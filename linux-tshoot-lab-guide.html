example.com | head -1\u003c/code>\u003c/td>\u003ctd>\u003ccode>-I\u003c/code> = HEAD request; \u003ccode>head -1\u003c/code> keeps the status line.\u003c/td>\u003ctd>End-to-end proof.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>", "root": "\u003cdiv class='tablewrap'>\u003ctable>\u003ctbody>\u003ctr>\u003ctd>Root cause\u003c/td>\u003ctd>1) \u003ccode>/etc/resolv.conf\u003c/code> symlink replaced with a hand-written file pointing to a dead resolver. 2) Stale \u003ccode>/etc/hosts\u003c/code> override for example.com\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prevent\u003c/td>\u003ctd>Manage DNS through netplan/systemd-resolved, not hand edits; never leave test entries in \u003ccode>/etc/hosts\u003c/code>; track both files in config management\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "explain": "\u003cp>\u003cstrong>How a name becomes an IP for an application:\u003c/strong>\u003c/p>\n\u003col>\u003cli>glibc reads \u003ccode>/etc/nsswitch.conf\u003c/code>: \u003ccode>hosts: files dns\u003c/code>\u003c/li>\u003cli>\u003ccode>files\u003c/code> = \u003ccode>/etc/hosts\u003c/code> is checked \u003cstrong>first\u003c/strong>\u003c/li>\u003cli>\u003ccode>dns\u003c/code> = nameservers in \u003ccode>/etc/resolv.conf\u003c/code> (on Ubuntu normally the stub \u003ccode>127.0.0.53\u003c/code> of systemd-resolved)\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>Split the problem.\u003c/strong> \u003ccode>ping 8.8.8.8\u003c/code> works but \u003ccode>ping ubuntu.com\u003c/code> fails -&gt; IP routing is fine, name resolution is broken.\u003c/p>\n\u003cp>\u003cstrong>Two independent faults here:\u003c/strong>\u003c/p>\n\u003col>\u003cli>\u003ccode>/etc/resolv.conf\u003c/code> was turned from a symlink (to \u003ccode>/run/systemd/resolve/stub-resolv.conf\u003c/code>) into a plain file pointing at a dead server \u003ccode>10.255.255.53\u003c/code>.\u003c/li>\u003cli>A stale line in \u003ccode>/etc/hosts\u003c/code> pins \u003ccode>example.com\u003c/code> to \u003ccode>203.0.113.77\u003c/code>.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>Tool difference:\u003c/strong> \u003ccode>dig\u003c/code> and \u003ccode>nslookup\u003c/code> talk to DNS only - they ignore \u003ccode>/etc/hosts\u003c/code>. \u003ccode>getent hosts\u003c/code> uses the same lookup path as real programs. After you fix DNS, \u003ccode>dig example.com\u003c/code> is right while \u003ccode>curl\u003c/code> still hits the stale IP - the \"dig and curl disagree\" trap.\u003c/p>", "mcq": [{"q": "`ping 8.8.8.8` works but `ping ubuntu.com` fails with 'Temporary failure in name resolution'. What is broken?", "o": ["Name resolution (DNS / resolver config)", "Routing to the internet", "The default gateway", "The network cable"], "why": "IP reachability is proven by the successful ping to an IP; only name -> IP resolution fails."}, {"q": "After fixing DNS, `dig example.com` shows the real IP but `curl https://example.com` still connects to a wrong IP. Why?", "o": ["/etc/hosts is consulted before DNS (nsswitch: files dns) and has a stale entry; dig ignores /etc/hosts", "curl caches DNS answers for 24 hours", "dig uses IPv6 only", "systemd-resolved is stopped"], "why": "Applications follow nsswitch order; `files` comes before `dns`. `dig` only queries DNS."}, {"q": "On a standard Ubuntu 22.04/24.04, what is /etc/resolv.conf normally?", "o": ["A symlink to /run/systemd/resolve/stub-resolv.conf managed by systemd-resolved", "A plain file that admins edit by hand", "An empty file", "A symlink to /etc/hosts"], "why": "Hand edits get lost or (as here) break resolution; manage DNS via netplan/systemd-resolved."}], "qa": [{"q": "Which command shows what applications really resolve, and why not use dig for that?", "a": "`getent hosts \u003cname>` (or `getent ahosts`) - it goes through nsswitch.conf (/etc/hosts, then DNS). dig/nslookup query DNS servers directly and bypass /etc/hosts, so they can disagree with what curl/apps see."}, {"q": "You fixed fault 1 and `apt update` works. Why are you not done, and how do you verify the whole ticket?", "a": "The ticket also says the payment check to example.com fails. A second fault (stale /etc/hosts entry) remained. Verify with the real client: `getent hosts example.com` and `curl -sI https://example.com`, not just with one tool. Always re-test the original symptom, not only the first fix."}]}, {"id": "e05", "level": "easy", "title": "Wrong page on port 80", "time": "15 min", "skills": "listening sockets, process to service mapping", "ticket": "\u003cblockquote>\u003cstrong>INC-1005 · P1 · Customer facing\u003c/strong>\u003cbr>\nCustomers see an old page \u003cem>\"Maintenance status: ALL GREEN (legacy page, 2021)\"\u003c/em>\u003cbr>\ninstead of the shop. Someone ran \u003ccode>systemctl start nginx\u003c/code> and it failed.\u003cbr>\nRestore the shop and make sure this does not come back after a reboot.\u003c/blockquote>", "success": "\u003cul>\u003cli>nginx owns port 80 and serves shopapp\u003c/li>\u003cli>The thing that took port 80 is stopped \u003cstrong>and\u003c/strong> will not start at boot\u003c/li>\u003c/ul>", "warmup": "\u003cp>The solution uses long command lines. They are just short commands with one flag added at a time. Practise each ladder on any Linux box first (all read-only). Every rung adds \u003cstrong>one\u003c/strong> thing to the rung above - stop at the rung you understand, and read the next one only when you are ready. The lab itself uses the last rung of each ladder.\u003c/p>\n\u003ch4>ss - who is listening / connected?\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">ss                              \u003cspan class=\"c\"># 1. all sockets (long)\u003c/span>\nss -l                           \u003cspan class=\"c\"># 2. -l = only listening sockets\u003c/span>\nss -lt                          \u003cspan class=\"c\"># 3. -t = TCP only\u003c/span>\nss -ltn                         \u003cspan class=\"c\"># 4. -n = numbers, no name lookup\u003c/span>\nss -ltnp                        \u003cspan class=\"c\"># 5. -p = which process owns each socket (needs sudo)\u003c/span>\nss -ltnp 'sport = :80'          \u003cspan class=\"c\"># 6. filter: only source (local) port 80\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>ps / pgrep / pstree - look at processes\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">ps                                         \u003cspan class=\"c\"># 1. only your shell\u003c/span>\nps -ef                                     \u003cspan class=\"c\"># 2. every process, full format (PID, PPID, command)\u003c/span>\nps -fp 1234                                \u003cspan class=\"c\"># 3. just one PID\u003c/span>\nps -eo pid,ppid,user,%cpu,%mem,cmd         \u003cspan class=\"c\"># 4. -o = choose your own columns\u003c/span>\nps -eo pid,%cpu,cmd --sort=-%cpu | head    \u003cspan class=\"c\"># 5. sort by CPU, highest first (- = descending), top 10\u003c/span>\npgrep -af nginx                            \u003cspan class=\"c\"># 6. find PIDs by name (-a = show full command, -f = match whole command line)\u003c/span>\npstree -ps 1234                            \u003cspan class=\"c\"># 7. parent chain of one PID: who started it?\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>systemctl + journalctl - service state and logs\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">systemctl status nginx                          \u003cspan class=\"c\"># 1. state, last exit code, last log lines\u003c/span>\nsystemctl is-active nginx                       \u003cspan class=\"c\"># 2. one word: active / failed / inactive\u003c/span>\njournalctl -u nginx                             \u003cspan class=\"c\"># 3. the whole log of one unit (-u = unit)\u003c/span>\njournalctl -u nginx -n 20                       \u003cspan class=\"c\"># 4. only the last 20 lines\u003c/span>\njournalctl -u nginx -n 20 --no-pager            \u003cspan class=\"c\"># 5. print straight to the terminal (no less)\u003c/span>\njournalctl -u nginx --since \"10 min ago\"        \u003cspan class=\"c\"># 6. time window instead of line count\u003c/span>\u003c/code>\u003c/pre>", "hints": [{"title": "Hint 1 - why won't nginx start?", "html": "\u003cp>\u003ccode>journalctl -u nginx -n 20\u003c/code> - look for \u003ccode>bind() ... failed (98: Address already in use)\u003c/code>.\u003c/p>"}, {"title": "Hint 2 - who has the port?", "html": "\u003cp>\u003ccode>sudo ss -ltnp 'sport = :80'\u003c/code> or \u003ccode>sudo lsof -i :80\u003c/code> gives you the PID.\u003c/p>"}, {"title": "Hint 3 - PID to service", "html": "\u003cp>\u003ccode>systemctl status &lt;PID&gt;\u003c/code> tells you which systemd unit owns that process. Killing the PID is not enough if the unit has \u003ccode>Restart=always\u003c/code>.\u003c/p>"}], "learn": "\u003cul>\u003cli>\u003ccode>Address already in use\u003c/code> = another socket holds the port. \u003ccode>ss -ltnp\u003c/code> finds the owner.\u003c/li>\u003cli>\u003ccode>systemctl status &lt;PID&gt;\u003c/code> maps any PID to its unit (or \u003ccode>ps -o unit= -p &lt;PID&gt;\u003c/code>).\u003c/li>\u003cli>\u003ccode>kill\u003c/code> treats the symptom; \u003ccode>systemctl disable --now\u003c/code> fixes the cause.\u003c/li>\u003c/ul>", "solution": "\u003cblockquote>Long commands below are built up short-first (\u003ccode># 1.\u003c/code>, \u003ccode># 2.\u003c/code> ...). Each rung adds one flag;\u003cbr>\nthe last rung is what the lab uses. The README \u003cstrong>Warm-up\u003c/strong> explains every flag from scratch.\u003c/blockquote>\n\u003ch3>1. Why nginx fails\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">systemctl status nginx --no-pager\njournalctl -u nginx -n 10 --no-pager\n\u003cspan class=\"c\"># nginx: [emerg] bind() to 0.0.0.0:80 failed (98: Address already in use)\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>systemctl status nginx --no-pager\u003c/code>\u003c/td>\u003ctd>Unit state without paging.\u003c/td>\u003ctd>Failed - need the reason.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>journalctl -u nginx -n 10 --no-pager\u003c/code>\u003c/td>\u003ctd>Last 10 log lines.\u003c/td>\u003ctd>\u003ccode>bind() to 0.0.0.0:80 failed (98: Address already in use)\u003c/code> - config is fine, the port is taken.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>2. Who owns port 80\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo ss -ltnp 'sport = :80'\n\u003cspan class=\"c\"># LISTEN 0 5 0.0.0.0:80 0.0.0.0:* users:((\"python3\",pid=2345,fd=3))\u003c/span>\nps -fp 2345\n\u003cspan class=\"c\"># root 2345 1 ... /usr/bin/python3 -m http.server 80 --directory /var/www/legacy-status\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>ss -ltnp 'sport = :80'\u003c/code>\u003c/td>\u003ctd>Listing of listeners on port 80 with process info.\u003c/td>\u003ctd>Names the owner: \u003ccode>python3\u003c/code>, pid 2345. Needs \u003ccode>sudo\u003c/code> to show other users' processes.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ps -fp 2345\u003c/code>\u003c/td>\u003ctd>Full-format (\u003ccode>-f\u003c/code>) info for one PID (\u003ccode>-p\u003c/code>).\u003c/td>\u003ctd>Shows parent, user and full command line - \u003ccode>python3 -m http.server 80\u003c/code> serving a legacy page.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>3. Map the PID to a service\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">systemctl status 2345 --no-pager\n\u003cspan class=\"c\"># ● legacy-status.service - Legacy maintenance status page\u003c/span>\n\u003cspan class=\"c\">#    Loaded: loaded (/etc/systemd/system/legacy-status.service; enabled ...)\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>sudo kill 2345\u003c/code> would not help: \u003ccode>Restart=always\u003c/code> starts it again in 100 ms.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>systemctl status 2345\u003c/code>\u003c/td>\u003ctd>systemctl can resolve a \u003cstrong>PID\u003c/strong> to its unit.\u003c/td>\u003ctd>Maps the stray process to \u003ccode>legacy-status.service\u003c/code> - the thing to manage, not the PID.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>kill 2345\u003c/code> (not used)\u003c/td>\u003ctd>Sends SIGTERM to the PID.\u003c/td>\u003ctd>Would fail here: \u003ccode>Restart=always\u003c/code> brings it back in 100 ms. Always find the supervisor.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>4. Fix\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo systemctl disable --now legacy-status\nsudo ss -ltnp 'sport = :80'          \u003cspan class=\"c\"># empty\u003c/span>\nsudo systemctl start nginx\ncurl -s localhost/                   \u003cspan class=\"c\"># shopapp is running\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>Optional cleanup after you ask the owner: remove the unit file and \u003ccode>systemctl daemon-reload\u003c/code>.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>systemctl disable --now legacy-status\u003c/code>\u003c/td>\u003ctd>\u003ccode>disable\u003c/code> removes boot-time start, \u003ccode>--now\u003c/code> also stops it immediately.\u003c/td>\u003ctd>Frees port 80 and keeps it from returning at reboot.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ss -ltnp 'sport = :80'\u003c/code> (again)\u003c/td>\u003ctd>Re-checks the port.\u003c/td>\u003ctd>Must be empty before starting nginx.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl start nginx\u003c/code>\u003c/td>\u003ctd>Starts the unit.\u003c/td>\u003ctd>Now it can bind.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>curl -s localhost/\u003c/code>\u003c/td>\u003ctd>Fetches the page.\u003c/td>\u003ctd>Confirm shopapp (not the legacy page) is answering.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>", "root": "\u003cdiv class='tablewrap'>\u003ctable>\u003ctbody>\u003ctr>\u003ctd>Root cause\u003c/td>\u003ctd>Old \u003ccode>legacy-status.service\u003c/code> (enabled, Restart=always) bound port 80 before nginx\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prevent\u003c/td>\u003ctd>Remove retired units instead of leaving them on disk; monitor that the expected process owns each public port\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "explain": "\u003cp>\u003cstrong>One listener per (address, port).\u003c/strong> \u003ccode>bind()\u003c/code> fails with errno 98 \u003ccode>Address already in use\u003c/code> when another socket already listens there. nginx logged exactly that.\u003c/p>\n\u003cp>\u003cstrong>Find the owner:\u003c/strong> \u003ccode>sudo ss -ltnp 'sport = :80'\u003c/code> -&gt; \u003ccode>python3 pid=2345\u003c/code>. \u003cstrong>Map PID to unit:\u003c/strong> \u003ccode>systemctl status 2345\u003c/code> (or \u003ccode>ps -o unit= -p 2345\u003c/code>) reads the process's cgroup and tells you \u003ccode>legacy-status.service\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Why \u003ccode>kill\u003c/code> is not a fix:\u003c/strong> the unit has \u003ccode>Restart=always\u003c/code>, so systemd restarts it within 100 ms and it grabs port 80 again. And it is \u003cstrong>enabled\u003c/strong>, so it would also win the race after the next reboot.\u003c/p>\n\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>Stops now\u003c/th>\u003cth>Stops at boot\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>systemctl stop X\u003c/code>\u003c/td>\u003ctd>yes\u003c/td>\u003ctd>no\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl disable X\u003c/code>\u003c/td>\u003ctd>no\u003c/td>\u003ctd>yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl disable --now X\u003c/code>\u003c/td>\u003ctd>yes\u003c/td>\u003ctd>yes\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Order of fix: disable --now the squatter, confirm port 80 is free (\u003ccode>ss\u003c/code>), start nginx, \u003ccode>curl\u003c/code> the shop. Remove the retired unit only after asking its owner.\u003c/p>", "mcq": [{"q": "nginx fails with `bind() to 0.0.0.0:80 failed (98: Address already in use)`. What does it mean?", "o": ["Another process already listens on port 80", "The firewall blocks port 80", "nginx lacks permission to use ports below 1024", "The port number is invalid"], "why": "EADDRINUSE: the (address, port) is already bound by another socket."}, {"q": "Which command shows which process owns port 80?", "o": ["sudo ss -ltnp 'sport = :80'", "systemctl list-timers", "df -h", "ip route"], "why": "`ss -ltnp` lists listening TCP sockets with the owning process."}, {"q": "Why is `kill \u003cPID>` not enough here?", "o": ["The unit has Restart=always (and is enabled), so it comes back; use systemctl disable --now", "kill cannot stop python processes", "Port 80 can never be freed", "nginx must be reinstalled first"], "why": "Fix the cause (the unit), not the symptom (the process)."}], "qa": [{"q": "Explain the difference between `stop`, `disable` and `disable --now`.", "a": "stop ends the running process only (it returns at next boot if enabled). disable removes the boot symlink but leaves it running. disable --now does both: stops now and prevents starting at boot - what this ticket asks for."}, {"q": "After the fix, what two checks prove the shop is restored AND the problem will not return after a reboot?", "a": "`ss -ltnp 'sport = :80'` shows nginx and `curl localhost/` returns 'shopapp is running'; `systemctl is-enabled legacy-status` says disabled while `systemctl is-enabled nginx` says enabled."}]}, {"id": "e06", "level": "easy", "title": "SSH key login refused", "time": "15 min", "skills": "sshd logs, StrictModes, home/.ssh permissions", "ticket": "\u003cblockquote>\u003cstrong>INC-1006 · P3 · CI pipeline red\u003c/strong>\u003cbr>\nThe deploy job fails with \u003ccode>deploy@tshoot-lab: Permission denied (publickey).\u003c/code>\u003cbr>\nThe key has not changed. Yesterday someone \"fixed permissions\" in the \u003ccode>deploy\u003c/code>\u003cbr>\nuser's home directory so a shared script would work.\u003cbr>\nReproduce with:\u003cbr>\n\u003ccode>sudo ssh -i /var/lib/tshoot/e06/deploy_key -o StrictHostKeyChecking=no deploy@127.0.0.1 hostname\u003c/code>\u003cbr>\nFix it without weakening the SSH server configuration.\u003c/blockquote>", "success": "\u003cul>\u003cli>Key login as \u003ccode>deploy\u003c/code> works with the given key\u003c/li>\u003cli>\u003ccode>/home/deploy\u003c/code>, \u003ccode>~/.ssh\u003c/code> and \u003ccode>authorized_keys\u003c/code> have safe permissions\u003c/li>\u003cli>\u003ccode>sshd_config\u003c/code> still enforces \u003ccode>StrictModes yes\u003c/code>\u003c/li>\u003c/ul>\n\u003cp>Check with \u003ccode>sudo ./labctl.sh check e06\u003c/code>.\u003c/p>", "warmup": "\u003cp>The solution uses long command lines. They are just short commands with one flag added at a time. Practise each ladder on any Linux box first (all read-only). Every rung adds \u003cstrong>one\u003c/strong> thing to the rung above - stop at the rung you understand, and read the next one only when you are ready. The lab itself uses the last rung of each ladder.\u003c/p>\n\u003ch4>ssh - log in and debug\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">ssh user@host                                   \u003cspan class=\"c\"># 1. log in\u003c/span>\nssh user@host hostname                          \u003cspan class=\"c\"># 2. run ONE command and exit\u003c/span>\nssh -i ~/.ssh/key user@host hostname            \u003cspan class=\"c\"># 3. -i = use this private key\u003c/span>\nssh -o StrictHostKeyChecking=no user@host hostname   \u003cspan class=\"c\"># 4. -o = set an option (here: skip the host-key question; lab only!)\u003c/span>\nssh -v -i ~/.ssh/key user@host 2&gt;&amp;1 | grep -E 'Offering|Authentications'   \u003cspan class=\"c\"># 5. -v = debug; filter the useful lines\u003c/span>\n\u003cspan class=\"c\"># The client rarely knows why it was refused - read the SERVER log: journalctl -u ssh -n 20\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>ls / namei / id - read permissions\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">ls                                  \u003cspan class=\"c\"># 1. names only\u003c/span>\nls -l /etc/hostname                 \u003cspan class=\"c\"># 2. -l = long: mode, owner, group, size, date\u003c/span>\nls -ld /etc                         \u003cspan class=\"c\"># 3. -d = the directory itself, not its content\u003c/span>\nnamei -l /etc/hostname              \u003cspan class=\"c\"># 4. mode + owner of EVERY directory on the way (a path needs x on each)\u003c/span>\nid                                  \u003cspan class=\"c\"># 5. who am I: uid, gid, groups\u003c/span>\nsudo -u www-data cat /etc/hostname  \u003cspan class=\"c\"># 6. run a command AS another user = test what the service can do\u003c/span>\n\u003cspan class=\"c\"># mode  rwxr-x---  = owner rwx (7), group r-x (5), others --- (0)  -&gt;  chmod 750\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>chmod / chown - change permissions and owner\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">chmod 644 file          \u003cspan class=\"c\"># 1. numbers: r=4 w=2 x=1, add up per owner/group/others -&gt; rw-r--r--\u003c/span>\nchmod 600 file          \u003cspan class=\"c\"># 2. owner only: rw-------\u003c/span>\nchmod u+x file          \u003cspan class=\"c\"># 3. symbolic: u=owner g=group o=others, +/- add/remove a bit\u003c/span>\nchown alice file        \u003cspan class=\"c\"># 4. change owner\u003c/span>\nchown alice:staff file  \u003cspan class=\"c\"># 5. owner and group\u003c/span>\nchown -R alice:staff dir/   \u003cspan class=\"c\"># 6. -R = recursive (whole tree - double-check the path first!)\u003c/span>\u003c/code>\u003c/pre>", "hints": [{"title": "Hint 1 - the client tells you little", "html": "\u003cp>\u003ccode>ssh -v\u003c/code> shows the client side only: the key was offered and refused. The \u003cem>reason\u003c/em> is on the server: \u003ccode>journalctl -u ssh -n 30\u003c/code> (unit is \u003ccode>ssh\u003c/code> on Ubuntu, \u003ccode>sshd\u003c/code> elsewhere).\u003c/p>"}, {"title": "Hint 2 - what sshd checks", "html": "\u003cp>With \u003ccode>StrictModes yes\u003c/code> sshd refuses keys if the home directory, \u003ccode>~/.ssh\u003c/code> or \u003ccode>authorized_keys\u003c/code> can be written by anyone other than the user. \u003ccode>namei -l /home/deploy/.ssh/authorized_keys\u003c/code> shows every level at once.\u003c/p>"}, {"title": "Hint 3 - the right modes", "html": "\u003cp>Home: no group/other write (\u003ccode>755\u003c/code> or \u003ccode>750\u003c/code>). \u003ccode>~/.ssh\u003c/code>: \u003ccode>700\u003c/code>. \u003ccode>authorized_keys\u003c/code>: \u003ccode>600\u003c/code>. All owned by \u003ccode>deploy\u003c/code>.\u003c/p>"}], "learn": "\u003cul>\u003cli>For SSH problems, the client error is generic - the server log has the real reason.\u003c/li>\u003cli>\u003ccode>Authentication refused: bad ownership or modes\u003c/code> = permissions, not the key.\u003c/li>\u003cli>\u003ccode>chmod 777\u003c/code> \"to make it work\" breaks security checks in other tools.\u003c/li>\u003cli>Never fix this by setting \u003ccode>StrictModes no\u003c/code> - that removes a protection for every user.\u003c/li>\u003c/ul>", "solution": "\u003cblockquote>Long commands below are built up short-first (\u003ccode># 1.\u003c/code>, \u003ccode># 2.\u003c/code> ...). Each rung adds one flag;\u003cbr>\nthe last rung is what the lab uses. The README \u003cstrong>Warm-up\u003c/strong> explains every flag from scratch.\u003c/blockquote>\n\u003ch3>1. Reproduce\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo ssh deploy@127.0.0.1                                  \u003cspan class=\"c\"># 1. plain login (asks for a key/password)\u003c/span>\nsudo ssh -i /var/lib/tshoot/e06/deploy_key deploy@127.0.0.1                       \u003cspan class=\"c\"># 2. + this private key\u003c/span>\nsudo ssh -i /var/lib/tshoot/e06/deploy_key deploy@127.0.0.1 hostname              \u003cspan class=\"c\"># 3. + run one command, then exit\u003c/span>\nsudo ssh -i /var/lib/tshoot/e06/deploy_key -o StrictHostKeyChecking=no deploy@127.0.0.1 hostname   \u003cspan class=\"c\"># 4. + skip host-key prompt (lab only)\u003c/span>\n\u003cspan class=\"c\"># deploy@127.0.0.1: Permission denied (publickey).\u003c/span>\nsudo ssh -v -i /var/lib/tshoot/e06/deploy_key deploy@127.0.0.1                    \u003cspan class=\"c\"># 5. -v = debug output (long)\u003c/span>\nsudo ssh -v -i /var/lib/tshoot/e06/deploy_key deploy@127.0.0.1 2&gt;&amp;1 | grep -E 'Offering|Authentications'   \u003cspan class=\"c\"># 6. keep only the useful lines (2&gt;&amp;1 = merge stderr into the pipe)\u003c/span>\n\u003cspan class=\"c\"># debug1: Offering public key: /var/lib/tshoot/e06/deploy_key ED25519 ...\u003c/span>\n\u003cspan class=\"c\"># debug1: Authentications that can continue: publickey\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>The client offered the key; the server said no. The client does not know why.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>ssh -i KEY -o StrictHostKeyChecking=no deploy@127.0.0.1 hostname\u003c/code>\u003c/td>\u003ctd>SSH using a specific key (\u003ccode>-i\u003c/code>), skipping host-key prompt, runs \u003ccode>hostname\u003c/code> remotely.\u003c/td>\u003ctd>Reproduces the failure: \u003ccode>Permission denied (publickey)\u003c/code>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ssh -v ... 2&gt;&amp;1 | grep -E 'Offering|Authentications'\u003c/code>\u003c/td>\u003ctd>\u003ccode>-v\u003c/code> verbose client log; \u003ccode>2&gt;&amp;1\u003c/code> merges stderr into the pipe; \u003ccode>grep -E\u003c/code> filters with a regex (\u003ccode>a|b\u003c/code> = either).\u003c/td>\u003ctd>Shows the client \u003cstrong>did offer\u003c/strong> the key and the server rejected it. The client never learns why - the reason is only in the \u003cstrong>server\u003c/strong> log.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>2. Read the server log\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">journalctl -u ssh -n 20 --no-pager\n\u003cspan class=\"c\"># sshd[2211]: Authentication refused: bad ownership or modes for directory /home/deploy\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>journalctl -u ssh -n 20 --no-pager\u003c/code>\u003c/td>\u003ctd>Server-side log.\u003c/td>\u003ctd>\u003ccode>Authentication refused: bad ownership or modes for directory /home/deploy\u003c/code> - the real reason.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>3. Check every level of the path\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">namei -l /home/deploy/.ssh/authorized_keys\n\u003cspan class=\"c\"># drwxr-xr-x root   root   /\u003c/span>\n\u003cspan class=\"c\"># drwxr-xr-x root   root   home\u003c/span>\n\u003cspan class=\"c\"># drwxrwxrwx deploy deploy deploy          &lt;- world-writable home\u003c/span>\n\u003cspan class=\"c\"># drwxrwxrwx deploy deploy .ssh            &lt;- world-writable .ssh\u003c/span>\n\u003cspan class=\"c\"># -rw-rw-rw- deploy deploy authorized_keys &lt;- anyone can add a key!\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>Why sshd cares: if anyone can write to your home or \u003ccode>.ssh\u003c/code>, anyone can add their own key and log in as you. sshd refuses rather than trust that file.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>namei -l /home/deploy/.ssh/authorized_keys\u003c/code>\u003c/td>\u003ctd>Owner and mode of every path component.\u003c/td>\u003ctd>Shows home, \u003ccode>.ssh\u003c/code> and the file are all world-writable (\u003ccode>777\u003c/code>/\u003ccode>666\u003c/code>). sshd checks the whole chain (StrictModes).\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>4. Fix\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo chmod 755 /home/deploy          \u003cspan class=\"c\"># or 750\u003c/span>\nsudo chmod 700 /home/deploy/.ssh\nsudo chmod 600 /home/deploy/.ssh/authorized_keys\nsudo chown -R deploy:deploy /home/deploy/.ssh\u003c/code>\u003c/pre>\n\u003cp>The shared script that needed access should get a group or a shared directory, not a 777 home.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>chmod 755 /home/deploy\u003c/code>\u003c/td>\u003ctd>Removes group/other write on home.\u003c/td>\u003ctd>Anyone able to write home could replace \u003ccode>.ssh\u003c/code> and add their own key.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>chmod 700 /home/deploy/.ssh\u003c/code>\u003c/td>\u003ctd>Only owner can enter.\u003c/td>\u003ctd>Standard secure mode for the SSH dir.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>chmod 600 .../authorized_keys\u003c/code>\u003c/td>\u003ctd>Owner read/write only.\u003c/td>\u003ctd>Standard secure mode for the key list.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>chown -R deploy:deploy /home/deploy/.ssh\u003c/code>\u003c/td>\u003ctd>Recursively sets owner/group.\u003c/td>\u003ctd>Ensures the user owns the key files (sshd also requires this).\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>5. Verify\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo ssh -i /var/lib/tshoot/e06/deploy_key -o StrictHostKeyChecking=no deploy@127.0.0.1 hostname\nsudo sshd -T | grep -i strictmodes      \u003cspan class=\"c\"># strictmodes yes\u003c/span>\nsudo ./labctl.sh check e06\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>sshd -T | grep -i strictmodes\u003c/code>\u003c/td>\u003ctd>\u003ccode>-T\u003c/code> dumps the effective server config.\u003c/td>\u003ctd>Verify \u003ccode>strictmodes yes\u003c/code> - we fixed the permissions, we did \u003cstrong>not\u003c/strong> weaken the security check.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>", "root": "\u003cdiv class='tablewrap'>\u003ctable>\u003ctbody>\u003ctr>\u003ctd>Root cause\u003c/td>\u003ctd>\u003ccode>chmod -R 777\u003c/code> on \u003ccode>/home/deploy\u003c/code>; sshd \u003ccode>StrictModes\u003c/code> rejected the key\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fix\u003c/td>\u003ctd>Home 755, \u003ccode>.ssh\u003c/code> 700, \u003ccode>authorized_keys\u003c/code> 600\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prevent\u003c/td>\u003ctd>Manage users/keys with config management; shared files go in a group-owned dir; monitor \"Authentication refused\" in auth logs\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "explain": "\u003cp>\u003cstrong>The client error is generic.\u003c/strong> \u003ccode>Permission denied (publickey)\u003c/code> only says \"the server did not accept any key\". The reason lives in the \u003cstrong>server\u003c/strong> log: \u003ccode>journalctl -u ssh\u003c/code> (unit is \u003ccode>ssh\u003c/code> on Ubuntu, \u003ccode>sshd\u003c/code> elsewhere):\u003c/p>\n\u003cpre>\u003ccode class=\"lang-text\">Authentication refused: bad ownership or modes for directory /home/deploy\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>StrictModes yes\u003c/strong> (default): sshd refuses to trust \u003ccode>authorized_keys\u003c/code> if the user's home directory, \u003ccode>~/.ssh\u003c/code> or the file can be written by anyone other than the user (or root). If they could be, any local user could append their own key and log in as \u003ccode>deploy\u003c/code>. So sshd rejects the setup instead of the key.\u003c/p>\n\u003cp>\u003cstrong>Safe modes:\u003c/strong>\u003c/p>\n\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Path\u003c/th>\u003cth>Mode\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>/home/deploy\u003c/code>\u003c/td>\u003ctd>755 (or 750) - no group/other write\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.ssh\u003c/code>\u003c/td>\u003ctd>700\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.ssh/authorized_keys\u003c/code>\u003c/td>\u003ctd>600\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>All owned by \u003ccode>deploy\u003c/code>. \u003ccode>namei -l\u003c/code> shows every level at once.\u003c/p>\n\u003cp>\u003cstrong>Wrong fixes:\u003c/strong> \u003ccode>StrictModes no\u003c/code> (removes the protection for every user on the server) and leaving \u003ccode>777\u003c/code> \"so the shared script works\" - give that script a group-owned shared directory instead.\u003c/p>", "mcq": [{"q": "`ssh` says `Permission denied (publickey)`. Where do you find the real reason?", "o": ["The server's auth log: journalctl -u ssh", "ssh -v on the client always prints the reason", "The client's ~/.ssh/known_hosts", "/var/log/dpkg.log"], "why": "The server deliberately gives the client little detail; its log has `bad ownership or modes`."}, {"q": "Which permission set is safe for key login?", "o": ["home 755, ~/.ssh 700, authorized_keys 600, all owned by the user", "home 777, ~/.ssh 777, authorized_keys 666", "home 700, ~/.ssh 755, authorized_keys 777", "everything owned by root with 600"], "why": "No group/other write anywhere on the path; .ssh and the key file private."}, {"q": "A colleague suggests `StrictModes no` in sshd_config. Why is that bad?", "o": ["It disables a safety check for every user on the host, not only deploy", "It breaks password logins", "It changes the SSH port", "It deletes authorized_keys"], "why": "Fix the permissions, never weaken the server config."}], "qa": [{"q": "Why does sshd refuse a key when the home directory is world-writable?", "a": "Anyone who can write the home dir or ~/.ssh can replace or add to authorized_keys, i.e. add their own public key and log in as that user (or swap .ssh for a symlink). sshd can't tell the file is trustworthy, so with StrictModes it ignores it."}, {"q": "A shared script needed access to /home/deploy, which is why someone ran chmod -R 777. What is a better design?", "a": "Put the shared files in a group-owned directory (e.g. /srv/shared with a dedicated group and mode 2770/2750), or use ACLs - and keep the home at 755/750 with .ssh 700 and authorized_keys 600."}]}, {"id": "e07", "level": "easy", "title": "Wrong time on the server", "time": "15 min", "skills": "timedatectl, NTP sync, timezones, restarting services after a change", "ticket": "\u003cblockquote>\u003cstrong>INC-1007 · P3\u003c/strong>\u003cbr>\nThe log team cannot correlate incidents: timestamps in \u003ccode>/var/log/shopapp/app.log\u003c/code> on\u003cbr>\ntshoot-lab are hours away from every other server. All our servers run in \u003cstrong>UTC\u003c/strong>.\u003cbr>\nMonitoring also fires \u003ccode>ClockNotSynchronised\u003c/code> for this host.\u003cbr>\nThe host was built from a \"customised\" image last week.\u003cbr>\nFix the clock and make sure the app logs correct UTC times.\u003c/blockquote>", "success": "\u003cul>\u003cli>System timezone is UTC\u003c/li>\u003cli>NTP synchronisation is enabled and a time sync service is running\u003c/li>\u003cli>New lines in \u003ccode>app.log\u003c/code> carry the current UTC time\u003c/li>\u003c/ul>\n\u003cp>Check with \u003ccode>sudo ./labctl.sh check e07\u003c/code>.\u003c/p>", "warmup": "\u003cp>The solution uses long command lines. They are just short commands with one flag added at a time. Practise each ladder on any Linux box first (all read-only). Every rung adds \u003cstrong>one\u003c/strong> thing to the rung above - stop at the rung you understand, and read the next one only when you are ready. The lab itself uses the last rung of each ladder.\u003c/p>\n\u003ch4>date / timedatectl - clocks\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">date                                   \u003cspan class=\"c\"># 1. local time\u003c/span>\ndate -u                                \u003cspan class=\"c\"># 2. -u = UTC\u003c/span>\ntimedatectl                            \u003cspan class=\"c\"># 3. local + UTC + time zone + 'System clock synchronized'\u003c/span>\ntimedatectl timesync-status            \u003cspan class=\"c\"># 4. which NTP server, offset\u003c/span>\nsudo timedatectl set-timezone Etc/UTC  \u003cspan class=\"c\"># 5. change zone\u003c/span>\nsudo timedatectl set-ntp true          \u003cspan class=\"c\"># 6. turn time sync on\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>head / tail / wc / sort - shape output\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">tail file                       \u003cspan class=\"c\"># 1. last 10 lines\u003c/span>\ntail -n 3 file                  \u003cspan class=\"c\"># 2. last 3\u003c/span>\ntail -f file                    \u003cspan class=\"c\"># 3. -f = follow: keep printing new lines (Ctrl-C to stop)\u003c/span>\nhead -n 5 file                  \u003cspan class=\"c\"># 4. first 5 lines\u003c/span>\nsort file | uniq -c             \u003cspan class=\"c\"># 5. count identical lines (sort first, uniq needs neighbours)\u003c/span>\nsort file | uniq -c | sort -rn | head   \u003cspan class=\"c\"># 6. most frequent first\u003c/span>\nwc -l file                      \u003cspan class=\"c\"># 7. count lines\u003c/span>\u003c/code>\u003c/pre>", "hints": [{"title": "Hint 1 - one command shows it all", "html": "\u003cp>\u003ccode>timedatectl\u003c/code> shows local time, UTC time, timezone, \"System clock synchronized\" and \"NTP service\". Compare \u003ccode>date\u003c/code> and \u003ccode>date -u\u003c/code>.\u003c/p>"}, {"title": "Hint 2 - two separate problems", "html": "\u003cp>A wrong \u003cem>timezone\u003c/em> only changes how time is displayed. A wrong \u003cem>clock\u003c/em> is really wrong. Here you have both. \u003ccode>timedatectl set-timezone\u003c/code>, \u003ccode>timedatectl set-ntp\u003c/code>. Is the sync service running? \u003ccode>systemctl status systemd-timesyncd\u003c/code> (or \u003ccode>chrony\u003c/code>).\u003c/p>"}, {"title": "Hint 3 - the app still logs the old zone", "html": "\u003cp>A running process read the timezone when it started. What do you need to do so shopapp picks up the new one?\u003c/p>"}], "learn": "\u003cul>\u003cli>\u003ccode>timedatectl\u003c/code> is the one place to check time, zone and sync.\u003c/li>\u003cli>Servers should run in UTC; convert to local time only when you display.\u003c/li>\u003cli>NTP off = the clock drifts; drift breaks TLS, Kerberos, cron, log correlation.\u003c/li>\u003cli>Many settings (timezone, env vars, limits) are read at process start - restart to apply.\u003c/li>\u003c/ul>", "solution": "\u003cblockquote>Long commands below are built up short-first (\u003ccode># 1.\u003c/code>, \u003ccode># 2.\u003c/code> ...). Each rung adds one flag;\u003cbr>\nthe last rung is what the lab uses. The README \u003cstrong>Warm-up\u003c/strong> explains every flag from scratch.\u003c/blockquote>\n\u003ch3>1. Look at the clock\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">timedatectl\n\u003cspan class=\"c\">#                Local time: Tue 2026-11-10 02:51:10 PST\u003c/span>\n\u003cspan class=\"c\">#            Universal time: Tue 2026-11-10 10:51:10 UTC\u003c/span>\n\u003cspan class=\"c\">#                 Time zone: America/Los_Angeles (PST, -0800)\u003c/span>\n\u003cspan class=\"c\"># System clock synchronized: no\u003c/span>\n\u003cspan class=\"c\">#               NTP service: inactive\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>Two problems:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Timezone\u003c/strong> is \u003ccode>America/Los_Angeles\u003c/code>, not UTC. The logs show local time, 8 hours off.\u003c/li>\u003cli>\u003cstrong>NTP is inactive\u003c/strong>, and the clock is wrong by several minutes (compare with another host or \u003ccode>curl -sI https://www.google.com | grep -i ^date\u003c/code> if you have internet).\u003c/li>\u003c/ol>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>timedatectl\u003c/code>\u003c/td>\u003ctd>Shows local time, UTC, timezone, NTP and sync state.\u003c/td>\u003ctd>One command reveals both faults: timezone \u003ccode>America/Los_Angeles\u003c/code> and \u003ccode>NTP service: inactive\u003c/code>, \u003ccode>synchronized: no\u003c/code>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>curl -sI https://www.google.com | grep -i ^date\u003c/code>\u003c/td>\u003ctd>\u003ccode>-I\u003c/code> fetches headers only; \u003ccode>grep -i ^date\u003c/code> keeps the Date header.\u003c/td>\u003ctd>Independent reference clock to see how far the local clock is off.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>2. Fix the timezone\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo timedatectl set-timezone Etc/UTC\nls -l /etc/localtime      \u003cspan class=\"c\"># -&gt; /usr/share/zoneinfo/Etc/UTC\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>timedatectl set-timezone Etc/UTC\u003c/code>\u003c/td>\u003ctd>Changes timezone; updates the \u003ccode>/etc/localtime\u003c/code> symlink.\u003c/td>\u003ctd>Servers log in UTC so logs from different hosts line up.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ls -l /etc/localtime\u003c/code>\u003c/td>\u003ctd>Shows the symlink target.\u003c/td>\u003ctd>Verify it points to \u003ccode>/usr/share/zoneinfo/Etc/UTC\u003c/code>.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>3. Turn time sync back on\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo timedatectl set-ntp true\nsystemctl status systemd-timesyncd     \u003cspan class=\"c\"># (Ubuntu 25.10+: chrony -&gt; `chronyc tracking`)\u003c/span>\ntimedatectl timesync-status            \u003cspan class=\"c\"># server, offset, poll interval\u003c/span>\njournalctl -u systemd-timesyncd -n 10\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>System clock synchronized: yes\u003c/code> appears once a server answers (needs network to NTP, UDP 123).\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>timedatectl set-ntp true\u003c/code>\u003c/td>\u003ctd>Enables network time sync service.\u003c/td>\u003ctd>Fixes the clock drift permanently; a one-time manual \u003ccode>date -s\u003c/code> would drift again.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl status systemd-timesyncd\u003c/code>\u003c/td>\u003ctd>State of the SNTP client.\u003c/td>\u003ctd>Confirms the sync daemon runs (on Ubuntu 25.10+, chrony: \u003ccode>chronyc tracking\u003c/code>).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>timedatectl timesync-status\u003c/code>\u003c/td>\u003ctd>Server, offset, poll interval.\u003c/td>\u003ctd>Verify it actually talks to a time server.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>journalctl -u systemd-timesyncd -n 10\u003c/code>\u003c/td>\u003ctd>Daemon logs.\u003c/td>\u003ctd>See sync events or errors (UDP 123 blocked, etc.).\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>4. The app still logs the old timezone\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">curl -s localhost/ &gt;/dev/null; tail -n1 /var/log/shopapp/app.log\n\u003cspan class=\"c\"># still 02:5x - the process read TZ at startup\u003c/span>\nsudo systemctl restart shopapp\ncurl -s localhost/ &gt;/dev/null; tail -n1 /var/log/shopapp/app.log\n\u003cspan class=\"c\"># now 10:5x = UTC\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>tail -n1 /var/log/shopapp/app.log\u003c/code>\u003c/td>\u003ctd>Newest log line.\u003c/td>\u003ctd>Shows the app still logs the \u003cstrong>old\u003c/strong> timezone.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl restart shopapp\u003c/code>\u003c/td>\u003ctd>Restarts the app.\u003c/td>\u003ctd>The process read \u003ccode>TZ\u003c/code> once at startup; system changes do not reach running processes.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>5. Verify\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo ./labctl.sh check e07\u003c/code>\u003c/pre>", "root": "\u003cdiv class='tablewrap'>\u003ctable>\u003ctbody>\u003ctr>\u003ctd>Root cause\u003c/td>\u003ctd>Image customisation set a local timezone and disabled NTP; clock drifted\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fix\u003c/td>\u003ctd>Timezone UTC, NTP enabled, app restarted\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prevent\u003c/td>\u003ctd>Set timezone + NTP in the base image / config management; alert on \u003ccode>timedatectl show -p NTPSynchronized\u003c/code> = no\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "explain": "\u003cp>\u003cstrong>Two different things called \"time\":\u003c/strong>\u003c/p>\n\u003cul>\u003cli>the \u003cstrong>clock\u003c/strong> - the real instant (kept as UTC by the kernel; NTP corrects drift)\u003c/li>\u003cli>the \u003cstrong>timezone\u003c/strong> - only how that instant is \u003cem>displayed\u003c/em> (\u003ccode>/etc/localtime\u003c/code> -&gt; a zoneinfo file)\u003c/li>\u003c/ul>\n\u003cp>\u003ccode>timedatectl\u003c/code> shows both plus \"System clock synchronized\" and \"NTP service\". Here: zone \u003ccode>America/Los_Angeles\u003c/code> (logs 8 h off) \u003cstrong>and\u003c/strong> NTP inactive (clock drifted by minutes).\u003c/p>\n\u003cp>\u003cstrong>Fix:\u003c/strong> \u003ccode>timedatectl set-timezone Etc/UTC\u003c/code> and \u003ccode>timedatectl set-ntp true\u003c/code> (systemd-timesyncd; chrony on newer Ubuntu). Synchronisation needs network access to an NTP server (UDP 123).\u003c/p>\n\u003cp>\u003cstrong>Why the app still logged the old zone:\u003c/strong> a process reads the timezone (the \u003ccode>TZ\u003c/code> / \u003ccode>/etc/localtime\u003c/code>) when it starts. Changing the system setting does not change running processes - \u003cstrong>restart shopapp\u003c/strong>. The same is true for environment variables and limits.\u003c/p>\n\u003cp>\u003cstrong>Why servers use UTC:\u003c/strong> one timeline for log correlation, no daylight-saving jumps. A drifting clock also breaks TLS validity checks, Kerberos (5 min skew), cron timing and token expiry.\u003c/p>", "mcq": [{"q": "Which single command shows local time, UTC time, timezone and NTP sync status?", "o": ["timedatectl", "date +%s", "hwclock --debug", "uptime"], "why": "`timedatectl` is the one place to look."}, {"q": "You set the timezone to UTC but shopapp still writes local-time timestamps. What is needed?", "o": ["Restart shopapp - it read the timezone at startup", "Reboot the network", "Run logrotate", "Nothing, it updates after 24 hours"], "why": "Timezone is read at process start; running processes keep the old value."}, {"q": "Which is NOT a typical consequence of a drifting system clock?", "o": ["The disk fills up faster", "TLS certificate validation errors", "Kerberos authentication failures", "Log timestamps that cannot be correlated across servers"], "why": "Clock drift affects anything time-based; it does not change disk consumption."}], "qa": [{"q": "Explain the difference between a wrong timezone and a wrong clock, and how you can tell them apart.", "a": "A wrong timezone changes only the displayed local time; `date -u` (UTC) is still correct. A wrong clock means even UTC is off - compare `date -u` with a trusted source or see `System clock synchronized: no` / NTP inactive in timedatectl. This host had both."}, {"q": "Why do most server fleets run in UTC?", "a": "One shared timeline makes log correlation and incident timelines simple, avoids daylight-saving ambiguity, and keeps tools (TLS, cron schedules, tokens) consistent. Convert to local time only at display."}]}, {"id": "e08", "level": "easy", "title": "\"Works when I run it\"", "time": "15 min", "skills": "systemd job failures, exit code 127, PATH, login vs non-login environments", "ticket": "\u003cblockquote>\u003cstrong>INC-1008 · P4\u003c/strong>\u003cbr>\nThe stock report \u003ccode>/srv/backups/shop-report.txt\u003c/code> has not been updated since the\u003cbr>\n\u003cstrong>shoptools\u003c/strong> package was upgraded. It is produced by \u003ccode>shopapp-report.service\u003c/code>\u003cbr>\n(started by a timer every 5 minutes).\u003cbr>\nThe developer says: \u003cem>\"The script works fine, I just ran it in my shell.\"\u003c/em>\u003cbr>\nMake the scheduled job work again.\u003c/blockquote>", "success": "\u003cul>\u003cli>\u003ccode>systemctl start shopapp-report\u003c/code> succeeds\u003c/li>\u003cli>\u003ccode>/srv/backups/shop-report.txt\u003c/code> is fresh and contains the stats\u003c/li>\u003cli>The timer is still enabled\u003c/li>\u003c/ul>\n\u003cp>Check with \u003ccode>sudo ./labctl.sh check e08\u003c/code>.\u003c/p>", "warmup": "\u003cp>The solution uses long command lines. They are just short commands with one flag added at a time. Practise each ladder on any Linux box first (all read-only). Every rung adds \u003cstrong>one\u003c/strong> thing to the rung above - stop at the rung you understand, and read the next one only when you are ready. The lab itself uses the last rung of each ladder.\u003c/p>\n\u003ch4>PATH - where commands are found\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">echo $PATH                         \u003cspan class=\"c\"># 1. directories searched, in order, separated by :\u003c/span>\ntype shopctl                       \u003cspan class=\"c\"># 2. where would the shell run it from? (or 'not found')\u003c/span>\ncommand -v shopctl                 \u003cspan class=\"c\"># 3. same, script-friendly\u003c/span>\nsystemctl show-environment | grep ^PATH   \u003cspan class=\"c\"># 4. the PATH systemd (and so services) use - not your shell's\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>sed - edit text from the command line\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">sed 's/old/new/' file           \u003cspan class=\"c\"># 1. print file with the first 'old' on each line replaced (file unchanged)\u003c/span>\nsed 's/old/new/g' file          \u003cspan class=\"c\"># 2. g = every match on the line\u003c/span>\nsed -n '3p' file                \u003cspan class=\"c\"># 3. -n + p = print only line 3\u003c/span>\nsed '/old/d' file               \u003cspan class=\"c\"># 4. d = delete lines that match (still only printed)\u003c/span>\nsed -i 's/old/new/' file        \u003cspan class=\"c\"># 5. -i = edit the file IN PLACE (make a copy first: cp file file.bak)\u003c/span>\nsed -i 's#/a/b#/c/d#' file      \u003cspan class=\"c\"># 6. any delimiter works: # avoids escaping / in paths\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>systemctl show / cat - ask systemd for facts\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">systemctl cat nginx                              \u003cspan class=\"c\"># 1. the unit file(s) systemd really uses, incl. drop-ins\u003c/span>\nsystemctl show nginx                             \u003cspan class=\"c\"># 2. every property (long)\u003c/span>\nsystemctl show -p User nginx                     \u003cspan class=\"c\"># 3. -p = just one property\u003c/span>\nsystemctl show -p User -p MainPID nginx          \u003cspan class=\"c\"># 4. several\u003c/span>\nsystemctl show -p MainPID --value nginx          \u003cspan class=\"c\"># 5. --value = print only the value (for scripts)\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>systemctl + journalctl - service state and logs\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">systemctl status nginx                          \u003cspan class=\"c\"># 1. state, last exit code, last log lines\u003c/span>\nsystemctl is-active nginx                       \u003cspan class=\"c\"># 2. one word: active / failed / inactive\u003c/span>\njournalctl -u nginx                             \u003cspan class=\"c\"># 3. the whole log of one unit (-u = unit)\u003c/span>\njournalctl -u nginx -n 20                       \u003cspan class=\"c\"># 4. only the last 20 lines\u003c/span>\njournalctl -u nginx -n 20 --no-pager            \u003cspan class=\"c\"># 5. print straight to the terminal (no less)\u003c/span>\njournalctl -u nginx --since \"10 min ago\"        \u003cspan class=\"c\"># 6. time window instead of line count\u003c/span>\u003c/code>\u003c/pre>", "hints": [{"title": "Hint 1 - what did systemd see?", "html": "\u003cp>\u003ccode>systemctl status shopapp-report\u003c/code> - look at \u003ccode>status=\u003c/code> in the \u003ccode>Main PID\u003c/code> / \u003ccode>Process\u003c/code> line. \u003ccode>journalctl -u shopapp-report -n 20\u003c/code>. Which exit code is it and what does it mean?\u003c/p>"}, {"title": "Hint 2 - compare environments", "html": "\u003cp>\u003ccode>type shopctl\u003c/code> in your login shell. Where does it live? Who adds that directory to your PATH? (\u003ccode>grep -r shoptools /etc/profile /etc/profile.d/ ~/.bashrc\u003c/code>). What is PATH for a systemd service? \u003ccode>systemctl show-environment\u003c/code>.\u003c/p>"}, {"title": "Hint 3 - fix options", "html": "\u003cp>Use the full path in the script, or set \u003ccode>Environment=PATH=...\u003c/code> in the unit (drop-in), or link the tool into a standard directory. Pick one and know why.\u003c/p>"}], "learn": "\u003cul>\u003cli>Exit code \u003cstrong>127\u003c/strong> = command not found. \u003cstrong>126\u003c/strong> = found but not executable.\u003c/li>\u003cli>systemd services and cron do \u003cstrong>not\u003c/strong> read \u003ccode>/etc/profile\u003c/code>, \u003ccode>~/.bashrc\u003c/code> or \u003ccode>/etc/profile.d\u003c/code>. Their PATH is short and fixed.\u003c/li>\u003cli>\"Works in my shell\" means \"my shell's environment is different\" - compare env, user, cwd.\u003c/li>\u003cli>Scripts run by machines should use full paths or set PATH themselves.\u003c/li>\u003c/ul>", "solution": "\u003cblockquote>Long commands below are built up short-first (\u003ccode># 1.\u003c/code>, \u003ccode># 2.\u003c/code> ...). Each rung adds one flag;\u003cbr>\nthe last rung is what the lab uses. The README \u003cstrong>Warm-up\u003c/strong> explains every flag from scratch.\u003c/blockquote>\n\u003ch3>1. What does systemd say?\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">systemctl status shopapp-report\n\u003cspan class=\"c\">#   Process: 3120 ExecStart=/usr/local/bin/shopapp-report (code=exited, status=127)\u003c/span>\njournalctl -u shopapp-report -n 5 --no-pager\n\u003cspan class=\"c\"># shopapp-report[3120]: /usr/local/bin/shopapp-report: line 6: shopctl: command not found\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>Exit code 127 = command not found.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>systemctl status shopapp-report\u003c/code>\u003c/td>\u003ctd>Unit state and exit code.\u003c/td>\u003ctd>\u003ccode>status=127\u003c/code> is the shell convention for \u003cstrong>command not found\u003c/strong>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>journalctl -u shopapp-report -n 5 --no-pager\u003c/code>\u003c/td>\u003ctd>Recent unit logs.\u003c/td>\u003ctd>Names the missing command: \u003ccode>shopctl: command not found\u003c/code>.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>2. Why does it work in a shell?\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">type shopctl\n\u003cspan class=\"c\"># shopctl is /opt/shoptools/bin/shopctl\u003c/span>\ngrep -r shoptools /etc/profile.d/\n\u003cspan class=\"c\"># /etc/profile.d/shoptools.sh:export PATH=\"$PATH:/opt/shoptools/bin\"\u003c/span>\nsystemctl show-environment | grep ^PATH\n\u003cspan class=\"c\"># PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>The upgrade moved \u003ccode>shopctl\u003c/code> to \u003ccode>/opt/shoptools/bin\u003c/code> and added it to PATH in \u003ccode>/etc/profile.d/\u003c/code>. Only \u003cstrong>login shells\u003c/strong> read that file. systemd (and cron) do not.\u003c/p>\n\u003cp>Note: \u003ccode>sudo /usr/local/bin/shopapp-report\u003c/code> also fails - sudo uses its own \u003ccode>secure_path\u003c/code>. \u003ccode>sudo -i\u003c/code> works because it starts a login shell. Same trap.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>type shopctl\u003c/code>\u003c/td>\u003ctd>Shows how the shell resolves a name (alias/builtin/file).\u003c/td>\u003ctd>In \u003cem>your\u003c/em> shell it exists: \u003ccode>/opt/shoptools/bin/shopctl\u003c/code> - so it works for you and fails for systemd.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>grep -r shoptools /etc/profile.d/\u003c/code>\u003c/td>\u003ctd>Recursive text search.\u003c/td>\u003ctd>Finds where PATH was extended: \u003ccode>/etc/profile.d/shoptools.sh\u003c/code>, read only by \u003cstrong>login shells\u003c/strong>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl show-environment | grep ^PATH\u003c/code>\u003c/td>\u003ctd>Prints the environment systemd gives services.\u003c/td>\u003ctd>Shows the PATH without \u003ccode>/opt/shoptools/bin\u003c/code> - the root cause.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>3. Fix (pick one)\u003c/h3>\n\u003cp>\u003cstrong>a) Full path in the script\u003c/strong> (simplest, explicit):\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">sed 's#shopctl #/opt/shoptools/bin/shopctl #' /usr/local/bin/shopapp-report   \u003cspan class=\"c\"># 1. simplest idea: preview the change (file untouched)\u003c/span>\nsed 's#^\\( *\\)shopctl #\\1/opt/shoptools/bin/shopctl #' /usr/local/bin/shopapp-report   \u003cspan class=\"c\"># 2. only at line start; \\( *\\) keeps the indentation as \\1\u003c/span>\nsudo sed -i 's#^\\( *\\)shopctl #\\1/opt/shoptools/bin/shopctl #' /usr/local/bin/shopapp-report   \u003cspan class=\"c\"># 3. -i = write it into the file\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>b) Set PATH for the unit\u003c/strong> (no script change):\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo systemctl edit shopapp-report\n\u003cspan class=\"c\"># [Service]\u003c/span>\n\u003cspan class=\"c\"># Environment=PATH=/opt/shoptools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>c) Link into a standard directory\u003c/strong>:\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo ln -s /opt/shoptools/bin/shopctl /usr/local/bin/shopctl\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>sed -i 's#^\\( *\\)shopctl #\\1/opt/shoptools/bin/shopctl #' SCRIPT\u003c/code>\u003c/td>\u003ctd>In-place edit; \u003ccode>#\u003c/code> as delimiter so slashes need no escaping; \u003ccode>\\1\u003c/code> keeps the indentation.\u003c/td>\u003ctd>Fix a: use the absolute path. Explicit and independent of PATH.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl edit shopapp-report\u003c/code> + \u003ccode>Environment=PATH=...\u003c/code>\u003c/td>\u003ctd>Opens a drop-in override file.\u003c/td>\u003ctd>Fix b: give just this unit the PATH without touching the script.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ln -s /opt/shoptools/bin/shopctl /usr/local/bin/shopctl\u003c/code>\u003c/td>\u003ctd>Creates a symlink in a standard PATH directory.\u003c/td>\u003ctd>Fix c: make the tool available everywhere.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>4. Verify\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo systemctl start shopapp-report\nsystemctl status shopapp-report --no-pager    \u003cspan class=\"c\"># status=0/SUCCESS\u003c/span>\ncat /srv/backups/shop-report.txt\nsystemctl list-timers shopapp-report.timer\nsudo ./labctl.sh check e08\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>systemctl start shopapp-report\u003c/code>\u003c/td>\u003ctd>Runs the oneshot job now.\u003c/td>\u003ctd>Do not wait for the timer to test the fix.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl list-timers shopapp-report.timer\u003c/code>\u003c/td>\u003ctd>Shows next/last run.\u003c/td>\u003ctd>Confirm the scheduled trigger is intact.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>", "root": "\u003cdiv class='tablewrap'>\u003ctable>\u003ctbody>\u003ctr>\u003ctd>Root cause\u003c/td>\u003ctd>Package upgrade moved \u003ccode>shopctl\u003c/code> out of the default PATH; only login shells got the new PATH\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fix\u003c/td>\u003ctd>Full path / unit \u003ccode>Environment=PATH\u003c/code> / symlink\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prevent\u003c/td>\u003ctd>Test scheduled jobs the way they run: \u003ccode>systemd-run --wait -p ... \u003c/code> or \u003ccode>systemctl start\u003c/code>; alert when a report gets stale; use full paths in scripts\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "explain": "\u003cp>\u003cstrong>Exit code 127 = command not found\u003c/strong> (126 = found but not executable). systemd logged \u003ccode>shopctl: command not found\u003c/code> with status 127.\u003c/p>\n\u003cp>\u003cstrong>Why it works in your shell:\u003c/strong> an interactive \u003cstrong>login shell\u003c/strong> reads \u003ccode>/etc/profile\u003c/code>, \u003ccode>/etc/profile.d/*.sh\u003c/code> and \u003ccode>~/.bashrc\u003c/code>. The package upgrade moved \u003ccode>shopctl\u003c/code> to \u003ccode>/opt/shoptools/bin\u003c/code> and added that directory to PATH in \u003ccode>/etc/profile.d/shoptools.sh\u003c/code>. systemd (and cron) never read those files; their PATH is short and fixed: \u003ccode>/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\u003c/code>. \u003ccode>sudo\u003c/code> has its own \u003ccode>secure_path\u003c/code>, \u003ccode>sudo -i\u003c/code> starts a login shell - same trap.\u003c/p>\n\u003cp>\u003cstrong>Three valid fixes:\u003c/strong>\u003c/p>\n\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Fix\u003c/th>\u003cth>Good because\u003c/th>\u003cth>Watch out\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Full path in the script\u003c/td>\u003ctd>explicit, no hidden env\u003c/td>\u003ctd>must edit script\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Environment=PATH=...\u003c/code> drop-in (\u003ccode>systemctl edit\u003c/code>)\u003c/td>\u003ctd>no script change\u003c/td>\u003ctd>must list the whole PATH\u003c/td>\u003c/tr>\u003ctr>\u003ctd>symlink into \u003ccode>/usr/local/bin\u003c/code>\u003c/td>\u003ctd>works everywhere\u003c/td>\u003ctd>one more thing to keep in sync\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Method:\u003c/strong> \"works in my shell\" means \"my environment differs\" - compare user, cwd, env, PATH. Test the job the way it runs: \u003ccode>systemctl start shopapp-report\u003c/code>.\u003c/p>", "mcq": [{"q": "A systemd service exits with status 127. What does that mean?", "o": ["Command not found", "Permission denied on the executable", "Out of memory", "Segmentation fault"], "why": "127 = not found; 126 = found but not executable."}, {"q": "Why does the script work in the developer's shell but not under systemd?", "o": ["systemd does not read /etc/profile.d or ~/.bashrc, so its PATH lacks /opt/shoptools/bin", "systemd runs scripts as a different language", "The timer is disabled", "The script is not executable only for systemd"], "why": "Only login shells source /etc/profile.d. Services get a minimal fixed PATH."}, {"q": "Which is a valid fix that needs no change to the script file?", "o": ["A systemctl edit drop-in with Environment=PATH=/opt/shoptools/bin:...", "chmod 777 /opt/shoptools", "Reboot the host", "Run the job from your own interactive shell every 5 minutes"], "why": "Set PATH for the unit; or use full paths, or a symlink."}], "qa": [{"q": "Compare the three fix options (full path, unit Environment=PATH, symlink). Which would you choose and why?", "a": "Full path is the most explicit and robust for machine-run scripts. A drop-in PATH keeps the script untouched but you must repeat the full standard PATH. A symlink makes the tool available to everything but is hidden indirection. Any is acceptable if you can justify it; for scheduled jobs prefer explicit full paths."}, {"q": "Why does `sudo /usr/local/bin/shopapp-report` also fail, and why does `sudo -i` succeed?", "a": "sudo resets PATH to its `secure_path` (no /opt/shoptools/bin), so the same 127 appears. `sudo -i` starts a login shell that sources /etc/profile.d, so PATH is extended - which hides the bug when you test that way."}]}, {"id": "e09", "level": "easy", "title": "Down after every reboot", "time": "10 min", "skills": "systemctl enable, unit `[Install]` section, boot targets", "ticket": "\u003cblockquote>\u003cstrong>INC-1009 · P2 (post-incident action)\u003c/strong>\u003cbr>\nAfter last night's patch reboot the shop was down for 40 minutes until on-call ran\u003cbr>\n\u003ccode>systemctl start shopapp\u003c/code>. It is running now.\u003cbr>\nMake sure shopapp starts \u003cstrong>by itself\u003c/strong> after the next reboot.\u003cbr>\nNote: last week a \"unit file template cleanup\" was rolled out to this host.\u003c/blockquote>", "success": "\u003cul>\u003cli>\u003ccode>shopapp\u003c/code> is enabled for boot (\u003ccode>multi-user.target\u003c/code>)\u003c/li>\u003cli>The unit file itself declares how it is enabled (so \u003ccode>enable\u003c/code>/\u003ccode>disable\u003c/code> keep working)\u003c/li>\u003cli>shopapp is running and healthy\u003c/li>\u003c/ul>\n\u003cp>Check with \u003ccode>sudo ./labctl.sh check e09\u003c/code>.\u003c/p>", "warmup": "\u003cp>The solution uses long command lines. They are just short commands with one flag added at a time. Practise each ladder on any Linux box first (all read-only). Every rung adds \u003cstrong>one\u003c/strong> thing to the rung above - stop at the rung you understand, and read the next one only when you are ready. The lab itself uses the last rung of each ladder.\u003c/p>\n\u003ch4>systemctl - enabled vs active\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">systemctl is-active shopapp          \u003cspan class=\"c\"># 1. running now?\u003c/span>\nsystemctl is-enabled shopapp         \u003cspan class=\"c\"># 2. starts at boot? (enabled / disabled / static)\u003c/span>\nsystemctl cat shopapp                \u003cspan class=\"c\"># 3. the unit file(s) systemd really uses\u003c/span>\nsudo systemctl daemon-reload         \u003cspan class=\"c\"># 4. after editing a unit file, tell systemd to re-read it\u003c/span>\nsudo systemctl enable shopapp        \u003cspan class=\"c\"># 5. start it at boot\u003c/span>\nsystemctl list-dependencies multi-user.target | grep shopapp   \u003cspan class=\"c\"># 6. is it really pulled in at boot?\u003c/span>\u003c/code>\u003c/pre>", "hints": [{"title": "Hint 1 - running is not enabled", "html": "\u003cp>\u003ccode>systemctl is-active shopapp\u003c/code> vs \u003ccode>systemctl is-enabled shopapp\u003c/code>. They answer different questions.\u003c/p>"}, {"title": "Hint 2 - read the error", "html": "\u003cp>Try \u003ccode>sudo systemctl enable shopapp\u003c/code>. Read the whole message. Then \u003ccode>systemctl cat shopapp\u003c/code>.\u003c/p>"}, {"title": "Hint 3 - what enable does", "html": "\u003cp>\u003ccode>enable\u003c/code> creates a symlink in \u003ccode>/etc/systemd/system/&lt;target&gt;.wants/\u003c/code> based on the \u003ccode>WantedBy=\u003c/code> line in the \u003ccode>[Install]\u003c/code> section. No \u003ccode>[Install]\u003c/code> = nothing to link.\u003c/p>"}], "learn": "\u003cul>\u003cli>\u003ccode>start\u003c/code> = now. \u003ccode>enable\u003c/code> = at boot. You usually want both: \u003ccode>systemctl enable --now\u003c/code>.\u003c/li>\u003cli>\u003ccode>enable\u003c/code> needs \u003ccode>[Install] WantedBy=...\u003c/code> in the unit.\u003c/li>\u003cli>After any fix, ask \"will this survive a reboot?\"\u003c/li>\u003c/ul>", "solution": "\u003cblockquote>Long commands below are built up short-first (\u003ccode># 1.\u003c/code>, \u003ccode># 2.\u003c/code> ...). Each rung adds one flag;\u003cbr>\nthe last rung is what the lab uses. The README \u003cstrong>Warm-up\u003c/strong> explains every flag from scratch.\u003c/blockquote>\n\u003ch3>1. Running, but not enabled\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">systemctl is-active shopapp     \u003cspan class=\"c\"># active\u003c/span>\nsystemctl is-enabled shopapp    \u003cspan class=\"c\"># static   &lt;- no [Install] section, cannot be enabled\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>static\u003c/code> means: the unit has no \u003ccode>[Install]\u003c/code> section, so it only starts if another unit pulls it in. Nothing does, so it never starts at boot.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>systemctl is-active shopapp\u003c/code>\u003c/td>\u003ctd>Prints whether it is \u003cstrong>running now\u003c/strong>.\u003c/td>\u003ctd>\u003ccode>active\u003c/code> - looks fine, but that is only half the story.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl is-enabled shopapp\u003c/code>\u003c/td>\u003ctd>Prints whether it \u003cstrong>starts at boot\u003c/strong>.\u003c/td>\u003ctd>\u003ccode>static\u003c/code> = unit has no \u003ccode>[Install]\u003c/code> section, so it can never be enabled. Nothing pulls it in at boot.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>2. Try to enable it\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo systemctl enable shopapp\n\u003cspan class=\"c\"># The unit files have no installation config (WantedBy=, RequiredBy=, UpheldBy=,\u003c/span>\n\u003cspan class=\"c\"># Also=, or Alias= settings in the [Install] section, and DefaultInstance= for\u003c/span>\n\u003cspan class=\"c\"># template units). This means they are not meant to be enabled or disabled ...\u003c/span>\nsystemctl cat shopapp      \u003cspan class=\"c\"># ends after [Service] - [Install] is gone\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>systemctl enable shopapp\u003c/code>\u003c/td>\u003ctd>Creates the boot symlink from \u003ccode>[Install]\u003c/code>.\u003c/td>\u003ctd>Fails with \"no installation config\" - confirms the missing section.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl cat shopapp\u003c/code>\u003c/td>\u003ctd>Prints the unit file(s) exactly as systemd sees them, including drop-ins.\u003c/td>\u003ctd>Shows the file ends after \u003ccode>[Service]\u003c/code>.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>3. Fix the unit file\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudoedit /etc/systemd/system/shopapp.service\n\u003cspan class=\"c\"># add at the end:\u003c/span>\n\u003cspan class=\"c\"># [Install]\u003c/span>\n\u003cspan class=\"c\"># WantedBy=multi-user.target\u003c/span>\n\nsudo systemctl daemon-reload\nsudo systemctl enable shopapp\n\u003cspan class=\"c\"># Created symlink /etc/systemd/system/multi-user.target.wants/shopapp.service -&gt; ...\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>Don't create the symlink by hand: the next \u003ccode>systemctl disable/enable\u003c/code> or config management run will not know about it.\u003c/p>\n\u003cp>Also: tell the owner of the \"template cleanup\" - other services from the same template are probably broken too: \u003ccode>grep -L '^\\[Install\\]' /etc/systemd/system/*.service\u003c/code>.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>sudoedit /etc/systemd/system/shopapp.service\u003c/code>\u003c/td>\u003ctd>Edits a file as root, through your own editor, safely.\u003c/td>\u003ctd>Add \u003ccode>[Install]\u003c/code> + \u003ccode>WantedBy=multi-user.target\u003c/code> (\"start in normal multi-user boot\").\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl daemon-reload\u003c/code>\u003c/td>\u003ctd>Re-reads all unit files.\u003c/td>\u003ctd>Required after any unit file change, otherwise systemd uses the old copy.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl enable shopapp\u003c/code>\u003c/td>\u003ctd>Creates \u003ccode>multi-user.target.wants/shopapp.service\u003c/code> symlink.\u003c/td>\u003ctd>The proper way - never hand-make the symlink; tooling would not track it.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>grep -L '^\\[Install\\]' /etc/systemd/system/*.service\u003c/code>\u003c/td>\u003ctd>\u003ccode>-L\u003c/code> lists files that do \u003cstrong>not\u003c/strong> match.\u003c/td>\u003ctd>Find other units with the same template breakage.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>4. Verify\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">systemctl is-enabled shopapp            \u003cspan class=\"c\"># enabled\u003c/span>\nsystemctl list-dependencies multi-user.target | grep shopapp\nsudo ./labctl.sh check e09\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>systemctl list-dependencies multi-user.target | grep shopapp\u003c/code>\u003c/td>\u003ctd>Shows what the boot target pulls in.\u003c/td>\u003ctd>Proof that it now starts at boot.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>", "root": "\u003cdiv class='tablewrap'>\u003ctable>\u003ctbody>\u003ctr>\u003ctd>Root cause\u003c/td>\u003ctd>Template rollout removed the \u003ccode>[Install]\u003c/code> section; service was never enabled for boot\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fix\u003c/td>\u003ctd>Restore \u003ccode>[Install] WantedBy=multi-user.target\u003c/code>, \u003ccode>systemctl enable\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prevent\u003c/td>\u003ctd>Lint unit files in CI (\u003ccode>systemd-analyze verify\u003c/code>); reboot-test hosts after changes; alert on \"service not running\" not just \"service failed\"\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "explain": "\u003cp>\u003cstrong>Running is not enabled.\u003c/strong> \u003ccode>is-active\u003c/code> asks \"is it running now?\"; \u003ccode>is-enabled\u003c/code> asks \"will it start at boot?\". Output \u003ccode>static\u003c/code> means the unit has \u003cstrong>no \u003ccode>[Install]\u003c/code> section\u003c/strong> - systemd has no instruction how to hook it into boot, so it only starts if another unit pulls it in (none does).\u003c/p>\n\u003cp>\u003cstrong>What \u003ccode>enable\u003c/code> does:\u003c/strong> reads \u003ccode>[Install] WantedBy=multi-user.target\u003c/code> and creates a symlink \u003ccode>/etc/systemd/system/multi-user.target.wants/shopapp.service -&gt; ...\u003c/code>. At boot \u003ccode>multi-user.target\u003c/code> \"wants\" the service. No \u003ccode>[In
