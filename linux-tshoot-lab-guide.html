003cstrong>and all drop-ins\u003c/strong>. \u003ccode>systemctl show shopapp -p CPUQuotaPerSecUSec -p Slice\u003c/code>. A unit can also be limited by its \u003cstrong>parent slice\u003c/strong>: \u003ccode>systemctl cat &lt;slice&gt;\u003c/code>, \u003ccode>cat /sys/fs/cgroup/&lt;slice&gt;/cpu.max\u003c/code>.\u003c/p>"}, {"title": "Hint 3 - fix it cleanly", "html": "\u003cp>Remove the FINOPS-77 drop-ins / slice (or raise them to something reasonable), \u003ccode>daemon-reload\u003c/code>, restart. Check \u003ccode>cpu.max\u003c/code> again on every level of the path: \u003ccode>max 100000\u003c/code> = no limit.\u003c/p>"}], "learn": "\u003cul>\u003cli>Throttling is invisible in host-level \u003ccode>top\u003c/code>: the host is idle while one cgroup waits for its quota.\u003c/li>\u003cli>\u003ccode>cpu.max\u003c/code> = \u003ccode>&lt;quota&gt; &lt;period&gt;\u003c/code>, e.g. \u003ccode>5000 100000\u003c/code> = 5% of one CPU. \u003ccode>nr_throttled\u003c/code> growing = you hit it.\u003c/li>\u003cli>Limits stack: service, then slice, then parent slice. The tightest one wins.\u003c/li>\u003cli>\u003ccode>systemctl cat\u003c/code> and \u003ccode>systemd-delta\u003c/code> show drop-ins that silently change units.\u003c/li>\u003c/ul>", "solution": "\u003cblockquote>Long commands below are built up short-first (\u003ccode># 1.\u003c/code>, \u003ccode># 2.\u003c/code> ...). Each rung adds one flag;\u003cbr>\nthe last rung is what the lab uses. The README \u003cstrong>Warm-up\u003c/strong> explains every flag from scratch.\u003c/blockquote>\n\u003ch3>1. Confirm\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">curl localhost/                                                       \u003cspan class=\"c\"># 1. one request\u003c/span>\ncurl -s -o /dev/null -w '%{http_code} %{time_total}s\\n' localhost/    \u003cspan class=\"c\"># 2. just status + total time\u003c/span>\nfor i in 1 2 3 4 5; do curl -s -o /dev/null -w '%{http_code} %{time_total}s\\n' localhost/; done   \u003cspan class=\"c\"># 3. repeat 5 times\u003c/span>\n\u003cspan class=\"c\"># 200 2.913s\u003c/span>\n\u003cspan class=\"c\"># 200 3.402s\u003c/span>\n\u003cspan class=\"c\"># 504 10.001s\u003c/span>\ntop -bn1 | head -4          \u003cspan class=\"c\"># %Cpu(s): 6.1 us, 2.0 sy, 91.2 id\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>Slow, but the host is idle. Not a host CPU problem - maybe a problem of what shopapp is \u003cem>allowed\u003c/em> to use.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>curl -s -o /dev/null -w '%{http_code} %{time_total}s\\n' localhost/\u003c/code>\u003c/td>\u003ctd>Status and total time.\u003c/td>\u003ctd>3-10 s and 504s...\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>top -bn1 | head -4\u003c/code>\u003c/td>\u003ctd>CPU header.\u003c/td>\u003ctd>91% idle: the \u003cstrong>host\u003c/strong> is not busy, so something is restricting this service.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>2. Look at the cgroup\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">systemctl status shopapp | grep -E 'CGroup|CPU'\n\u003cspan class=\"c\">#      CPU: 1min 2.381s\u003c/span>\n\u003cspan class=\"c\">#   CGroup: /shop.slice/shopapp.service          &lt;- not in system.slice!\u003c/span>\nsystemd-cgtop -n 1 | head                         \u003cspan class=\"c\"># shopapp ~5% CPU, never more\u003c/span>\nCG=/sys/fs/cgroup/shop.slice/shopapp.service\ncat $CG/cpu.max                                   \u003cspan class=\"c\"># 5000 100000  = 5% of one CPU\u003c/span>\ncat $CG/cpu.stat\n\u003cspan class=\"c\"># nr_periods 41210\u003c/span>\n\u003cspan class=\"c\"># nr_throttled 39877        &lt;- throttled in almost every period\u003c/span>\n\u003cspan class=\"c\"># throttled_usec 912384112\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>systemctl status shopapp | grep -E 'CGroup|CPU'\u003c/code>\u003c/td>\u003ctd>Shows total CPU time and the cgroup path.\u003c/td>\u003ctd>CGroup is \u003ccode>/shop.slice/...\u003c/code>, not \u003ccode>system.slice\u003c/code>: someone moved it.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemd-cgtop -n 1\u003c/code>\u003c/td>\u003ctd>Per-cgroup resource view.\u003c/td>\u003ctd>The service never goes above ~5%.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>cat $CG/cpu.max\u003c/code>\u003c/td>\u003ctd>Raw cgroup v2 CPU limit: \u003ccode>quota period\u003c/code> in microseconds.\u003c/td>\u003ctd>\u003ccode>5000 100000\u003c/code> = 5% of one CPU.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>cat $CG/cpu.stat\u003c/code>\u003c/td>\u003ctd>Counters.\u003c/td>\u003ctd>\u003ccode>nr_throttled\u003c/code> almost equals \u003ccode>nr_periods\u003c/code>: throttled nearly every period.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>3. Where do the limits come from?\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">systemctl cat shopapp\n\u003cspan class=\"c\"># # /etc/systemd/system/shopapp.service\u003c/span>\n\u003cspan class=\"c\"># ...\u003c/span>\n\u003cspan class=\"c\"># # /etc/systemd/system/shopapp.service.d/50-finops.conf\u003c/span>\n\u003cspan class=\"c\"># [Service]\u003c/span>\n\u003cspan class=\"c\"># # FINOPS-77 right-size noisy services\u003c/span>\n\u003cspan class=\"c\"># CPUQuota=5%\u003c/span>\n\u003cspan class=\"c\"># Slice=shop.slice\u003c/span>\nsystemd-delta --type=extended                     \u003cspan class=\"c\"># lists all drop-ins on the host\u003c/span>\n\nsystemctl cat shop.slice\n\u003cspan class=\"c\"># [Slice]\u003c/span>\n\u003cspan class=\"c\"># # FINOPS-77 cap the whole shop at 10%\u003c/span>\n\u003cspan class=\"c\"># CPUQuota=10%\u003c/span>\ncat /sys/fs/cgroup/shop.slice/cpu.max             \u003cspan class=\"c\"># 10000 100000\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>Two layers: the service is capped at 5% and its slice at 10%. Removing only the service quota still leaves the slice cap - latency improves a bit and stays bad.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>systemctl cat shopapp\u003c/code>\u003c/td>\u003ctd>Unit file and drop-ins.\u003c/td>\u003ctd>Finds \u003ccode>50-finops.conf\u003c/code>: \u003ccode>CPUQuota=5%\u003c/code> and \u003ccode>Slice=shop.slice\u003c/code>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemd-delta --type=extended\u003c/code>\u003c/td>\u003ctd>Lists every override across the host.\u003c/td>\u003ctd>Find all drop-ins from the FinOps change at once.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl cat shop.slice\u003c/code> and \u003ccode>cat /sys/fs/cgroup/shop.slice/cpu.max\u003c/code>\u003c/td>\u003ctd>The parent slice.\u003c/td>\u003ctd>A second cap: 10%. Removing only the service quota would still leave the slice limit.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>4. Fix\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo rm /etc/systemd/system/shopapp.service.d/50-finops.conf     \u003cspan class=\"c\"># puts shopapp back in system.slice\u003c/span>\nsudo systemctl daemon-reload\nsudo systemctl restart shopapp\nsystemctl show shopapp -p Slice -p CPUQuotaPerSecUSec\n\u003cspan class=\"c\"># Slice=system.slice\u003c/span>\n\u003cspan class=\"c\"># CPUQuotaPerSecUSec=infinity\u003c/span>\ncat /sys/fs/cgroup/system.slice/shopapp.service/cpu.max           \u003cspan class=\"c\"># max 100000\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>If you keep \u003ccode>shop.slice\u003c/code> (grouping is useful), remove its quota or use \u003ccode>CPUWeight=\u003c/code> instead: weights only matter when CPU is actually contended, quotas throttle always.\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo rm /etc/systemd/system/shop.slice &amp;&amp; sudo systemctl daemon-reload   \u003cspan class=\"c\"># if unused now\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>rm .../50-finops.conf; systemctl daemon-reload; systemctl restart shopapp\u003c/code>\u003c/td>\u003ctd>Remove override, reload, restart.\u003c/td>\u003ctd>Puts it back in \u003ccode>system.slice\u003c/code> with no quota.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl show shopapp -p Slice -p CPUQuotaPerSecUSec\u003c/code>\u003c/td>\u003ctd>Effective values.\u003c/td>\u003ctd>Verify \u003ccode>system.slice\u003c/code> and \u003ccode>infinity\u003c/code>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>CPUWeight=\u003c/code> (alternative)\u003c/td>\u003ctd>Relative share, only matters under contention.\u003c/td>\u003ctd>Better than quotas for fair sharing; quotas throttle even when the CPU is idle.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>5. Verify\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">for i in $(seq 10); do curl -s -o /dev/null -w '%{time_total}\\n' localhost/; done\ngrep nr_throttled /sys/fs/cgroup/system.slice/shopapp.service/cpu.stat    \u003cspan class=\"c\"># stays 0\u003c/span>\nsudo ./labctl.sh check h10\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>grep nr_throttled .../cpu.stat\u003c/code>\u003c/td>\u003ctd>Re-read counter.\u003c/td>\u003ctd>Must stay at 0 after the fix.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>", "root": "\u003cdiv class='tablewrap'>\u003ctable>\u003ctbody>\u003ctr>\u003ctd>Root cause\u003c/td>\u003ctd>FINOPS-77 drop-in moved shopapp into \u003ccode>shop.slice\u003c/code> with \u003ccode>CPUQuota=5%\u003c/code>, slice capped at 10%; under normal traffic the app was throttled every period\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fix\u003c/td>\u003ctd>Removed the drop-in (and slice quota); shopapp back in \u003ccode>system.slice\u003c/code> without quota\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prevent\u003c/td>\u003ctd>Resource-limit changes go through review with load data; monitor \u003ccode>nr_throttled\u003c/code> / \u003ccode>throttled_usec\u003c/code> per service; prefer \u003ccode>CPUWeight\u003c/code> to hard quotas for latency-sensitive services\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "explain": "\u003cp>\u003cstrong>The host is idle - but shopapp is not allowed to use it.\u003c/strong> FINOPS-77 added a drop-in \u003ccode>50-finops.conf\u003c/code>:\u003c/p>\n\u003cpre>\u003ccode class=\"lang-text\">[Service]\nCPUQuota=5%\nSlice=shop.slice\u003c/code>\u003c/pre>\n\u003cp>and \u003ccode>shop.slice\u003c/code> itself has \u003ccode>CPUQuota=10%\u003c/code>. systemd turns these into cgroup v2 \u003ccode>cpu.max\u003c/code>:\u003c/p>\n\u003cul>\u003cli>\u003ccode>cpu.max = 5000 100000\u003c/code> -&gt; \u003cstrong>5000 us of CPU per 100000 us period = 5% of one CPU\u003c/strong>\u003c/li>\u003cli>\u003ccode>cpu.stat\u003c/code>: \u003ccode>nr_throttled 39877\u003c/code> of \u003ccode>nr_periods 41210\u003c/code> -&gt; throttled in almost every period; \u003ccode>throttled_usec\u003c/code> huge\u003c/li>\u003c/ul>\n\u003cp>Host-level \u003ccode>top\u003c/code> shows 90% idle because other CPUs have nothing to do - the quota stops \u003cem>this cgroup\u003c/em> at its allowance regardless.\u003c/p>\n\u003cp>\u003cstrong>Limits stack:\u003c/strong> service -&gt; slice -&gt; parent slice. The \u003cstrong>tightest wins\u003c/strong>. Removing only the service quota still leaves the slice cap at 10%.\u003c/p>\n\u003cp>\u003cstrong>Find them:\u003c/strong> \u003ccode>systemd-cgtop\u003c/code>, \u003ccode>systemctl status shopapp\u003c/code> (\u003ccode>CGroup: /shop.slice/...\u003c/code>), \u003ccode>systemctl cat shopapp\u003c/code> (shows every drop-in), \u003ccode>systemd-delta --type=extended\u003c/code>, \u003ccode>cat /sys/fs/cgroup/&lt;path&gt;/cpu.max\u003c/code> on \u003cstrong>every level\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>Fix:\u003c/strong> remove the drop-in (and the slice quota), \u003ccode>daemon-reload\u003c/code>, restart; confirm \u003ccode>cpu.max = max 100000\u003c/code> and \u003ccode>nr_throttled\u003c/code> stays 0. Prefer \u003cstrong>\u003ccode>CPUWeight=\u003c/code>\u003c/strong> (matters only under contention) to hard \u003cstrong>\u003ccode>CPUQuota=\u003c/code>\u003c/strong> for latency-sensitive services.\u003c/p>", "mcq": [{"q": "The host is 90% idle but one service is very slow. Which mechanism could explain it?", "o": ["CPU throttling by a cgroup quota (cpu.max / CPUQuota)", "A full disk", "Zombie processes", "An expired certificate"], "why": "A quota throttles the cgroup even when the host has free CPU."}, {"q": "What does `cpu.max` = `5000 100000` mean?", "o": ["5000 us of CPU time per 100000 us period = 5% of one CPU", "5000 CPUs", "100000 shares", "5% of total host CPU"], "why": "quota/period."}, {"q": "Which is better for a latency-sensitive service on a shared host?", "o": ["CPUWeight (relative share applied only under contention)", "A hard CPUQuota of 5%", "Nice 19", "Removing the cgroup"], "why": "Weights don't throttle an idle host; quotas do."}], "qa": [{"q": "Why isn't removing only the service's CPUQuota enough in this lab?", "a": "The service sits in `shop.slice`, which has its own 10% quota. Limits stack and the tightest applies, so shopapp would still be throttled at 10% of one CPU. Remove the drop-in that moves it into shop.slice (and/or the slice quota) and verify cpu.max on every level."}, {"q": "How do you prove throttling to a skeptic who says 'it can't be CPU, the host is idle'?", "a": "Show `cpu.max` for the service cgroup and `cpu.stat` with `nr_throttled`/`throttled_usec` increasing (nr_throttled close to nr_periods), plus `systemd-cgtop` showing shopapp stuck at ~5% while the host shows 90% idle."}]}], "method": {"html": "\u003cp>Tools change; the method doesn't. Use it in every lab.\u003c/p>\n\u003ch3>1. Confirm the symptom yourself\u003c/h3>\n\u003cp>Tickets are often wrong. Reproduce it: \u003ccode>curl -v\u003c/code>, \u003ccode>systemctl status\u003c/code>, \u003ccode>df -h\u003c/code>. Write down the exact error.\u003c/p>\n\u003ch3>2. Define scope and ask \"what changed?\"\u003c/h3>\n\u003cp>One host or all? One service or all? Since when? Most incidents follow a change: deploy, config edit, reboot, cron job, \"hardening\", \"cleanup\", load test. Check \u003ccode>journalctl --since\u003c/code>, \u003ccode>last reboot\u003c/code>, \u003ccode>ls -lt /etc | head\u003c/code>, package logs (\u003ccode>/var/log/apt/history.log\u003c/code>).\u003c/p>\n\u003ch3>3. Work from the outside in, layer by layer\u003c/h3>\n\u003cp>Client -&gt; DNS -&gt; network -&gt; port/listener -&gt; proxy -&gt; service -&gt; app -&gt; OS resources (CPU, memory, disk, fds) -&gt; kernel/hardware. Find the \u003cstrong>first\u003c/strong> layer that is broken. Error messages usually name it:\u003c/p>\n\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Message\u003c/th>\u003cth>Likely layer\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>Connection refused\u003c/code>\u003c/td>\u003ctd>nothing listening on that port (service down / wrong port)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Connection timed out\u003c/code>\u003c/td>\u003ctd>packets dropped: firewall, routing, host down\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Name or service not known\u003c/code> / \u003ccode>Temporary failure in name resolution\u003c/code>\u003c/td>\u003ctd>DNS\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>502 Bad Gateway\u003c/code>\u003c/td>\u003ctd>proxy is up, backend down or refusing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>504 Gateway Timeout\u003c/code>\u003c/td>\u003ctd>backend up but not answering in time (hung, overloaded)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Permission denied\u003c/code> (EACCES)\u003c/td>\u003ctd>file mode / owner / directory \u003ccode>x\u003c/code> bit / SELinux-AppArmor\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>No space left on device\u003c/code> (ENOSPC)\u003c/td>\u003ctd>blocks \u003cstrong>or\u003c/strong> inodes full\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Too many open files\u003c/code> (EMFILE)\u003c/td>\u003ctd>per-process fd limit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Read-only file system\u003c/code> (EROFS)\u003c/td>\u003ctd>fs remounted ro (often after errors) or mounted ro\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Address already in use\u003c/code> (EADDRINUSE)\u003c/td>\u003ctd>another process owns the port\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Cannot assign requested address\u003c/code> (EADDRNOTAVAIL)\u003c/td>\u003ctd>out of local (ephemeral) ports for outgoing connections\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Resource temporarily unavailable\u003c/code> (EAGAIN) on fork\u003c/td>\u003ctd>task/PID limit (\u003ccode>TasksMax\u003c/code>, zombies)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>certificate has expired\u003c/code> / \u003ccode>verify failed\u003c/code>\u003c/td>\u003ctd>TLS: wrong/expired cert, missing CA, wrong name\u003c/td>\u003c/tr>\u003ctr>\u003ctd>exit code \u003ccode>127\u003c/code>\u003c/td>\u003ctd>command not found (PATH)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>4. USE method for performance\u003c/h3>\n\u003cp>For every resource - CPU, memory, disk, network: \u003cstrong>U\u003c/strong>tilisation, \u003cstrong>S\u003c/strong>aturation, \u003cstrong>E\u003c/strong>rrors. Don't stop at the first busy thing you see (lab H04).\u003c/p>\n\u003ch3>5. One hypothesis, one test, one change at a time\u003c/h3>\n\u003cp>Write the hypothesis, the command that tests it, and the result. Change one thing, then re-test. Several changes at once = you don't know what fixed it (or what broke something new).\u003c/p>\n\u003ch3>6. Preserve evidence before you \"fix\"\u003c/h3>\n\u003cp>A restart destroys the state you need (open fds, memory, stuck threads). Capture first: \u003ccode>ps\u003c/code>, \u003ccode>ls /proc/PID/fd\u003c/code>, \u003ccode>ss\u003c/code>, logs. Then restart if you must (lab H01).\u003c/p>\n\u003ch3>7. Fix the cause, not only the symptom\u003c/h3>\n\u003cp>Killing a process that cron restarts, deleting files that a disabled cleanup job should delete, raising a limit to hide a leak - these come back. Ask \"why?\" until you hit a process problem.\u003c/p>\n\u003ch3>8. Verify, persist, document\u003c/h3>\n\u003cp>Verify from the user's view (\u003ccode>curl\u003c/code>), make it survive a reboot (fstab, \u003ccode>systemctl enable\u003c/code>, \u003ccode>sysctl.d\u003c/code>, firewall persistence), and write the incident notes with prevention items.\u003c/p>\n\u003ch3>Safety rules in production\u003c/h3>\n\u003cul>\u003cli>Look before destructive commands: \u003ccode>ls\u003c/code> before \u003ccode>rm\u003c/code>, \u003ccode>find ... -print | wc -l\u003c/code> before \u003ccode>-delete\u003c/code>, \u003ccode>pgrep -af\u003c/code> before \u003ccode>pkill -f\u003c/code>.\u003c/li>\u003cli>Prefer \u003ccode>reload\u003c/code> over \u003ccode>restart\u003c/code>; run the config test first (\u003ccode>nginx -t\u003c/code>, \u003ccode>sshd -t\u003c/code>).\u003c/li>\u003cli>Never \u003ccode>chmod 777\u003c/code>, never run the service as root to \"fix\" permissions.\u003c/li>\u003cli>Never \u003ccode>fsck\u003c/code> a mounted filesystem. Never just remount a broken fs \u003ccode>rw\u003c/code>.\u003c/li>\u003cli>Tell people what you are doing (incident channel) before you do it.\u003c/li>\u003c/ul>", "mcq": [{"q": "`Connection refused` - which layer is most likely at fault?", "o": ["Nothing listens on that port (service down or wrong port)", "A firewall drop", "DNS", "TLS"], "why": "Refused = an active RST from the kernel: reachable host, no listener."}, {"q": "`Connection timed out` - which layer is most likely at fault?", "o": ["Packets are dropped: firewall, routing or host down", "Nothing listens on that port", "Wrong file permissions", "Out of memory"], "why": "Silence is typical for DROP rules and routing problems."}, {"q": "nginx returns 502 versus 504. What is the difference?", "o": ["502: backend down/refusing; 504: backend up but not answering in time", "502: DNS; 504: TLS", "502: client error; 504: server error", "They are identical"], "why": "Check the backend first for 502; for 504 look for hangs and overload."}, {"q": "`No space left on device` (ENOSPC) with `df -h` showing free space. What next?", "o": ["df -i - inodes may be exhausted", "Reboot", "Add RAM", "Run fsck on a mounted fs"], "why": "ENOSPC means no blocks OR no inodes."}, {"q": "What does `Cannot assign requested address` on an outgoing connect indicate?", "o": ["Out of local (ephemeral) ports", "The remote IP is wrong", "DNS failure", "Disk full"], "why": "EADDRNOTAVAIL on connect: see TIME_WAIT and ip_local_port_range."}, {"q": "A systemd service exits with 127. What does that mean?", "o": ["Command not found (PATH)", "Out of memory", "Permission denied", "Port in use"], "why": "127 = not found; 126 = not executable."}, {"q": "What does the USE method stand for?", "o": ["Utilisation, Saturation, Errors - for each resource", "User, System, Exit", "Up, Slow, Error", "Usage, Swap, Entropy"], "why": "Check all of CPU, memory, disk and network; don't stop at the first busy thing."}, {"q": "Why should you preserve evidence before restarting a failing service?", "o": ["A restart destroys live state (open fds, memory, stuck threads) you need for root cause", "Restarts are forbidden", "It makes the service faster", "Logs are deleted on restart"], "why": "Capture ps, /proc/PID/fd, ss, logs first - then restart if you must."}, {"q": "`Too many open files` (EMFILE) points to:", "o": ["The per-process file descriptor limit", "A full disk", "No inodes", "A bad certificate"], "why": "Check /proc/PID/limits and the unit's LimitNOFILE."}, {"q": "`Read-only file system` (EROFS) most often means:", "o": ["The filesystem was remounted read-only after errors (or mounted ro)", "Wrong file mode", "No inodes", "A full disk"], "why": "Check the kernel log; run e2fsck on the unmounted fs - don't just remount rw."}], "qa": [{"q": "List the 8 steps of the senior troubleshooting method from the README.", "a": "1) Confirm the symptom yourself. 2) Define scope and ask 'what changed?'. 3) Work outside-in, layer by layer. 4) USE method for performance. 5) One hypothesis, one test, one change at a time. 6) Preserve evidence before fixing. 7) Fix the cause, not only the symptom. 8) Verify, persist (survive reboot), document."}, {"q": "Give three production safety rules from the guide.", "a": "Look before destructive commands (ls before rm, find ... | wc -l before -delete, pgrep -af before pkill -f); prefer reload over restart and run the config test first; never chmod 777 or run the service as root to 'fix' permissions; never fsck a mounted fs or just remount a broken fs rw; announce what you are doing in the incident channel."}]}, "home": {"system": "\u003cp>Every lab uses the same small \"production\" stack, so you learn the system the way you would at work:\u003c/p>\n\u003cpre>\u003ccode class=\"lang-text\"> client --&gt; nginx :80 --&gt; shopapp :8080 (python, systemd unit, runs as user \"shopapp\")\n                              |-- config : /etc/shopapp/config.ini\n                              |-- logs   : /var/log/shopapp   (own 256 MB volume)\n                              `-- data   : /srv/shopdata      (own 128 MB volume)\u003c/code>\u003c/pre>\n\u003cul>\u003cli>\u003ccode>curl localhost/\u003c/code> -&gt; \u003ccode>shopapp is running\u003c/code>\u003c/li>\u003cli>\u003ccode>curl localhost/health\u003c/code> -&gt; \u003ccode>OK\u003c/code> (the app writes a heartbeat file to the data volume)\u003c/li>\u003cli>Unit file: \u003ccode>systemctl cat shopapp\u003c/code> · logs: \u003ccode>journalctl -u shopapp\u003c/code>, \u003ccode>/var/log/shopapp/app.log\u003c/code>\u003c/li>\u003c/ul>", "run": "\u003cpre>\u003ccode class=\"lang-bash\">sudo ./labctl.sh list            \u003cspan class=\"c\"># all labs\u003c/span>\nsudo ./labctl.sh start e01       \u003cspan class=\"c\"># breaks the system and prints the ticket\u003c/span>\n\u003cspan class=\"c\">#   ... investigate and fix ...\u003c/span>\nsudo ./labctl.sh check e01       \u003cspan class=\"c\"># automatic checker: PASS / FAIL per item\u003c/span>\nsudo ./labctl.sh reset e01       \u003cspan class=\"c\"># undo everything, back to a healthy baseline\u003c/span>\n./labctl.sh ticket e01           \u003cspan class=\"c\"># print the ticket again\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>Rules for students:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Do the Warm-up first.\u003c/strong> Every lab README has a \u003cem>Warm-up\u003c/em> section: each command built from its simplest form, one flag at a time. Long command lines in \u003ccode>SOLUTION.md\u003c/code> are built the same way (\u003ccode># 1.\u003c/code>, \u003ccode># 2.\u003c/code> ...).\u003c/li>\u003cli>\u003cstrong>Don't read \u003ccode>break.sh\u003c/code> or \u003ccode>SOLUTION.md\u003c/code> first.\u003c/strong> In production nobody tells you what broke.\u003c/li>\u003cli>Use the hints in the lab \u003ccode>README.md\u003c/code> one at a time, only after ~10 minutes stuck.\u003c/li>\u003cli>Write incident notes while you work (template above). The notes are the real deliverable.\u003c/li>\u003cli>After you pass, read \u003ccode>SOLUTION.md\u003c/code> anyway - compare your path with the senior path.\u003c/li>\u003cli>Only one lab active at a time. Always \u003ccode>reset\u003c/code> before the next one.\u003c/li>\u003c/ol>"}}</script>
<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById('data').textContent);
const LABS = DATA.labs;
const BYID = Object.fromEntries(LABS.map(l => [l.id, l]));
const LEVEL_NAME = {easy:'Easy', medium:'Medium', hard:'Hard'};
const KEY = 'tshoot-guide-v1';

/* ---------- storage ---------- */
let store;
try { store = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { store = {}; }
store.quiz = store.quiz || {}; store.sol = store.sol || {}; store.exam = store.exam || {best: null, runs: 0}; store.theme = store.theme || null;
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
function qs(id){ return store.quiz[id] || (store.quiz[id] = {mcq:{}, qa:{}}); }

/* ---------- helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmt(s){ return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\n/g,'<br>'); }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const LETTERS = 'ABCD';

function labScore(id){
  const l = BYID[id] || DATA.method, s = qs(id);
  const total = l.mcq.length; let done = 0, right = 0;
  l.mcq.forEach((q, i) => { if (s.mcq[i] !== undefined) { done++; if (s.mcq[i] === 0) right++; } });
  let qaDone = 0, qaOk = 0;
  l.qa.forEach((q, i) => { const r = s.qa[i]; if (r && r.ok !== undefined) { qaDone++; if (r.ok) qaOk++; } });
  return {total, done, right, qaTotal: l.qa.length, qaDone, qaOk};
}
function scoreBadge(id){
  const s = labScore(id);
  if (!s.done) return '';
  const cls = s.done === s.total && s.right === s.total ? 'perfect' : 'partial';
  return `<span class="score ${cls}">${s.right}/${s.total}</span>`;
}
function totals(){
  let mcq = 0, done = 0, right = 0, qa = 0, qaDone = 0, qaOk = 0, perfect = 0;
  LABS.concat([{id:'method', mcq: DATA.method.mcq, qa: DATA.method.qa}]).forEach(l => {
    const s = labScore(l.id); mcq += s.total; done += s.done; right += s.right; qa += s.qaTotal; qaDone += s.qaDone; qaOk += s.qaOk;
    if (l.id !== 'method' && s.done === s.total && s.right === s.total) perfect++;
  });
  return {mcq, done, right, qa, qaDone, qaOk, perfect};
}

/* ---------- sidebar ---------- */
function buildNav(){
  const f = ($('#search').value || '').trim().toLowerCase();
  let h = `<a href="#/home" data-r="home">Home</a><a href="#/method" data-r="method"><span class="t">Troubleshooting method</span>${scoreBadge('method')}</a>`;
  LEVELS_ORDER.forEach(lv => {
    const items = LABS.filter(l => l.level === lv && (!f || (l.id + ' ' + l.title + ' ' + l.skills).toLowerCase().includes(f)));
    if (!items.length) return;
    h += `<h4>${LEVEL_NAME[lv]}</h4>` + items.map(l =>
      `<a href="#/lab/${l.id}" data-r="lab/${l.id}"><span class="id">${l.id.toUpperCase()}</span><span class="t">${fmt(l.title)}</span>${scoreBadge(l.id)}</a>`).join('');
  });
  h += `<h4>Test yourself</h4><a href="#/exam" data-r="exam"><span class="t">Final exam (mixed)</span>${store.exam.best !== null ? `<span class="score perfect">${store.exam.best}%</span>` : ''}</a>`;
  $('#nav').innerHTML = h;
  markActive();
  const t = totals();
  $('#foot-progress').textContent = `Quiz: ${t.done}/${t.mcq} answered`;
}
const LEVELS_ORDER = ['easy', 'medium', 'hard'];
function markActive(){
  const r = route().join('/');
  $$('#nav a').forEach(a => {
    const d = a.getAttribute('data-r');
    a.classList.toggle('active', r === d || r.startsWith(d + '/'));
  });
}

/* ---------- routing ---------- */
function route(){
  const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  return p.length ? p : ['home'];
}
function go(){
  const r = route();
  document.body.classList.remove('menu-open');
  const v = $('#view');
  if (r[0] === 'lab' && BYID[r[1]]) renderLab(v, BYID[r[1]], r[2] || 'lab');
  else if (r[0] === 'method') renderMethod(v);
  else if (r[0] === 'exam') renderExam(v);
  else renderHome(v);
  decorate(v);
  window.scrollTo(0, 0);
  markActive();
}

/* ---------- home ---------- */
function renderHome(v){
  const t = totals();
  const pct = Math.round(100 * t.done / t.mcq);
  let h = `<div class="hero"><h1>Linux Troubleshooting Lab - Study Guide</h1>
  <p>30 break/fix labs (10 easy, 10 medium, 10 hard) with the <strong>ticket</strong>, the <strong>senior-engineer solution</strong>, a plain-English <strong>explanation</strong> of why it works, and a <strong>quiz + Q&amp;A</strong> to check that you really understood it.</p>
  <div class="stats">
    <div class="stat"><b>${LABS.length}</b>labs</div>
    <div class="stat"><b>${t.mcq}</b>multiple-choice questions</div>
    <div class="stat"><b>${t.qa}</b>open Q&amp;A prompts</div>
    <div class="stat"><b>${t.perfect}/${LABS.length}</b>labs with a perfect quiz<div class="bar"><i style="width:${Math.round(100*t.perfect/LABS.length)}%"></i></div></div>
  </div>
  <div class="row"><a class="btn primary" href="#/lab/e01">Start with E01</a><a class="btn" href="#/method">Read the method</a><a class="btn" href="#/exam">Take the final exam</a>
  <span class="muted">Progress: ${t.done}/${t.mcq} MCQ answered (${pct}%) - saved in this browser.</span></div></div>`;
  h += `<h2>How to use each lab page</h2><div class="card"><ol>
    <li><strong>Lab</strong> - read the ticket and success criteria, run the lab on the VM, open hints one at a time only after ~10 minutes stuck.</li>
    <li><strong>Solution</strong> - hidden until you click. Compare your path with the senior path.</li>
    <li><strong>Explanation</strong> - the mental model, what to learn, and the root cause / prevention table.</li>
    <li><strong>Quiz</strong> - 3 multiple-choice + 2 Q&amp;A questions. Write your own answer first, then reveal the model answer and mark yourself honestly.</li></ol></div>`;
  h += `<h2>The system you will support</h2><div class="card">${DATA.home.system}</div>`;
  h += `<h2>How to run a lab</h2><div class="card">${DATA.home.run}</div>`;
  LEVELS_ORDER.forEach(lv => {
    const desc = {easy:'One fault, one layer', medium:"The obvious fix doesn't work, or there are 2-3 faults", hard:'Several stacked faults, evidence needed, red herrings'}[lv];
    h += `<h2>${LEVEL_NAME[lv]} <span class="muted" style="font-size:14px;font-weight:400">- ${desc}</span></h2><div class="grid">` +
      LABS.filter(l => l.level === lv).map(l => `<a class="lab-card ${lv}" href="#/lab/${l.id}"><div class="h"><span>${l.id.toUpperCase()} · ${esc(l.time)}</span>${scoreBadge(l.id)}</div><div class="t">${fmt(l.title)}</div><div class="s">${fmt(l.skills)}</div></a>`).join('') + '</div>';
  });
  v.innerHTML = h;
}

/* ---------- method ---------- */
function renderMethod(v){
  v.innerHTML = `<div class="crumbs"><a href="#/home">Home</a> › Method</div><h1>How a senior SRE troubleshoots</h1>
  <p class="muted">Tools change; the method does not. Use it in every lab.</p><div class="card">${DATA.method.html}</div>
  <h2>Check yourself</h2>` + quizHtml('method', DATA.method);
  bindQuiz(v, 'method', DATA.method);
}

/* ---------- lab page ---------- */
const TABS = [['lab', 'Lab'], ['solution', 'Solution'], ['explain', 'Explanation'], ['quiz', 'Quiz & Q&A']];
function renderLab(v, l, tab){
  if (!TABS.some(t => t[0] === tab)) tab = 'lab';
  const idx = LABS.indexOf(l), prev = LABS[idx - 1], next = LABS[idx + 1];
  let h = `<div class="crumbs"><a href="#/home">Home</a> › ${LEVEL_NAME[l.level]} › ${l.id.toUpperCase()}</div>
  <h1>${l.id.toUpperCase()} · ${fmt(l.title)}</h1>
  <div class="chips"><span class="badge ${l.level}">${LEVEL_NAME[l.level]}</span><span class="chip">⏱ ${esc(l.time)}</span><span class="chip">🛠 ${fmt(l.skills)}</span></div>
  <div class="tabs">${TABS.map(t => `<a href="#/lab/${l.id}/${t[0]}" class="${t[0] === tab ? 'on' : ''}">${t[1]}${t[0] === 'quiz' ? ' ' + scoreBadge(l.id) : ''}</a>`).join('')}</div>`;
  if (tab === 'lab') {
    h += `<h2>Ticket</h2><div class="ticket-box">${l.ticket.replace('<blockquote>', '<blockquote class="ticket">')}</div>
    <div class="callout"><strong>Run it on the lab VM</strong>
<pre><code>sudo ./labctl.sh start ${l.id}    # breaks the system, prints the ticket
sudo ./labctl.sh check ${l.id}    # PASS / FAIL per item
sudo ./labctl.sh reset ${l.id}    # undo, back to baseline</code></pre></div>
    <h2>Success criteria</h2><div class="card">${l.success}</div>
    ${l.warmup ? `<h2>Warm-up <span class="muted" style="font-size:14px;font-weight:400">- simple commands first, then the full ones the lab uses</span></h2><details class="warmup"><summary>Show the command ladders</summary><div>${l.warmup}</div></details>` : ''}
    <h2>Hints <span class="muted" style="font-size:14px;font-weight:400">- open one at a time</span></h2>` +
      l.hints.map(x => `<details><summary>${x.title}</summary>${x.html}</details>`).join('');
  } else if (tab === 'solution') {
    if (store.sol[l.id]) {
      h += `<h2>Solution walkthrough</h2><div class="card">${l.solution}</div>
      <div class="row"><button class="btn small" data-act="hide-sol">Hide solution again</button></div>`;
    } else {
      h += `<div class="card gate"><div class="big">🔒</div><h2 style="margin-top:6px">Try it first</h2>
      <p class="muted">Rule of the lab: spend about ${esc(l.time)} on it and write your own incident notes before reading the senior path.</p>
      <button class="btn primary" data-act="show-sol">Show the solution</button></div>`;
    }
  } else if (tab === 'explain') {
    h += `<h2>Why it works - the mental model</h2><div class="card">${l.explain}</div>
    <h2>What you should learn</h2><div class="card">${l.learn}</div>
    <h2>Root cause &amp; prevention</h2><div class="card">${l.root}</div>`;
  } else {
    h += quizHtml(l.id, l);
  }
  h += `<div class="nav-lab"><span>${prev ? `<a href="#/lab/${prev.id}">← ${prev.id.toUpperCase()} ${fmt(prev.title)}</a>` : ''}</span><span>${next ? `<a href="#/lab/${next.id}">${next.id.toUpperCase()} ${fmt(next.title)} →</a>` : ''}</span></div>`;
  v.innerHTML = h;
  if (tab === 'quiz') bindQuiz(v, l.id, l);
  $$('[data-act]', v).forEach(b => b.addEventListener('click', () => {
    if (b.dataset.act === 'show-sol') store.sol[l.id] = true;
    if (b.dataset.act === 'hide-sol') delete store.sol[l.id];
    save(); go();
  }));
}

/* ---------- quiz (per lab) ---------- */
const ORDER = {};   // id:i -> shuffled original indexes (stable while the page is open)
function order(id, i, n){ const k = id + ':' + i; return ORDER[k] || (ORDER[k] = shuffle([...Array(n).keys()])); }

function quizHtml(id, l){
  const s = qs(id);
  let h = `<div class="qbar"><div><span class="sum" id="qsum"></span></div><button class="btn small" data-reset="${id}">Reset this quiz</button></div>
  <h2>Multiple choice</h2>`;
  l.mcq.forEach((q, i) => {
    h += `<div class="q" data-mcq="${i}"><div class="qt"><span class="qn">${i + 1}.</span>${fmt(q.q)}</div>` +
      order(id, i, q.o.length).map((o, pos) => `<button class="opt" data-o="${o}"><strong>${LETTERS[pos]}.</strong> ${fmt(q.o[o])}</button>`).join('') +
      `<div class="fb" hidden></div></div>`;
  });
  h += `<h2>Q&amp;A - answer in your own words</h2><p class="muted">Write the answer (or say it out loud), then reveal the model answer and mark yourself honestly.</p>`;
  l.qa.forEach((q, i) => {
    h += `<div class="q" data-qa="${i}"><div class="qt"><span class="qn">Q${i + 1}.</span>${fmt(q.q)}</div>
    <textarea placeholder="Your answer..." data-ta="${i}"></textarea>
    <div class="row"><button class="btn small" data-show="${i}">Show model answer</button></div>
    <div class="ans" hidden><strong>Model answer</strong><br>${fmt(q.a)}
      <div class="row"><span class="muted">Did you cover the key points?</span><button class="btn small good" data-ok="${i}">✔ Got it</button><button class="btn small bad" data-no="${i}">✘ Missed some</button></div></div></div>`;
  });
  return h;
}
function bindQuiz(v, id, l){
  const s = qs(id);
  const upd = () => {
    const sc = labScore(id);
    $('#qsum', v).textContent = `Multiple choice ${sc.right}/${sc.total} correct (${sc.done} answered) · Q&A self-check ${sc.qaOk}/${sc.qaTotal}`;
    buildNav();
  };
  function paintMcq(i, animate){
    const box = $(`[data-mcq="${i}"]`, v), q = l.mcq[i], chosen = s.mcq[i];
    if (chosen === undefined) return;
    $$('.opt', box).forEach(b => {
      const o = +b.dataset.o; b.disabled = true;
      b.classList.toggle('right', o === 0);
      b.classList.toggle('wrong', o === chosen && o !== 0);
      b.classList.toggle('dim', o !== 0 && o !== chosen);
    });
    const fb = $('.fb', box); fb.hidden = false;
    fb.className = 'fb ' + (chosen === 0 ? 'ok' : 'no');
    fb.innerHTML = (chosen === 0 ? '<strong>Correct.</strong> ' : '<strong>Not quite.</strong> The right answer is highlighted. ') + fmt(q.why);
  }
  function paintQa(i){
    const box = $(`[data-qa="${i}"]`, v), r = s.qa[i] || {};
    const ta = $('textarea', box); if (r.text) ta.value = r.text;
    if (r.shown) { $('.ans', box).hidden = false; $('[data-show]', box).hidden = true; }
    $('[data-ok]', box).classList.toggle('on', r.ok === true);
    $('[data-no]', box).classList.toggle('on', r.ok === false);
  }
  l.mcq.forEach((q, i) => paintMcq(i));
  l.qa.forEach((q, i) => paintQa(i));
  upd();
  $$('.opt', v).forEach(b => b.addEventListener('click', () => {
    const i = +b.closest('[data-mcq]').dataset.mcq;
    if (s.mcq[i] !== undefined) return;
    s.mcq[i] = +b.dataset.o; save(); paintMcq(i); upd();
  }));
  $$('[data-ta]', v).forEach(t => t.addEventListener('input', () => { const i = +t.dataset.ta; (s.qa[i] = s.qa[i] || {}).text = t.value; save(); }));
  $$('[data-show]', v).forEach(b => b.addEventListener('click', () => { const i = +b.dataset.show; (s.qa[i] = s.qa[i] || {}).shown = true; save(); paintQa(i); }));
  $$('[data-ok]', v).forEach(b => b.addEventListener('click', () => { const i = +b.dataset.ok; (s.qa[i] = s.qa[i] || {}).ok = true; s.qa[i].shown = true; save(); paintQa(i); upd(); }));
  $$('[data-no]', v).forEach(b => b.addEventListener('click', () => { const i = +b.dataset.no; (s.qa[i] = s.qa[i] || {}).ok = false; s.qa[i].shown = true; save(); paintQa(i); upd(); }));
  $('[data-reset]', v).addEventListener('click', () => {
    if (!confirm('Reset your answers for this quiz?')) return;
    delete store.quiz[id]; Object.keys(ORDER).filter(k => k.startsWith(id + ':')).forEach(k => delete ORDER[k]); save(); go();
  });
}

/* ---------- final exam ---------- */
let EX = null;   // running exam state
function allQuestions(scope){
  const out = [];
  LABS.forEach(l => { if (scope === 'all' || scope === l.level) l.mcq.forEach(q => out.push({lab: l.id, level: l.level, q})); });
  if (scope === 'all' || scope === 'method') DATA.method.mcq.forEach(q => out.push({lab: 'method', level: 'method', q}));
  return out;
}
function renderExam(v){
  if (EX && EX.done) return examResult(v);
  if (EX) return examQuestion(v);
  const best = store.exam.best;
  v.innerHTML = `<div class="crumbs"><a href="#/home">Home</a> › Final exam</div><h1>Final exam</h1>
  <p class="muted">Mixed multiple-choice questions drawn from all labs, in random order with shuffled answers. You get feedback after every question and a review list at the end.${best !== null ? ` Your best score: <strong>${best}%</strong> (${store.exam.runs} attempt${store.exam.runs === 1 ? '' : 's'}).` : ''}</p>
  <div class="card"><h3 style="margin-top:0">Scope</h3><div class="opts-row" id="scope">
    ${[['all', 'All labs + method'], ['easy', 'Easy'], ['medium', 'Medium'], ['hard', 'Hard'], ['method', 'Method only']].map((s, i) => `<button class="pill ${i === 0 ? 'on' : ''}" data-scope="${s[0]}">${s[1]}</button>`).join('')}</div>
  <h3>Number of questions</h3><div class="opts-row" id="count">${[10, 20, 30, 0].map((n, i) => `<button class="pill ${i === 0 ? 'on' : ''}" data-n="${n}">${n || 'All'}</button>`).join('')}</div>
  <button class="btn primary" id="start">Start exam</button></div>`;
  let scope = 'all', n = 10;
  $$('#scope .pill', v).forEach(b => b.addEventListener('click', () => { scope = b.dataset.scope; $$('#scope .pill', v).forEach(x => x.classList.toggle('on', x === b)); }));
  $$('#count .pill', v).forEach(b => b.addEventListener('click', () => { n = +b.dataset.n; $$('#count .pill', v).forEach(x => x.classList.toggle('on', x === b)); }));
  $('#start', v).addEventListener('click', () => {
    let pool = shuffle(allQuestions(scope));
    if (n && n < pool.length) pool = pool.slice(0, n);
    EX = {pool, i: 0, answers: [], done: false, scope, opts: pool.map(p => shuffle([...Array(p.q.o.length).keys()]))};
    go();
  });
}
function examQuestion(v){
  const p = EX.pool[EX.i], q = p.q, ans = EX.answers[EX.i], ord = EX.opts[EX.i];
  const lab = BYID[p.lab];
  v.innerHTML = `<div class="crumbs"><a href="#/home">Home</a> › Final exam</div>
  <div class="qbar"><span class="sum">Question ${EX.i + 1} of ${EX.pool.length}</span><button class="btn small" id="quit">Quit exam</button></div>
  <div class="bar"><i style="width:${Math.round(100 * EX.i / EX.pool.length)}%"></i></div>
  <div class="q"><div class="qt"><span class="chip">${lab ? lab.id.toUpperCase() + ' · ' + LEVEL_NAME[lab.level] : 'Method'}</span><br><br>${fmt(q.q)}</div>
  ${ord.map((o, pos) => `<button class="opt" data-o="${o}"><strong>${LETTERS[pos]}.</strong> ${fmt(q.o[o])}</button>`).join('')}<div class="fb" hidden></div>
  <div class="row" id="nextrow" hidden><button class="btn primary" id="next">${EX.i + 1 === EX.pool.length ? 'Finish' : 'Next question →'}</button></div></div>`;
  function paint(){
    $$('.opt', v).forEach(b => { const o = +b.dataset.o; b.disabled = true; b.classList.toggle('right', o === 0); b.classList.toggle('wrong', o === ans && o !== 0); b.classList.toggle('dim', o !== 0 && o !== ans); });
    const fb = $('.fb', v); fb.hidden = false; fb.className = 'fb ' + (ans === 0 ? 'ok' : 'no');
    fb.innerHTML = (ans === 0 ? '<strong>Correct.</strong> ' : '<strong>Not quite.</strong> ') + fmt(q.why);
    $('#nextrow', v).hidden = false;
  }
  if (ans !== undefined) paint();
  $$('.opt', v).forEach(b => b.addEventListener('click', () => { if (EX.answers[EX.i] !== undefined) return; EX.answers[EX.i] = +b.dataset.o; paint(); }));
  $('#next', v).addEventListener('click', () => { if (EX.i + 1 === EX.pool.length) EX.done = true; else EX.i++; go(); });
  $('#quit', v).addEventListener('click', () => { if (confirm('Quit this exam?')) { EX = null; go(); } });
}
function examResult(v){
  const total = EX.pool.length, right = EX.answers.filter(a => a === 0).length, pct = Math.round(100 * right / total);
  if (!EX.saved) { EX.saved = true; store.exam.runs++; if (store.exam.best === null || pct > store.exam.best) store.exam.best = pct; save(); buildNav(); }
  const byLevel = {};
  EX.pool.forEach((p, i) => { const k = p.level; (byLevel[k] = byLevel[k] || {t: 0, r: 0}); byLevel[k].t++; if (EX.answers[i] === 0) byLevel[k].r++; });
  const missed = EX.pool.map((p, i) => ({p, i})).filter(x => EX.answers[x.i] !== 0);
  const verdict = pct >= 90 ? 'Excellent - you could run the incident.' : pct >= 70 ? 'Solid. Review the misses below.' : 'Keep going - redo the labs you missed and retry.';
  v.innerHTML = `<div class="crumbs"><a href="#/home">Home</a> › Final exam</div><h1>Result</h1>
  <div class="card"><div class="big-score">${pct}%</div><p><strong>${right}</strong> of <strong>${total}</strong> correct. ${verdict}</p>
  <div class="chips">${Object.keys(byLevel).map(k => `<span class="chip">${k}: ${byLevel[k].r}/${byLevel[k].t}</span>`).join('')}</div>
  <div class="row"><button class="btn primary" id="again">Take another exam</button></div></div>
  <h2>Review ${missed.length ? 'what you missed' : ''}</h2>` +
  (missed.length ? missed.map(x => { const q = x.p.q, lab = BYID[x.p.lab], got = EX.answers[x.i];
    return `<div class="q review"><div class="qt">${fmt(q.q)}</div><div class="fb no"><strong>Your answer:</strong> ${fmt(q.o[got])}</div>
    <div class="fb ok" style="margin-top:8px"><strong>Correct:</strong> ${fmt(q.o[0])}<br>${fmt(q.why)}</div>
    <div class="row">${lab ? `<a href="#/lab/${lab.id}/explain">Review ${lab.id.toUpperCase()} - ${fmt(lab.title)}</a>` : '<a href="#/method">Review the method</a>'}</div></div>`; }).join('')
   : '<div class="card">Nothing missed - perfect run.</div>');
  $('#again', v).addEventListener('click', () => { EX = null; go(); });
}

/* ---------- code copy buttons ---------- */
function decorate(v){
  $$('pre', v).forEach(pre => {
    if ($('.copy', pre)) return;
    const b = document.createElement('button'); b.className = 'copy'; b.textContent = 'Copy';
    b.addEventListener('click', () => {
      const t = $('code', pre).innerText;
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => { b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1200); }, () => {});
    });
    pre.appendChild(b);
  });
}

/* ---------- theme / menu / init ---------- */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  $('#theme').textContent = t === 'dark' ? 'Light' : 'Dark';
}
const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
applyTheme(store.theme || (prefersDark ? 'dark' : 'light'));
$('#theme').addEventListener('click', () => { store.theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; save(); applyTheme(store.theme); });
$('#menu').addEventListener('click', () => document.body.classList.toggle('menu-open'));
$('#search').addEventListener('input', buildNav);
window.addEventListener('hashchange', () => { buildNav(); go(); });
buildNav();
go();
})();
</script>
