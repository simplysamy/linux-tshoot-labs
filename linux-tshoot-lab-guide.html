3ccode>curl -v --resolve shop.lab.internal:443:127.0.0.1 --cacert /etc/ssl/shopapp/lab-ca.crt https://shop.lab.internal/\u003c/code>\u003cbr>\nFix it and make sure the setup passes a security review.\u003c/blockquote>", "success": "\u003cul>\u003cli>The \u003ccode>curl\u003c/code> above succeeds without \u003ccode>-k\u003c/code>\u003c/li>\u003cli>The served certificate is valid for at least 30 more days\u003c/li>\u003cli>The private key nginx uses is readable only by root\u003c/li>\u003cli>nginx config test passes; plain HTTP on port 80 still works\u003c/li>\u003c/ul>\n\u003cp>Check with \u003ccode>sudo ./labctl.sh check m09\u003c/code>.\u003c/p>", "warmup": "\u003cp>The solution uses long command lines. They are just short commands with one flag added at a time. Practise each ladder on any Linux box first (all read-only). Every rung adds \u003cstrong>one\u003c/strong> thing to the rung above - stop at the rung you understand, and read the next one only when you are ready. The lab itself uses the last rung of each ladder.\u003c/p>\n\u003ch4>openssl - look at a certificate\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">openssl x509 -in cert.crt -text -noout          \u003cspan class=\"c\"># 1. -text = everything in the cert, -noout = no raw base64\u003c/span>\nopenssl x509 -in cert.crt -noout -dates         \u003cspan class=\"c\"># 2. only notBefore / notAfter\u003c/span>\nopenssl x509 -in cert.crt -noout -subject -dates   \u003cspan class=\"c\"># 3. + who it is for\u003c/span>\nopenssl s_client -connect host:443              \u003cspan class=\"c\"># 4. connect and see the cert the SERVER really presents\u003c/span>\necho | openssl s_client -connect host:443 -servername host 2&gt;/dev/null | openssl x509 -noout -dates\n                                                \u003cspan class=\"c\"># 5. -servername = SNI; 2&gt;/dev/null hides noise; pipe into x509\u003c/span>\nopenssl x509 -in cert.crt -noout -checkend 2592000   \u003cspan class=\"c\"># 6. will it still be valid in 30 days? (exit 0 = yes)\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>curl - talk to a web service\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">curl http://localhost/                                   \u003cspan class=\"c\"># 1. fetch a page, print the body\u003c/span>\ncurl -s http://localhost/                                \u003cspan class=\"c\"># 2. -s = silent (no progress bar)\u003c/span>\ncurl -s -o /dev/null http://localhost/                   \u003cspan class=\"c\"># 3. -o /dev/null = throw the body away\u003c/span>\ncurl -s -o /dev/null -w '%{http_code}\\n' http://localhost/   \u003cspan class=\"c\"># 4. -w = print only the HTTP status code\u003c/span>\ncurl -v http://localhost/                                \u003cspan class=\"c\"># 5. -v = verbose: shows connect, headers (debug)\u003c/span>\ncurl -s -o /dev/null -w '%{http_code} %{time_total}s\\n' --max-time 5 http://localhost/   \u003cspan class=\"c\"># 6. + timing, + give up after 5 s\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>nginx - test before you restart\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">nginx -t                                  \u003cspan class=\"c\"># 1. check the config syntax, change nothing\u003c/span>\nsudo nginx -t                             \u003cspan class=\"c\"># 2. needs root to read all files\u003c/span>\nsudo nginx -T                             \u003cspan class=\"c\"># 3. -T = test AND print the full effective config\u003c/span>\nsudo nginx -T | grep -n listen            \u003cspan class=\"c\"># 4. find one directive in it\u003c/span>\nsudo nginx -t &amp;&amp; sudo systemctl reload nginx   \u003cspan class=\"c\"># 5. &amp;&amp; = reload only if the test passed\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>--resolve / --cacert - test TLS without real DNS\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">curl https://shop.lab.internal/                                              \u003cspan class=\"c\"># 1. fails: name unknown / CA unknown\u003c/span>\ncurl --resolve shop.lab.internal:443:127.0.0.1 https://shop.lab.internal/    \u003cspan class=\"c\"># 2. pretend the name points to 127.0.0.1\u003c/span>\ncurl --resolve shop.lab.internal:443:127.0.0.1 --cacert lab-ca.crt https://shop.lab.internal/   \u003cspan class=\"c\"># 3. + trust this CA\u003c/span>\n\u003cspan class=\"c\"># the error message (expired / unknown CA / name mismatch) tells you which TLS problem you have\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>matching a key to a certificate\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">openssl x509 -in c.crt -noout -pubkey | sha256sum       \u003cspan class=\"c\"># 1. fingerprint of the cert's public key\u003c/span>\nopenssl pkey -in c.key -pubout | sha256sum              \u003cspan class=\"c\"># 2. fingerprint of the key's public half\u003c/span>\n\u003cspan class=\"c\"># identical hashes = they belong together\u003c/span>\u003c/code>\u003c/pre>", "hints": [{"title": "Hint 1 - what is served right now?", "html": "\u003cp>\u003ccode>openssl s_client -connect 127.0.0.1:443 -servername shop.lab.internal &lt;/dev/null 2&gt;/dev/null | openssl x509 -noout -subject -dates\u003c/code>\u003c/p>"}, {"title": "Hint 2 - what is on disk?", "html": "\u003cp>For every \u003ccode>.crt\u003c/code>: \u003ccode>openssl x509 -in FILE -noout -subject -enddate\u003c/code>. Which files does nginx actually use? \u003ccode>sudo nginx -T | grep ssl_\u003c/code>.\u003c/p>"}, {"title": "Hint 3 - which key belongs to which cert?", "html": "\u003cp>Compare public keys: \u003ccode>openssl x509 -in CERT -noout -pubkey | sha256sum\u003c/code> vs \u003ccode>openssl pkey -in KEY -pubout | sha256sum\u003c/code>. Same hash = pair. Then check \u003ccode>ls -l\u003c/code> on the key.\u003c/p>"}], "learn": "\u003cul>\u003cli>Always check what the server \u003cstrong>serves\u003c/strong> (\u003ccode>s_client\u003c/code>), not only what is on disk.\u003c/li>\u003cli>Renewing a cert = new files \u003cstrong>and\u003c/strong> config pointing to them \u003cstrong>and\u003c/strong> a reload.\u003c/li>\u003cli>A cert and key must be a pair - check before you reload (\u003ccode>nginx -t\u003c/code> also catches it).\u003c/li>\u003cli>Private keys: \u003ccode>0600 root\u003c/code> (or \u003ccode>0640\u003c/code> for a service group). World-readable = treat as leaked.\u003c/li>\u003c/ul>", "solution": "\u003cblockquote>Long commands below are built up short-first (\u003ccode># 1.\u003c/code>, \u003ccode># 2.\u003c/code> ...). Each rung adds one flag;\u003cbr>\nthe last rung is what the lab uses. The README \u003cstrong>Warm-up\u003c/strong> explains every flag from scratch.\u003c/blockquote>\n\u003ch3>1. Reproduce\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">curl https://shop.lab.internal/                                                              \u003cspan class=\"c\"># 1. fails: name unknown\u003c/span>\ncurl --resolve shop.lab.internal:443:127.0.0.1 https://shop.lab.internal/                    \u003cspan class=\"c\"># 2. + name -&gt; 127.0.0.1\u003c/span>\ncurl --resolve shop.lab.internal:443:127.0.0.1 --cacert /etc/ssl/shopapp/lab-ca.crt https://shop.lab.internal/   \u003cspan class=\"c\"># 3. + trust the lab CA\u003c/span>\ncurl -v --resolve shop.lab.internal:443:127.0.0.1 --cacert /etc/ssl/shopapp/lab-ca.crt https://shop.lab.internal/   \u003cspan class=\"c\"># 4. + -v shows the TLS error\u003c/span>\n\u003cspan class=\"c\"># * SSL certificate problem: certificate has expired\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>curl -v --resolve shop.lab.internal:443:127.0.0.1 --cacert CA https://shop.lab.internal/\u003c/code>\u003c/td>\u003ctd>\u003ccode>--resolve\u003c/code> forces name -&gt; IP without DNS; \u003ccode>--cacert\u003c/code> trusts our private CA.\u003c/td>\u003ctd>Reproduces exactly what a client sees: \u003ccode>certificate has expired\u003c/code>.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>2. What is served?\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">openssl s_client -connect 127.0.0.1:443 -servername shop.lab.internal              \u003cspan class=\"c\"># 1. connect, shows the cert chain (waits for input)\u003c/span>\nopenssl s_client -connect 127.0.0.1:443 -servername shop.lab.internal &lt;/dev/null   \u003cspan class=\"c\"># 2. &lt;/dev/null = no input, exits at once\u003c/span>\nopenssl s_client -connect 127.0.0.1:443 -servername shop.lab.internal &lt;/dev/null 2&gt;/dev/null \\\n  | openssl x509 -noout -subject -dates                \u003cspan class=\"c\"># 3. keep the cert only, print who + validity\u003c/span>\n\u003cspan class=\"c\"># subject=CN = shop.lab.internal\u003c/span>\n\u003cspan class=\"c\"># notBefore=... 2024\u003c/span>\n\u003cspan class=\"c\"># notAfter=Nov  7 09:12:00 2026 GMT       &lt;- 3 days ago\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>openssl s_client -connect 127.0.0.1:443 -servername NAME &lt;/dev/null 2&gt;/dev/null | openssl x509 -noout -subject -dates\u003c/code>\u003c/td>\u003ctd>Connects with TLS, grabs the served cert, prints subject and validity. \u003ccode>&lt;/dev/null\u003c/code> ends the session; \u003ccode>-servername\u003c/code> sets SNI.\u003c/td>\u003ctd>Shows what is \u003cstrong>actually served\u003c/strong>: expired 3 days ago.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>3. What is on disk, and what does nginx use?\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">ls -l /etc/ssl/shopapp/\n\u003cspan class=\"c\"># -rw-r--r-- root root  lab-ca.crt\u003c/span>\n\u003cspan class=\"c\"># -rw-r--r-- root root  shop-2025.crt\u003c/span>\n\u003cspan class=\"c\"># -rw------- root root  shop-2025.key\u003c/span>\n\u003cspan class=\"c\"># -rw-r--r-- root root  shop-2026.crt\u003c/span>\n\u003cspan class=\"c\"># -rw------- root root  shop-2026.key\u003c/span>\n\u003cspan class=\"c\"># -rw-r--r-- root root  shop-2026-renewal.key     &lt;- world-readable private key!\u003c/span>\n\nfor c in /etc/ssl/shopapp/shop-*.crt; do echo \"$c\"; openssl x509 -in \"$c\" -noout -enddate; done\n\u003cspan class=\"c\"># shop-2025.crt  notAfter=Nov  7 ... 2026      expired\u003c/span>\n\u003cspan class=\"c\"># shop-2026.crt  notAfter=Nov  5 ... 2027      good\u003c/span>\n\nsudo nginx -T 2&gt;/dev/null | grep ssl_certificate\n\u003cspan class=\"c\"># ssl_certificate     /etc/ssl/shopapp/shop-2025.crt;\u003c/span>\n\u003cspan class=\"c\"># ssl_certificate_key /etc/ssl/shopapp/shop-2025.key;\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>The renewal put new files on disk, but nginx was never pointed at them.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>ls -l /etc/ssl/shopapp/\u003c/code>\u003c/td>\u003ctd>Files and modes.\u003c/td>\u003ctd>Old and new cert/key pairs exist. Also \u003ccode>shop-2026-renewal.key\u003c/code> is world-readable.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>for c in /etc/ssl/shopapp/shop-*.crt; do openssl x509 -in \"$c\" -noout -enddate; done\u003c/code>\u003c/td>\u003ctd>Loop: print expiry of each cert.\u003c/td>\u003ctd>Find which cert is still valid: \u003ccode>shop-2026.crt\u003c/code>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>nginx -T 2&gt;/dev/null | grep ssl_certificate\u003c/code>\u003c/td>\u003ctd>\u003ccode>-T\u003c/code> = test and \u003cstrong>dump the full effective config\u003c/strong>.\u003c/td>\u003ctd>Which cert/key nginx really uses (still the 2025 files) - renewal never got deployed.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>4. Which key matches the new cert?\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">cd /etc/ssl/shopapp\nopenssl x509 -in shop-2026.crt -noout -pubkey | sha256sum\nfor k in shop-2026.key shop-2026-renewal.key; do echo -n \"$k \"; openssl pkey -in $k -pubout | sha256sum; done\n\u003cspan class=\"c\"># shop-2026.key          9c1e...   &lt;- does NOT match (left over from a first CSR attempt)\u003c/span>\n\u003cspan class=\"c\"># shop-2026-renewal.key  4b7a...   &lt;- matches the cert\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>If you had used \u003ccode>shop-2026.key\u003c/code>, \u003ccode>nginx -t\u003c/code> would say: \u003ccode>SSL_CTX_use_PrivateKey ... key values mismatch\u003c/code>.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>openssl x509 -in CERT -noout -pubkey | sha256sum\u003c/code>\u003c/td>\u003ctd>Hash of the cert's public key.\u003c/td>\u003ctd>Compare with the key's public key.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>openssl pkey -in KEY -pubout | sha256sum\u003c/code>\u003c/td>\u003ctd>Hash of the public key derived from a private key.\u003c/td>\u003ctd>Equal hashes = this key belongs to this cert. Only \u003ccode>shop-2026-renewal.key\u003c/code> matches.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>5. Fix\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo chmod 600 /etc/ssl/shopapp/shop-2026-renewal.key\nsudo sed -i 's#shop-2025.crt#shop-2026.crt#; s#shop-2025.key#shop-2026-renewal.key#' \\\n    /etc/nginx/sites-available/shopapp-tls\nsudo nginx -t &amp;&amp; sudo systemctl reload nginx\u003c/code>\u003c/pre>\n\u003cp>The key was world-readable for a week: in production, report it to security - it may have to be treated as compromised (new key + new cert + revoke the old one).\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>chmod 600 shop-2026-renewal.key\u003c/code>\u003c/td>\u003ctd>Owner read/write only.\u003c/td>\u003ctd>Private keys must not be readable by others.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sed -i 's#shop-2025.crt#shop-2026.crt#; s#shop-2025.key#shop-2026-renewal.key#' FILE\u003c/code>\u003c/td>\u003ctd>Two substitutions in one run.\u003c/td>\u003ctd>Point nginx at the new pair.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>nginx -t &amp;&amp; systemctl reload nginx\u003c/code>\u003c/td>\u003ctd>Validate, then reload without dropping connections.\u003c/td>\u003ctd>A mismatched key would fail here with \u003ccode>key values mismatch\u003c/code> instead of causing an outage.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>6. Verify\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">curl -s --resolve shop.lab.internal:443:127.0.0.1 --cacert /etc/ssl/shopapp/lab-ca.crt https://shop.lab.internal/\necho | openssl s_client -connect 127.0.0.1:443 -servername shop.lab.internal 2&gt;/dev/null \\\n  | openssl x509 -noout -checkend 2592000 &amp;&amp; echo \"valid &gt; 30 days\"\nsudo ./labctl.sh check m09\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>openssl x509 -noout -checkend 2592000\u003c/code>\u003c/td>\u003ctd>Exits 0 if the cert is still valid in 2592000 s (30 days).\u003c/td>\u003ctd>Monitoring-style check for the future.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>", "root": "\u003cdiv class='tablewrap'>\u003ctable>\u003ctbody>\u003ctr>\u003ctd>Root cause\u003c/td>\u003ctd>Renewal copied new files but nginx still referenced the expired cert; new key world-readable; a non-matching key file with a misleading name\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fix\u003c/td>\u003ctd>Point nginx to the new cert + matching key, \u003ccode>chmod 600\u003c/code>, \u003ccode>nginx -t\u003c/code>, reload\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prevent\u003c/td>\u003ctd>Automate renewal (ACME/certbot, cert-manager) incl. reload; monitor the \u003cstrong>served\u003c/strong> expiry date (\u003ccode>-checkend\u003c/code>); clear file names\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "explain": "\u003cp>\u003cstrong>Check what the server \u003cem>serves\u003c/em>, not only what is on disk.\u003c/strong> \u003ccode>openssl s_client -connect 127.0.0.1:443 -servername shop.lab.internal &lt;/dev/null | openssl x509 -noout -subject -dates\u003c/code> showed an \u003cstrong>expired\u003c/strong> cert (\u003ccode>notAfter\u003c/code> 3 days ago).\u003c/p>\n\u003cp>\u003cstrong>What went wrong in the \"renewal\":\u003c/strong>\u003c/p>\n\u003col>\u003cli>New files were copied to \u003ccode>/etc/ssl/shopapp/\u003c/code> but nginx still referenced \u003ccode>shop-2025.crt\u003c/code> / \u003ccode>.key\u003c/code> -&gt; never switched\u003c/li>\u003cli>Two candidate new keys existed; only \u003ccode>shop-2026-renewal.key\u003c/code> matches the new certificate (\u003ccode>shop-2026.key\u003c/code> is a leftover from another CSR). A mismatch makes \u003ccode>nginx -t\u003c/code> fail with \u003ccode>key values mismatch\u003c/code>\u003c/li>\u003cli>The matching key was \u003cstrong>world-readable\u003c/strong> (\u003ccode>0644\u003c/code>)\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>Prove a cert/key pair:\u003c/strong> compare public-key hashes\u003c/p>\n\u003cpre>\u003ccode class=\"lang-text\">openssl x509 -in CERT -noout -pubkey | sha256sum\nopenssl pkey -in KEY  -pubout       | sha256sum     \u003cspan class=\"c\"># same hash = pair\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Fix:\u003c/strong> \u003ccode>chmod 600\u003c/code> the key, point nginx at the 2026 cert + matching key, \u003ccode>nginx -t &amp;&amp; systemctl reload nginx\u003c/code>, verify with \u003ccode>curl --cacert\u003c/code> and \u003ccode>openssl x509 -checkend 2592000\u003c/code> (still valid for 30 days?).\u003c/p>\n\u003cp>A private key that was world-readable must be treated as \u003cstrong>possibly compromised\u003c/strong> - in production report it, reissue key+cert, revoke the old one.\u003c/p>", "mcq": [{"q": "Which command shows the certificate that the server is actually presenting?", "o": ["openssl s_client -connect host:443 -servername name | openssl x509 -noout -dates", "ls -l /etc/ssl", "nginx -v", "systemctl status nginx"], "why": "Always verify the served cert; disk files may not be what nginx loaded."}, {"q": "How do you prove a certificate and a private key belong together?", "o": ["Compare the sha256 of the public key from the cert and from the key", "Compare file names", "Compare file modification times", "Check both are mode 0600"], "why": "`openssl x509 -pubkey` vs `openssl pkey -pubout` must give the same hash."}, {"q": "What mode should the nginx private key have?", "o": ["0600 (root only) - or 0640 with a dedicated group", "0644", "0666", "0777"], "why": "World-readable private keys must be treated as leaked."}], "qa": [{"q": "What three things make a certificate renewal complete?", "a": "1) New cert and matching key files on disk. 2) The server configuration points at them (ssl_certificate / ssl_certificate_key). 3) The service reloads (after `nginx -t`) and you verify the served expiry date from outside. Missing step 2 or 3 leaves the old expired cert in use."}, {"q": "The new key was world-readable for a week. What do you do in production?", "a": "Fix the mode immediately, then report to security: treat the key as potentially compromised, generate a new key and certificate, deploy them, and revoke the old certificate. Also audit who could have read it."}]}, {"id": "m10", "level": "medium", "title": "Works on the box, down for everyone else", "time": "30 min", "skills": "listen addresses, `ss -ltn`, refused vs. timed out, INPUT firewall rules, testing from another host", "ticket": "\u003cblockquote>\u003cstrong>INC-2010 · P1\u003c/strong>\u003cbr>\nExternal monitoring says the shop is \u003cstrong>DOWN\u003c/strong>. On the server itself \u003ccode>curl localhost/\u003c/code> works fine,\u003cbr>\nso on-call closed the first alert as \"false positive\" - and it fired again.\u003cbr>\nRecent changes: \u003cstrong>CHG-610\u003c/strong> \"web tier hardening\" and \u003cstrong>SEC-118\u003c/strong> \"block scanner subnet\".\u003cbr>\nThe monitoring probe lives at \u003ccode>10.210.0.2\u003c/code> (namespace \u003ccode>mon-ns\u003c/code> in the lab). Test as the probe:\u003cbr>\n\u003ccode>sudo ip netns exec mon-ns curl -sv --max-time 5 http://10.210.0.1/health\u003c/code>\u003cbr>\nMake the shop reachable for the probe again.\u003c/blockquote>", "success": "\u003cul>\u003cli>The probe gets \u003ccode>200\u003c/code> from \u003ccode>http://10.210.0.1/health\u003c/code>\u003c/li>\u003cli>\u003ccode>curl localhost/\u003c/code> on the server still works\u003c/li>\u003cli>\u003ccode>nginx -t\u003c/code> passes\u003c/li>\u003c/ul>\n\u003cp>Check with \u003ccode>sudo ./labctl.sh check m10\u003c/code>.\u003c/p>", "warmup": "\u003cp>The solution uses long command lines. They are just short commands with one flag added at a time. Practise each ladder on any Linux box first (all read-only). Every rung adds \u003cstrong>one\u003c/strong> thing to the rung above - stop at the rung you understand, and read the next one only when you are ready. The lab itself uses the last rung of each ladder.\u003c/p>\n\u003ch4>curl - talk to a web service\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">curl http://localhost/                                   \u003cspan class=\"c\"># 1. fetch a page, print the body\u003c/span>\ncurl -s http://localhost/                                \u003cspan class=\"c\"># 2. -s = silent (no progress bar)\u003c/span>\ncurl -s -o /dev/null http://localhost/                   \u003cspan class=\"c\"># 3. -o /dev/null = throw the body away\u003c/span>\ncurl -s -o /dev/null -w '%{http_code}\\n' http://localhost/   \u003cspan class=\"c\"># 4. -w = print only the HTTP status code\u003c/span>\ncurl -v http://localhost/                                \u003cspan class=\"c\"># 5. -v = verbose: shows connect, headers (debug)\u003c/span>\ncurl -s -o /dev/null -w '%{http_code} %{time_total}s\\n' --max-time 5 http://localhost/   \u003cspan class=\"c\"># 6. + timing, + give up after 5 s\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>ip / ip netns - addresses, routes, namespaces\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">ip addr                                  \u003cspan class=\"c\"># 1. interfaces and their IPs (short: ip a)\u003c/span>\nip -br addr                              \u003cspan class=\"c\"># 2. -br = brief, one line per interface\u003c/span>\nip route                                 \u003cspan class=\"c\"># 3. routing table: 'default via X' = where unknown traffic goes\u003c/span>\nip route get 10.0.0.5                    \u003cspan class=\"c\"># 4. which route/interface would the kernel use for THIS destination?\u003c/span>\nip netns list                            \u003cspan class=\"c\"># 5. namespaces = separate mini network stacks (lab hosts)\u003c/span>\nsudo ip netns exec NAME ip route         \u003cspan class=\"c\"># 6. run any command INSIDE a namespace\u003c/span>\nC=\"sudo ip netns exec NAME\"; $C ip route \u003cspan class=\"c\"># 7. shortcut variable so you type less\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>tcpdump - watch packets\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo tcpdump -i eth0                      \u003cspan class=\"c\"># 1. every packet on an interface (very noisy)\u003c/span>\nsudo tcpdump -ni eth0                     \u003cspan class=\"c\"># 2. -n = no name lookups\u003c/span>\nsudo tcpdump -ni eth0 icmp                \u003cspan class=\"c\"># 3. filter: only ping\u003c/span>\nsudo tcpdump -ni eth0 port 80             \u003cspan class=\"c\"># 4. filter: only port 80\u003c/span>\nsudo tcpdump -ni eth0 'tcp port 80 and host 10.0.0.5'   \u003cspan class=\"c\"># 5. combine with and/or\u003c/span>\nsudo tcpdump -ni eth0 -c 5 icmp           \u003cspan class=\"c\"># 6. -c 5 = stop after 5 packets\u003c/span>\n\u003cspan class=\"c\"># Reading it: packets arrive on one side but nothing leaves the other side -&gt; something in between drops/does not forward.\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>iptables - read the firewall\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo iptables -L                              \u003cspan class=\"c\"># 1. list rules (all chains)\u003c/span>\nsudo iptables -L INPUT                        \u003cspan class=\"c\"># 2. one chain: INPUT = traffic TO this host; FORWARD = through; OUTPUT = from\u003c/span>\nsudo iptables -L INPUT -n                     \u003cspan class=\"c\"># 3. -n = numbers, no DNS (much faster)\u003c/span>\nsudo iptables -L INPUT -n -v                  \u003cspan class=\"c\"># 4. -v = packet/byte counters: does the number rise when you test? -&gt; that rule hits\u003c/span>\nsudo iptables -L INPUT -n -v --line-numbers   \u003cspan class=\"c\"># 5. rule numbers, so you can delete/insert by number\u003c/span>\nsudo iptables -S                              \u003cspan class=\"c\"># 6. the same rules as commands (easy to copy, grep)\u003c/span>\n\u003cspan class=\"c\"># change:  -D INPUT 1  (delete rule 1)   -I INPUT 1 &lt;rule&gt;  (insert at top)   -A  (append at end)\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>ss - who is listening / connected?\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">ss                              \u003cspan class=\"c\"># 1. all sockets (long)\u003c/span>\nss -l                           \u003cspan class=\"c\"># 2. -l = only listening sockets\u003c/span>\nss -lt                          \u003cspan class=\"c\"># 3. -t = TCP only\u003c/span>\nss -ltn                         \u003cspan class=\"c\"># 4. -n = numbers, no name lookup\u003c/span>\nss -ltnp                        \u003cspan class=\"c\"># 5. -p = which process owns each socket (needs sudo)\u003c/span>\nss -ltnp 'sport = :80'          \u003cspan class=\"c\"># 6. filter: only source (local) port 80\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>nginx - test before you restart\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">nginx -t                                  \u003cspan class=\"c\"># 1. check the config syntax, change nothing\u003c/span>\nsudo nginx -t                             \u003cspan class=\"c\"># 2. needs root to read all files\u003c/span>\nsudo nginx -T                             \u003cspan class=\"c\"># 3. -T = test AND print the full effective config\u003c/span>\nsudo nginx -T | grep -n listen            \u003cspan class=\"c\"># 4. find one directive in it\u003c/span>\nsudo nginx -t &amp;&amp; sudo systemctl reload nginx   \u003cspan class=\"c\"># 5. &amp;&amp; = reload only if the test passed\u003c/span>\u003c/code>\u003c/pre>", "hints": [{"title": "Hint 1 - read the client error exactly", "html": "\u003cp>\u003ccode>Connection refused\u003c/code> and \u003ccode>Connection timed out\u003c/code> mean different things. Which one do you get? Which layer does each point to? (README \"How a senior SRE troubleshoots\" table.)\u003c/p>"}, {"title": "Hint 2 - do the packets arrive? who drops them?", "html": "\u003cp>\u003ccode>sudo tcpdump -ni h-mon port 80\u003c/code> shows if SYNs arrive and if anything answers. \u003ccode>sudo iptables -L INPUT -n -v --line-numbers\u003c/code> - watch the packet counters while the probe tries.\u003c/p>"}, {"title": "Hint 3 - after the firewall, the error changes", "html": "\u003cp>On which address does nginx listen? \u003ccode>sudo ss -ltnp | grep ':80 '\u003c/code>. \u003ccode>0.0.0.0:80\u003c/code> / \u003ccode>*:80\u003c/code> = all addresses; \u003ccode>127.0.0.1:80\u003c/code> = only local. \u003ccode>sudo nginx -T | grep listen\u003c/code>.\u003c/p>"}], "learn": "\u003cul>\u003cli>Always test from where the user is. \u003ccode>localhost\u003c/code> skips the network, the firewall and the listen address.\u003c/li>\u003cli>\u003cstrong>Refused\u003c/strong> = packet arrived, nothing listens on that address/port (or REJECT with RST). \u003cstrong>Timed out\u003c/strong> = packet dropped on the way (firewall DROP, routing).\u003c/li>\u003cli>Fixing one layer can reveal the next one. Re-test after each change - a \u003cem>changed\u003c/em> error is progress.\u003c/li>\u003cli>Firewall rules: read them with counters (\u003ccode>-v\u003c/code>) and in order; narrow a rule instead of deleting it blindly.\u003c/li>\u003c/ul>", "solution": "\u003cblockquote>Long commands below are built up short-first (\u003ccode># 1.\u003c/code>, \u003ccode># 2.\u003c/code> ...). Each rung adds one flag;\u003cbr>\nthe last rung is what the lab uses. The README \u003cstrong>Warm-up\u003c/strong> explains every flag from scratch.\u003c/blockquote>\n\u003ch3>1. Test as the user\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">curl -s localhost/health                                      \u003cspan class=\"c\"># OK  (misleading)\u003c/span>\ncurl http://10.210.0.1/health                                         \u003cspan class=\"c\"># 1. from THIS host (not what the monitor sees)\u003c/span>\nsudo ip netns exec mon-ns curl http://10.210.0.1/health               \u003cspan class=\"c\"># 2. same, run INSIDE the monitor's namespace\u003c/span>\nsudo ip netns exec mon-ns curl -sv --max-time 5 http://10.210.0.1/health   \u003cspan class=\"c\"># 3. + silent progress, + verbose, + give up after 5 s\u003c/span>\n\u003cspan class=\"c\"># * Connection timed out after 5001 milliseconds\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>Timed out = the packets are dropped somewhere. \u003ccode>localhost\u003c/code> never touches the network interface or the INPUT rules for that subnet, which is why it \"works\".\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>curl -s localhost/health\u003c/code>\u003c/td>\u003ctd>Local test.\u003c/td>\u003ctd>Works - \u003cstrong>misleading\u003c/strong>: loopback does not use the network path the monitor uses.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ip netns exec mon-ns curl -sv --max-time 5 http://10.210.0.1/health\u003c/code>\u003c/td>\u003ctd>Runs curl inside the monitoring network namespace (simulated remote host). \u003ccode>--max-time 5\u003c/code> limits the wait.\u003c/td>\u003ctd>Test \u003cstrong>as the user\u003c/strong>, from their side. \u003ccode>Connection timed out\u003c/code> = packets dropped.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>2. Is the traffic arriving? Who drops it?\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo tcpdump -ni h-mon port 80          \u003cspan class=\"c\"># SYNs arrive from 10.210.0.2, nothing answers\u003c/span>\nsudo iptables -L INPUT -n -v --line-numbers\n\u003cspan class=\"c\"># num pkts bytes target prot opt in  out source          destination\u003c/span>\n\u003cspan class=\"c\"># 1     14   840 DROP   tcp  --  *   *   10.210.0.0/24   0.0.0.0/0   tcp dpt:80 /* SEC-118 block scanner subnet */\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>The counter goes up each time the probe tries. SEC-118 blocked the whole \u003ccode>10.210.0.0/24\u003c/code> subnet - which is the monitoring network.\u003c/p>\n\u003cp>Fix the rule, not the whole firewall. Ask security which host was the scanner. In the lab: allow the probe, keep the block.\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo iptables -I INPUT 1 -s 10.210.0.2/32 -p tcp --dport 80 -m comment --comment \"INC-2010 monitoring probe\" -j ACCEPT\n\u003cspan class=\"c\"># or, if the block was a mistake:  sudo iptables -D INPUT &lt;num&gt;\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>In production also make it persistent (\u003ccode>netfilter-persistent save\u003c/code>, or your firewall tool).\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>tcpdump -ni h-mon port 80\u003c/code>\u003c/td>\u003ctd>Packet capture on interface \u003ccode>h-mon\u003c/code>; \u003ccode>-n\u003c/code> no name lookup.\u003c/td>\u003ctd>SYNs arrive, nothing is answered: traffic reaches the host but something drops it.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>iptables -L INPUT -n -v --line-numbers\u003c/code>\u003c/td>\u003ctd>Lists firewall rules with hit counters (\u003ccode>-v\u003c/code>) and numbers.\u003c/td>\u003ctd>\u003ccode>DROP ... 10.210.0.0/24 dpt:80\u003c/code> with a counter that increases on every probe = this rule is the one.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>iptables -I INPUT 1 -s 10.210.0.2/32 -p tcp --dport 80 -j ACCEPT\u003c/code>\u003c/td>\u003ctd>Inserts an ACCEPT at position 1, for just the probe host.\u003c/td>\u003ctd>Narrow exception: keep the security block, allow monitoring.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>iptables -D INPUT NUM\u003c/code>\u003c/td>\u003ctd>Deletes rule number NUM.\u003c/td>\u003ctd>Alternative if the block was a mistake.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>3. Re-test - the error changes\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo ip netns exec mon-ns curl -sv --max-time 5 http://10.210.0.1/health\n\u003cspan class=\"c\"># * connect to 10.210.0.1 port 80 failed: Connection refused\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>Progress: packets now reach the host, but nothing listens on \u003ccode>10.210.0.1:80\u003c/code>.\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo ss -ltnp | grep ':80 '\n\u003cspan class=\"c\"># LISTEN 0 511  127.0.0.1:80   0.0.0.0:*  users:((\"nginx\",pid=812,fd=6),...)\u003c/span>\n\u003cspan class=\"c\"># LISTEN 0 511      [::1]:80      [::]:*  ...\u003c/span>\nsudo nginx -T 2&gt;/dev/null | grep -n listen\n\u003cspan class=\"c\">#   listen 127.0.0.1:80 default_server;   # CHG-610 hardening: loopback only\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>CHG-610 bound nginx to loopback. That \"hardens\" the web server by switching it off for everyone else. Fix:\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">sudoedit /etc/nginx/sites-available/shopapp\n\u003cspan class=\"c\">#   listen 80 default_server;\u003c/span>\n\u003cspan class=\"c\">#   listen [::]:80 default_server;\u003c/span>\nsudo nginx -t &amp;&amp; sudo systemctl reload nginx\nsudo ss -ltn | grep ':80 '          \u003cspan class=\"c\"># 0.0.0.0:80 and [::]:80\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>curl\u003c/code> again from \u003ccode>mon-ns\u003c/code>\u003c/td>\u003ctd>Re-test.\u003c/td>\u003ctd>Error changed to \u003ccode>Connection refused\u003c/code> = progress: packets arrive, nobody listens on that address.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ss -ltnp | grep ':80 '\u003c/code>\u003c/td>\u003ctd>Listening sockets on port 80.\u003c/td>\u003ctd>nginx listens only on \u003ccode>127.0.0.1:80\u003c/code> and \u003ccode>[::1]:80\u003c/code>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>nginx -T | grep -n listen\u003c/code>\u003c/td>\u003ctd>Effective config with line numbers.\u003c/td>\u003ctd>Shows \u003ccode>listen 127.0.0.1:80\u003c/code> from CHG-610.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sudoedit ...\u003c/code> + \u003ccode>listen 80;\u003c/code> + \u003ccode>listen [::]:80;\u003c/code>\u003c/td>\u003ctd>Binds to all addresses.\u003c/td>\u003ctd>The fix.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>nginx -t &amp;&amp; systemctl reload nginx\u003c/code>\u003c/td>\u003ctd>Validate then apply.\u003c/td>\u003ctd>Safe change.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>4. Verify\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo ip netns exec mon-ns curl -s http://10.210.0.1/health   \u003cspan class=\"c\"># OK\u003c/span>\nsudo ./labctl.sh check m10\u003c/code>\u003c/pre>\n\u003cp>Side finding for the incident notes: shopapp itself listens on \u003ccode>0.0.0.0:8080\u003c/code>, so the probe can reach the backend directly and bypass nginx (\u003ccode>ip netns exec mon-ns curl 10.210.0.1:8080/\u003c/code>). \u003cem>That\u003c/em> is what real hardening should fix.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>ss -ltn | grep ':80 '\u003c/code>\u003c/td>\u003ctd>Verify.\u003c/td>\u003ctd>\u003ccode>0.0.0.0:80\u003c/code> and \u003ccode>[::]:80\u003c/code>.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>", "root": "\u003cdiv class='tablewrap'>\u003ctable>\u003ctbody>\u003ctr>\u003ctd>Root cause\u003c/td>\u003ctd>(1) SEC-118 dropped the monitoring subnet; (2) CHG-610 bound nginx to 127.0.0.1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fix\u003c/td>\u003ctd>ACCEPT for the probe before the DROP; nginx listens on all addresses\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prevent\u003c/td>\u003ctd>Test changes from outside (synthetic checks in the change pipeline); never close an alert as false positive without testing from the alert's source\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "explain": "\u003cp>\u003cstrong>Read the client error exactly:\u003c/strong>\u003c/p>\n\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Error\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>Connection refused\u003c/code>\u003c/td>\u003ctd>packet reached a host, nothing listens on that address:port (or a REJECT with RST)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Connection timed out\u003c/code>\u003c/td>\u003ctd>packets are \u003cstrong>dropped\u003c/strong> somewhere: firewall DROP, routing, host down\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>\u003ccode>curl localhost\u003c/code> is a misleading test.\u003c/strong> It never touches the network interface, the INPUT rules for the external subnet, or the listening address used by remote clients.\u003c/p>\n\u003cp>\u003cstrong>Two stacked faults:\u003c/strong>\u003c/p>\n\u003col>\u003cli>\u003cstrong>SEC-118\u003c/strong> \u003ccode>DROP\u003c/code> of the whole \u003ccode>10.210.0.0/24\u003c/code> on tcp/80 - which includes the monitoring probe (timeout). Found with \u003ccode>tcpdump -ni h-mon port 80\u003c/code> (SYNs arrive, nothing answers) and \u003ccode>iptables -L INPUT -n -v --line-numbers\u003c/code> (packet counter rises).\u003c/li>\u003cli>\u003cstrong>CHG-610\u003c/strong> bound nginx to \u003ccode>127.0.0.1:80\u003c/code>. After the firewall fix the error becomes \u003cstrong>refused\u003c/strong> - progress! \u003ccode>ss -ltnp | grep ':80 '\u003c/code> shows loopback only. Fix: \u003ccode>listen 80;\u003c/code> / \u003ccode>listen [::]:80;\u003c/code>, \u003ccode>nginx -t &amp;&amp; reload\u003c/code>.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>Firewall habit:\u003c/strong> read rules in order, with counters; insert an ACCEPT for the probe \u003cstrong>before\u003c/strong> the DROP (or narrow the DROP) instead of deleting the whole rule; persist the change.\u003c/p>\n\u003cp>Side finding: shopapp's \u003ccode>0.0.0.0:8080\u003c/code> lets the probe bypass nginx - that is what real hardening should address.\u003c/p>", "mcq": [{"q": "A remote client gets 'Connection timed out'. What is the most likely class of cause?", "o": ["Packets are being dropped (firewall DROP or routing)", "Nothing listens on the port", "The service crashed", "The DNS name does not exist"], "why": "Timeout = silence; refused = an active RST."}, {"q": "After fixing the firewall, the probe now gets 'Connection refused'. What does that tell you?", "o": ["Traffic now reaches the host, but nothing listens on that address/port - check the listen address", "The firewall is still dropping", "DNS failed", "The cert expired"], "why": "A changed error is progress: the next layer is the listener (nginx bound to 127.0.0.1)."}, {"q": "Why is `curl localhost/health` a poor check for 'is the shop reachable for customers'?", "o": ["It bypasses the network path, remote firewall rules and the externally bound listen address", "localhost uses UDP", "It always returns 200", "It tests DNS only"], "why": "Always test from where the user is."}], "qa": [{"q": "Describe your process for a layered outage where fixing one fault reveals another.", "a": "Re-test from the client after every single change and compare the error text: timeout -> (fix firewall) -> refused -> (fix listen address) -> 200. Check counters (iptables -v), packet captures (tcpdump) and listeners (ss) at each layer; change one thing at a time; note each step in the incident notes."}, {"q": "What was the 'side finding' about shopapp on 0.0.0.0:8080 and why does it matter?", "a": "The backend app listens on all addresses, so external clients can bypass nginx (and its controls) by hitting :8080 directly. Real hardening would bind it to 127.0.0.1 or restrict it by firewall, rather than binding nginx to loopback and breaking the service."}]}, {"id": "h01", "level": "hard", "title": "App hangs after some traffic, restart \"fixes\" it", "time": "40 min", "skills": "file descriptors, ulimits, /proc, systemd drop-ins, strace", "ticket": "\u003cblockquote>\u003cstrong>INC-3001 · P1 · Customer facing · recurring\u003c/strong>\u003cbr>\nSince yesterday shopapp stops answering after a few minutes of traffic.\u003cbr>\nnginx returns \u003cstrong>504 Gateway Timeout\u003c/strong>. CPU of the app goes high while it hangs.\u003cbr>\nRestarting shopapp fixes it for a few minutes, then it happens again.\u003cbr>\nThe team already did 4 restarts today. We need the root cause, not another restart.\u003c/blockquote>", "success": "\u003cul>\u003cli>shopapp survives 300+ requests and stays healthy\u003c/li>\u003cli>No fd leak (fd count stays low)\u003c/li>\u003cli>Limits are sane (soft NOFILE &gt;= 1024)\u003c/li>\u003c/ul>", "warmup": "\u003cp>The solution uses long command lines. They are just short commands with one flag added at a time. Practise each ladder on any Linux box first (all read-only). Every rung adds \u003cstrong>one\u003c/strong> thing to the rung above - stop at the rung you understand, and read the next one only when you are ready. The lab itself uses the last rung of each ladder.\u003c/p>\n\u003ch4>curl - talk to a web service\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">curl http://localhost/                                   \u003cspan class=\"c\"># 1. fetch a page, print the body\u003c/span>\ncurl -s http://localhost/                                \u003cspan class=\"c\"># 2. -s = silent (no progress bar)\u003c/span>\ncurl -s -o /dev/null http://localhost/                   \u003cspan class=\"c\"># 3. -o /dev/null = throw the body away\u003c/span>\ncurl -s -o /dev/null -w '%{http_code}\\n' http://localhost/   \u003cspan class=\"c\"># 4. -w = print only the HTTP status code\u003c/span>\ncurl -v http://localhost/                                \u003cspan class=\"c\"># 5. -v = verbose: shows connect, headers (debug)\u003c/span>\ncurl -s -o /dev/null -w '%{http_code} %{time_total}s\\n' --max-time 5 http://localhost/   \u003cspan class=\"c\"># 6. + timing, + give up after 5 s\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>/proc - the kernel's view of a process\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">cat /proc/self/status | head                    \u003cspan class=\"c\"># 1. 'self' = the cat process itself\u003c/span>\nls /proc/self/fd                                \u003cspan class=\"c\"># 2. its open file descriptors\u003c/span>\nls -l /proc/self/fd                             \u003cspan class=\"c\"># 3. -l shows what each fd points to\u003c/span>\nls /proc/1234/fd | wc -l                        \u003cspan class=\"c\"># 4. how many fds does PID 1234 have?\u003c/span>\ngrep 'open files' /proc/1234/limits             \u003cspan class=\"c\"># 5. its fd limit\u003c/span>\nPID=$(systemctl show -p MainPID --value nginx)  \u003cspan class=\"c\"># 6. get a service's PID into a variable\u003c/span>\nsudo ls /proc/$PID/fd | wc -l                   \u003cspan class=\"c\"># 7. now the same check without typing the number\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>ps / pgrep / pstree - look at processes\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">ps                                         \u003cspan class=\"c\"># 1. only your shell\u003c/span>\nps -ef                                     \u003cspan class=\"c\"># 2. every process, full format (PID, PPID, command)\u003c/span>\nps -fp 1234                                \u003cspan class=\"c\"># 3. just one PID\u003c/span>\nps -eo pid,ppid,user,%cpu,%mem,cmd         \u003cspan class=\"c\"># 4. -o = choose your own columns\u003c/span>\nps -eo pid,%cpu,cmd --sort=-%cpu | head    \u003cspan class=\"c\"># 5. sort by CPU, highest first (- = descending), top 10\u003c/span>\npgrep -af nginx                            \u003cspan class=\"c\"># 6. find PIDs by name (-a = show full command, -f = match whole command line)\u003c/span>\npstree -ps 1234                            \u003cspan class=\"c\"># 7. parent chain of one PID: who started it?\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>strace - see what a process asks the kernel\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">strace ls /nonexistent                          \u003cspan class=\"c\"># 1. run a command and print every system call\u003c/span>\nstrace -e trace=openat ls /nonexistent          \u003cspan class=\"c\"># 2. -e = only these calls (openat = open a file)\u003c/span>\nsudo strace -p 1234                             \u003cspan class=\"c\"># 3. -p = attach to a running process\u003c/span>\nsudo strace -f -p 1234 -e trace=openat,close    \u003cspan class=\"c\"># 4. -f = follow child threads; two call types\u003c/span>\nsudo strace -f -p 1234 -e trace=openat,close -o /tmp/st.txt   \u003cspan class=\"c\"># 5. -o = write to file, then grep it\u003c/span>\n\u003cspan class=\"c\"># openat without a matching close = a file-descriptor leak.\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>systemctl show / cat - ask systemd for facts\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">systemctl cat nginx                              \u003cspan class=\"c\"># 1. the unit file(s) systemd really uses, incl. drop-ins\u003c/span>\nsystemctl show nginx                             \u003cspan class=\"c\"># 2. every property (long)\u003c/span>\nsystemctl show -p User nginx                     \u003cspan class=\"c\"># 3. -p = just one property\u003c/span>\nsystemctl show -p User -p MainPID nginx          \u003cspan class=\"c\"># 4. several\u003c/span>\nsystemctl show -p MainPID --value nginx          \u003cspan class=\"c\"># 5. --value = print only the value (for scripts)\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>sed - edit text from the command line\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">sed 's/old/new/' file           \u003cspan class=\"c\"># 1. print file with the first 'old' on each line replaced (file unchanged)\u003c/span>\nsed 's/old/new/g' file          \u003cspan class=\"c\"># 2. g = every match on the line\u003c/span>\nsed -n '3p' file                \u003cspan class=\"c\"># 3. -n + p = print only line 3\u003c/span>\nsed '/old/d' file               \u003cspan class=\"c\"># 4. d = delete lines that match (still only printed)\u003c/span>\nsed -i 's/old/new/' file        \u003cspan class=\"c\"># 5. -i = edit the file IN PLACE (make a copy first: cp file file.bak)\u003c/span>\nsed -i 's#/a/b#/c/d#' file      \u003cspan class=\"c\"># 6. any delimiter works: # avoids escaping / in paths\u003c/span>\u003c/code>\u003c/pre>", "hints": [{"title": "Hint 1 - what does the process see?", "html": "\u003cp>Find the PID: \u003ccode>systemctl show -p MainPID shopapp\u003c/code>. Then count open fds: \u003ccode>sudo ls /proc/&lt;PID&gt;/fd | wc -l\u003c/code>. Compare to \u003ccode>grep 'open files' /proc/&lt;PID&gt;/limits\u003c/code>. \u003ccode>journalctl -u shopapp\u003c/code> - search for \u003ccode>Errno\u003c/code>.\u003c/p>"}, {"title": "Hint 2 - what are those fds?", "html": "\u003cp>\u003ccode>sudo ls -l /proc/&lt;PID&gt;/fd\u003c/code> or \u003ccode>sudo lsof -p &lt;PID&gt;\u003c/code>. Many fds to the same file = leak. \u003ccode>sudo strace -f -p &lt;PID&gt; -e trace=openat,accept4\u003c/code> while you send one request.\u003c/p>"}, {"title": "Hint 3 - where does the limit come from?", "html": "\u003cp>\u003ccode>systemctl cat shopapp\u003c/code> prints the unit \u003cstrong>and every drop-in\u003c/strong> with file paths. \u003ccode>systemctl show -p LimitNOFILE shopapp\u003c/code>. Two changes combined into one outage.\u003c/p>"}], "learn": "\u003cul>\u003cli>\u003ccode>EMFILE (Errno 24) Too many open files\u003c/code> = per-process fd limit reached.\u003c/li>\u003cli>\u003ccode>/proc/&lt;PID&gt;/fd\u003c/code> and \u003ccode>/proc/&lt;PID&gt;/limits\u003c/code> show the real state of a running process. Your shell's \u003ccode>ulimit -n\u003c/code> does \u003cstrong>not\u003c/strong> apply to systemd services.\u003c/li>\u003cli>\u003ccode>systemctl cat\u003c/code> reveals drop-ins in \u003ccode>/etc/systemd/system/&lt;unit&gt;.d/\u003c/code> that override the main unit.\u003c/li>\u003cli>Two changes can be safe alone and break together. Raising the limit alone only delays a leak.\u003c/li>\u003c/ul>", "solution": "\u003cblockquote>Long commands below are built up short-first (\u003ccode># 1.\u003c/code>, \u003ccode># 2.\u003c/code> ...). Each rung adds one flag;\u003cbr>\nthe last rung is what the lab uses. The README \u003cstrong>Warm-up\u003c/strong> explains every flag from scratch.\u003c/blockquote>\n\u003ch3>1. Confirm and capture evidence \u003cstrong>before\u003c/strong> restarting\u003c/h3>\n\u003cp>A restart destroys the evidence. Look first.\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">curl -s -o /dev/null -w '%{http_code}\\n' --max-time 15 localhost/   \u003cspan class=\"c\"># 504\u003c/span>\nPID=$(systemctl show -p MainPID --value shopapp); echo $PID\ntop -p $PID                          \u003cspan class=\"c\"># high CPU while hung\u003c/span>\nsudo ls /proc/$PID/fd | wc -l        \u003cspan class=\"c\"># 64\u003c/span>\ngrep 'open files' /proc/$PID/limits\n\u003cspan class=\"c\"># Max open files            64                   64                   files\u003c/span>\njournalctl -u shopapp --since \"15 min ago\" | grep -i errno | tail -3\n\u003cspan class=\"c\"># OSError: [Errno 24] Too many open files: '/srv/shopdata/trace.log'\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>The process reached its fd limit. Why the high CPU? The listening socket is \"ready\" but \u003ccode>accept()\u003c/code> fails with EMFILE, so the event loop spins.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>curl -s -o /dev/null -w '%{http_code}\\n' --max-time 15 localhost/\u003c/code>\u003c/td>\u003ctd>Status code only, give up after 15 s.\u003c/td>\u003ctd>\u003ccode>504\u003c/code>: the app is hanging, not erroring.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>PID=$(systemctl show -p MainPID --value shopapp)\u003c/code>\u003c/td>\u003ctd>Captures the main PID into a shell variable. \u003ccode>--value\u003c/code> prints just the number.\u003c/td>\u003ctd>Reused in every following command; \u003cstrong>gather evidence before restarting\u003c/strong>, a restart destroys it.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>top -p $PID\u003c/code>\u003c/td>\u003ctd>Live view of one process.\u003c/td>\u003ctd>High CPU while hung: an event loop spinning.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ls /proc/$PID/fd | wc -l\u003c/code>\u003c/td>\u003ctd>Counts open file descriptors.\u003c/td>\u003ctd>64 fds open.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>grep 'open files' /proc/$PID/limits\u003c/code>\u003c/td>\u003ctd>The \u003cstrong>effective\u003c/strong> limits of the running process.\u003c/td>\u003ctd>\u003ccode>Max open files 64\u003c/code> - the process is at its ceiling.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>journalctl -u shopapp --since \"15 min ago\" | grep -i errno | tail -3\u003c/code>\u003c/td>\u003ctd>Search recent errors.\u003c/td>\u003ctd>\u003ccode>Errno 24 Too many open files: trace.log\u003c/code>.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>2. What are the fds?\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo ls -l /proc/$PID/fd                                       \u003cspan class=\"c\"># 1. each fd and where it points\u003c/span>\nsudo ls -l /proc/$PID/fd | awk '{print $NF}'                   \u003cspan class=\"c\"># 2. keep only the last column (the target)\u003c/span>\nsudo ls -l /proc/$PID/fd | awk '{print $NF}' | sort | uniq -c  \u003cspan class=\"c\"># 3. group and count identical targets\u003c/span>\nsudo ls -l /proc/$PID/fd | awk '{print $NF}' | sort | uniq -c | sort -rn | head   \u003cspan class=\"c\"># 4. most frequent first\u003c/span>\n\u003cspan class=\"c\">#  56 /srv/shopdata/trace.log         &lt;-- same file opened 56 times = leak\u003c/span>\nsudo strace -p $PID                                              \u003cspan class=\"c\"># 1. every system call (noisy)\u003c/span>\nsudo strace -p $PID -e trace=openat,close                       \u003cspan class=\"c\"># 2. only open/close\u003c/span>\nsudo strace -f -p $PID -e trace=openat,close -o /tmp/st.txt &amp;   \u003cspan class=\"c\"># 3. + threads, + write to a file, + background (&amp;)\u003c/span>\ncurl -s --max-time 2 localhost:8080/ ; sudo kill %1\ngrep trace.log /tmp/st.txt          \u003cspan class=\"c\"># openat ... trace.log ... and no close()\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>Each request opens \u003ccode>trace.log\u003c/code> and never closes it.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>ls -l /proc/$PID/fd | awk '{print $NF}' | sort | uniq -c | sort -rn | head\u003c/code>\u003c/td>\u003ctd>Prints the last field (the target path) of each fd, groups and counts identical lines, biggest first.\u003c/td>\u003ctd>56 fds are the \u003cstrong>same file\u003c/strong>: \u003ccode>trace.log\u003c/code> opened repeatedly = a leak.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>strace -f -p $PID -e trace=openat,close -o /tmp/st.txt &amp;\u003c/code>\u003c/td>\u003ctd>Traces system calls of the process (and its threads, \u003ccode>-f\u003c/code>), only \u003ccode>openat\u003c/code>/\u003ccode>close\u003c/code>, into a file, in the background.\u003c/td>\u003ctd>Watch one request: \u003ccode>openat(trace.log)\u003c/code> with no matching \u003ccode>close()\u003c/code>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>grep trace.log /tmp/st.txt\u003c/code>\u003c/td>\u003ctd>Filter the trace.\u003c/td>\u003ctd>Proves the leak at the syscall level.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>3. Why only since yesterday? Two changes\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">grep -n trace /etc/shopapp/config.ini\n\u003cspan class=\"c\"># 11:; enabled for INC-1999 debugging - turn off after!\u003c/span>\n\u003cspan class=\"c\"># 12:trace_requests = true\u003c/span>\nsystemctl cat shopapp\n\u003cspan class=\"c\"># # /etc/systemd/system/shopapp.service\u003c/span>\n\u003cspan class=\"c\"># ...\u003c/span>\n\u003cspan class=\"c\"># # /etc/systemd/system/shopapp.service.d/10-limits.conf\u003c/span>\n\u003cspan class=\"c\"># # copied from legacy container template (tpl-v1)\u003c/span>\n\u003cspan class=\"c\"># [Service]\u003c/span>\n\u003cspan class=\"c\"># LimitNOFILE=64\u003c/span>\u003c/code>\u003c/pre>\n\u003cul>\u003cli>The leak (trace on) was added yesterday.\u003c/li>\u003cli>The tiny limit (64) has existed for weeks; it made the leak fail in minutes instead of days.\u003c/li>\u003c/ul>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>grep -n trace /etc/shopapp/config.ini\u003c/code>\u003c/td>\u003ctd>Search config.\u003c/td>\u003ctd>\u003ccode>trace_requests = true\u003c/code> set yesterday for debugging INC-1999.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl cat shopapp\u003c/code>\u003c/td>\u003ctd>Unit file \u003cstrong>plus all drop-ins\u003c/strong>.\u003c/td>\u003ctd>Reveals \u003ccode>LimitNOFILE=64\u003c/code> in \u003ccode>10-limits.conf\u003c/code>: the old tiny limit made the leak fail within minutes.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>4. Fix both\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">\u003cspan class=\"c\"># stop the leak\u003c/span>\nsudo sed -i 's/^trace_requests = true.*/trace_requests = false/' /etc/shopapp/config.ini\n\u003cspan class=\"c\"># remove the bad limit (default for services is 1024 soft / 524288 hard)\u003c/span>\nsudo rm /etc/systemd/system/shopapp.service.d/10-limits.conf\nsudo systemctl daemon-reload\nsudo systemctl restart shopapp\nPID=$(systemctl show -p MainPID --value shopapp)\ngrep 'open files' /proc/$PID/limits\nfor i in $(seq 300); do curl -s -o /dev/null localhost:8080/; done\nsudo ls /proc/$PID/fd | wc -l       \u003cspan class=\"c\"># small and stable\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>(If you need a custom limit, set e.g. \u003ccode>LimitNOFILE=65536\u003c/code> in a drop-in - via \u003ccode>sudo systemctl edit shopapp\u003c/code> - never edit \u003ccode>/lib/systemd/system\u003c/code> files.)\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>sed -i 's/^trace_requests = true.*/trace_requests = false/'\u003c/code>\u003c/td>\u003ctd>Turns tracing off.\u003c/td>\u003ctd>Stops the leak.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>rm .../10-limits.conf; systemctl daemon-reload; systemctl restart shopapp\u003c/code>\u003c/td>\u003ctd>Removes the override, reloads units, restarts.\u003c/td>\u003ctd>Removes the bad limit. Custom limits belong in a drop-in made with \u003ccode>systemctl edit\u003c/code>, never in \u003ccode>/lib/systemd\u003c/code>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>for i in $(seq 300); do curl -s -o /dev/null localhost:8080/; done\u003c/code>\u003c/td>\u003ctd>300 quick requests.\u003c/td>\u003ctd>Load test; fd count must stay small and stable afterwards.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>5. Report the bug\u003c/h3>\n\u003cp>The trace code never closes its file handle. Tell the developers: use \u003ccode>with open(...)\u003c/code> or one shared handle.\u003c/p>", "root": "\u003cdiv class='tablewrap'>\u003ctable>\u003ctbody>\u003ctr>\u003ctd>Root cause\u003c/td>\u003ctd>Debug tracing leaks 1 fd per request; a legacy drop-in limited the service to 64 fds\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Contributing\u003c/td>\u003ctd>Restarts were used as a fix and destroyed evidence; \"temporary\" debug flag left on\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prevent\u003c/td>\u003ctd>Monitor \u003ccode>process_open_fds / process_max_fds\u003c/code>; review drop-ins (\u003ccode>systemd-delta\u003c/code>); time-box debug flags\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "explain": "\u003cp>\u003cstrong>Two faults combined:\u003c/strong>\u003c/p>\n\u003col>\u003cli>\u003cstrong>A leak\u003c/strong> - \u003ccode>trace_requests = true\u003c/code> (debug flag from INC-1999) makes every request open \u003ccode>trace.log\u003c/code> and never close it: +1 fd per request.\u003c/li>\u003cli>\u003cstrong>A tiny limit\u003c/strong> - a legacy drop-in \u003ccode>shopapp.service.d/10-limits.conf\u003c/code> sets \u003ccode>LimitNOFILE=64\u003c/code>. It existed for weeks; the leak made it bite within minutes.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>EMFILE (\u003ccode>Errno 24 Too many open files\u003c/code>)\u003c/strong> = per-process fd limit reached. Your shell's \u003ccode>ulimit -n\u003c/code> does \u003cstrong>not\u003c/strong> apply to a systemd service - limits come from the unit (\u003ccode>LimitNOFILE=\u003c/code>) and are visible in \u003ccode>/proc/&lt;PID&gt;/limits\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Why 504 and high CPU:\u003c/strong> the listening socket stays \"readable\" but \u003ccode>accept()\u003c/code> fails with EMFILE, so the event loop spins.\u003c/p>\n\u003cp>\u003cstrong>Evidence before restart:\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode class=\"lang-text\">ls /proc/$PID/fd | wc -l              \u003cspan class=\"c\"># 64\u003c/span>\ngrep 'open files' /proc/$PID/limits   \u003cspan class=\"c\"># 64\u003c/span>\nls -l /proc/$PID/fd | awk '{print $NF}' | sort | uniq -c | sort -rn   \u003cspan class=\"c\"># same file x56 = leak\u003c/span>\nstrace -f -p $PID -e trace=openat,close   \u003cspan class=\"c\"># openat without close\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Fix both:\u003c/strong> turn tracing off, remove the bad drop-in (or set a sensible \u003ccode>LimitNOFILE=65536\u003c/code> via \u003ccode>systemctl edit\u003c/code>), \u003ccode>daemon-reload\u003c/code>, restart, then prove it with 300 requests and a stable fd count. Raising the limit alone only delays a leak. \u003ccode>systemctl cat\u003c/code> shows drop-ins; never edit \u003ccode>/lib/systemd/system\u003c/code>.\u003c/p>", "mcq": [{"q": "The log says `OSError: [Errno 24] Too many open files`. What limit is reached?", "o": ["The per-process file descriptor limit (RLIMIT_NOFILE)", "The system-wide disk quota", "The number of inodes", "The TCP port range"], "why": "EMFILE is per process; ENFILE would be system-wide."}, {"q": "Where do you see a RUNNING process's real fd count and limit?", "o": ["/proc/\u003cPID>/fd and /proc/\u003cPID>/limits", "ulimit -n in your own shell", "/etc/security/limits.conf only", "df -i"], "why": "Your shell's ulimit does not apply to systemd services; /proc shows the live state."}, {"q": "Why is raising LimitNOFILE alone not a fix here?", "o": ["The code leaks one fd per request, so it would only take longer to fail again", "Systemd ignores LimitNOFILE", "fds are free", "The limit is read-only"], "why": "A leak needs the code/config fixed; raising a limit just hides it for a while."}], "qa": [{"q": "Why capture evidence before restarting the service?", "a": "A restart destroys the live state you need: open fds, which files they point to, thread/CPU behaviour, memory. Capturing `ls -l /proc/PID/fd`, `/proc/PID/limits`, strace output and logs first proves the cause (same file open 56 times, no close) and stops the team from repeating 'restart as a fix'."}, {"q": "Which two changes were combined into this outage, and which is the 'root cause'?", "a": "The leak (debug trace on, file never closed) is the root cause; the legacy `LimitNOFILE=64` drop-in is the contributing condition that made it fail in minutes instead of days. Fix both and report the bug to developers (use `with open` / one shared handle)."}]}, {"id": "h02", "level": "hard", "title": "\"Read-only file system\"", "time": "45 min", "skills": "kernel log, mount options, unmount safely, fsck, restore from backup", "ticket": "\u003cblockquote>\u003cstrong>INC-3002 · P1 · Customer facing\u003c/strong>\u003cbr>\n\u003ccode>/health\u003c/code> returns \u003ccode>500 ERROR: [Errno 30] Read-only file system\u003c/code>. Checkout is broken.\u003cbr>\nNobody changed mounts. The storage team reported a \"brief glitch\" on the hypervisor overnight.\u003cbr>\nGet the data volume \u003ccode>/srv/shopdata\u003c/code> healthy and writable again. If data was lost, restore it -\u003cbr>\nlast night's backups are in \u003ccode>/srv/backups/\u003c/code>.\u003c/blockquote>", "success": "\u003cul>\u003cli>\u003ccode>/srv/shopdata\u003c/code> mounted read-write and the filesystem is \u003cstrong>clean\u003c/strong> (no errors flag)\u003c/li>\u003cli>\u003ccode>catalog/products.db\u003c/code> restored from backup, owned by \u003ccode>shopapp\u003c/code>\u003c/li>\u003cli>\u003ccode>/health\u003c/code> returns 200\u003c/li>\u003c/ul>", "warmup": "\u003cp>The solution uses long command lines. They are just short commands with one flag added at a time. Practise each ladder on any Linux box first (all read-only). Every rung adds \u003cstrong>one\u003c/strong> thing to the rung above - stop at the rung you understand, and read the next one only when you are ready. The lab itself uses the last rung of each ladder.\u003c/p>\n\u003ch4>findmnt / mount - what is mounted\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">mount | head                         \u003cspan class=\"c\"># 1. old way: long list\u003c/span>\nfindmnt                              \u003cspan class=\"c\"># 2. tree of all mounts\u003c/span>\nfindmnt /srv/shopdata                \u003cspan class=\"c\"># 3. one mount: source, type, options (look for ro / rw)\u003c/span>\nfindmnt -t nfs,nfs4                  \u003cspan class=\"c\"># 4. -t = only these types\u003c/span>\nfindmnt -no OPTIONS /srv/shopdata    \u003cspan class=\"c\"># 5. -n no header, -o choose column -&gt; script-friendly\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>dmesg / journalctl -k - the kernel's messages\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">dmesg                           \u003cspan class=\"c\"># 1. kernel ring buffer (needs sudo on some systems)\u003c/span>\ndmesg -T                        \u003cspan class=\"c\"># 2. -T = readable timestamps\u003c/span>\nsudo dmesg -T | tail -5         \u003cspan class=\"c\"># 3. only the newest lines\u003c/span>\njournalctl -k --since \"1 hour ago\"    \u003cspan class=\"c\"># 4. kernel log from the journal, time window\u003c/span>\njournalctl -k | grep -iE 'oom|ext4'   \u003cspan class=\"c\"># 5. filter for what you suspect\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>fuser / umount - free the mount point\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">cd /                                    \u003cspan class=\"c\"># 1. make sure YOUR shell is not inside the mount\u003c/span>\nsudo fuser -vm /srv/shopdata            \u003cspan class=\"c\"># 2. who uses it? (-v verbose, -m everything on that mount)\u003c/span>\nsudo systemctl stop shopapp             \u003cspan class=\"c\"># 3. stop the user of the mount, then\u003c/span>\nsudo umount /srv/shopdata               \u003cspan class=\"c\"># 4. unmount\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>fsck - check a filesystem (unmounted!)\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo umount /srv/shopdata               \u003cspan class=\"c\"># 1. a filesystem must not be mounted while you repair it\u003c/span>\nsudo e2fsck -n /path/to.img             \u003cspan class=\"c\"># 2. -n = read-only check, answer 'no' to everything: SAFE dry run\u003c/span>\nsudo e2fsck -f /path/to.img             \u003cspan class=\"c\"># 3. -f = force a full check; it asks before each repair (y)\u003c/span>\nsudo dumpe2fs -h /path/to.img | grep -i state   \u003cspan class=\"c\"># 4. -h = header only: 'clean' or 'not clean'\u003c/span>\u003c/code>\u003c/pre>", "hints": [{"title": "Hint 1 - why read-only?", "html": "\u003cp>\u003ccode>findmnt /srv/shopdata\u003c/code> shows the options now. The kernel decided this, so the kernel logged why: \u003ccode>journalctl -k | grep -i ext4\u003c/code> or \u003ccode>sudo dmesg -T | grep -i -E 'ext4|remount'\u003c/code>.\u003c/p>"}, {"title": "Hint 2 - don't just remount rw", "html": "\u003cp>\u003ccode>mount -o remount,rw\u003c/code> makes the error go away and leaves a corrupt filesystem. Look at \u003ccode>sudo dumpe2fs -h &lt;device&gt; | grep -i -E 'state|error'\u003c/code>. A filesystem with errors needs \u003ccode>e2fsck\u003c/code>, and \u003ccode>e2fsck\u003c/code> needs it \u003cstrong>unmounted\u003c/strong>.\u003c/p>"}, {"title": "Hint 3 - \"target is busy\"", "html": "\u003cp>Who uses the mount? \u003ccode>sudo fuser -vm /srv/shopdata\u003c/code> or \u003ccode>sudo lsof /srv/shopdata\u003c/code>. Stop the service (and \u003ccode>cd\u003c/code> out of the directory yourself). After fsck, check \u003ccode>lost+found\u003c/code> and what is missing - then restore from backup.\u003c/p>"}], "learn": "\u003cul>\u003cli>\u003ccode>errors=remount-ro\u003c/code>: ext4 goes read-only on corruption to protect your data. It is a symptom.\u003c/li>\u003cli>The kernel log tells you the device, inode and function that hit the error.\u003c/li>\u003cli>Correct order: stop writers -&gt; unmount -&gt; \u003ccode>e2fsck -f\u003c/code> -&gt; mount -&gt; verify data -&gt; restore -&gt; start app.\u003c/li>\u003cli>Never run \u003ccode>fsck\u003c/code> on a mounted filesystem. Never \"fix\" read-only by just remounting rw.\u003c/li>\u003cli>After fsck, files can disappear or move to \u003ccode>lost+found\u003c/code>. Backups are part of recovery.\u003c/li>\u003c/ul>", "solution": "\u003cblockquote>Long commands below are built up short-first (\u003ccode># 1.\u003c/code>, \u003ccode># 2.\u003c/code> ...). Each rung adds one flag;\u003cbr>\nthe last rung is what the lab uses. The README \u003cstrong>Warm-up\u003c/strong> explains every flag from scratch.\u003c/blockquote>\n\u003ch3>1. Confirm\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">curl -s localhost/health                     \u003cspan class=\"c\"># ERROR: [Errno 30] Read-only file system\u003c/span>\nfindmnt /srv/shopdata\n\u003cspan class=\"c\"># TARGET        SOURCE     FSTYPE OPTIONS\u003c/span>\n\u003cspan class=\"c\"># /srv/shopdata /dev/loop1 ext4   ro,relatime,errors=remount-ro\u003c/span>\ntouch /srv/shopdata/x                        \u003cspan class=\"c\"># Read-only file system\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>curl -s localhost/health\u003c/code>\u003c/td>\u003ctd>Health call.\u003c/td>\u003ctd>\u003ccode>Errno 30 Read-only file system\u003c/code>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>findmnt /srv/shopdata\u003c/code>\u003c/td>\u003ctd>Shows mount source, type and \u003cstrong>options\u003c/strong>.\u003c/td>\u003ctd>\u003ccode>ro,...,errors=remount-ro\u003c/code>: the kernel flipped it to read-only after an error.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>touch /srv/shopdata/x\u003c/code>\u003c/td>\u003ctd>Tries a write.\u003c/td>\u003ctd>Quick proof.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>2. Why? Ask the kernel\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">journalctl -k --since \"1 hour ago\" | grep -iE 'ext4|remount'\n\u003cspan class=\"c\"># EXT4-fs error (device loop1): ext4_lookup:1855: inode #13: comm cat: deleted inode referenced: 14\u003c/span>\n\u003cspan class=\"c\"># EXT4-fs (loop1): Remounting filesystem read-only\u003c/span>\nsudo dumpe2fs -h /dev/loop1                                   \u003cspan class=\"c\"># 1. filesystem header\u003c/span>\nsudo dumpe2fs -h /dev/loop1 2&gt;/dev/null                       \u003cspan class=\"c\"># 2. hide the version banner (stderr)\u003c/span>\nsudo dumpe2fs -h /dev/loop1 2&gt;/dev/null | grep -iE 'state|error'   \u003cspan class=\"c\"># 3. only state / error lines\u003c/span>\n\u003cspan class=\"c\"># Filesystem state:         clean with errors\u003c/span>\n\u003cspan class=\"c\"># FS Error count:           1\u003c/span>\n\u003cspan class=\"c\"># Last error function:      ext4_lookup\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>A directory entry (\u003ccode>products.db\u003c/code> in the catalog dir, inode 13) points to inode 14, which is wiped. That is on-disk corruption.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>journalctl -k --since \"1 hour ago\" | grep -iE 'ext4|remount'\u003c/code>\u003c/td>\u003ctd>Kernel messages about ext4.\u003c/td>\u003ctd>\u003ccode>EXT4-fs error ... deleted inode referenced\u003c/code> followed by \u003ccode>Remounting filesystem read-only\u003c/code>: on-disk corruption.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>dumpe2fs -h /dev/loop1 | grep -iE 'state|error'\u003c/code>\u003c/td>\u003ctd>Prints the ext4 superblock header.\u003c/td>\u003ctd>\u003ccode>clean with errors\u003c/code>, error count, last error function.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>3. Stop writers and unmount\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">cd /                                         \u003cspan class=\"c\"># don't block the unmount yourself\u003c/span>\nsudo fuser -vm /srv/shopdata                 \u003cspan class=\"c\"># who uses it?\u003c/span>\nsudo systemctl stop shopapp\nsudo umount /srv/shopdata\n\u003cspan class=\"c\"># if \"target is busy\": fuser -vm again, stop that process. Avoid `umount -l` here.\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>cd /\u003c/code>\u003c/td>\u003ctd>Leaves the mount point.\u003c/td>\u003ctd>Your own shell would make the unmount fail with \"busy\".\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>fuser -vm /srv/shopdata\u003c/code>\u003c/td>\u003ctd>Lists processes using the mounted filesystem.\u003c/td>\u003ctd>Find what to stop before unmounting.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl stop shopapp; umount /srv/shopdata\u003c/code>\u003c/td>\u003ctd>Stop the writer, unmount.\u003c/td>\u003ctd>\u003ccode>e2fsck\u003c/code> must only run on an \u003cstrong>unmounted\u003c/strong> filesystem. Avoid \u003ccode>umount -l\u003c/code> (lazy) here.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>4. Repair\u003c/h3>\n\u003cp>The volume is a loop file; the image path is in \u003ccode>/etc/fstab\u003c/code>:\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">grep shopdata /etc/fstab\nsudo e2fsck -f /var/lib/tshoot/shopdata.img        \u003cspan class=\"c\"># interactive: answer y\u003c/span>\n\u003cspan class=\"c\">#   Entry 'products.db' in /catalog (13) has deleted/unused inode 14.  Clear&lt;y&gt;? yes\u003c/span>\n\u003cspan class=\"c\">#   ***** FILE SYSTEM WAS MODIFIED *****\u003c/span>\nsudo e2fsck -f /var/lib/tshoot/shopdata.img        \u003cspan class=\"c\"># second run must be clean\u003c/span>\nsudo dumpe2fs -h /var/lib/tshoot/shopdata.img 2&gt;/dev/null | grep state   \u003cspan class=\"c\"># clean\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>(On a real disk you run \u003ccode>e2fsck -f /dev/sdb1\u003c/code>. Use \u003ccode>-n\u003c/code> first for a read-only dry run if you are unsure.)\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>grep shopdata /etc/fstab\u003c/code>\u003c/td>\u003ctd>Find the backing device/image.\u003c/td>\u003ctd>The \"disk\" here is a loop file.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>e2fsck -f IMAGE\u003c/code>\u003c/td>\u003ctd>Filesystem check and repair; \u003ccode>-f\u003c/code> forces a check even if flagged clean.\u003c/td>\u003ctd>Clears the bad directory entry. Run it \u003cstrong>twice\u003c/strong>: the second must be clean. Use \u003ccode>-n\u003c/code> first for a read-only dry run on real disks.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>5. Mount, check data, restore\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo mount /srv/shopdata\nfindmnt -no OPTIONS /srv/shopdata            \u003cspan class=\"c\"># rw,...\u003c/span>\nls -l /srv/shopdata/catalog/                 \u003cspan class=\"c\"># products.db is gone (fsck removed the broken entry)\u003c/span>\nls -l /srv/shopdata/lost+found/\nls -l /srv/backups/catalog/\nsudo cp /srv/backups/catalog/products.db.&lt;date&gt; /srv/shopdata/catalog/products.db\nsudo chown shopapp:shopapp /srv/shopdata/catalog/products.db\nhead -3 /srv/shopdata/catalog/products.db\nsudo systemctl start shopapp\ncurl -s localhost/health                     \u003cspan class=\"c\"># OK\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003c
