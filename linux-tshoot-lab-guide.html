stall]\u003c/code> -&gt; nothing to link -&gt; \u003ccode>enable\u003c/code> explains this in its error message.\u003c/p>\n\u003cp>\u003cstrong>Fix:\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode class=\"lang-text\">[Install]\nWantedBy=multi-user.target\u003c/code>\u003c/pre>\n\u003cp>then \u003ccode>systemctl daemon-reload\u003c/code> and \u003ccode>systemctl enable --now shopapp\u003c/code>. Do \u003cstrong>not\u003c/strong> create the symlink by hand: config management and \u003ccode>systemctl disable\u003c/code> would not know about it.\u003c/p>\n\u003cp>\u003cstrong>Mindset:\u003c/strong> after every fix ask \"does this survive a reboot?\" The 40-minute outage came from patch-reboot + a template rollout that removed \u003ccode>[Install]\u003c/code>. Prevent with \u003ccode>systemd-analyze verify\u003c/code> in CI and reboot tests.\u003c/p>", "mcq": [{"q": "`systemctl is-enabled shopapp` prints `static`. What does it mean?", "o": ["The unit has no [Install] section, so it cannot be enabled for boot", "The unit is enabled and running", "The unit file is read-only", "The unit is masked"], "why": "static = no installation config; it can't be enabled/disabled directly."}, {"q": "What does `systemctl enable` actually do?", "o": ["Creates a symlink in \u003ctarget>.wants/ based on WantedBy= in [Install]", "Starts the service immediately", "Edits /etc/fstab", "Sets the service's nice value"], "why": "Enable = hook into boot via a symlink; start = run now."}, {"q": "You edited a unit file. What must you run before enable/start see the change?", "o": ["systemctl daemon-reload", "ldconfig", "update-rc.d -f", "sysctl --system"], "why": "systemd caches unit files; reload to re-read them."}], "qa": [{"q": "Explain `start` vs `enable`, and the one-liner that does both.", "a": "start runs the unit now; enable makes it start at boot. `systemctl enable --now \u003cunit>` does both."}, {"q": "The ticket mentions a 'template cleanup' rolled out to the host. How do you find out whether other services are affected?", "a": "List units with no [Install] section: `grep -L '^\\[Install\\]' /etc/systemd/system/*.service`, then check `systemctl is-enabled` for each that should start at boot; run `systemd-analyze verify` on them and tell the template owner."}]}, {"id": "e10", "level": "easy", "title": "502 after a debugging session", "time": "15 min", "skills": "reading crash loops, exit codes, file ownership, running things as the right user", "ticket": "\u003cblockquote>\u003cstrong>INC-1010 · P2\u003c/strong>\u003cbr>\nThe shop returns \u003ccode>502 Bad Gateway\u003c/code> since this morning.\u003cbr>\nYesterday evening an engineer was debugging shopapp. Their note in the ticket:\u003cbr>\n\u003cem>\"stopped the service, ran app.py by hand as root to see the error, moved the old log away,\u003cbr>\nstarted the service again - looked fine.\"\u003c/em>\u003cbr>\nBring the shop back. The service must keep running as user \u003ccode>shopapp\u003c/code>.\u003c/blockquote>", "success": "\u003cul>\u003cli>shopapp is active and stays up; \u003ccode>/health\u003c/code> returns 200\u003c/li>\u003cli>shopapp still runs as user \u003ccode>shopapp\u003c/code>\u003c/li>\u003cli>Log files belong to \u003ccode>shopapp\u003c/code>\u003c/li>\u003c/ul>\n\u003cp>Check with \u003ccode>sudo ./labctl.sh check e10\u003c/code>.\u003c/p>", "warmup": "\u003cp>The solution uses long command lines. They are just short commands with one flag added at a time. Practise each ladder on any Linux box first (all read-only). Every rung adds \u003cstrong>one\u003c/strong> thing to the rung above - stop at the rung you understand, and read the next one only when you are ready. The lab itself uses the last rung of each ladder.\u003c/p>\n\u003ch4>ls / namei / id - read permissions\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">ls                                  \u003cspan class=\"c\"># 1. names only\u003c/span>\nls -l /etc/hostname                 \u003cspan class=\"c\"># 2. -l = long: mode, owner, group, size, date\u003c/span>\nls -ld /etc                         \u003cspan class=\"c\"># 3. -d = the directory itself, not its content\u003c/span>\nnamei -l /etc/hostname              \u003cspan class=\"c\"># 4. mode + owner of EVERY directory on the way (a path needs x on each)\u003c/span>\nid                                  \u003cspan class=\"c\"># 5. who am I: uid, gid, groups\u003c/span>\nsudo -u www-data cat /etc/hostname  \u003cspan class=\"c\"># 6. run a command AS another user = test what the service can do\u003c/span>\n\u003cspan class=\"c\"># mode  rwxr-x---  = owner rwx (7), group r-x (5), others --- (0)  -&gt;  chmod 750\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>chmod / chown - change permissions and owner\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">chmod 644 file          \u003cspan class=\"c\"># 1. numbers: r=4 w=2 x=1, add up per owner/group/others -&gt; rw-r--r--\u003c/span>\nchmod 600 file          \u003cspan class=\"c\"># 2. owner only: rw-------\u003c/span>\nchmod u+x file          \u003cspan class=\"c\"># 3. symbolic: u=owner g=group o=others, +/- add/remove a bit\u003c/span>\nchown alice file        \u003cspan class=\"c\"># 4. change owner\u003c/span>\nchown alice:staff file  \u003cspan class=\"c\"># 5. owner and group\u003c/span>\nchown -R alice:staff dir/   \u003cspan class=\"c\"># 6. -R = recursive (whole tree - double-check the path first!)\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>systemd-run / sudo -u - run it like the service does\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo -u shopapp COMMAND                         \u003cspan class=\"c\"># 1. as the service user\u003c/span>\nsudo systemd-run --pty -p User=shopapp COMMAND  \u003cspan class=\"c\"># 2. through systemd: same environment as a service\u003c/span>\nsudo systemctl start shopapp-report             \u003cspan class=\"c\"># 3. start the real unit, then read its status/journal\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>systemctl show / cat - ask systemd for facts\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">systemctl cat nginx                              \u003cspan class=\"c\"># 1. the unit file(s) systemd really uses, incl. drop-ins\u003c/span>\nsystemctl show nginx                             \u003cspan class=\"c\"># 2. every property (long)\u003c/span>\nsystemctl show -p User nginx                     \u003cspan class=\"c\"># 3. -p = just one property\u003c/span>\nsystemctl show -p User -p MainPID nginx          \u003cspan class=\"c\"># 4. several\u003c/span>\nsystemctl show -p MainPID --value nginx          \u003cspan class=\"c\"># 5. --value = print only the value (for scripts)\u003c/span>\u003c/code>\u003c/pre>", "hints": [{"title": "Hint 1 - 502 means...", "html": "\u003cp>nginx is up, the backend is not. \u003ccode>systemctl status shopapp\u003c/code> - is it running, restarting, failed? Look at the exit \u003ccode>status=\u003c/code>.\u003c/p>"}, {"title": "Hint 2 - why does it exit?", "html": "\u003cp>\u003ccode>journalctl -u shopapp -n 20\u003c/code>. The app prints a FATAL line before it exits.\u003c/p>"}, {"title": "Hint 3 - who owns it", "html": "\u003cp>\u003ccode>ls -l /var/log/shopapp/\u003c/code>. Which user runs the service (\u003ccode>systemctl show -p User shopapp\u003c/code>)? Can that user write the file? Test: \u003ccode>sudo -u shopapp test -w /var/log/shopapp/app.log &amp;&amp; echo ok\u003c/code>.\u003c/p>"}], "learn": "\u003cul>\u003cli>502 from a proxy = look at the backend service first.\u003c/li>\u003cli>A crash loop shows up as \u003ccode>activating (auto-restart)\u003c/code> and a growing restart counter.\u003c/li>\u003cli>Running a service by hand as root leaves root-owned files that the real service user cannot write. Use \u003ccode>sudo -u &lt;serviceuser&gt;\u003c/code> when you debug.\u003c/li>\u003cli>The fix is \u003ccode>chown\u003c/code> back to the service user - not running the service as root.\u003c/li>\u003c/ul>", "solution": "\u003cblockquote>Long commands below are built up short-first (\u003ccode># 1.\u003c/code>, \u003ccode># 2.\u003c/code> ...). Each rung adds one flag;\u003cbr>\nthe last rung is what the lab uses. The README \u003cstrong>Warm-up\u003c/strong> explains every flag from scratch.\u003c/blockquote>\n\u003ch3>1. Confirm\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">curl -si localhost/ | head -1          \u003cspan class=\"c\"># HTTP/1.1 502 Bad Gateway\u003c/span>\nsystemctl status shopapp\n\u003cspan class=\"c\"># Active: activating (auto-restart) (Result: exit-code)\u003c/span>\n\u003cspan class=\"c\"># Process: 4410 ExecStart=/usr/bin/python3 /opt/shopapp/app.py (code=exited, status=3)\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>curl -si localhost/ | head -1\u003c/code>\u003c/td>\u003ctd>\u003ccode>-i\u003c/code> includes response headers; \u003ccode>head -1\u003c/code> shows the status line.\u003c/td>\u003ctd>\u003ccode>502 Bad Gateway\u003c/code> - proxy up, app down.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl status shopapp\u003c/code>\u003c/td>\u003ctd>State and last exit.\u003c/td>\u003ctd>Crash loop, \u003ccode>status=3\u003c/code>.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>2. Why does it exit?\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">journalctl -u shopapp -n 5 --no-pager\n\u003cspan class=\"c\"># python3[4410]: FATAL: cannot open log file /var/log/shopapp/app.log: [Errno 13] Permission denied: '/var/log/shopapp/app.log'\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>journalctl -u shopapp -n 5 --no-pager\u003c/code>\u003c/td>\u003ctd>Recent logs.\u003c/td>\u003ctd>\u003ccode>Permission denied: '/var/log/shopapp/app.log'\u003c/code> - names the exact file.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>3. Check ownership\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">ls -l /var/log/shopapp/\n\u003cspan class=\"c\"># -rw-r--r-- 1 root    root       812 ... app.log        &lt;- created by the root test run\u003c/span>\n\u003cspan class=\"c\"># -rw-r--r-- 1 shopapp shopapp  48211 ... app.log.old\u003c/span>\nsystemctl show -p User shopapp          \u003cspan class=\"c\"># User=shopapp\u003c/span>\nsudo -u shopapp test -w /var/log/shopapp/app.log || echo \"shopapp cannot write\"\u003c/code>\u003c/pre>\n\u003cp>The engineer moved the old log away and started \u003ccode>app.py\u003c/code> as root. Python created a new \u003ccode>app.log\u003c/code> owned by root with mode 644. The service runs as \u003ccode>shopapp\u003c/code> and cannot open it.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>ls -l /var/log/shopapp/\u003c/code>\u003c/td>\u003ctd>Owner, group, mode of each file.\u003c/td>\u003ctd>\u003ccode>app.log\u003c/code> is \u003ccode>root:root 644\u003c/code>. Someone ran the app as root during testing, so root created the file.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl show -p User shopapp\u003c/code>\u003c/td>\u003ctd>Which account the unit runs as.\u003c/td>\u003ctd>\u003ccode>shopapp\u003c/code> - not root, so it cannot write a root-owned 644 file.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sudo -u shopapp test -w FILE || echo \"shopapp cannot write\"\u003c/code>\u003c/td>\u003ctd>\u003ccode>test -w\u003c/code> checks write permission as that user; \u003ccode>||\u003c/code> runs echo only if the test fails.\u003c/td>\u003ctd>Quick yes/no proof of the permission problem.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>4. Fix\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo chown shopapp:shopapp /var/log/shopapp/app.log\nsudo systemctl restart shopapp     \u003cspan class=\"c\"># or wait for the next auto-restart\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>Wrong fixes: \u003ccode>chmod 666 app.log\u003c/code> (anyone can forge log lines), \u003ccode>User=root\u003c/code> in the unit.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>chown shopapp:shopapp /var/log/shopapp/app.log\u003c/code>\u003c/td>\u003ctd>Gives the file to the service account.\u003c/td>\u003ctd>Correct fix. \u003ccode>chmod 666\u003c/code> would let anyone forge log lines.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl restart shopapp\u003c/code>\u003c/td>\u003ctd>Restart.\u003c/td>\u003ctd>Skip the restart back-off wait.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>5. Verify\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">systemctl status shopapp --no-pager\ncurl -s localhost/health\nsudo ./labctl.sh check e10\u003c/code>\u003c/pre>\n\u003cp>Next time, debug as the service user with the service's environment:\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo -u shopapp /usr/bin/python3 /opt/shopapp/app.py\n\u003cspan class=\"c\"># or exactly like systemd would run it:\u003c/span>\nsudo systemd-run --pty -p User=shopapp /usr/bin/python3 /opt/shopapp/app.py\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>sudo -u shopapp /usr/bin/python3 /opt/shopapp/app.py\u003c/code>\u003c/td>\u003ctd>Runs the app by hand \u003cstrong>as the service user\u003c/strong>.\u003c/td>\u003ctd>Debug habit: never test as root - that is how this bug was created.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemd-run --pty -p User=shopapp CMD\u003c/code>\u003c/td>\u003ctd>Runs a command in a transient unit with the same properties systemd would give it.\u003c/td>\u003ctd>Reproduces the service environment (user, cgroup, limits) as closely as possible.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>", "root": "\u003cdiv class='tablewrap'>\u003ctable>\u003ctbody>\u003ctr>\u003ctd>Root cause\u003c/td>\u003ctd>Manual run as root created a root-owned \u003ccode>app.log\u003c/code>; service user could not open it (exit 3)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fix\u003c/td>\u003ctd>\u003ccode>chown shopapp:shopapp app.log\u003c/code>, restart\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prevent\u003c/td>\u003ctd>Debug with \u003ccode>sudo -u\u003c/code> / \u003ccode>systemd-run\u003c/code>; create log files from the unit (\u003ccode>LogsDirectory=\u003c/code>) or tmpfiles.d; alert on restart counts\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "explain": "\u003cp>\u003cstrong>Chain of events:\u003c/strong>\u003c/p>\n\u003col>\u003cli>Engineer stopped the service and ran \u003ccode>app.py\u003c/code> \u003cstrong>as root\u003c/strong>\u003c/li>\u003cli>They moved the old log away, so root's run \u003cstrong>created a new \u003ccode>app.log\u003c/code> owned by root (0644)\u003c/strong>\u003c/li>\u003cli>They restarted the service, which runs as \u003cstrong>\u003ccode>shopapp\u003c/code>\u003c/strong>\u003c/li>\u003cli>shopapp cannot open the root-owned log -&gt; prints \u003ccode>FATAL: cannot open log file ... Permission denied\u003c/code> -&gt; exits with status 3\u003c/li>\u003cli>\u003ccode>Restart=\u003c/code> relaunches it -&gt; crash loop -&gt; nginx has no backend -&gt; \u003cstrong>502\u003c/strong>\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>Reading the symptoms:\u003c/strong> \u003ccode>activating (auto-restart)\u003c/code> and a growing restart counter = a crash loop. \u003ccode>status=3\u003c/code> (exit code) plus the FATAL line in \u003ccode>journalctl\u003c/code> give the reason. \u003ccode>ls -l /var/log/shopapp\u003c/code> + \u003ccode>sudo -u shopapp test -w ...\u003c/code> prove it.\u003c/p>\n\u003cp>\u003cstrong>Fix:\u003c/strong> \u003ccode>chown shopapp:shopapp app.log\u003c/code>. Not \u003ccode>chmod 666\u003c/code> (anyone could forge log lines) and not \u003ccode>User=root\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Debug the right way:\u003c/strong> \u003ccode>sudo -u shopapp /usr/bin/python3 /opt/shopapp/app.py\u003c/code> or \u003ccode>systemd-run --pty -p User=shopapp ...\u003c/code>. Better still, let systemd create log files with \u003ccode>LogsDirectory=\u003c/code> or tmpfiles.d so ownership is always right.\u003c/p>", "mcq": [{"q": "Why did shopapp crash-loop after the engineer's manual debug session?", "o": ["Running app.py as root created a root-owned app.log that user shopapp cannot open", "Python was upgraded", "The disk was full", "nginx removed the upstream"], "why": "Files created by root stay root-owned; the service user can't write them."}, {"q": "What is the correct fix?", "o": ["chown shopapp:shopapp /var/log/shopapp/app.log, then restart", "chmod 666 app.log", "Change the unit to User=root", "Delete /var/log/shopapp entirely"], "why": "Restore ownership to the service user; 666 and root are workarounds with side effects."}, {"q": "`systemctl status` shows `activating (auto-restart)` with a rising restart count. This indicates:", "o": ["A crash loop: the process starts, exits, and systemd restarts it", "The service is healthy", "The service is masked", "The service is waiting for a timer"], "why": "Read the exit status and journal to find why it exits."}], "qa": [{"q": "How should the engineer have debugged to avoid causing this?", "a": "Run it as the service user: `sudo -u shopapp /usr/bin/python3 /opt/shopapp/app.py`, or reproduce systemd's environment with `systemd-run --pty -p User=shopapp ...`. Never run the service by hand as root in its real directories."}, {"q": "Why is `chmod 666 app.log` a bad fix?", "a": "Any local user could write or forge log lines (breaking audit trust); it only hides the ownership mistake. The log should be owned by the service user with restrictive mode."}]}, {"id": "m01", "level": "medium", "title": "\"I deleted the file but the disk is still full\"", "time": "20 min", "skills": "inodes vs. names, open file handles, lsof, /proc", "ticket": "\u003cblockquote>\u003cstrong>INC-2001 · P2\u003c/strong>\u003cbr>\nDisk alert on \u003ccode>/var/log/shopapp\u003c/code> (85%+). The on-call engineer found a 200 MB\u003cbr>\n\u003ccode>shipper-spool.log\u003c/code> and ran \u003ccode>rm\u003c/code> on it. The alert did \u003cstrong>not\u003c/strong> clear.\u003cbr>\n\u003ccode>du\u003c/code> shows the directory is almost empty but \u003ccode>df\u003c/code> still shows it full.\u003cbr>\nFree the space. The \u003ccode>log-shipper\u003c/code> service must keep running.\u003c/blockquote>", "success": "\u003cul>\u003cli>\u003ccode>/var/log/shopapp\u003c/code> below 50%\u003c/li>\u003cli>No process holds a deleted spool file\u003c/li>\u003cli>\u003ccode>log-shipper\u003c/code> is still active\u003c/li>\u003c/ul>", "warmup": "\u003cp>The solution uses long command lines. They are just short commands with one flag added at a time. Practise each ladder on any Linux box first (all read-only). Every rung adds \u003cstrong>one\u003c/strong> thing to the rung above - stop at the rung you understand, and read the next one only when you are ready. The lab itself uses the last rung of each ladder.\u003c/p>\n\u003ch4>df - which filesystem is full?\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">df                          \u003cspan class=\"c\"># 1. every filesystem, sizes in 1 KB blocks (hard to read)\u003c/span>\ndf -h                       \u003cspan class=\"c\"># 2. -h = human units (M, G)\u003c/span>\ndf -h /var/log              \u003cspan class=\"c\"># 3. give a path: only the filesystem that holds it\u003c/span>\ndf -i /var/log              \u003cspan class=\"c\"># 4. -i = inodes (file *count*) instead of bytes\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>du - what is using the space?\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">du /var/log                          \u003cspan class=\"c\"># 1. size of every directory below (1 KB blocks)\u003c/span>\ndu -h /var/log                       \u003cspan class=\"c\"># 2. human units\u003c/span>\ndu -sh /var/log                      \u003cspan class=\"c\"># 3. -s = one summary line for the whole tree\u003c/span>\ndu -h --max-depth=1 /var/log         \u003cspan class=\"c\"># 4. one level deep: a size per child\u003c/span>\ndu -xh --max-depth=1 /var/log        \u003cspan class=\"c\"># 5. -x = do not cross into other mounted filesystems\u003c/span>\ndu -xh --max-depth=1 /var/log | sort -h   \u003cspan class=\"c\"># 6. pipe to sort -h: biggest ends up last\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>lsof - who has this file open?\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">lsof                                  \u003cspan class=\"c\"># 1. every open file of every process (huge)\u003c/span>\nlsof /var/log/syslog                  \u003cspan class=\"c\"># 2. only processes that have THIS file open\u003c/span>\nlsof -p 1234                          \u003cspan class=\"c\"># 3. everything process 1234 has open\u003c/span>\nlsof +L1                              \u003cspan class=\"c\"># 4. open files with link count &lt; 1 = deleted but still open\u003c/span>\nlsof -nP +L1 /var/log                 \u003cspan class=\"c\"># 5. -n/-P = no DNS / port-name lookups (faster); limit to one filesystem\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>/proc - the kernel's view of a process\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">cat /proc/self/status | head                    \u003cspan class=\"c\"># 1. 'self' = the cat process itself\u003c/span>\nls /proc/self/fd                                \u003cspan class=\"c\"># 2. its open file descriptors\u003c/span>\nls -l /proc/self/fd                             \u003cspan class=\"c\"># 3. -l shows what each fd points to\u003c/span>\nls /proc/1234/fd | wc -l                        \u003cspan class=\"c\"># 4. how many fds does PID 1234 have?\u003c/span>\ngrep 'open files' /proc/1234/limits             \u003cspan class=\"c\"># 5. its fd limit\u003c/span>\nPID=$(systemctl show -p MainPID --value nginx)  \u003cspan class=\"c\"># 6. get a service's PID into a variable\u003c/span>\nsudo ls /proc/$PID/fd | wc -l                   \u003cspan class=\"c\"># 7. now the same check without typing the number\u003c/span>\u003c/code>\u003c/pre>", "hints": [{"title": "Hint 1 - df vs du", "html": "\u003cp>\u003ccode>du\u003c/code> adds up file \u003cem>names\u003c/em> it can see in directories. \u003ccode>df\u003c/code> asks the filesystem how many blocks are in use. When they disagree a lot, blocks are used by something without a name.\u003c/p>"}, {"title": "Hint 2 - find deleted but open files", "html": "\u003cp>\u003ccode>sudo lsof +L1\u003c/code> lists open files with link count 0 (deleted). Add \u003ccode>-nP\u003c/code> for speed. Or: \u003ccode>sudo find /proc/*/fd -lname '*(deleted)' -printf '%p -&gt; %l\\n' 2&gt;/dev/null\u003c/code>.\u003c/p>"}, {"title": "Hint 3 - two ways to free it", "html": "\u003cp>A) Restart the process that holds it (it closes the fd). B) If you cannot restart, truncate through \u003ccode>/proc\u003c/code>: \u003ccode>: &gt; /proc/&lt;PID&gt;/fd/&lt;FD&gt;\u003c/code>.\u003c/p>"}], "learn": "\u003cul>\u003cli>A file is an \u003cstrong>inode\u003c/strong>. \u003ccode>rm\u003c/code> only removes a \u003cstrong>name\u003c/strong>. Blocks are freed when the last name is gone \u003cstrong>and\u003c/strong> the last open fd is closed.\u003c/li>\u003cli>\u003ccode>df\u003c/code> vs. \u003ccode>du\u003c/code> mismatch -&gt; think deleted-open files (or files hidden under a mount point).\u003c/li>\u003cli>Safe log cleanup on a live system: \u003ccode>truncate -s 0 file\u003c/code> (or \u003ccode>: &gt; file\u003c/code>), not \u003ccode>rm\u003c/code>.\u003c/li>\u003c/ul>", "solution": "\u003cblockquote>Long commands below are built up short-first (\u003ccode># 1.\u003c/code>, \u003ccode># 2.\u003c/code> ...). Each rung adds one flag;\u003cbr>\nthe last rung is what the lab uses. The README \u003cstrong>Warm-up\u003c/strong> explains every flag from scratch.\u003c/blockquote>\n\u003ch3>1. See the mismatch\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">df -h /var/log/shopapp          \u003cspan class=\"c\"># ~90% used\u003c/span>\nsudo du -sh /var/log/shopapp    \u003cspan class=\"c\"># only a few MB\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>df -h /var/log/shopapp\u003c/code>\u003c/td>\u003ctd>Filesystem-level usage (from the superblock counters).\u003c/td>\u003ctd>~90% used.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>du -sh /var/log/shopapp\u003c/code>\u003c/td>\u003ctd>Adds up sizes of \u003cstrong>visible names\u003c/strong> (\u003ccode>-s\u003c/code> summary, \u003ccode>-h\u003c/code> human).\u003c/td>\u003ctd>Only a few MB. \u003ccode>df\u003c/code> &gt;&gt; \u003ccode>du\u003c/code> = space is held by something with \u003cstrong>no name\u003c/strong>: a deleted-but-open file.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>2. Find the hidden space\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo lsof /var/log/shopapp               \u003cspan class=\"c\"># 1. who has files open there\u003c/span>\nsudo lsof +L1 /var/log/shopapp           \u003cspan class=\"c\"># 2. + only files with link count &lt; 1 (deleted)\u003c/span>\nsudo lsof -nP +L1 /var/log/shopapp       \u003cspan class=\"c\"># 3. + no DNS/port-name lookups (faster)\u003c/span>\n\u003cspan class=\"c\"># COMMAND   PID    USER  FD  TYPE DEVICE  SIZE/OFF NLINK NODE NAME\u003c/span>\n\u003cspan class=\"c\"># log-shipp 3120 shopapp  3w  REG    7,0 209715200     0   14 /var/log/shopapp/shipper-spool.log (deleted)\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>NLINK 0\u003c/code> = no names left. \u003ccode>SIZE/OFF\u003c/code> = 200 MB still held by PID 3120 on fd 3.\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">ls -l /proc/3120/fd/\n\u003cspan class=\"c\"># 3 -&gt; /var/log/shopapp/shipper-spool.log (deleted)\u003c/span>\nsystemctl status 3120 --no-pager     \u003cspan class=\"c\"># log-shipper.service\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>lsof -nP +L1 /var/log/shopapp\u003c/code>\u003c/td>\u003ctd>\u003ccode>lsof\u003c/code> lists open files. \u003ccode>+L1\u003c/code> = only files with link count &lt; 1 (deleted). \u003ccode>-n\u003c/code> no DNS, \u003ccode>-P\u003c/code> no port-name lookup.\u003c/td>\u003ctd>Finds \u003ccode>shipper-spool.log (deleted)\u003c/code>, \u003ccode>NLINK 0\u003c/code>, 200 MB held by PID 3120 on fd 3.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ls -l /proc/3120/fd/\u003c/code>\u003c/td>\u003ctd>Every process exposes its open fds as symlinks under \u003ccode>/proc/PID/fd\u003c/code>.\u003c/td>\u003ctd>Second proof, and it gives the \u003cstrong>fd number\u003c/strong> needed for the in-place truncate.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl status 3120\u003c/code>\u003c/td>\u003ctd>Resolves the PID to its unit.\u003c/td>\u003ctd>Tells you \u003cem>who\u003c/em> owns it (\u003ccode>log-shipper.service\u003c/code>) so you know what restart means.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>3a. Fix - restart the holder (preferred when allowed)\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo systemctl restart log-shipper\ndf -h /var/log/shopapp       \u003cspan class=\"c\"># space is back\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>The service opens a new, empty spool file.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>systemctl restart log-shipper\u003c/code>\u003c/td>\u003ctd>Stops the holder (fd closes, blocks freed) and starts a new one.\u003c/td>\u003ctd>Preferred fix: space returns and the service opens a fresh empty spool.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>3b. Fix - when you may NOT restart (e.g. a database)\u003c/h3>\n\u003cp>Truncate the deleted file through the fd. The process keeps running:\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo sh -c ': &gt; /proc/3120/fd/3'\ndf -h /var/log/shopapp\u003c/code>\u003c/pre>\n\u003cp>The fd stays open with size 0. \u003ccode>lsof +L1\u003c/code> still lists it (size 0) until the process restarts. Restart it in the next maintenance window. The checker wants zero deleted spool files, so do 3a at some point.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>sh -c ': &gt; /proc/3120/fd/3'\u003c/code>\u003c/td>\u003ctd>\u003ccode>:\u003c/code> is a no-op, \u003ccode>&gt;\u003c/code> redirect truncates the target to 0 bytes. Goes through the fd symlink to the deleted inode. \u003ccode>sh -c\u003c/code> is needed so \u003cstrong>root\u003c/strong> performs the redirect (plain \u003ccode>sudo : &gt; file\u003c/code> redirects as you).\u003c/td>\u003ctd>Fix when you may \u003cstrong>not\u003c/strong> restart (e.g. a database): frees the space while the process runs.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>df -h\u003c/code> again\u003c/td>\u003ctd>Re-reads usage.\u003c/td>\u003ctd>Space is back.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>", "root": "\u003cdiv class='tablewrap'>\u003ctable>\u003ctbody>\u003ctr>\u003ctd>Root cause\u003c/td>\u003ctd>Spool file deleted with \u003ccode>rm\u003c/code> while log-shipper still had it open; inode and blocks stay allocated\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prevent\u003c/td>\u003ctd>Use \u003ccode>truncate -s 0\u003c/code> for live logs; logrotate with \u003ccode>copytruncate\u003c/code> or a \u003ccode>postrotate\u003c/code> signal; alert on spool size\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "explain": "\u003cp>\u003cstrong>A file is an inode; a name is just a pointer to it.\u003c/strong> \u003ccode>rm\u003c/code> (unlink) deletes a \u003cstrong>directory entry\u003c/strong> and decrements the inode's \u003cem>link count\u003c/em>. The inode and its data blocks are freed only when the link count is 0 \u003cstrong>and\u003c/strong> no process still has the file open.\u003c/p>\n\u003cp>\u003ccode>log-shipper\u003c/code> had \u003ccode>shipper-spool.log\u003c/code> open (fd 3, write). After \u003ccode>rm\u003c/code>: link count 0, but an open file description exists -&gt; 200 MB stays allocated, invisible to any directory listing.\u003c/p>\n\u003cp>\u003cstrong>Why \u003ccode>df\u003c/code> and \u003ccode>du\u003c/code> disagree:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003ccode>du\u003c/code> adds up files it can reach \u003cstrong>by name\u003c/strong>\u003c/li>\u003cli>\u003ccode>df\u003c/code> asks the filesystem how many blocks are in use\u003c/li>\u003c/ul>\n\u003cp>A big gap = space used by something without a name (deleted-but-open files, or data hidden under a mount point).\u003c/p>\n\u003cp>\u003cstrong>Find it:\u003c/strong> \u003ccode>sudo lsof -nP +L1\u003c/code> (open files with link count &lt; 1) or \u003ccode>find /proc/*/fd -lname '*(deleted)'\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Free it:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>restart the holder (closes the fd), or\u003c/li>\u003cli>if you may not restart: \u003ccode>: &gt; /proc/&lt;PID&gt;/fd/&lt;FD&gt;\u003c/code> truncates the deleted file through the fd.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Better habit:\u003c/strong> on a live log use \u003ccode>truncate -s 0 file\u003c/code> instead of \u003ccode>rm\u003c/code>.\u003c/p>", "mcq": [{"q": "What does `rm file` actually remove?", "o": ["A directory entry (name) pointing at the inode", "The inode and its blocks immediately", "Only the file's metadata", "The data blocks only, keeping the name"], "why": "Blocks are freed only after the last name AND the last open handle are gone."}, {"q": "`df` says 90% used, but `du -sh` on the same volume shows a few MB. What should you suspect first?", "o": ["A deleted file still held open by a process (lsof +L1)", "Corrupt superblock", "Swap is full", "The kernel needs a reboot"], "why": "du counts names, df counts blocks; deleted-but-open files are the classic gap."}, {"q": "The holder is a database you must not restart. How do you free the space now?", "o": ["Truncate through its fd: `: > /proc/\u003cPID>/fd/\u003cFD>`", "rm the file again", "Run fsck", "chmod the fd"], "why": "Writing through /proc/PID/fd/N truncates the underlying inode; the process keeps running."}], "qa": [{"q": "Explain to a junior what an inode and a link count are, and why deleting a file may not free space.", "a": "An inode holds the file's metadata and block pointers; directory entries are names that link to it. rm removes one name and lowers the link count. When the count hits 0 AND the last open file descriptor closes, the kernel frees the blocks. A process with the file open keeps the space allocated."}, {"q": "After you truncate through /proc, `lsof +L1` still lists the file and the checker still fails. Why, and what do you do?", "a": "The fd is still open (size now 0); the deleted inode still exists until the process closes it. The checker requires no process to hold a deleted spool file, so restart `log-shipper` in a maintenance window - it then opens a fresh, named file."}]}, {"id": "m02", "level": "medium", "title": "\"No space left on device\" but the disk is empty", "time": "25 min", "skills": "inodes, counting files, find with age filters, cron", "ticket": "\u003cblockquote>\u003cstrong>INC-2002 · P1 · Customer facing\u003c/strong>\u003cbr>\n\u003ccode>curl localhost/health\u003c/code> returns \u003ccode>500 ERROR: [Errno 28] No space left on device\u003c/code>.\u003cbr>\nThe engineer on shift checked \u003ccode>df -h /srv/shopdata\u003c/code> and says it is only ~15% used,\u003cbr>\nso \"it must be an app bug\". Find the real cause and fix it.\u003cbr>\n\u003cstrong>Do not delete sessions active in the last 24 hours\u003c/strong> - customers would lose their carts.\u003c/blockquote>", "success": "\u003cul>\u003cli>\u003ccode>/srv/shopdata\u003c/code> inode use below 50%\u003c/li>\u003cli>All live sessions (newer than 24h) kept\u003c/li>\u003cli>\u003ccode>/health\u003c/code> returns 200\u003c/li>\u003cli>The root cause is fixed, so it does not come back\u003c/li>\u003c/ul>", "warmup": "\u003cp>The solution uses long command lines. They are just short commands with one flag added at a time. Practise each ladder on any Linux box first (all read-only). Every rung adds \u003cstrong>one\u003c/strong> thing to the rung above - stop at the rung you understand, and read the next one only when you are ready. The lab itself uses the last rung of each ladder.\u003c/p>\n\u003ch4>df - which filesystem is full?\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">df                          \u003cspan class=\"c\"># 1. every filesystem, sizes in 1 KB blocks (hard to read)\u003c/span>\ndf -h                       \u003cspan class=\"c\"># 2. -h = human units (M, G)\u003c/span>\ndf -h /var/log              \u003cspan class=\"c\"># 3. give a path: only the filesystem that holds it\u003c/span>\ndf -i /var/log              \u003cspan class=\"c\"># 4. -i = inodes (file *count*) instead of bytes\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>find - search by name, size, age\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">find /var/log                                   \u003cspan class=\"c\"># 1. everything below, one path per line\u003c/span>\nfind /var/log -type f                           \u003cspan class=\"c\"># 2. only regular files (f); d = directories\u003c/span>\nfind /var/log -type f -name '*.log'             \u003cspan class=\"c\"># 3. add a name pattern (quote it!)\u003c/span>\nfind /var/log -type f -size +1M                 \u003cspan class=\"c\"># 4. bigger than 1 MB (+ = more than)\u003c/span>\nfind /var/log -type f -mmin +60                 \u003cspan class=\"c\"># 5. modified more than 60 minutes ago (-60 = less than)\u003c/span>\nfind /var/log -xdev -type f -size +1M           \u003cspan class=\"c\"># 6. -xdev = stay on one filesystem\u003c/span>\nfind /var/log -xdev -type f -size +1M -exec ls -lh {} +   \u003cspan class=\"c\"># 7. run a command on all hits ({} = the files)\u003c/span>\n\u003cspan class=\"c\"># find ... -delete deletes. ALWAYS run it first without -delete, count with | wc -l, then add it.\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>du --inodes - where are the many files?\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">ls /srv/shopdata/sessions | head                 \u003cspan class=\"c\"># 1. look at a few names first\u003c/span>\nls -lt /srv/shopdata/sessions | head             \u003cspan class=\"c\"># 2. -t = newest first\u003c/span>\ndu --inodes /srv/shopdata                        \u003cspan class=\"c\"># 3. count files (inodes) per directory instead of bytes\u003c/span>\ndu --inodes -x /srv/shopdata | sort -n | tail -3 \u003cspan class=\"c\"># 4. biggest file-count last\u003c/span>\u003c/code>\u003c/pre>", "hints": [{"title": "Hint 1 - two kinds of \"space\"", "html": "\u003cp>A filesystem can run out of \u003cstrong>blocks\u003c/strong> (data) or out of \u003cstrong>inodes\u003c/strong> (one per file/dir). \u003ccode>df -h\u003c/code> shows blocks. Which flag shows inodes?\u003c/p>"}, {"title": "Hint 2 - where are all the files?", "html": "\u003cp>\u003ccode>sudo du --inodes -x /srv/shopdata | sort -n | tail\u003c/code> or \u003ccode>sudo find /srv/shopdata -xdev -type f | cut -d/ -f1-4 | sort | uniq -c | sort -n\u003c/code>.\u003c/p>"}, {"title": "Hint 3 - delete by age, safely", "html": "\u003cp>First \u003cstrong>list\u003c/strong> and count: \u003ccode>find ... -mmin +1440 | wc -l\u003c/code>. Then change \u003ccode>-print\u003c/code> to \u003ccode>-delete\u003c/code>. Why did they pile up? Look in \u003ccode>/etc/cron.d/\u003c/code>.\u003c/p>"}], "learn": "\u003cul>\u003cli>ENOSPC can mean no blocks \u003cstrong>or\u003c/strong> no inodes. Always run \u003ccode>df -h\u003c/code> \u003cstrong>and\u003c/strong> \u003ccode>df -i\u003c/code>.\u003c/li>\u003cli>Millions of tiny files (sessions, cache, mail queue, temp files) eat inodes, not bytes.\u003c/li>\u003cli>Always dry-run destructive \u003ccode>find\u003c/code>: list -&gt; count -&gt; then \u003ccode>-delete\u003c/code>.\u003c/li>\u003cli>Fix the cause (the disabled cleanup job), not only the symptom.\u003c/li>\u003c/ul>", "solution": "\u003cblockquote>Long commands below are built up short-first (\u003ccode># 1.\u003c/code>, \u003ccode># 2.\u003c/code> ...). Each rung adds one flag;\u003cbr>\nthe last rung is what the lab uses. The README \u003cstrong>Warm-up\u003c/strong> explains every flag from scratch.\u003c/blockquote>\n\u003ch3>1. Confirm and look at both kinds of space\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">curl -s localhost/health            \u003cspan class=\"c\"># ERROR: [Errno 28] No space left on device\u003c/span>\ndf -h /srv/shopdata                 \u003cspan class=\"c\"># Use% ~15%  -&gt; blocks are fine\u003c/span>\ndf -i /srv/shopdata\n\u003cspan class=\"c\"># Filesystem  Inodes IUsed IFree IUse% Mounted on\u003c/span>\n\u003cspan class=\"c\"># /dev/loop1    4096  4096     0  100% /srv/shopdata    &lt;-- out of inodes\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>curl -s localhost/health\u003c/code>\u003c/td>\u003ctd>Calls the health endpoint.\u003c/td>\u003ctd>\u003ccode>Errno 28 No space left on device\u003c/code> - yet it is not about space in bytes.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>df -h /srv/shopdata\u003c/code>\u003c/td>\u003ctd>Block usage.\u003c/td>\u003ctd>~15% - blocks are fine.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>df -i /srv/shopdata\u003c/code>\u003c/td>\u003ctd>\u003cstrong>Inode\u003c/strong> usage (\u003ccode>-i\u003c/code>).\u003c/td>\u003ctd>100% IUse: filesystem has 4096 inodes and all are used. Every file needs one, regardless of size.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>2. Where are the files?\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo du --inodes /srv/shopdata                          \u003cspan class=\"c\"># 1. file count per directory\u003c/span>\nsudo du --inodes -x /srv/shopdata | sort -n             \u003cspan class=\"c\"># 2. -x one filesystem, sort by count\u003c/span>\nsudo du --inodes -x /srv/shopdata | sort -n | tail -3   \u003cspan class=\"c\"># 3. only the 3 biggest\u003c/span>\n\u003cspan class=\"c\"># 4070  /srv/shopdata/sessions\u003c/span>\nls /srv/shopdata/sessions | head\nls -lt /srv/shopdata/sessions | head      \u003cspan class=\"c\"># newest first: sess_live_* are recent\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>du --inodes -x /srv/shopdata | sort -n | tail -3\u003c/code>\u003c/td>\u003ctd>\u003ccode>--inodes\u003c/code> counts files instead of bytes; \u003ccode>sort -n\u003c/code> numeric; \u003ccode>tail -3\u003c/code> biggest three.\u003c/td>\u003ctd>Finds the directory eating inodes: \u003ccode>sessions\u003c/code> with ~4070.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ls -lt /srv/shopdata/sessions | head\u003c/code>\u003c/td>\u003ctd>Lists newest first (\u003ccode>-t\u003c/code>).\u003c/td>\u003ctd>See that \u003ccode>sess_live_*\u003c/code> are recent and must be kept.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>3. Dry run, then delete only old sessions\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">\u003cspan class=\"c\"># older than 24h (1440 minutes), only regular files named sess_*\u003c/span>\nsudo find /srv/shopdata/sessions -type f                                    \u003cspan class=\"c\"># 1. all files\u003c/span>\nsudo find /srv/shopdata/sessions -type f -name 'sess_*'                     \u003cspan class=\"c\"># 2. + name pattern\u003c/span>\nsudo find /srv/shopdata/sessions -type f -name 'sess_*' -mmin +1440         \u003cspan class=\"c\"># 3. + older than 1440 min (24 h)\u003c/span>\nsudo find /srv/shopdata/sessions -type f -name 'sess_*' -mmin +1440 | wc -l     \u003cspan class=\"c\"># 4. count them (dry run): ~4000\u003c/span>\nsudo find /srv/shopdata/sessions -type f -name 'sess_*' -mmin -1440 | wc -l     \u003cspan class=\"c\"># 40 live\u003c/span>\nsudo find /srv/shopdata/sessions -type f -name 'sess_*' -mmin +1440 -delete\ndf -i /srv/shopdata\ncurl -s localhost/health            \u003cspan class=\"c\"># OK\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>find ... -type f -name 'sess_*' -mmin +1440 | wc -l\u003c/code>\u003c/td>\u003ctd>\u003ccode>-mmin +1440\u003c/code> = modified more than 1440 min (24 h) ago; \u003ccode>wc -l\u003c/code> counts lines.\u003c/td>\u003ctd>\u003cstrong>Dry run\u003c/strong>: count what would be deleted (~4000) before deleting.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>find ... -mmin -1440 | wc -l\u003c/code>\u003c/td>\u003ctd>\u003ccode>-1440\u003c/code> = newer than 24 h.\u003c/td>\u003ctd>Count what is protected (40 live). Both numbers must add up and match expectations.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>find ... -mmin +1440 -delete\u003c/code>\u003c/td>\u003ctd>Same filter, then deletes each match.\u003c/td>\u003ctd>The fix - narrow filter (type, name, age) instead of \u003ccode>rm -rf\u003c/code>. Keep \u003ccode>-delete\u003c/code> \u003cstrong>last\u003c/strong> in the expression.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>4. Why did it happen? Fix the cause\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">ls /etc/cron.d/\ncat /etc/cron.d/shopapp-session-cleanup\n\u003cspan class=\"c\"># #17 * * * * shopapp find ...     &lt;-- commented out (\"DISABLED during migration\")\u003c/span>\nsudo sed -i 's/^#\\(17 \\* \\* \\* \\* shopapp find\\)/\\1/' /etc/cron.d/shopapp-session-cleanup\ncat /etc/cron.d/shopapp-session-cleanup\u003c/code>\u003c/pre>\n\u003cp>cron reads \u003ccode>/etc/cron.d\u003c/code> automatically; no restart needed.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>cat /etc/cron.d/shopapp-session-cleanup\u003c/code>\u003c/td>\u003ctd>Shows the cron job file.\u003c/td>\u003ctd>Root cause: cleanup line is commented out (\"DISABLED during migration\").\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sed -i 's/^#\\(17 \\* \\* \\* \\* shopapp find\\)/\\1/' FILE\u003c/code>\u003c/td>\u003ctd>Removes the leading \u003ccode>#\u003c/code> using a captured group \u003ccode>\\(...\\)\u003c/code> and \u003ccode>\\1\u003c/code>.\u003c/td>\u003ctd>Re-enables the job so inodes do not fill up again. cron rereads \u003ccode>/etc/cron.d\u003c/code> by itself.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>", "root": "\u003cdiv class='tablewrap'>\u003ctable>\u003ctbody>\u003ctr>\u003ctd>Root cause\u003c/td>\u003ctd>Session cleanup cron disabled during a migration and never re-enabled; session files used all 4096 inodes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prevent\u003c/td>\u003ctd>Alert on inode usage (\u003ccode>node_filesystem_files_free\u003c/code>); track \"temporary\" changes in tickets with an end date; size inode count for small-file workloads (\u003ccode>mkfs.ext4 -i\u003c/code> / \u003ccode>-N\u003c/code>) or use XFS (dynamic inodes)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "explain": "\u003cp>\u003cstrong>Two resources hide behind \"No space left on device\" (ENOSPC):\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>blocks\u003c/strong> (bytes of data) - \u003ccode>df -h\u003c/code>\u003c/li>\u003cli>\u003cstrong>inodes\u003c/strong> (one per file or directory) - \u003ccode>df -i\u003c/code>\u003c/li>\u003c/ul>\n\u003cp>ext4 fixes the inode count at \u003ccode>mkfs\u003c/code> time (by a bytes-per-inode ratio). The 128 MB volume had only 4096 inodes; ~4000 tiny session files used them all while data usage stayed at 15%. The engineer's \u003ccode>df -h\u003c/code> was right and irrelevant.\u003c/p>\n\u003cp>\u003cstrong>Find where:\u003c/strong> \u003ccode>du --inodes -x /srv/shopdata | sort -n | tail\u003c/code> or count files per directory.\u003c/p>\n\u003cp>\u003cstrong>Delete safely - dry-run first:\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode class=\"lang-text\">find ... -type f -name 'sess_*' -mmin +1440 | wc -l    \u003cspan class=\"c\"># how many old?\u003c/span>\nfind ... -type f -name 'sess_*' -mmin -1440 | wc -l    \u003cspan class=\"c\"># how many live (must keep)?\u003c/span>\nfind ... -type f -name 'sess_*' -mmin +1440 -delete    \u003cspan class=\"c\"># only now delete\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>-mmin +1440\u003c/code> = modified more than 1440 minutes (24 h) ago.\u003c/p>\n\u003cp>\u003cstrong>Why it happened:\u003c/strong> the cleanup cron in \u003ccode>/etc/cron.d/shopapp-session-cleanup\u003c/code> was commented out \"during migration\" and never restored. Deleting files without re-enabling it just resets the clock. Prevention: alert on inode usage, size inodes for small-file workloads (\u003ccode>mkfs.ext4 -i\u003c/code>/\u003ccode>-N\u003c/code>) or use XFS (dynamic inodes).\u003c/p>", "mcq": [{"q": "`/health` returns `No space left on device`, but `df -h` shows 15% used. What next?", "o": ["df -i - the filesystem may be out of inodes", "Reboot", "Increase swap", "Run fsck on /"], "why": "ENOSPC = no blocks OR no inodes. Always check both."}, {"q": "What is the safe way to delete only sessions older than 24 hours?", "o": ["Run find with the exact criteria and wc -l first, then repeat with -delete", "rm -rf /srv/shopdata/sessions/*", "find ... -mmin -1440 -delete", "Delete files by size"], "why": "List and count before destroying; `-mmin +1440` selects old files, `-1440` would select the live ones."}, {"q": "Which action fixes the ROOT cause so the problem does not return?", "o": ["Re-enable the disabled session-cleanup cron job", "Delete all sessions again next week", "Mount the volume read-only", "Increase `df -h` free space"], "why": "A migration disabled the cleanup job; without it the files pile up again."}], "qa": [{"q": "Why must you not simply delete all session files?", "a": "Sessions newer than 24 hours belong to active customers (carts); deleting them is a business-visible outage. The ticket demands keeping them, so filter by age, verify counts first, and delete only the old ones."}, {"q": "What would you do to prevent inode exhaustion for a small-file workload?", "a": "Alert on inode usage (e.g. > 80%), keep scheduled cleanup jobs and track 'temporary' changes with an end date, create the filesystem with more inodes (mkfs.ext4 -i or -N) or choose XFS/btrfs with dynamic inodes, and avoid millions of tiny files where possible."}]}, {"id": "m03", "level": "medium", "title": "High CPU that keeps coming back", "time": "25 min", "skills": "load average, top/ps, process trees, cron", "ticket": "\u003cblockquote>\u003cstrong>INC-2003 · P2\u003c/strong>\u003cbr>\nServer is slow, load average is high, CPU is pinned at 100%.\u003cbr>\nThe night shift \"killed the process\" twice. Each time the CPU went back to\u003cbr>\n100% about a minute later. Find what it is, why it comes back, and stop it for good.\u003cbr>\nThe search team owns the job - leave a note for them, do not delete their script.\u003c/blockquote>", "success": "\u003cul>\u003cli>The CPU hog is not running\u003c/li>\u003cli>Nothing will start it again\u003c/li>\u003cli>shopapp still healthy\u003c/li>\u003c/ul>", "warmup": "\u003cp>The solution uses long command lines. They are just short commands with one flag added at a time. Practise each ladder on any Linux box first (all read-only). Every rung adds \u003cstrong>one\u003c/strong> thing to the rung above - stop at the rung you understand, and read the next one only when you are ready. The lab itself uses the last rung of each ladder.\u003c/p>\n\u003ch4>uptime / top - CPU\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">uptime                  \u003cspan class=\"c\"># 1. load average: 1, 5, 15 min. Compare to the CPU count:\u003c/span>\nnproc                   \u003cspan class=\"c\"># 2. number of CPUs. load 2.0 on 2 CPUs = fully busy\u003c/span>\ntop                     \u003cspan class=\"c\"># 3. live view. P = sort by CPU, M = by memory, 1 = per-CPU, q = quit\u003c/span>\ntop -bn1 | head -5      \u003cspan class=\"c\"># 4. -b = batch (plain text), -n1 = one snapshot -&gt; good for logs and pipes\u003c/span>\n\u003cspan class=\"c\"># CPU line: us=user sy=kernel ni=niced id=idle wa=waiting for disk\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>ps / pgrep / pstree - look at processes\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">ps                                         \u003cspan class=\"c\"># 1. only your shell\u003c/span>\nps -ef                                     \u003cspan class=\"c\"># 2. every process, full format (PID, PPID, command)\u003c/span>\nps -fp 1234                                \u003cspan class=\"c\"># 3. just one PID\u003c/span>\nps -eo pid,ppid,user,%cpu,%mem,cmd         \u003cspan class=\"c\"># 4. -o = choose your own columns\u003c/span>\nps -eo pid,%cpu,cmd --sort=-%cpu | head    \u003cspan class=\"c\"># 5. sort by CPU, highest first (- = descending), top 10\u003c/span>\npgrep -af nginx                            \u003cspan class=\"c\"># 6. find PIDs by name (-a = show full command, -f = match whole command line)\u003c/span>\npstree -ps 1234                            \u003cspan class=\"c\"># 7. parent chain of one PID: who started it?\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>grep - find text\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">grep error file                 \u003cspan class=\"c\"># 1. lines containing 'error'\u003c/span>\ngrep -i error file              \u003cspan class=\"c\"># 2. -i = ignore case\u003c/span>\ngrep -n error file              \u003cspan class=\"c\"># 3. -n = show line numbers\u003c/span>\ngrep -v debug file              \u003cspan class=\"c\"># 4. -v = invert: lines WITHOUT 'debug'\u003c/span>\ngrep -r error /etc/             \u003cspan class=\"c\"># 5. -r = search all files below a directory\u003c/span>\ngrep -E 'oom|killed' file       \u003cspan class=\"c\"># 6. -E = extended regex: 'oom' OR 'killed'\u003c/span>\ndmesg | grep -i oom             \u003cspan class=\"c\"># 7. most used form: filter another command's output\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>cron - is my job running?\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">ls -l /etc/cron.d/                              \u003cspan class=\"c\"># 1. system cron files: names, owner, mode\u003c/span>\ncat /etc/cron.d/NAME                            \u003cspan class=\"c\"># 2. format: min hour day month weekday USER command\u003c/span>\njournalctl -u cron --since \"10 min ago\"         \u003cspan class=\"c\"># 3. every run, and every complaint\u003c/span>\nsystemctl list-timers                           \u003cspan class=\"c\"># 4. the systemd equivalent\u003c/span>\nsudo /path/to/script                            \u003cspan class=\"c\"># 5. run the job by hand to see its real error\u003c/span>\u003c/code>\u003c/pre>", "hints": [{"title": "Hint 1 - who is using CPU?", "html": "\u003cp>\u003ccode>uptime\u003c/code> (load vs. CPU count from \u003ccode>nproc\u003c/code>), then \u003ccode>top\u003c/code> (press \u003ccode>P\u003c/code> to sort by CPU, \u003ccode>1\u003c/code> for per-CPU), or \u003ccode>ps -eo pid,ppid,user,ni,%cpu,etime,cmd --sort=-%cpu | head\u003c/code>.\u003c/p>"}, {"title": "Hint 2 - who started it?", "html": "\u003cp>Look at the parent PID chain: \u003ccode>pstree -ps &lt;PID&gt;\u003c/code>. What is at the top? \u003ccode>systemctl status &lt;PID&gt;\u003c/code> also shows the unit (cgroup) it belongs to.\u003c/p>"}, {"title": "Hint 3 - where is it scheduled?", "html": "\u003cp>\u003ccode>grep -r reindex /etc/cron* /var/spool/cron 2&gt;/dev/null\u003c/code> and \u003ccode>systemctl list-timers\u003c/code>. \u003ccode>journalctl -u cron --since \"10 min ago\"\u003c/code> shows every cron run.\u003c/p>"}], "learn": "\u003cul>\u003cli>Load average = runnable (+ uninterruptible) tasks. Compare it to \u003ccode>nproc\u003c/code>.\u003c/li>\u003cli>Killing a PID is not a fix if a scheduler (cron, systemd timer, supervisor, k8s) restarts it.\u003c/li>\u003cli>\u003ccode>pstree -ps\u003c/code> and \u003ccode>systemctl status &lt;PID&gt;\u003c/code> answer \"who started this?\".\u003c/li>\u003cli>Disable (comment out) and leave a note instead of deleting other teams' work.\u003c/li>\u003c/ul>", "solution": "\u003cblockquote>Long commands below are built up short-first (\u003ccode># 1.\u003c/code>, \u003ccode># 2.\u003c/code> ...). Each rung adds one flag;\u003cbr>\nthe last rung is what the lab uses. The README \u003cstrong>Warm-up\u003c/strong> explains every flag from scratch.\u003c/blockquote>\n\u003ch3>1. Size the problem\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">uptime            \u003cspan class=\"c\"># load average: 2.10, 1.80, 1.05   (with nproc = 2 -&gt; fully busy)\u003c/span>\nnproc\ntop -o %CPU       \u003cspan class=\"c\"># python3 processes at ~100% each\u003c/span>\nps -ef                                                    \u003cspan class=\"c\"># 1. all processes\u003c/span>\nps -eo pid,ppid,user,%cpu,cmd                             \u003cspan class=\"c\"># 2. choose columns\u003c/span>\nps -eo pid,ppid,user,%cpu,cmd --sort=-%cpu                \u003cspan class=\"c\"># 3. + highest CPU first\u003c/span>\nps -eo pid,ppid,user,ni,%cpu,etime,cmd --sort=-%cpu | head -5   \u003cspan class=\"c\"># 4. + nice value, run time, only top 5\u003c/span>\n\u003cspan class=\"c\">#  PID  PPID USER NI %CPU ELAPSED CMD\u003c/span>\n\u003cspan class=\"c\"># 4102  4100 root  0 99.5   01:12 /usr/bin/python3 /usr/local/bin/shopapp-reindex\u003c/span>\n\u003cspan class=\"c\"># 4103  4100 root  0 99.1   01:12 /usr/bin/python3 /usr/local/bin/shopapp-reindex\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>uptime\u003c/code>\u003c/td>\u003ctd>Load averages for 1/5/15 min.\u003c/td>\u003ctd>Load 2.1 on 2 CPUs = fully busy.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>nproc\u003c/code>\u003c/td>\u003ctd>Number of CPUs.\u003c/td>\u003ctd>Load only makes sense relative to CPU count.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>top -o %CPU\u003c/code>\u003c/td>\u003ctd>Live process view sorted by CPU.\u003c/td>\u003ctd>Two python3 processes at ~100% each.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ps -eo pid,ppid,user,ni,%cpu,etime,cmd --sort=-%cpu | head -5\u003c/code>\u003c/td>\u003ctd>\u003ccode>-e\u003c/code> all processes, \u003ccode>-o\u003c/code> choose columns, \u003ccode>--sort=-%cpu\u003c/code> highest first.\u003c/td>\u003ctd>Static snapshot with PPID (who started it), NI (priority) and ELAPSED (how long).\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>2. Who started it?\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">pstree -ps 4102\n\u003cspan class=\"c\"># systemd(1)---cron(650)---cron(4098)---sh(4099)---flock(4100)---python3(4101)---python3(4102)\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>(The very first copy was started by hand by the lab, so it may show \u003ccode>systemd(1)---flock\u003c/code>. After you kill it, the next copy clearly comes from cron.)\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">grep -r reindex /etc/cron* /var/spool/cron 2&gt;/dev/null\n\u003cspan class=\"c\"># /etc/cron.d/shopapp-reindex:* * * * * root /usr/bin/flock -n ... /usr/local/bin/shopapp-reindex\u003c/span>\njournalctl -u cron --since \"5 min ago\" | grep reindex\u003c/code>\u003c/pre>\n\u003cp>Every minute cron tries to start it; \u003ccode>flock -n\u003c/code> only blocks duplicates. Kill it -&gt; lock free -&gt; cron starts it again.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>pstree -ps 4102\u003c/code>\u003c/td>\u003ctd>Shows the process ancestry (\u003ccode>-p\u003c/code> PIDs, \u003ccode>-s\u003c/code> parents of that PID).\u003c/td>\u003ctd>Answers \u003cem>who keeps starting it\u003c/em>: \u003ccode>cron -&gt; sh -&gt; flock -&gt; python3\u003c/code>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>grep -r reindex /etc/cron* /var/spool/cron 2&gt;/dev/null\u003c/code>\u003c/td>\u003ctd>Search all cron locations; hide permission errors.\u003c/td>\u003ctd>Finds \u003ccode>/etc/cron.d/shopapp-reindex\u003c/code>, the scheduler.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>journalctl -u cron --since \"5 min ago\" | grep reindex\u003c/code>\u003c/td>\u003ctd>cron's own log.\u003c/td>\u003ctd>Proves cron launches it every minute.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>3. Fix - in the right order\u003c/h3>\n\u003cp>Disable the scheduler \u003cstrong>first\u003c/strong>, then kill:\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo sed -i 's/^\\* \\* \\* \\* \\* root/# DISABLED INC-2003 runaway CPU, see ticket\\n#* * * * * root/' /etc/cron.d/shopapp-reindex\ncat /etc/cron.d/shopapp-reindex\npgrep -af shopapp-reindex                       \u003cspan class=\"c\"># ALWAYS look before pkill -f\u003c/span>\npgrep -af shopapp-reindex                                      \u003cspan class=\"c\"># 1. LOOK first: which processes match?\u003c/span>\nsudo pkill -f '^/usr/bin/python3 /usr/local/bin/shopapp-reindex'   \u003cspan class=\"c\"># 2. kill exactly those (^ = match from the start of the command line)\u003c/span>\nsleep 2; pgrep -af shopapp-reindex || echo \"gone\"\u003c/code>\u003c/pre>\n\u003cp>Why the \u003ccode>^\u003c/code> anchor? \u003ccode>pkill -f\u003c/code> matches the whole command line of \u003cstrong>every\u003c/strong> process. Without the anchor, the pattern also matches \u003ccode>sudo pkill -f /usr/local/bin/...\u003c/code> itself (its parent \u003ccode>sudo\u003c/code> has the same text in its command line) and can kill your own command, or other things such as an editor that has the script open.\u003c/p>\n\u003cp>Wait 2 minutes and check again: it must not come back. Watch load drop with \u003ccode>uptime\u003c/code>.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>sed -i 's/^\\* \\* \\* \\* \\* root/# DISABLED INC-2003 .../' FILE\u003c/code>\u003c/td>\u003ctd>Comments out the job and leaves a reason.\u003c/td>\u003ctd>\u003cstrong>Disable the scheduler first\u003c/strong>, otherwise killing the process just makes cron respawn it.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>pgrep -af shopapp-reindex\u003c/code>\u003c/td>\u003ctd>Lists matching PIDs (\u003ccode>-a\u003c/code> with command line, \u003ccode>-f\u003c/code> match full command line).\u003c/td>\u003ctd>\u003cstrong>Always look before you kill\u003c/strong> - see exactly what the pattern hits.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>pkill -f '^/usr/bin/python3 /usr/local/bin/shopapp-reindex'\u003c/code>\u003c/td>\u003ctd>Signals every process whose command line matches the regex. \u003ccode>^\u003c/code> anchors to the start.\u003c/td>\u003ctd>Without \u003ccode>^\u003c/code> it also matches your own \u003ccode>sudo pkill ...\u003c/code> command line (which contains the same text).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sleep 2; pgrep -af ... || echo \"gone\"\u003c/code>\u003c/td>\u003ctd>Wait, re-check.\u003c/td>\u003ctd>Confirms the kill worked; wait 2 minutes to confirm it does not respawn.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>4. Hand off\u003c/h3>\n\u003cp>Tell the search team: retry loop with no sleep/backoff and no max attempts burns all CPUs. They should add backoff, run it with \u003ccode>nice -n 10\u003c/code>, or as a systemd timer with \u003ccode>CPUQuota=\u003c/code>.\u003c/p>", "root": "\u003cdiv class='tablewrap'>\u003ctable>\u003ctbody>\u003ctr>\u003ctd>Root cause\u003c/td>\u003ctd>Reindex job busy-loops on retry; cron restarts it every minute\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prevent\u003c/td>\u003ctd>Backoff + max retries; limit batch jobs with \u003ccode>nice\u003c/code>/\u003ccode>CPUQuota\u003c/code>; alert on load &gt; nproc for 10 min\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "explain": "\u003cp>\u003cstrong>Load average\u003c/strong> = average number of tasks that are runnable \u003cstrong>or\u003c/strong> in uninterruptible sleep. Compare it with the CPU count: load 2.1 on \u003ccode>nproc\u003c/code> = 2 means the machine is fully busy.\u003c/p>\n\u003cp>\u003cstrong>Find the hog:\u003c/strong> \u003ccode>top\u003c/code> (press \u003ccode>P\u003c/code>), or \u003ccode>ps -eo pid,ppid,user,ni,%cpu,etime,cmd --sort=-%cpu | head\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Who started it:\u003c/strong> \u003ccode>pstree -ps &lt;PID&gt;\u003c/code> and \u003ccode>systemctl status &lt;PID&gt;\u003c/code>. Here the chain is \u003ccode>cron -&gt; sh -&gt; flock -&gt; python3\u003c/code>. \u003ccode>grep -r reindex /etc/cron* /var/spool/cron\u003c/code> finds the schedule: \u003ccode>* * * * * root flock -n ... shopapp-reindex\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Why killing fails:\u003c/strong> \u003ccode>flock -n\u003c/code> only prevents \u003cem>duplicates\u003c/em>. Kill the running copy -&gt; lock is free -&gt; next minute cron starts a new one.\u003c/p>\n\u003cp>\u003cstrong>Correct order:\u003c/strong>\u003c/p>\n\u003col>\u003cli>\u003cstrong>Disable the scheduler first\u003c/strong> (comment the cron line, add a note with the ticket number)\u003c/li>\u003cli>then kill the process (\u003ccode>pgrep -af\u003c/code> first, then an anchored \u003ccode>pkill -f '^...'\u003c/code>)\u003c/li>\u003cli>wait 2+ minutes and confirm it does not return\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>Why anchor \u003ccode>pkill -f\u003c/code>?\u003c/strong> \u003ccode>-f\u003c/code> matches the whole command line of every process - including your own \u003ccode>sudo pkill -f ...\u003c/code>, which contains the same text.\u003c/p>\n\u003cp>Hand off to the owning team (retry loop with no backoff); do not delete their script.\u003c/p>", "mcq": [{"q": "Load average is 2.10 on a host with 2 CPUs. What does that mean?", "o": ["The CPUs are roughly fully utilised", "The host is idle", "The disk is saturated", "There is a memory leak"], "why": "Compare load to nproc: load ~= nproc is full utilisation."}, {"q": "Why did the CPU hog return a minute after it was killed?", "o": ["cron starts it every minute; flock -n only blocks duplicate runs", "The kernel restarts killed processes", "systemd's OOM killer", "The disk was full"], "why": "A scheduler (cron, timer, supervisor) respawns it. Remove the trigger, not just the process."}, {"q": "What is the correct order to stop the job for good?", "o": ["Disable the cron entry, then kill the process, then verify it stays gone", "Kill the process, then disable cron", "Reboot the host", "Delete the script"], "why": "If you kill first, cron may immediately start another copy."}], "qa": [{"q": "What is the danger of `pkill -f reindex` and how do you make it safer?", "a": "-f matches the full command line of ALL processes, so the pattern can also match your own sudo/pkill command or other tools (an editor with the script open). Run `pgrep -af` first, anchor the pattern (`^/usr/bin/python3 /usr/local/bin/shopapp-reindex`), and prefer stopping the owning unit/scheduler."}, {"q": "List the commands that answer 'who started this process?'", "a": "`pstree -ps \u003cPID>` (parent chain), `ps -o pid,ppid,user,etime,cmd -p \u003cPID>`, `systemctl status \u003cPID>` (unit/cgroup), `journalctl -u cron` (cron runs), `grep -r \u003cname> /etc/cron* /var/spool/cron`, `systemctl list-timers`."}]}, {"id": "m04", "level": "medium", "title": "Service keeps restarting (OOM killer)", "time": "25 min", "skills": "memory, cgroups, OOM killer, kernel log, systemd", "ticket": "\u003cblockquote>\u003cstrong>INC-2004 · P3\u003c/strong>\u003cbr>\n\u003ccode>cache-warmer.service\u003c/code> restarts every few seconds. Product pages are slow because the cache\u003cbr>\nis always cold. Nobody changed the code. There was a load test (LT-88) last week.\u003cbr>\nFind why it dies and stabilise it. Do \u003cstrong>not\u003c/strong> remove the memory limit - it protects the host.\u003c/blockquote>", "success": "\u003cul>\u003cli>cache-warmer stays up (no restarts for 20s)\u003c/li>\u003cli>The memory limit on the unit is still in place\u003c/li>\u003cli>The real cause is fixed\u003c/li>\u003c/ul>", "warmup": "\u003cp>The solution uses long command lines. They are just short commands with one flag added at a time. Practise each ladder on any Linux box first (all read-only). Every rung adds \u003cstrong>one\u003c/strong> thing to the rung above - stop at the rung you understand, and read the next one only when you are ready. The lab itself uses the last rung of each ladder.\u003c/p>\n\u003ch4>systemctl + journalctl - service state and logs\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">systemctl status nginx                          \u003cspan class=\"c\"># 1. state, last exit code, last log lines\u003c/span>\nsystemctl is-active nginx                       \u003cspan class=\"c\"># 2. one word: active / failed / inactive\u003c/span>\njournalctl -u nginx                             \u003cspan class=\"c\"># 3. the whole log of one unit (-u = unit)\u003c/span>\njournalctl -u nginx -n 20                       \u003cspan class=\"c\"># 4. only the last 20 lines\u003c/span>\njournalctl -u nginx -n 20 --no-pager            \u003cspan class=\"c\"># 5. print straight to the terminal (no less)\u003c/span>\njournalctl -u nginx --since \"10 min ago\"        \u003cspan class=\"c\"># 6. time window instead of line count\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>systemctl show / cat - ask systemd for facts\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">systemctl cat nginx                              \u003cspan class=\"c\"># 1. the unit file(s) systemd really uses, incl. drop-ins\u003c/span>\nsystemctl show nginx                             \u003cspan class=\"c\"># 2. every property (long)\u003c/span>\nsystemctl show -p User nginx                     \u003cspan class=\"c\"># 3. -p = just one property\u003c/span>\nsystemctl show -p User -p MainPID nginx          \u003cspan class=\"c\"># 4. several\u003c/span>\nsystemctl show -p MainPID --value nginx          \u003cspan class=\"c\"># 5. --value = print only the value (for scripts)\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>dmesg / journalctl -k - the kernel's messages\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">dmesg                           \u003cspan class=\"c\"># 1. kernel ring buffer (needs sudo on some systems)\u003c/span>\ndmesg -T                        \u003cspan class=\"c\"># 2. -T = readable timestamps\u003c/span>\nsudo dmesg -T | tail -5         \u003cspan class=\"c\"># 3. only the newest lines\u003c/span>\njournalctl -k --since \"1 hour ago\"    \u003cspan class=\"c\"># 4. kernel log from the journal, time window\u003c/span>\njournalctl -k | grep -iE 'oom|ext4'   \u003cspan class=\"c\"># 5. filter for what you suspect\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>free / vmstat - memory and swap\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">free                    \u003cspan class=\"c\"># 1. memory in KB\u003c/span>\nfree -m                 \u003cspan class=\"c\"># 2. in MB; read the 'available' column, not 'free'\u003c/span>\nvmstat                  \u003cspan class=\"c\"># 3. one summary line since boot\u003c/span>\nvmstat 1 5              \u003cspan class=\"c\"># 4. a line per second, 5 times (ignore the first line)\u003c/span>\n\u003cspan class=\"c\"># columns: r=runnable b=blocked si/so=swap in/out wa=CPU waiting for disk. si/so &gt; 0 for long = swapping.\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>sed - edit text from the command line\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">sed 's/old/new/' file           \u003cspan class=\"c\"># 1. print file with the first 'old' on each line replaced (file unchanged)\u003c/span>\nsed 's/old/new/g' file          \u003cspan class=\"c\"># 2. g = every match on the line\u003c/span>\nsed -n '3p' file                \u003cspan class=\"c\"># 3. -n + p = print only line 3\u003c/span>\nsed '/old/d' file               \u003cspan class=\"c\"># 4. d = delete lines that match (still only printed)\u003c/span>\nsed -i 's/old/new/' file        \u003cspan class=\"c\"># 5. -i = edit the file IN PLACE (make a copy first: cp file file.bak)\u003c/span>\nsed -i 's#/a/b#/c/d#' file      \u003cspan class=\"c\"># 6. any delimiter works: # avoids escaping / in paths\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>watch - repeat a command\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">systemctl show -p MemoryCurrent cache-warmer                        \u003cspan class=\"c\"># 1. one reading\u003c/span>\nwatch -n1 'systemctl show -p MemoryCurrent cache-warmer'            \u003cspan class=\"c\"># 2. every second; Ctrl-C to stop\u003c/span>\n\u003cspan class=\"c\"># a straight line going up = a leak; flat = healthy\u003c/span>\u003c/code>\u003c/pre>", "hints": [{"title": "Hint 1 - how does it die?", "html": "\u003cp>\u003ccode>systemctl status cache-warmer\u003c/code> - look at \u003ccode>Main PID\u003c/code>, the restart counter and \u003ccode>Result:\u003c/code>. \u003ccode>journalctl -u cache-warmer -n 30\u003c/code>.\u003c/p>"}, {"title": "Hint 2 - who killed it?", "html": "\u003cp>The kernel logs every OOM kill: \u003ccode>journalctl -k | grep -i -E 'oom|killed process'\u003c/code> (or \u003ccode>sudo dmesg -T | grep -i oom\u003c/code>). Is it a \u003cem>global\u003c/em> OOM or a \u003cem>cgroup\u003c/em> (memcg) OOM?\u003c/p>"}, {"title": "Hint 3 - why does it grow?", "html": "\u003cp>Watch it grow: \u003ccode>watch -n1 'systemctl show -p MemoryCurrent cache-warmer'\u003c/code> or \u003ccode>ps -o pid,rss,cmd -C python3\u003c/code>. The program prints its config at start - read the log and \u003ccode>/etc/cache-warmer.conf\u003c/code>.\u003c/p>"}], "learn": "\u003cul>\u003cli>\u003ccode>Result: oom-kill\u003c/code> and \u003ccode>Killed process ... (oom-kill / memcg)\u003c/code> in the kernel log.\u003c/li>\u003cli>cgroup limits (\u003ccode>MemoryMax=\u003c/code>) produce OOM kills even when \u003ccode>free -m\u003c/code> shows plenty of RAM.\u003c/li>\u003cli>RSS growing in a straight line = leak or unbounded cache. Find the bound, don't raise the limit blindly.\u003c/li>\u003cli>\"Nobody changed the code\" - but config changes are changes too.\u003c/li>\u003c/ul>", "solution": "\u003cblockquote>Long commands below are built up short-first (\u003ccode># 1.\u003c/code>, \u003ccode># 2.\u003c/code> ...). Each rung adds one flag;\u003cbr>\nthe last rung is what the lab uses. The README \u003cstrong>Warm-up\u003c/strong> explains every flag from scratch.\u003c/blockquote>\n\u003ch3>1. How does it die?\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">systemctl status cache-warmer --no-pager\n\u003cspan class=\"c\"># Active: activating (auto-restart) (Result: oom-kill)\u003c/span>\nsystemctl show -p NRestarts cache-warmer    \u003cspan class=\"c\"># NRestarts=7 and climbing\u003c/span>\njournalctl -u cache-warmer -n 20 --no-pager\n\u003cspan class=\"c\"># cache-warmer starting, max_mb=0 (UNLIMITED)\u003c/span>\n\u003cspan class=\"c\"># cache size 150 MB\u003c/span>\n\u003cspan class=\"c\"># cache-warmer.service: A process of this unit has been killed by the OOM killer.\u003c/span>\n\u003cspan class=\"c\"># cache-warmer.service: Failed with result 'oom-kill'.\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>systemctl status cache-warmer\u003c/code>\u003c/td>\u003ctd>State and result.\u003c/td>\u003ctd>\u003ccode>Result: oom-kill\u003c/code> - killed by the OOM killer, not a normal crash.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl show -p NRestarts cache-warmer\u003c/code>\u003c/td>\u003ctd>Counter of auto-restarts.\u003c/td>\u003ctd>Proof of a crash loop and how fast it climbs.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>journalctl -u cache-warmer -n 20\u003c/code>\u003c/td>\u003ctd>Unit log.\u003c/td>\u003ctd>Shows \u003ccode>max_mb=0 (UNLIMITED)\u003c/code> and the oom-kill message.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>2. Kernel view\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">journalctl -k                                          \u003cspan class=\"c\"># 1. kernel messages\u003c/span>\njournalctl -k --since \"5 min ago\"                      \u003cspan class=\"c\"># 2. recent only\u003c/span>\njournalctl -k --since \"5 min ago\" | grep -i oom        \u003cspan class=\"c\"># 3. only OOM lines\u003c/span>\njournalctl -k --since \"5 min ago\" | grep -iE 'oom|killed process'   \u003cspan class=\"c\"># 4. -E = this OR that\u003c/span>\n\u003cspan class=\"c\"># Memory cgroup out of memory: Killed process 5120 (python3) total-vm:..., anon-rss:163000kB ...\u003c/span>\n\u003cspan class=\"c\">#   oom-kill:constraint=CONSTRAINT_MEMCG ... task_memcg=/system.slice/cache-warmer.service\u003c/span>\nfree -m             \u003cspan class=\"c\"># host has lots of free RAM -&gt; this is a cgroup limit, not the host\u003c/span>\nsystemctl show -p MemoryMax cache-warmer    \u003cspan class=\"c\"># 167772160 (160M)\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>CONSTRAINT_MEMCG\u003c/code> = the unit hit \u003cstrong>its own\u003c/strong> limit.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u0
