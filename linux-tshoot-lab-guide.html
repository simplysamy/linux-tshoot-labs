<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linux Troubleshooting Lab - Study Guide</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#f0f2f5; --text:#1b2230; --muted:#5c6677; --line:#dfe3ea;
  --accent:#0d7a6b; --accent-soft:#d9f1ec; --accent-ink:#ffffff;
  --easy:#1f8a4c; --easy-soft:#dcf3e5; --medium:#b36b00; --medium-soft:#fdecc8; --hard:#c0392b; --hard-soft:#fbdcd8;
  --good:#1f8a4c; --good-soft:#dcf3e5; --bad:#c0392b; --bad-soft:#fbdcd8;
  --code-bg:#0f1720; --code-fg:#d6e2f0; --code-c:#6f8aa3; --inline-code:#eaeef4;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05);
}
html[data-theme=dark]{
  --bg:#0e1319; --panel:#151c24; --panel2:#1b242e; --text:#e4eaf1; --muted:#93a1b3; --line:#27323f;
  --accent:#3cc3ad; --accent-soft:#12352f; --accent-ink:#06211c;
  --easy:#46c37b; --easy-soft:#13321f; --medium:#e3a53a; --medium-soft:#3a2b0d; --hard:#ef6f61; --hard-soft:#3b1814;
  --good:#46c37b; --good-soft:#13321f; --bad:#ef6f61; --bad-soft:#3b1814;
  --code-bg:#0a0f14; --code-fg:#d6e2f0; --code-c:#6f8aa3; --inline-code:#222d39;
  --shadow:none;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
code,pre{font-family:ui-monospace,"Cascadia Code",SFMono-Regular,Menlo,Consolas,monospace}
code{background:var(--inline-code);padding:.1em .35em;border-radius:5px;font-size:.88em}
pre{background:var(--code-bg);color:var(--code-fg);padding:14px 16px;border-radius:10px;overflow:auto;font-size:13px;line-height:1.5;position:relative;margin:12px 0}
pre code{background:none;padding:0;font-size:inherit;color:inherit}
pre .c{color:var(--code-c)}
.copy{position:absolute;top:8px;right:8px;background:#ffffff1a;color:#cfd9e5;border:0;border-radius:6px;padding:2px 9px;font-size:12px;cursor:pointer;opacity:0;transition:.15s}
pre:hover .copy{opacity:1}
.layout{display:flex;min-height:100vh}
/* sidebar */
.side{width:300px;flex:none;background:var(--panel);border-right:1px solid var(--line);height:100vh;position:sticky;top:0;display:flex;flex-direction:column}
.side-head{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;text-decoration:none;color:var(--text)}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:ui-monospace,monospace;font-weight:700;font-size:13px}
.search{margin-top:12px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);font:inherit;font-size:13.5px}
.search:focus{outline:2px solid var(--accent);outline-offset:0}
.nav{overflow:auto;padding:8px 8px 20px;flex:1}
.nav h4{margin:14px 10px 4px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.nav a{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;color:var(--text);text-decoration:none;font-size:13.5px;line-height:1.35}
.nav a:hover{background:var(--panel2)}
.nav a.active{background:var(--accent-soft);color:var(--text);font-weight:600}
.nav .id{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--muted);width:30px;flex:none}
.nav .lvl{width:8px;height:8px;border-radius:50%;flex:none}
.lvl.easy{background:var(--easy)}.lvl.medium{background:var(--medium)}.lvl.hard{background:var(--hard)}
.nav .t{flex:1;min-width:0}
.score{font-size:11px;font-weight:600;border-radius:999px;padding:1px 7px;background:var(--panel2);color:var(--muted);flex:none}
.score.perfect{background:var(--good-soft);color:var(--good)}
.score.partial{background:var(--medium-soft);color:var(--medium)}
.side-foot{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:6px 12px;font:inherit;font-size:13.5px;cursor:pointer}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:3px 10px;font-size:12.5px}
.btn.good{border-color:var(--good);color:var(--good)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.good.on{background:var(--good);color:#fff}
.btn.bad.on{background:var(--bad);color:#fff}
/* main */
.main{flex:1;min-width:0;padding:28px clamp(16px,4vw,56px) 80px}
.wrap{max-width:900px;margin:0 auto}
.menu{display:none;position:fixed;top:10px;left:10px;z-index:30}
h1{font-size:28px;line-height:1.25;margin:6px 0 10px}
h2{font-size:20px;margin:30px 0 10px}
h3{font-size:16.5px;margin:24px 0 8px}
h4{font-size:15px;margin:18px 0 6px}
.crumbs{font-size:13px;color:var(--muted)}
.crumbs a{color:var(--muted)}
.badge{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 9px;border-radius:999px}
.badge.easy{background:var(--easy-soft);color:var(--easy)}.badge.medium{background:var(--medium-soft);color:var(--medium)}.badge.hard{background:var(--hard-soft);color:var(--hard)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.chip{font-size:12.5px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:20px 0 4px;overflow:auto}
.tabs a{padding:9px 16px;border-radius:8px 8px 0 0;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--text)}
.tabs a.on{color:var(--accent);border-bottom-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 22px;box-shadow:var(--shadow);margin:14px 0}
.card>:first-child{margin-top:0}.card>:last-child{margin-bottom:0}
blockquote{margin:12px 0;padding:12px 18px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0}
blockquote p{margin:6px 0}
blockquote pre{margin:10px 0}
.ticket{border-left-color:var(--medium);background:var(--medium-soft)}
.tablewrap{overflow:auto;margin:12px 0}
.cmdbox{border-left:4px solid var(--accent,#4f8cff);background:rgba(79,140,255,.06);border-radius:0 10px 10px 0;padding:6px 14px 4px;margin:10px 0 22px}
.cmdbox .cmdhead{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.75;margin:6px 0 0}
.cmdbox table{font-size:13px}.cmdbox .tablewrap{margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:7px 11px;text-align:left;vertical-align:top}
th{background:var(--panel2)}
details{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:0 16px}
details summary{cursor:pointer;padding:10px 0;font-weight:600}
details[open] summary{border-bottom:1px solid var(--line);margin-bottom:8px}
ul,ol{padding-left:22px}
li{margin:4px 0}
.callout{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:12px;padding:12px 18px;margin:16px 0;font-size:14px}
.callout pre{margin:8px 0 2px}
.gate{text-align:center;padding:34px 20px}
.gate .big{font-size:40px}
.nav-lab{display:flex;justify-content:space-between;gap:10px;margin-top:34px;padding-top:16px;border-top:1px solid var(--line)}
.nav-lab a{font-size:14px}
/* quiz */
.qbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin:14px 0}
.qbar .sum{font-weight:700}
.q{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin:14px 0;box-shadow:var(--shadow)}
.q .qt{font-weight:600;margin-bottom:10px}
.q .qn{color:var(--muted);font-weight:700;margin-right:6px}
.opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 13px;margin:7px 0;font:inherit;font-size:14.5px;cursor:pointer;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--text)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.dim{opacity:.55}
.fb{margin-top:10px;padding:10px 14px;border-radius:10px;font-size:14px}
.fb.ok{background:var(--good-soft);border-left:4px solid var(--good)}
.fb.no{background:var(--bad-soft);border-left:4px solid var(--bad)}
textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);padding:10px 12px;font:inherit;font-size:14px;resize:vertical}
textarea:focus{outline:2px solid var(--accent)}
.ans{margin-top:10px;padding:12px 14px;border-radius:10px;background:var(--accent-soft);border-left:4px solid var(--accent);font-size:14.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.muted{color:var(--muted)}
/* home */
.hero{background:linear-gradient(135deg,var(--accent-soft),var(--panel));border:1px solid var(--line);border-radius:18px;padding:26px 28px;margin-bottom:18px}
.hero h1{margin-top:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.stat b{display:block;font-size:24px}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.lab-card{display:block;text-decoration:none;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);border-top:3px solid var(--line)}
.lab-card:hover{border-color:var(--accent)}
.lab-card.easy{border-top-color:var(--easy)}.lab-card.medium{border-top-color:var(--medium)}.lab-card.hard{border-top-color:var(--hard)}
.lab-card .h{display:flex;justify-content:space-between;align-items:center;font-family:ui-monospace,monospace;font-size:12px;color:var(--muted)}
.lab-card .t{font-weight:600;margin:4px 0 2px;line-height:1.35}
.lab-card .s{font-size:12.5px;color:var(--muted)}
.opts-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.pill{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.big-score{font-size:52px;font-weight:800;line-height:1.1}
.review a{color:var(--accent)}
@media (max-width:900px){
  .side{position:fixed;left:0;top:0;z-index:20;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow);width:min(86vw,320px)}
  body.menu-open .side{transform:none}
  .menu{display:block}
  .main{padding-top:56px}
}
@media print{
  .side,.menu,.tabs,.copy,.nav-lab,.btn{display:none!important}
  body{background:#fff;color:#000}.card,.q{box-shadow:none}
}
</style>

<script id="data" type="application/json">{"labs": [{"id": "e01", "level": "easy", "title": "Log volume full", "time": "15 min", "skills": "disk usage, finding big files, safe cleanup", "ticket": "\u003cblockquote>\u003cstrong>INC-1001 · P3 · Monitoring alert\u003c/strong>\u003cbr>\n\u003ccode>DiskSpaceCritical: /var/log/shopapp is 100% full on tshoot-lab\u003c/code>\u003cbr>\nThe app team also says shopapp's log (\u003ccode>/var/log/shopapp/app.log\u003c/code>) stopped\u003cbr>\ngetting new lines a few minutes ago. The site still loads.\u003cbr>\nPlease free up space and make sure the app logs again. Do not delete\u003cbr>\n\u003ccode>app.log\u003c/code> itself - the audit team needs it.\u003c/blockquote>", "success": "\u003cul>\u003cli>\u003ccode>/var/log/shopapp\u003c/code> below 80% used\u003c/li>\u003cli>shopapp writes new lines into \u003ccode>app.log\u003c/code> again\u003c/li>\u003cli>\u003ccode>app.log\u003c/code> still exists\u003c/li>\u003c/ul>\n\u003cp>Check with \u003ccode>sudo ./labctl.sh check e01\u003c/code>.\u003c/p>", "warmup": "\u003cp>The solution uses long command lines. They are just short commands with one flag added at a time. Practise each ladder on any Linux box first (all read-only). Every rung adds \u003cstrong>one\u003c/strong> thing to the rung above - stop at the rung you understand, and read the next one only when you are ready. The lab itself uses the last rung of each ladder.\u003c/p>\n\u003ch4>df - which filesystem is full?\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">df                          \u003cspan class=\"c\"># 1. every filesystem, sizes in 1 KB blocks (hard to read)\u003c/span>\ndf -h                       \u003cspan class=\"c\"># 2. -h = human units (M, G)\u003c/span>\ndf -h /var/log              \u003cspan class=\"c\"># 3. give a path: only the filesystem that holds it\u003c/span>\ndf -i /var/log              \u003cspan class=\"c\"># 4. -i = inodes (file *count*) instead of bytes\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>du - what is using the space?\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">du /var/log                          \u003cspan class=\"c\"># 1. size of every directory below (1 KB blocks)\u003c/span>\ndu -h /var/log                       \u003cspan class=\"c\"># 2. human units\u003c/span>\ndu -sh /var/log                      \u003cspan class=\"c\"># 3. -s = one summary line for the whole tree\u003c/span>\ndu -h --max-depth=1 /var/log         \u003cspan class=\"c\"># 4. one level deep: a size per child\u003c/span>\ndu -xh --max-depth=1 /var/log        \u003cspan class=\"c\"># 5. -x = do not cross into other mounted filesystems\u003c/span>\ndu -xh --max-depth=1 /var/log | sort -h   \u003cspan class=\"c\"># 6. pipe to sort -h: biggest ends up last\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>find - search by name, size, age\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">find /var/log                                   \u003cspan class=\"c\"># 1. everything below, one path per line\u003c/span>\nfind /var/log -type f                           \u003cspan class=\"c\"># 2. only regular files (f); d = directories\u003c/span>\nfind /var/log -type f -name '*.log'             \u003cspan class=\"c\"># 3. add a name pattern (quote it!)\u003c/span>\nfind /var/log -type f -size +1M                 \u003cspan class=\"c\"># 4. bigger than 1 MB (+ = more than)\u003c/span>\nfind /var/log -type f -mmin +60                 \u003cspan class=\"c\"># 5. modified more than 60 minutes ago (-60 = less than)\u003c/span>\nfind /var/log -xdev -type f -size +1M           \u003cspan class=\"c\"># 6. -xdev = stay on one filesystem\u003c/span>\nfind /var/log -xdev -type f -size +1M -exec ls -lh {} +   \u003cspan class=\"c\"># 7. run a command on all hits ({} = the files)\u003c/span>\n\u003cspan class=\"c\"># find ... -delete deletes. ALWAYS run it first without -delete, count with | wc -l, then add it.\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>lsof - who has this file open?\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">lsof                                  \u003cspan class=\"c\"># 1. every open file of every process (huge)\u003c/span>\nlsof /var/log/syslog                  \u003cspan class=\"c\"># 2. only processes that have THIS file open\u003c/span>\nlsof -p 1234                          \u003cspan class=\"c\"># 3. everything process 1234 has open\u003c/span>\nlsof +L1                              \u003cspan class=\"c\"># 4. open files with link count &lt; 1 = deleted but still open\u003c/span>\nlsof -nP +L1 /var/log                 \u003cspan class=\"c\"># 5. -n/-P = no DNS / port-name lookups (faster); limit to one filesystem\u003c/span>\u003c/code>\u003c/pre>", "hints": [{"title": "Hint 1 - confirm the alert", "html": "\u003cp>Do not trust the alert, confirm it. Which command shows usage per filesystem? \u003ccode>df -h\u003c/code>. Is \u003ccode>/var/log/shopapp\u003c/code> its own filesystem?\u003c/p>"}, {"title": "Hint 2 - find what is big", "html": "\u003cp>\u003ccode>du -xh --max-depth=1 /var/log/shopapp | sort -h\u003c/code> shows which directory is big. \u003ccode>find /var/log/shopapp -xdev -type f -size +20M -exec ls -lh {} +\u003c/code> shows big files.\u003c/p>"}, {"title": "Hint 3 - before you delete", "html": "\u003cp>Look inside the big file first (\u003ccode>tail -n 3\u003c/code>). Is anything still writing to it? \u003ccode>lsof /var/log/shopapp/&lt;file&gt;\u003c/code> - if a process holds it open, deleting it will NOT free space (that is lab M01).\u003c/p>"}], "learn": "\u003cul>\u003cli>\u003ccode>df\u003c/code> tells you \u003cem>which filesystem\u003c/em> is full; \u003ccode>du\u003c/code> / \u003ccode>find\u003c/code> tell you \u003cem>what\u003c/em> is filling it.\u003c/li>\u003cli>\u003ccode>-x\u003c/code> / \u003ccode>-xdev\u003c/code> keeps \u003ccode>du\u003c/code> and \u003ccode>find\u003c/code> on one filesystem - important when other volumes are mounted underneath.\u003c/li>\u003cli>Always look at a file and check who writes it before you delete it.\u003c/li>\u003cli>Logs that grow without limit need \u003ccode>logrotate\u003c/code> and a monitoring alert at 80%, not 100%.\u003c/li>\u003c/ul>", "solution": "\u003cblockquote>Long commands below are built up short-first (\u003ccode># 1.\u003c/code>, \u003ccode># 2.\u003c/code> ...). Each rung adds one flag;\u003cbr>\nthe last rung is what the lab uses. The README \u003cstrong>Warm-up\u003c/strong> explains every flag from scratch.\u003c/blockquote>\n\u003ch3>1. Confirm the symptom\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">df -h /var/log/shopapp\n\u003cspan class=\"c\"># Filesystem  Size  Used Avail Use% Mounted on\u003c/span>\n\u003cspan class=\"c\"># /dev/loop0  232M  232M     0 100% /var/log/shopapp\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>/var/log/shopapp\u003c/code> is its own small volume, and it is full. Root (\u003ccode>/\u003c/code>) is fine, so only this app is hit.\u003c/p>\n\u003cp>The journal shows the app failing to write:\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">journalctl -u shopapp                          \u003cspan class=\"c\"># 1. whole log of the unit\u003c/span>\njournalctl -u shopapp --since \"10 min ago\"     \u003cspan class=\"c\"># 2. only the last 10 minutes\u003c/span>\njournalctl -u shopapp --since \"10 min ago\" | tail   \u003cspan class=\"c\"># 3. only the newest lines of those\u003c/span>\n\u003cspan class=\"c\"># --- Logging error ---\u003c/span>\n\u003cspan class=\"c\"># OSError: [Errno 28] No space left on device\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>df -h /var/log/shopapp\u003c/code>\u003c/td>\u003ctd>Reports used/free space of the \u003cstrong>filesystem\u003c/strong> that holds that path. \u003ccode>-h\u003c/code> = human units (M, G).\u003c/td>\u003ctd>First question is \u003cem>which volume is full\u003c/em>. Shows \u003ccode>/dev/loop0 100%\u003c/code> on its own mount, while \u003ccode>/\u003c/code> is healthy.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>journalctl -u shopapp --since \"10 min ago\"\u003c/code>\u003c/td>\u003ctd>Reads the systemd journal for one unit (\u003ccode>-u\u003c/code>) over a time window.\u003c/td>\u003ctd>Proves the symptom from the app's side: \u003ccode>Errno 28 No space left on device\u003c/code> = \u003ccode>ENOSPC\u003c/code>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>... | tail\u003c/code>\u003c/td>\u003ctd>Keeps only the last 10 lines.\u003c/td>\u003ctd>Journal is long; the newest lines matter.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>2. Find what is big\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo du -h /var/log/shopapp                              \u003cspan class=\"c\"># 1. size of every directory\u003c/span>\nsudo du -h --max-depth=1 /var/log/shopapp                \u003cspan class=\"c\"># 2. one level only\u003c/span>\nsudo du -xh --max-depth=1 /var/log/shopapp | sort -h     \u003cspan class=\"c\"># 3. stay on this filesystem, biggest last\u003c/span>\n\nsudo find /var/log/shopapp -type f -size +20M            \u003cspan class=\"c\"># 1. files over 20 MB\u003c/span>\nsudo find /var/log/shopapp -xdev -type f -size +20M -exec ls -lh {} +   \u003cspan class=\"c\"># 2. + one filesystem, + owner/size\u003c/span>\n\u003cspan class=\"c\"># -rw-r--r-- 1 shopapp shopapp 200M ... /var/log/shopapp/debug-trace.log\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>du -xh --max-depth=1 /var/log/shopapp | sort -h\u003c/code>\u003c/td>\u003ctd>\u003ccode>du\u003c/code> adds up file sizes per directory. \u003ccode>-x\u003c/code> = stay on this filesystem, \u003ccode>-h\u003c/code> = human sizes, \u003ccode>--max-depth=1\u003c/code> = one level only. \u003ccode>sort -h\u003c/code> sorts human numbers (10M &lt; 1G).\u003c/td>\u003ctd>\u003ccode>df\u003c/code> says \u003cem>which volume\u003c/em>; \u003ccode>du\u003c/code> says \u003cem>what is inside\u003c/em>. Biggest entry lands at the bottom.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>find /var/log/shopapp -xdev -type f -size +20M -exec ls -lh {} +\u003c/code>\u003c/td>\u003ctd>Lists regular files bigger than 20 MB without crossing mount points, then runs \u003ccode>ls -lh\u003c/code> on all hits in one call (\u003ccode>{} +\u003c/code>).\u003c/td>\u003ctd>Pinpoints the single culprit (\u003ccode>debug-trace.log\u003c/code>, 200 MB) with owner and size.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>3. Look before you delete\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">tail -n 2 /var/log/shopapp/debug-trace.log     \u003cspan class=\"c\"># debug trace spam\u003c/span>\nsudo lsof /var/log/shopapp/debug-trace.log     \u003cspan class=\"c\"># no output = nothing holds it open\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>tail -n 2 debug-trace.log\u003c/code>\u003c/td>\u003ctd>Shows the last 2 lines of the file.\u003c/td>\u003ctd>Look at \u003cem>what\u003c/em> the file is before deleting - confirms it is debug spam, not the protected \u003ccode>app.log\u003c/code> audit log.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>lsof /var/log/shopapp/debug-trace.log\u003c/code>\u003c/td>\u003ctd>Lists processes that have the file open.\u003c/td>\u003ctd>No output = no open fd, so a plain \u003ccode>rm\u003c/code> really frees the blocks. If something held it, \u003ccode>rm\u003c/code> would only remove the name.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>4. Fix\u003c/h3>\n\u003cp>No process holds the file open, so we can remove it:\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo rm /var/log/shopapp/debug-trace.log\u003c/code>\u003c/pre>\n\u003cp>If a process \u003cem>did\u003c/em> hold it open, empty it in place instead, so the space is freed now:\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo truncate -s 0 /var/log/shopapp/debug-trace.log\u003c/code>\u003c/pre>\n\u003cp>Old rotated logs in \u003ccode>archive/\u003c/code> are another option, but only after you check how long they must be kept.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>rm debug-trace.log\u003c/code>\u003c/td>\u003ctd>Unlinks the file; blocks are freed when no fd remains.\u003c/td>\u003ctd>The actual fix.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>truncate -s 0 FILE\u003c/code>\u003c/td>\u003ctd>Sets file size to 0 \u003cem>in place\u003c/em> (same inode).\u003c/td>\u003ctd>The alternative when a process still holds the file: space returns immediately and the writer keeps its fd.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>5. Verify\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">df -h /var/log/shopapp\ncurl -s localhost/ &amp;&amp; tail -n1 /var/log/shopapp/app.log\nsudo ./labctl.sh check e01\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>curl -s localhost/ &amp;&amp; tail -n1 app.log\u003c/code>\u003c/td>\u003ctd>\u003ccode>-s\u003c/code> = silent. Hits the app, then reads its newest log line.\u003c/td>\u003ctd>Verify: the app answers \u003cstrong>and\u003c/strong> logging works again (new line appears).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>./labctl.sh check e01\u003c/code>\u003c/td>\u003ctd>Lab's own checker script.\u003c/td>\u003ctd>Confirms every success criterion (including \"app.log untouched\").\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>", "root": "\u003cdiv class='tablewrap'>\u003ctable>\u003ctbody>\u003ctr>\u003ctd>Root cause\u003c/td>\u003ctd>A debug trace was left on and wrote to an unrotated file until the log volume filled\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fix\u003c/td>\u003ctd>Removed the trace file, freed space\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prevent\u003c/td>\u003ctd>Add a \u003ccode>logrotate\u003c/code> rule for \u003ccode>/var/log/shopapp/*.log\u003c/code> with \u003ccode>maxsize\u003c/code>; alert at 80% usage; turn off debug tracing after use\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "explain": "\u003cp>\u003cstrong>Mental model.\u003c/strong> Two tools, two questions:\u003c/p>\n\u003cul>\u003cli>\u003ccode>df\u003c/code> asks the \u003cstrong>filesystem\u003c/strong> how many blocks are used (superblock counters). It answers \u003cem>which volume is full\u003c/em>.\u003c/li>\u003cli>\u003ccode>du\u003c/code> / \u003ccode>find\u003c/code> \u003cstrong>walk directory names\u003c/strong> and add up file sizes. They answer \u003cem>what is filling it\u003c/em>.\u003c/li>\u003c/ul>\n\u003cp>Here \u003ccode>/var/log/shopapp\u003c/code> is its own 256 MB volume, so \u003ccode>/\u003c/code> looked healthy while the log volume hit 100%. The app kept serving pages (the web request does not depend on the log write) but every log write failed with \u003ccode>ENOSPC\u003c/code> (\u003ccode>Errno 28\u003c/code>) - which is why the \u003cem>log\u003c/em> silently stopped growing.\u003c/p>\n\u003cp>\u003cstrong>Why \u003ccode>-x\u003c/code> / \u003ccode>-xdev\u003c/code>?\u003c/strong> Without it \u003ccode>du\u003c/code> and \u003ccode>find\u003c/code> cross into other mounted volumes, so you count (or delete!) data that is not on the full filesystem.\u003c/p>\n\u003cp>\u003cstrong>Why look before you \u003ccode>rm\u003c/code>?\u003c/strong> If a process still has the file open, \u003ccode>rm\u003c/code> removes only the \u003cem>name\u003c/em>; the blocks stay allocated (that is lab M01). Here \u003ccode>lsof\u003c/code> printed nothing, so a plain \u003ccode>rm\u003c/code> was safe. If something \u003cem>had\u003c/em> held it, \u003ccode>truncate -s 0\u003c/code> frees the blocks immediately.\u003c/p>\n\u003cp>\u003cstrong>Why not the obvious file?\u003c/strong> The ticket protects \u003ccode>app.log\u003c/code> (audit). The big file was a forgotten debug trace, found by size - not by guessing from the symptom.\u003c/p>", "mcq": [{"q": "Which command tells you WHICH filesystem is full?", "o": ["df -h", "du -sh /", "lsof +L1", "ls -l /var/log"], "why": "`df` reads per-filesystem usage. `du` shows what is inside a directory tree, not which volume is full."}, {"q": "Why do you add `-x` (du) or `-xdev` (find) when hunting for big files on a full volume?", "o": ["It keeps the command on one filesystem, so other mounted volumes are not counted or touched", "It makes the command run faster by using extended attributes", "It excludes files owned by root", "It shows only files larger than 1 MB"], "why": "`-x`/`-xdev` = do not cross mount points. Otherwise you may chase space (or delete files) on a different volume."}, {"q": "A running process still writes to a 200 MB log and you need the space back NOW without stopping it. What do you do?", "o": ["truncate -s 0 the file", "rm the file", "mv the file to /tmp", "chmod 000 the file"], "why": "`rm` only removes the name; the open fd keeps the blocks. Truncating in place frees them while the process keeps its fd."}], "qa": [{"q": "The ticket says 'do not delete app.log'. app.log is the file that stopped growing - so why is it NOT the file to clean up?", "a": "app.log stopped growing only because the volume was full (ENOSPC). It is the victim, not the cause. The real consumer was debug-trace.log (200 MB), found with `du -xh --max-depth=1 | sort -h` and `find -size +20M`. Always find what fills the disk by measuring, not by assuming the file named in the symptom."}, {"q": "Name three prevention items for this incident.", "a": "1) logrotate rule with `maxsize` for /var/log/shopapp/*.log. 2) Alert at 80% disk usage, not 100%. 3) Turn debug tracing off after use / time-box debug flags. (Bonus: monitor inode usage too.)"}]}, {"id": "e02", "level": "easy", "title": "Website down after a config change", "time": "15 min", "skills": "systemd, journal, config validation", "ticket": "\u003cblockquote>\u003cstrong>INC-1002 · P1 · Customer facing\u003c/strong>\u003cbr>\n\u003ccode>curl http://localhost/\u003c/code> returns \u003cstrong>Connection refused\u003c/strong>.\u003cbr>\nA colleague says: \"I only bumped an nginx timeout and restarted it. Nothing else.\"\u003cbr>\nBring the site back. Keep the colleague's change if it is valid.\u003c/blockquote>", "success": "\u003cul>\u003cli>\u003ccode>nginx -t\u003c/code> passes, nginx is active and enabled\u003c/li>\u003cli>\u003ccode>http://localhost/\u003c/code> returns 200\u003c/li>\u003c/ul>", "warmup": "\u003cp>The solution uses long command lines. They are just short commands with one flag added at a time. Practise each ladder on any Linux box first (all read-only). Every rung adds \u003cstrong>one\u003c/strong> thing to the rung above - stop at the rung you understand, and read the next one only when you are ready. The lab itself uses the last rung of each ladder.\u003c/p>\n\u003ch4>curl - talk to a web service\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">curl http://localhost/                                   \u003cspan class=\"c\"># 1. fetch a page, print the body\u003c/span>\ncurl -s http://localhost/                                \u003cspan class=\"c\"># 2. -s = silent (no progress bar)\u003c/span>\ncurl -s -o /dev/null http://localhost/                   \u003cspan class=\"c\"># 3. -o /dev/null = throw the body away\u003c/span>\ncurl -s -o /dev/null -w '%{http_code}\\n' http://localhost/   \u003cspan class=\"c\"># 4. -w = print only the HTTP status code\u003c/span>\ncurl -v http://localhost/                                \u003cspan class=\"c\"># 5. -v = verbose: shows connect, headers (debug)\u003c/span>\ncurl -s -o /dev/null -w '%{http_code} %{time_total}s\\n' --max-time 5 http://localhost/   \u003cspan class=\"c\"># 6. + timing, + give up after 5 s\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>ss - who is listening / connected?\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">ss                              \u003cspan class=\"c\"># 1. all sockets (long)\u003c/span>\nss -l                           \u003cspan class=\"c\"># 2. -l = only listening sockets\u003c/span>\nss -lt                          \u003cspan class=\"c\"># 3. -t = TCP only\u003c/span>\nss -ltn                         \u003cspan class=\"c\"># 4. -n = numbers, no name lookup\u003c/span>\nss -ltnp                        \u003cspan class=\"c\"># 5. -p = which process owns each socket (needs sudo)\u003c/span>\nss -ltnp 'sport = :80'          \u003cspan class=\"c\"># 6. filter: only source (local) port 80\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>systemctl + journalctl - service state and logs\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">systemctl status nginx                          \u003cspan class=\"c\"># 1. state, last exit code, last log lines\u003c/span>\nsystemctl is-active nginx                       \u003cspan class=\"c\"># 2. one word: active / failed / inactive\u003c/span>\njournalctl -u nginx                             \u003cspan class=\"c\"># 3. the whole log of one unit (-u = unit)\u003c/span>\njournalctl -u nginx -n 20                       \u003cspan class=\"c\"># 4. only the last 20 lines\u003c/span>\njournalctl -u nginx -n 20 --no-pager            \u003cspan class=\"c\"># 5. print straight to the terminal (no less)\u003c/span>\njournalctl -u nginx --since \"10 min ago\"        \u003cspan class=\"c\"># 6. time window instead of line count\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>nginx - test before you restart\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">nginx -t                                  \u003cspan class=\"c\"># 1. check the config syntax, change nothing\u003c/span>\nsudo nginx -t                             \u003cspan class=\"c\"># 2. needs root to read all files\u003c/span>\nsudo nginx -T                             \u003cspan class=\"c\"># 3. -T = test AND print the full effective config\u003c/span>\nsudo nginx -T | grep -n listen            \u003cspan class=\"c\"># 4. find one directive in it\u003c/span>\nsudo nginx -t &amp;&amp; sudo systemctl reload nginx   \u003cspan class=\"c\"># 5. &amp;&amp; = reload only if the test passed\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>grep - find text\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">grep error file                 \u003cspan class=\"c\"># 1. lines containing 'error'\u003c/span>\ngrep -i error file              \u003cspan class=\"c\"># 2. -i = ignore case\u003c/span>\ngrep -n error file              \u003cspan class=\"c\"># 3. -n = show line numbers\u003c/span>\ngrep -v debug file              \u003cspan class=\"c\"># 4. -v = invert: lines WITHOUT 'debug'\u003c/span>\ngrep -r error /etc/             \u003cspan class=\"c\"># 5. -r = search all files below a directory\u003c/span>\ngrep -E 'oom|killed' file       \u003cspan class=\"c\"># 6. -E = extended regex: 'oom' OR 'killed'\u003c/span>\ndmesg | grep -i oom             \u003cspan class=\"c\"># 7. most used form: filter another command's output\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>sed - edit text from the command line\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">sed 's/old/new/' file           \u003cspan class=\"c\"># 1. print file with the first 'old' on each line replaced (file unchanged)\u003c/span>\nsed 's/old/new/g' file          \u003cspan class=\"c\"># 2. g = every match on the line\u003c/span>\nsed -n '3p' file                \u003cspan class=\"c\"># 3. -n + p = print only line 3\u003c/span>\nsed '/old/d' file               \u003cspan class=\"c\"># 4. d = delete lines that match (still only printed)\u003c/span>\nsed -i 's/old/new/' file        \u003cspan class=\"c\"># 5. -i = edit the file IN PLACE (make a copy first: cp file file.bak)\u003c/span>\nsed -i 's#/a/b#/c/d#' file      \u003cspan class=\"c\"># 6. any delimiter works: # avoids escaping / in paths\u003c/span>\u003c/code>\u003c/pre>", "hints": [{"title": "Hint 1 - is it running?", "html": "\u003cp>\u003ccode>systemctl status nginx\u003c/code> - look at the \u003ccode>Active:\u003c/code> line and the last log lines.\u003c/p>"}, {"title": "Hint 2 - why did it fail?", "html": "\u003cp>\u003ccode>journalctl -u nginx -n 30 --no-pager\u003c/code> and \u003ccode>sudo nginx -t\u003c/code>. The error names a file and a line number.\u003c/p>"}, {"title": "Hint 3 - read the line before", "html": "\u003cp>Parser errors often point at the line \u003cem>after\u003c/em> the real mistake. Check the end of the line before it.\u003c/p>"}], "learn": "\u003cul>\u003cli>Connection refused = nothing is listening on that port. Check the service first.\u003c/li>\u003cli>\u003ccode>systemctl status\u003c/code> -&gt; \u003ccode>journalctl -u\u003c/code> -&gt; the tool's own config test (\u003ccode>nginx -t\u003c/code>, \u003ccode>sshd -t\u003c/code>, \u003ccode>apachectl configtest\u003c/code>, \u003ccode>named-checkconf\u003c/code>).\u003c/li>\u003cli>Always run the config test \u003cstrong>before\u003c/strong> you restart. \u003ccode>nginx -t &amp;&amp; systemctl reload nginx\u003c/code>.\u003c/li>\u003cli>\u003ccode>reload\u003c/code> keeps the old workers if the new config is bad; \u003ccode>restart\u003c/code> stops nginx first.\u003c/li>\u003c/ul>", "solution": "\u003cblockquote>Long commands below are built up short-first (\u003ccode># 1.\u003c/code>, \u003ccode># 2.\u003c/code> ...). Each rung adds one flag;\u003cbr>\nthe last rung is what the lab uses. The README \u003cstrong>Warm-up\u003c/strong> explains every flag from scratch.\u003c/blockquote>\n\u003ch3>1. Confirm\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">curl http://localhost/                  \u003cspan class=\"c\"># 1. plain request\u003c/span>\ncurl -v http://localhost/               \u003cspan class=\"c\"># 2. -v shows the connect step\u003c/span>\n\u003cspan class=\"c\"># connect to 127.0.0.1 port 80 failed: Connection refused\u003c/span>\nsudo ss -l                              \u003cspan class=\"c\"># 1. every listening socket\u003c/span>\nsudo ss -ltn                            \u003cspan class=\"c\"># 2. TCP only, numbers\u003c/span>\nsudo ss -ltnp 'sport = :80'             \u003cspan class=\"c\"># 3. + owning process, + only port 80\u003c/span>\n\u003cspan class=\"c\">#   (empty -&gt; nothing listens on 80)\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>curl -v http://localhost/\u003c/code>\u003c/td>\u003ctd>HTTP client; \u003ccode>-v\u003c/code> prints the connect step.\u003c/td>\u003ctd>\u003ccode>Connection refused\u003c/code> = kernel answered with RST = \u003cstrong>nothing is listening\u003c/strong>. Not a slow or broken app.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ss -ltnp 'sport = :80'\u003c/code>\u003c/td>\u003ctd>\u003ccode>ss\u003c/code> = socket statistics. \u003ccode>-l\u003c/code> listening, \u003ccode>-t\u003c/code> TCP, \u003ccode>-n\u003c/code> numeric (no DNS), \u003ccode>-p\u003c/code> show owning process. The filter \u003ccode>sport = :80\u003c/code> = source port 80.\u003c/td>\u003ctd>Empty output confirms no process owns port 80.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>2. Check the service\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">systemctl status nginx\n\u003cspan class=\"c\"># Active: failed (Result: exit-code)\u003c/span>\njournalctl -u nginx                     \u003cspan class=\"c\"># 1. whole log\u003c/span>\njournalctl -u nginx -n 20               \u003cspan class=\"c\"># 2. last 20 lines\u003c/span>\njournalctl -u nginx -n 20 --no-pager    \u003cspan class=\"c\"># 3. print straight to the terminal\u003c/span>\n\u003cspan class=\"c\"># nginx: [emerg] unexpected end of file, expecting \";\" or \"}\" ... or\u003c/span>\n\u003cspan class=\"c\"># nginx: [emerg] invalid number of arguments in \"proxy_read_timeout\" directive in /etc/nginx/sites-enabled/shopapp:15\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>systemctl status nginx\u003c/code>\u003c/td>\u003ctd>Shows unit state, last exit code and recent log lines.\u003c/td>\u003ctd>\u003ccode>failed (Result: exit-code)\u003c/code> - nginx tried to start and died.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>journalctl -u nginx -n 20 --no-pager\u003c/code>\u003c/td>\u003ctd>Last 20 journal lines for nginx; \u003ccode>--no-pager\u003c/code> prints straight to the terminal.\u003c/td>\u003ctd>Gives the exact error and file:line (\u003ccode>invalid number of arguments ... :15\u003c/code>).\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>3. Validate the config\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo nginx -t\nsudo grep -n timeout /etc/nginx/sites-available/shopapp\n\u003cspan class=\"c\">#  proxy_read_timeout 30s            &lt;-- missing ;\u003c/span>\n\u003cspan class=\"c\">#  proxy_send_timeout 30s;\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>Without the \u003ccode>;\u003c/code> nginx reads both lines as one directive: \u003ccode>proxy_read_timeout 30s proxy_send_timeout 30s\u003c/code> - too many arguments.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>nginx -t\u003c/code>\u003c/td>\u003ctd>Parses the config and exits, without touching the running server.\u003c/td>\u003ctd>Safe syntax check; use it before \u003cstrong>every\u003c/strong> reload/restart.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>grep -n timeout /etc/nginx/sites-available/shopapp\u003c/code>\u003c/td>\u003ctd>Searches the file; \u003ccode>-n\u003c/code> prints line numbers.\u003c/td>\u003ctd>The reported line is where the parser gave up - look at the line \u003cem>before\u003c/em> it. Shows \u003ccode>proxy_read_timeout 30s\u003c/code> with no \u003ccode>;\u003c/code>.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>4. Fix - keep the colleague's change, add the \u003ccode>;\u003c/code>\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo sed -i 's/proxy_read_timeout 30s$/proxy_read_timeout 30s;/' /etc/nginx/sites-available/shopapp\nsudo nginx -t &amp;&amp; sudo systemctl restart nginx\ncurl -s -o /dev/null -w '%{http_code}\\n' http://localhost/\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>sed -i 's/proxy_read_timeout 30s$/proxy_read_timeout 30s;/' FILE\u003c/code>\u003c/td>\u003ctd>In-place (\u003ccode>-i\u003c/code>) substitution. \u003ccode>$\u003c/code> anchors to end of line so only the broken line matches.\u003c/td>\u003ctd>Adds the missing \u003ccode>;\u003c/code> and keeps the colleague's valid 30 s change instead of reverting it.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>nginx -t &amp;&amp; systemctl restart nginx\u003c/code>\u003c/td>\u003ctd>\u003ccode>&amp;&amp;\u003c/code> runs the second command only if the first succeeded.\u003c/td>\u003ctd>Never restart onto an unchecked config; a bad config would turn a partial outage into a full one.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>curl -s -o /dev/null -w '%{http_code}\\n' http://localhost/\u003c/code>\u003c/td>\u003ctd>\u003ccode>-o /dev/null\u003c/code> discards the body, \u003ccode>-w\u003c/code> prints a format string - here the HTTP status.\u003c/td>\u003ctd>One-line pass/fail check: expect \u003ccode>200\u003c/code>.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>", "root": "\u003cdiv class='tablewrap'>\u003ctable>\u003ctbody>\u003ctr>\u003ctd>Root cause\u003c/td>\u003ctd>Syntax error (missing \u003ccode>;\u003c/code>) in nginx site config; nginx was restarted without a config test\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prevent\u003c/td>\u003ctd>Always \u003ccode>nginx -t &amp;&amp; systemctl reload nginx\u003c/code>; keep config in git with CI linting; use config management\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "explain": "\u003cp>\u003cstrong>Connection refused = nothing is listening.\u003c/strong> The kernel answers a SYN to a closed port with a RST. So the first question is not \"what is wrong with the app\" but \"is the service running?\" - \u003ccode>ss -ltnp 'sport = :80'\u003c/code> and \u003ccode>systemctl status nginx\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Why the error points at the wrong line.\u003c/strong> nginx directives end with \u003ccode>;\u003c/code>. With \u003ccode>proxy_read_timeout 30s\u003c/code> missing its \u003ccode>;\u003c/code>, the parser keeps reading and treats the next line as more arguments:\u003c/p>\n\u003cpre>\u003ccode class=\"lang-text\">proxy_read_timeout 30s proxy_send_timeout 30s;   \u003cspan class=\"c\"># one directive, 3 args -&gt; \"invalid number of arguments\"\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>The error names the line where the parser \u003cem>gave up\u003c/em>, which is often the line \u003cstrong>after\u003c/strong> the real mistake. Look at the end of the previous line.\u003c/p>\n\u003cp>\u003cstrong>Config test before apply.\u003c/strong> \u003ccode>nginx -t\u003c/code> parses the config without touching the running server. \u003ccode>reload\u003c/code> starts new workers with the new config and keeps the old ones if parsing fails; \u003ccode>restart\u003c/code> stops nginx first, so a bad config means an outage. Habit: \u003ccode>nginx -t &amp;&amp; systemctl reload nginx\u003c/code>. The same pattern exists for \u003ccode>sshd -t\u003c/code>, \u003ccode>apachectl configtest\u003c/code>, \u003ccode>named-checkconf\u003c/code>.\u003c/p>\n\u003cp>Keep the colleague's valid change (30s timeout): fix the syntax, do not revert blindly.\u003c/p>", "mcq": [{"q": "`curl http://localhost/` returns 'Connection refused'. What is the best FIRST check?", "o": ["Is nginx running / is anything listening on port 80? (systemctl status nginx, ss -ltnp)", "Clear the DNS cache", "Check the TLS certificate dates", "Increase proxy_read_timeout"], "why": "Refused = RST from the kernel = no listener on that port."}, {"q": "nginx reports an error on line 15, but the typo is on line 14. Why?", "o": ["A missing `;` makes the parser continue into the next line and only fail there", "nginx counts lines starting from 0", "The journal shows the wrong file", "nginx -t reports errors one line late by design in all cases"], "why": "Without `;` the next line's text becomes extra arguments; the parser fails when it sees too many."}, {"q": "Why is `nginx -t && systemctl reload nginx` safer than `systemctl restart nginx`?", "o": ["With a bad config the reload fails and the old workers keep serving; a restart would stop nginx first", "reload is faster because it skips DNS", "restart does not read the config file", "reload re-enables the unit at boot"], "why": "Validate first; reload never drops the old working configuration if the new one is broken."}], "qa": [{"q": "Walk through the tools you use from symptom to root cause for this ticket, in order.", "a": "curl -v (confirm 'Connection refused') -> ss -ltnp 'sport = :80' (nothing listens) -> systemctl status nginx (failed, exit-code) -> journalctl -u nginx -n 30 (emerg + file:line) -> nginx -t -> grep -n timeout on the file (see missing `;`) -> fix with sed/editor -> nginx -t && systemctl restart nginx -> curl returns 200."}, {"q": "The colleague only 'bumped a timeout'. What do you keep and what do you change?", "a": "Keep the new timeout value (it is valid); only add the missing semicolon. Reverting the whole change would hide the real lesson and lose their intended tuning. Prevent with config in git + CI lint and always running nginx -t before applying."}]}, {"id": "e03", "level": "easy", "title": "App won't start after \"security hardening\"", "time": "20 min", "skills": "Linux permissions, users/groups, path traversal", "ticket": "\u003cblockquote>\u003cstrong>INC-1003 · P2\u003c/strong>\u003cbr>\nAfter the security team ran a hardening script last night, \u003ccode>shopapp\u003c/code> does not start.\u003cbr>\n\u003ccode>curl localhost\u003c/code> returns \u003cstrong>502 Bad Gateway\u003c/strong>.\u003cbr>\nThe security team's goal: \u003cem>other users on the box must not read the shopapp\u003cbr>\nconfig.\u003c/em> Fix the app \u003cstrong>without\u003c/strong> undoing that goal (no \u003ccode>chmod 777\u003c/code>, no world-readable config).\u003c/blockquote>", "success": "\u003cul>\u003cli>shopapp is active and \u003ccode>/health\u003c/code> returns 200\u003c/li>\u003cli>\u003ccode>shopapp\u003c/code> user can read but not write \u003ccode>config.ini\u003c/code>\u003c/li>\u003cli>\u003ccode>config.ini\u003c/code> is not world-readable\u003c/li>\u003c/ul>", "warmup": "\u003cp>The solution uses long command lines. They are just short commands with one flag added at a time. Practise each ladder on any Linux box first (all read-only). Every rung adds \u003cstrong>one\u003c/strong> thing to the rung above - stop at the rung you understand, and read the next one only when you are ready. The lab itself uses the last rung of each ladder.\u003c/p>\n\u003ch4>curl - talk to a web service\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">curl http://localhost/                                   \u003cspan class=\"c\"># 1. fetch a page, print the body\u003c/span>\ncurl -s http://localhost/                                \u003cspan class=\"c\"># 2. -s = silent (no progress bar)\u003c/span>\ncurl -s -o /dev/null http://localhost/                   \u003cspan class=\"c\"># 3. -o /dev/null = throw the body away\u003c/span>\ncurl -s -o /dev/null -w '%{http_code}\\n' http://localhost/   \u003cspan class=\"c\"># 4. -w = print only the HTTP status code\u003c/span>\ncurl -v http://localhost/                                \u003cspan class=\"c\"># 5. -v = verbose: shows connect, headers (debug)\u003c/span>\ncurl -s -o /dev/null -w '%{http_code} %{time_total}s\\n' --max-time 5 http://localhost/   \u003cspan class=\"c\"># 6. + timing, + give up after 5 s\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>systemctl + journalctl - service state and logs\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">systemctl status nginx                          \u003cspan class=\"c\"># 1. state, last exit code, last log lines\u003c/span>\nsystemctl is-active nginx                       \u003cspan class=\"c\"># 2. one word: active / failed / inactive\u003c/span>\njournalctl -u nginx                             \u003cspan class=\"c\"># 3. the whole log of one unit (-u = unit)\u003c/span>\njournalctl -u nginx -n 20                       \u003cspan class=\"c\"># 4. only the last 20 lines\u003c/span>\njournalctl -u nginx -n 20 --no-pager            \u003cspan class=\"c\"># 5. print straight to the terminal (no less)\u003c/span>\njournalctl -u nginx --since \"10 min ago\"        \u003cspan class=\"c\"># 6. time window instead of line count\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>ls / namei / id - read permissions\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">ls                                  \u003cspan class=\"c\"># 1. names only\u003c/span>\nls -l /etc/hostname                 \u003cspan class=\"c\"># 2. -l = long: mode, owner, group, size, date\u003c/span>\nls -ld /etc                         \u003cspan class=\"c\"># 3. -d = the directory itself, not its content\u003c/span>\nnamei -l /etc/hostname              \u003cspan class=\"c\"># 4. mode + owner of EVERY directory on the way (a path needs x on each)\u003c/span>\nid                                  \u003cspan class=\"c\"># 5. who am I: uid, gid, groups\u003c/span>\nsudo -u www-data cat /etc/hostname  \u003cspan class=\"c\"># 6. run a command AS another user = test what the service can do\u003c/span>\n\u003cspan class=\"c\"># mode  rwxr-x---  = owner rwx (7), group r-x (5), others --- (0)  -&gt;  chmod 750\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>chmod / chown - change permissions and owner\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">chmod 644 file          \u003cspan class=\"c\"># 1. numbers: r=4 w=2 x=1, add up per owner/group/others -&gt; rw-r--r--\u003c/span>\nchmod 600 file          \u003cspan class=\"c\"># 2. owner only: rw-------\u003c/span>\nchmod u+x file          \u003cspan class=\"c\"># 3. symbolic: u=owner g=group o=others, +/- add/remove a bit\u003c/span>\nchown alice file        \u003cspan class=\"c\"># 4. change owner\u003c/span>\nchown alice:staff file  \u003cspan class=\"c\"># 5. owner and group\u003c/span>\nchown -R alice:staff dir/   \u003cspan class=\"c\"># 6. -R = recursive (whole tree - double-check the path first!)\u003c/span>\u003c/code>\u003c/pre>", "hints": [{"title": "Hint 1 - 502 means what?", "html": "\u003cp>nginx is up but its backend (shopapp on :8080) is not answering. Look at the backend: \u003ccode>systemctl status shopapp\u003c/code>, \u003ccode>journalctl -u shopapp -n 20\u003c/code>.\u003c/p>"}, {"title": "Hint 2 - which user?", "html": "\u003cp>Which user does the service run as? \u003ccode>systemctl show -p User shopapp\u003c/code> or look at \u003ccode>systemctl cat shopapp\u003c/code>. Test as that user: \u003ccode>sudo -u shopapp cat /etc/shopapp/config.ini\u003c/code>.\u003c/p>"}, {"title": "Hint 3 - every directory counts", "html": "\u003cp>To open a file you need \u003ccode>x\u003c/code> on \u003cstrong>every\u003c/strong> directory on the path. \u003ccode>namei -l /etc/shopapp/config.ini\u003c/code> shows owner and mode of each part.\u003c/p>"}], "learn": "\u003cul>\u003cli>502 from a proxy -&gt; the backend is the problem, not the proxy.\u003c/li>\u003cli>Always test access \u003cem>as the service user\u003c/em> (\u003ccode>sudo -u &lt;user&gt; ...\u003c/code>), not as root. Root ignores permissions.\u003c/li>\u003cli>File access needs \u003ccode>r\u003c/code> on the file \u003cstrong>and\u003c/strong> \u003ccode>x\u003c/code> on every parent directory.\u003c/li>\u003cli>Least privilege: give access through the \u003cstrong>group\u003c/strong> (\u003ccode>root:shopapp 0640\u003c/code>), not \"other\".\u003c/li>\u003c/ul>", "solution": "\u003cblockquote>Long commands below are built up short-first (\u003ccode># 1.\u003c/code>, \u003ccode># 2.\u003c/code> ...). Each rung adds one flag;\u003cbr>\nthe last rung is what the lab uses. The README \u003cstrong>Warm-up\u003c/strong> explains every flag from scratch.\u003c/blockquote>\n\u003ch3>1. Find the failing layer\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">curl localhost/                                       \u003cspan class=\"c\"># 1. the body: an error page\u003c/span>\ncurl -s -o /dev/null -w '%{http_code}\\n' localhost/    \u003cspan class=\"c\"># 2. just the status code: 502 -&gt; nginx up, backend down\u003c/span>\nsystemctl status shopapp\n\u003cspan class=\"c\"># Active: activating (auto-restart) (Result: exit-code) ... status=2\u003c/span>\njournalctl -u shopapp -n 5 --no-pager\n\u003cspan class=\"c\"># FATAL: cannot read config /etc/shopapp/config.ini: [Errno 13] Permission denied\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>curl -s -o /dev/null -w '%{http_code}\\n' localhost/\u003c/code>\u003c/td>\u003ctd>Prints only the HTTP status code.\u003c/td>\u003ctd>\u003ccode>502 Bad Gateway\u003c/code> = nginx (front) is up, the backend behind it is down. Tells you which layer to debug.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl status shopapp\u003c/code>\u003c/td>\u003ctd>Unit state and exit info.\u003c/td>\u003ctd>\u003ccode>activating (auto-restart)\u003c/code> + \u003ccode>status=2\u003c/code> = crash loop; the app starts and dies.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>journalctl -u shopapp -n 5 --no-pager\u003c/code>\u003c/td>\u003ctd>Last 5 log lines for the unit.\u003c/td>\u003ctd>\u003ccode>[Errno 13] Permission denied\u003c/code> on \u003ccode>config.ini\u003c/code> - the real error.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>2. Test as the service user\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">systemctl show -p User -p Group shopapp       \u003cspan class=\"c\"># User=shopapp Group=shopapp\u003c/span>\nsudo -u shopapp cat /etc/shopapp/config.ini   \u003cspan class=\"c\"># Permission denied\u003c/span>\nnamei -l /etc/shopapp/config.ini\n\u003cspan class=\"c\"># f: /etc/shopapp/config.ini\u003c/span>\n\u003cspan class=\"c\"># drwxr-xr-x root root /\u003c/span>\n\u003cspan class=\"c\"># drwxr-xr-x root root etc\u003c/span>\n\u003cspan class=\"c\"># drwx------ root root shopapp        &lt;-- no x for shopapp\u003c/span>\n\u003cspan class=\"c\"># -rw------- root root config.ini     &lt;-- no r for shopapp\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>Two problems: directory \u003ccode>0700\u003c/code> and file \u003ccode>root:root 0600\u003c/code>.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>systemctl show -p User -p Group shopapp\u003c/code>\u003c/td>\u003ctd>Prints chosen properties of the unit in \u003ccode>key=value\u003c/code> form.\u003c/td>\u003ctd>Learn \u003cstrong>which account\u003c/strong> the service runs as (\u003ccode>shopapp\u003c/code>) - permissions must be tested as that user, not as you/root.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sudo -u shopapp cat /etc/shopapp/config.ini\u003c/code>\u003c/td>\u003ctd>Runs a command as another user.\u003c/td>\u003ctd>Reproduces the exact failure as the service user. Reading as root would always work and prove nothing.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>namei -l /etc/shopapp/config.ini\u003c/code>\u003c/td>\u003ctd>Walks every component of a path and prints owner and mode of each.\u003c/td>\u003ctd>Reading a file needs \u003ccode>x\u003c/code> on \u003cstrong>every\u003c/strong> directory plus \u003ccode>r\u003c/code> on the file. \u003ccode>namei\u003c/code> shows the exact broken link: dir \u003ccode>drwx------\u003c/code> and file \u003ccode>-rw-------\u003c/code>.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>3. Fix with least privilege\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo chmod 0755 /etc/shopapp                 \u003cspan class=\"c\"># dir: contains no secrets, normal mode\u003c/span>\nsudo chown root:shopapp /etc/shopapp/config.ini\nsudo chmod 0640 /etc/shopapp/config.ini      \u003cspan class=\"c\"># root rw, group shopapp r, others nothing\u003c/span>\nsudo -u shopapp cat /etc/shopapp/config.ini  \u003cspan class=\"c\"># works now\u003c/span>\nsudo systemctl restart shopapp\ncurl -s localhost/health\u003c/code>\u003c/pre>\n\u003cp>(\u003ccode>0750 root:shopapp\u003c/code> on the directory is also fine and stricter.)\u003c/p>\n\u003cp>Wrong fixes: \u003ccode>chmod 777\u003c/code>, \u003ccode>chmod 644\u003c/code> on the config (world-readable), or changing the service to \u003ccode>User=root\u003c/code>.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>chmod 0755 /etc/shopapp\u003c/code>\u003c/td>\u003ctd>Sets directory mode (owner rwx, others r-x).\u003c/td>\u003ctd>Directory holds no secrets; others need \u003ccode>x\u003c/code> to traverse it.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>chown root:shopapp config.ini\u003c/code>\u003c/td>\u003ctd>Changes owner and group.\u003c/td>\u003ctd>Gives group \u003ccode>shopapp\u003c/code> ownership so the service can read without making it world-readable.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>chmod 0640 config.ini\u003c/code>\u003c/td>\u003ctd>owner rw, group r, others nothing.\u003c/td>\u003ctd>Least privilege: service reads, outsiders cannot.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl restart shopapp\u003c/code>\u003c/td>\u003ctd>Stop + start.\u003c/td>\u003ctd>Pick up the fix now instead of waiting for the next auto-restart.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>curl -s localhost/health\u003c/code>\u003c/td>\u003ctd>Calls the health endpoint.\u003c/td>\u003ctd>Confirms the app is really serving again.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>", "root": "\u003cdiv class='tablewrap'>\u003ctable>\u003ctbody>\u003ctr>\u003ctd>Root cause\u003c/td>\u003ctd>Hardening script set config to \u003ccode>root:root 0600\u003c/code> and dir to \u003ccode>0700\u003c/code>; service user lost access\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prevent\u003c/td>\u003ctd>Test hardening in staging; manage file modes in config management; health-check after changes\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "explain": "\u003cp>\u003cstrong>502 = proxy fine, backend not.\u003c/strong> nginx answered, so look at shopapp (\u003ccode>systemctl status\u003c/code>, \u003ccode>journalctl -u shopapp\u003c/code>). The log says \u003ccode>Permission denied\u003c/code> on the config.\u003c/p>\n\u003cp>\u003cstrong>Permission rule you must know:\u003c/strong> to open \u003ccode>/etc/shopapp/config.ini\u003c/code> a user needs \u003ccode>r\u003c/code> on the file \u003cstrong>and\u003c/strong> \u003ccode>x\u003c/code> (search) on \u003cstrong>every directory\u003c/strong> on the path. \u003ccode>namei -l &lt;path&gt;\u003c/code> prints owner and mode of each component - the broken one stands out.\u003c/p>\n\u003cp>\u003cstrong>Test as the service user.\u003c/strong> \u003ccode>root\u003c/code> ignores file permissions (DAC), so \u003ccode>sudo cat\u003c/code> \"works\" and proves nothing. Use \u003ccode>sudo -u shopapp cat ...\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Least privilege with groups:\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode class=\"lang-text\">root:shopapp 0640 config.ini   \u003cspan class=\"c\"># root rw, group shopapp r, others nothing\u003c/span>\n0755 /etc/shopapp              \u003cspan class=\"c\"># directory itself holds no secret; the file does\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>The security goal (others cannot read the config) stays true; only the service user's group gets read access. Wrong fixes: \u003ccode>chmod 777\u003c/code>, \u003ccode>chmod 644\u003c/code> (world-readable = violates the goal), \u003ccode>User=root\u003c/code> (service gets too much power).\u003c/p>", "mcq": [{"q": "nginx returns 502 Bad Gateway. What does that tell you?", "o": ["nginx is up, but its backend (shopapp) is not answering correctly", "nginx itself is down", "DNS is broken", "The client certificate is invalid"], "why": "A 502 is generated by the proxy when the upstream fails. Start with the backend."}, {"q": "Why is `sudo cat /etc/shopapp/config.ini` NOT a valid test of whether shopapp can read it?", "o": ["root bypasses file permission checks; you must test as the service user (sudo -u shopapp)", "sudo strips the file path", "cat cannot open .ini files", "sudo cat is always denied"], "why": "DAC permission checks do not apply to root, so the test must run as the real service user."}, {"q": "Which result best meets 'shopapp can read the config, others cannot'?", "o": ["chown root:shopapp config.ini; chmod 0640 config.ini (and make the directory traversable)", "chmod 777 config.ini", "chmod 644 config.ini", "Change the unit to User=root"], "why": "Group read for the service group; no access for others. 777/644 are too open; root is excessive privilege."}], "qa": [{"q": "What does `namei -l /etc/shopapp/config.ini` show and why was it the key command?", "a": "It prints owner, group and mode of every component of the path (/, etc, shopapp, config.ini). It revealed `drwx------ root` on the shopapp directory (no `x` for the shopapp user) and `-rw------- root` on the file (no `r`) - two separate problems that a single `ls -l` of the file would have hidden."}, {"q": "Why is `chmod 644 config.ini` the wrong fix even though the service then starts?", "a": "It makes the config world-readable, which is exactly what the security team's hardening wanted to prevent. The correct fix grants read through the group (root:shopapp 0640) so the requirement and the service both work."}]}, {"id": "e04", "level": "easy", "title": "\"The internet is down\" (DNS)", "time": "20 min", "skills": "name resolution, resolv.conf, /etc/hosts, nsswitch", "ticket": "\u003cblockquote>\u003cstrong>INC-1004 · P2\u003c/strong>\u003cbr>\n\u003ccode>sudo apt update\u003c/code> fails with \u003ccode>Temporary failure resolving 'archive.ubuntu.com'\u003c/code>.\u003cbr>\nAlso, a payment check calls \u003ccode>https://example.com\u003c/code> and fails with a TLS/connection error.\u003cbr>\nPing to \u003ccode>8.8.8.8\u003c/code> still works. Fix name resolution on this host.\u003c/blockquote>", "success": "\u003cul>\u003cli>Public names resolve (\u003ccode>getent ahosts ubuntu.com\u003c/code>)\u003c/li>\u003cli>\u003ccode>example.com\u003c/code> resolves to its real address and \u003ccode>curl https://example.com\u003c/code> works\u003c/li>\u003c/ul>", "warmup": "\u003cp>The solution uses long command lines. They are just short commands with one flag added at a time. Practise each ladder on any Linux box first (all read-only). Every rung adds \u003cstrong>one\u003c/strong> thing to the rung above - stop at the rung you understand, and read the next one only when you are ready. The lab itself uses the last rung of each ladder.\u003c/p>\n\u003ch4>ping / dig / getent - names and addresses\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">ping 8.8.8.8                       \u003cspan class=\"c\"># 1. is the network reachable? (Ctrl-C to stop)\u003c/span>\nping -c2 8.8.8.8                   \u003cspan class=\"c\"># 2. -c2 = send 2 and stop\u003c/span>\nping -c2 ubuntu.com                \u003cspan class=\"c\"># 3. same, by name: tests DNS + network\u003c/span>\ndig ubuntu.com                     \u003cspan class=\"c\"># 4. ask DNS directly (shows the whole answer)\u003c/span>\ndig +short ubuntu.com              \u003cspan class=\"c\"># 5. only the answer\u003c/span>\ndig @8.8.8.8 +short ubuntu.com     \u003cspan class=\"c\"># 6. @server = ask THAT server instead of the default\u003c/span>\ngetent hosts ubuntu.com            \u003cspan class=\"c\"># 7. resolve like programs do (/etc/hosts first, then DNS)\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>ls -l / cat - is resolv.conf a file or a symlink?\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">cat /etc/resolv.conf                 \u003cspan class=\"c\"># 1. which DNS server do programs use?\u003c/span>\nls -l /etc/resolv.conf               \u003cspan class=\"c\"># 2. a leading 'l' and '-&gt;' mean symlink; '-' means plain file\u003c/span>\nresolvectl status                    \u003cspan class=\"c\"># 3. what systemd-resolved itself uses\u003c/span>\nresolvectl status | grep -A2 'DNS Servers'    \u003cspan class=\"c\"># 4. only the DNS part\u003c/span>\ngrep hosts /etc/nsswitch.conf        \u003cspan class=\"c\"># 5. the lookup ORDER programs use (files = /etc/hosts, dns = DNS servers)\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>ln - symlinks\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">ln -s TARGET LINKNAME                \u003cspan class=\"c\"># 1. LINKNAME now points to TARGET\u003c/span>\nln -sf TARGET LINKNAME               \u003cspan class=\"c\"># 2. -f = replace LINKNAME if it exists\u003c/span>\nreadlink -f LINKNAME                 \u003cspan class=\"c\"># 3. where does it really point?\u003c/span>\u003c/code>\u003c/pre>", "hints": [{"title": "Hint 1 - network or DNS?", "html": "\u003cp>\u003ccode>ping -c2 8.8.8.8\u003c/code> works, \u003ccode>ping -c2 ubuntu.com\u003c/code> does not -&gt; IP works, names do not. That is DNS. Which server does this host ask? \u003ccode>cat /etc/resolv.conf\u003c/code>, \u003ccode>resolvectl status\u003c/code>.\u003c/p>"}, {"title": "Hint 2 - test the resolver directly", "html": "\u003cp>\u003ccode>dig ubuntu.com\u003c/code> uses resolv.conf. \u003ccode>dig @127.0.0.53 ubuntu.com\u003c/code> asks systemd-resolved. \u003ccode>dig @1.1.1.1 ubuntu.com\u003c/code> asks a public resolver. Compare. \u003ccode>ls -l /etc/resolv.conf\u003c/code> - what is it normally on Ubuntu?\u003c/p>"}, {"title": "Hint 3 - dig and curl disagree", "html": "\u003cp>After fixing DNS, \u003ccode>dig example.com\u003c/code> may be right but \u003ccode>curl\u003c/code> still goes to a wrong IP. \u003ccode>dig\u003c/code> asks DNS only. Apps use \u003ccode>getent hosts\u003c/code> order from \u003ccode>/etc/nsswitch.conf\u003c/code> - \u003ccode>files\u003c/code> (= \u003ccode>/etc/hosts\u003c/code>) comes before \u003ccode>dns\u003c/code>.\u003c/p>"}], "learn": "\u003cul>\u003cli>Split the problem: IP connectivity (\u003ccode>ping &lt;ip&gt;\u003c/code>) vs. name resolution (\u003ccode>getent hosts &lt;name&gt;\u003c/code>).\u003c/li>\u003cli>On modern Ubuntu, \u003ccode>/etc/resolv.conf\u003c/code> is a symlink managed by systemd-resolved. Hand edits get lost or break things.\u003c/li>\u003cli>\u003ccode>dig\u003c/code>/\u003ccode>nslookup\u003c/code> bypass \u003ccode>/etc/hosts\u003c/code>. \u003ccode>getent hosts\u003c/code> shows what applications really get.\u003c/li>\u003cli>Stale \u003ccode>/etc/hosts\u003c/code> entries are a classic cause of \"works on my box, not on this one\".\u003c/li>\u003c/ul>", "solution": "\u003cblockquote>Long commands below are built up short-first (\u003ccode># 1.\u003c/code>, \u003ccode># 2.\u003c/code> ...). Each rung adds one flag;\u003cbr>\nthe last rung is what the lab uses. The README \u003cstrong>Warm-up\u003c/strong> explains every flag from scratch.\u003c/blockquote>\n\u003ch3>1. IP or DNS?\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">ping -c2 8.8.8.8          \u003cspan class=\"c\"># works -&gt; routing/internet OK\u003c/span>\nping -c2 ubuntu.com       \u003cspan class=\"c\"># \"Temporary failure in name resolution\" -&gt; DNS\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>ping -c2 8.8.8.8\u003c/code>\u003c/td>\u003ctd>Sends 2 ICMP echoes (\u003ccode>-c2\u003c/code>) to a raw IP.\u003c/td>\u003ctd>Works = routing and internet are fine. Splits the problem: network vs name resolution.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ping -c2 ubuntu.com\u003c/code>\u003c/td>\u003ctd>Same, by name.\u003c/td>\u003ctd>\u003ccode>Temporary failure in name resolution\u003c/code> while the IP works = \u003cstrong>DNS\u003c/strong> problem.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>2. Which resolver do we use?\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">ls -l /etc/resolv.conf\n\u003cspan class=\"c\"># -rw-r--r-- 1 root root ... /etc/resolv.conf     &lt;-- a plain file, normally a symlink\u003c/span>\ncat /etc/resolv.conf\n\u003cspan class=\"c\"># nameserver 10.255.255.53                        &lt;-- dead server\u003c/span>\ndig ubuntu.com                      \u003cspan class=\"c\"># ;; connection timed out; no servers could be reached\u003c/span>\ndig @127.0.0.53 ubuntu.com           \u003cspan class=\"c\"># 1. ask one specific server (127.0.0.53 = systemd-resolved)\u003c/span>\ndig @127.0.0.53 ubuntu.com +short    \u003cspan class=\"c\"># 2. only the answer: systemd-resolved still works\u003c/span>\nresolvectl status                    \u003cspan class=\"c\"># 1. everything systemd-resolved knows\u003c/span>\nresolvectl status | grep -A2 'DNS Servers'   \u003cspan class=\"c\"># 2. -A2 = the match + 2 lines after it\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>ls -l /etc/resolv.conf\u003c/code>\u003c/td>\u003ctd>Long listing incl. symlink target.\u003c/td>\u003ctd>On Ubuntu it should be a symlink into \u003ccode>/run/systemd/resolve/\u003c/code>. A plain file means someone overwrote it.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>cat /etc/resolv.conf\u003c/code>\u003c/td>\u003ctd>Prints the resolver list.\u003c/td>\u003ctd>Shows \u003ccode>nameserver 10.255.255.53\u003c/code> - a dead server.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>dig ubuntu.com\u003c/code>\u003c/td>\u003ctd>DNS query tool; uses the servers in resolv.conf.\u003c/td>\u003ctd>\u003ccode>connection timed out; no servers could be reached\u003c/code> confirms that nameserver is dead.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>dig @127.0.0.53 ubuntu.com +short\u003c/code>\u003c/td>\u003ctd>Queries a \u003cstrong>specific\u003c/strong> server (\u003ccode>@\u003c/code>); \u003ccode>+short\u003c/code> prints just the answer.\u003c/td>\u003ctd>\u003ccode>127.0.0.53\u003c/code> is systemd-resolved's stub. It works, so the resolver service is healthy and only the pointer is wrong.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>resolvectl status\u003c/code>\u003c/td>\u003ctd>Shows per-link DNS servers known to systemd-resolved.\u003c/td>\u003ctd>Verify the real upstream DNS is configured.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>3. Fix fault 1 - give resolv.conf back to systemd-resolved\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo ln -sf /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf\ngetent ahosts ubuntu.com | head -2\nsudo apt update     \u003cspan class=\"c\"># works\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>ln -sf /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf\u003c/code>\u003c/td>\u003ctd>Creates a symlink; \u003ccode>-s\u003c/code> symbolic, \u003ccode>-f\u003c/code> replace existing.\u003c/td>\u003ctd>Restores the standard setup: resolv.conf managed by systemd-resolved again.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>getent ahosts ubuntu.com\u003c/code>\u003c/td>\u003ctd>Resolves via the \u003cstrong>system resolver path\u003c/strong> (nsswitch), same as apps do.\u003c/td>\u003ctd>More realistic than \u003ccode>dig\u003c/code>, which bypasses \u003ccode>/etc/hosts\u003c/code> and nsswitch.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>apt update\u003c/code>\u003c/td>\u003ctd>Refreshes package lists.\u003c/td>\u003ctd>Real-world test that name resolution works for the original complaint.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>4. Fault 2 - example.com still broken\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">dig +short example.com          \u003cspan class=\"c\"># real IP (DNS is fine now)\u003c/span>\ngetent hosts example.com        \u003cspan class=\"c\"># 203.0.113.77  &lt;-- different!\u003c/span>\ngrep -n example /etc/hosts\ngrep hosts /etc/nsswitch.conf   \u003cspan class=\"c\"># hosts: files dns  -&gt; /etc/hosts wins\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>Remove the stale line:\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo sed -i '/203\\.0\\.113\\.77/d' /etc/hosts\ngetent hosts example.com\ncurl -sI https://example.com | head -1\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>dig +short example.com\u003c/code> vs \u003ccode>getent hosts example.com\u003c/code>\u003c/td>\u003ctd>\u003ccode>dig\u003c/code> asks DNS only; \u003ccode>getent\u003c/code> follows nsswitch order.\u003c/td>\u003ctd>Two different answers = something earlier than DNS overrides it. This is how you find fault 2.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>grep -n example /etc/hosts\u003c/code>\u003c/td>\u003ctd>Finds the line in the hosts file.\u003c/td>\u003ctd>Shows the stale \u003ccode>203.0.113.77 example.com\u003c/code> entry.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>grep hosts /etc/nsswitch.conf\u003c/code>\u003c/td>\u003ctd>Shows lookup order.\u003c/td>\u003ctd>\u003ccode>hosts: files dns\u003c/code> - \u003ccode>files\u003c/code> (/etc/hosts) is consulted \u003cstrong>before\u003c/strong> DNS, so it wins.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sed -i '/203\\.0\\.113\\.77/d' /etc/hosts\u003c/code>\u003c/td>\u003ctd>Deletes every line matching the pattern (\u003ccode>\\.\u003c/code> = literal dot).\u003c/td>\u003ctd>Removes only the stale entry.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>curl -sI https://
