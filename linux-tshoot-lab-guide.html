tbody>\u003ctr>\u003ctd>\u003ccode>mount /srv/shopdata\u003c/code>\u003c/td>\u003ctd>Mounts using the fstab entry.\u003c/td>\u003ctd>Back to \u003ccode>rw\u003c/code>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ls -l lost+found/ ... backups/catalog/\u003c/code>\u003c/td>\u003ctd>Look for what fsck removed or moved.\u003c/td>\u003ctd>\u003ccode>products.db\u003c/code> is gone: restore from backup.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>cp backup /srv/shopdata/catalog/products.db; chown shopapp:shopapp ...\u003c/code>\u003c/td>\u003ctd>Restore and fix ownership.\u003c/td>\u003ctd>The service user must be able to read it.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>6. Wrong fix (and why)\u003c/h3>\n\u003cp>\u003ccode>sudo mount -o remount,rw /srv/shopdata\u003c/code> - works at first, but the filesystem still has the error flag, the broken entry is still there, and the next access can flip it to ro again or spread the damage. The checker detects it (\u003ccode>state: clean with errors\u003c/code>).\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>mount -o remount,rw\u003c/code> (the \u003cstrong>wrong\u003c/strong> fix)\u003c/td>\u003ctd>Flips to rw without repair.\u003c/td>\u003ctd>Hides the problem: error flag and broken entry remain; it can go read-only again.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>", "root": "\u003cdiv class='tablewrap'>\u003ctable>\u003ctbody>\u003ctr>\u003ctd>Root cause\u003c/td>\u003ctd>Storage glitch corrupted an inode; ext4 detected it and remounted ro (\u003ccode>errors=remount-ro\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fix\u003c/td>\u003ctd>Stop app -&gt; unmount -&gt; e2fsck -&gt; mount -&gt; restore lost file from backup -&gt; start app\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prevent\u003c/td>\u003ctd>Alert on \u003ccode>EXT4-fs error\u003c/code> in kernel log and on ro mounts; test restores regularly; investigate storage layer (SMART, hypervisor logs)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "explain": "\u003cp>\u003cstrong>What happened:\u003c/strong> a storage glitch corrupted metadata (a directory entry in \u003ccode>/catalog\u003c/code> pointed at a wiped inode). ext4 mounted with \u003ccode>errors=remount-ro\u003c/code> detected it and \u003cstrong>remounted read-only\u003c/strong> to protect the data - the \"Read-only file system\" error is a \u003cstrong>symptom\u003c/strong>, not the problem.\u003c/p>\n\u003cp>\u003cstrong>Evidence:\u003c/strong> \u003ccode>findmnt /srv/shopdata\u003c/code> (options \u003ccode>ro\u003c/code>), \u003ccode>journalctl -k | grep -i ext4\u003c/code> (\u003ccode>EXT4-fs error ... Remounting filesystem read-only\u003c/code>), \u003ccode>dumpe2fs -h &lt;dev&gt; | grep -i state\u003c/code> -&gt; \u003ccode>clean with errors\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Correct recovery order:\u003c/strong>\u003c/p>\n\u003col>\u003cli>stop writers (\u003ccode>systemctl stop shopapp\u003c/code>, \u003ccode>cd /\u003c/code> yourself, \u003ccode>fuser -vm\u003c/code>)\u003c/li>\u003cli>\u003ccode>umount /srv/shopdata\u003c/code>\u003c/li>\u003cli>\u003ccode>e2fsck -f &lt;device-or-image&gt;\u003c/code> (run again; second run must be clean)\u003c/li>\u003cli>mount, check what is missing (\u003ccode>lost+found\u003c/code>)\u003c/li>\u003cli>restore the lost file from backup (\u003ccode>products.db\u003c/code>), fix ownership\u003c/li>\u003cli>start the app, test \u003ccode>/health\u003c/code>\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>Never\u003c/strong> \u003ccode>fsck\u003c/code> a mounted filesystem (it can destroy it). \u003cstrong>Never\u003c/strong> \"fix\" it with \u003ccode>mount -o remount,rw\u003c/code> - the error flag and broken entry remain, and the next access can flip it back or spread the damage. After fsck, files may vanish or end up in \u003ccode>lost+found\u003c/code> - backups are part of recovery.\u003c/p>", "mcq": [{"q": "Why did /srv/shopdata become read-only without anyone changing mounts?", "o": ["ext4 detected corruption and remounted read-only (errors=remount-ro) to protect data", "The disk is full", "A cron job ran mount -o ro", "SELinux changed it"], "why": "The kernel decided; its log names the device and function."}, {"q": "What is the correct sequence?", "o": ["Stop writers -> umount -> e2fsck -f -> mount -> verify/restore -> start app", "remount rw -> start app -> fsck", "fsck on the mounted volume -> reboot", "Delete the volume and recreate it"], "why": "fsck needs the filesystem unmounted; restore data before restarting writers."}, {"q": "Why is `mount -o remount,rw` the wrong fix?", "o": ["It hides the symptom but leaves the corruption; it can fail again or spread damage", "It needs a reboot", "It deletes lost+found", "It always fails"], "why": "The filesystem still has errors; run e2fsck."}], "qa": [{"q": "A colleague wants to run e2fsck right away on the mounted volume 'to save time'. What do you say?", "a": "No. fsck must run on an unmounted (or read-only, with caution) filesystem; running it on a mounted rw filesystem can corrupt it further. Stop the writers, unmount (find holders with `fuser -vm`), then run `e2fsck -f`."}, {"q": "After fsck, `products.db` is gone. What now?", "a": "Check `lost+found`, then restore from the latest good backup in /srv/backups/catalog, set ownership to shopapp, start the service and verify /health. Then investigate the storage layer (hypervisor logs, SMART) and test restores regularly."}]}, {"id": "h03", "level": "hard", "title": "Service unreachable across networks (layered faults)", "time": "60 min", "skills": "routing, IP forwarding, firewall, tcpdump, network namespaces", "ticket": "\u003cblockquote>\u003cstrong>INC-3003 · P1\u003c/strong>\u003cbr>\nClients on the \u003cstrong>client network\u003c/strong> cannot reach \u003cstrong>inventory-api\u003c/strong> at \u003ccode>http://10.200.0.2:9000\u003c/code>.\u003cbr>\nThe app team swears the service is up. The network team swears the network is fine.\u003cbr>\nFind every problem along the path and fix it. The fix must survive a reboot of the router.\u003c/blockquote>\n\u003cp>Setup: this VM is the \u003cstrong>router\u003c/strong> between two \"machines\". Each machine is a Linux \u003cem>network namespace\u003c/em> (like a container):\u003c/p>\n\u003cpre>\u003ccode class=\"lang-text\"> [client-ns]                         [ this VM = router ]                         [app-ns]\n cl0 10.201.0.2/24  &lt;----veth----&gt;  h-cl 10.201.0.1/24                      inventory-api :9000\n                                    h-ap 10.200.0.1/24  &lt;----veth----&gt;  ap0 10.200.0.2/24\u003c/code>\u003c/pre>\n\u003cp>Run a command \"on\" a machine with \u003ccode>sudo ip netns exec client-ns &lt;cmd&gt;\u003c/code> or \u003ccode>sudo ip netns exec app-ns &lt;cmd&gt;\u003c/code>.\u003c/p>", "success": "\u003cul>\u003cli>\u003ccode>sudo ip netns exec client-ns curl http://10.200.0.2:9000/\u003c/code> returns \u003ccode>inventory-api OK\u003c/code>\u003c/li>\u003cli>The router config is persistent\u003c/li>\u003c/ul>", "warmup": "\u003cp>The solution uses long command lines. They are just short commands with one flag added at a time. Practise each ladder on any Linux box first (all read-only). Every rung adds \u003cstrong>one\u003c/strong> thing to the rung above - stop at the rung you understand, and read the next one only when you are ready. The lab itself uses the last rung of each ladder.\u003c/p>\n\u003ch4>ip / ip netns - addresses, routes, namespaces\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">ip addr                                  \u003cspan class=\"c\"># 1. interfaces and their IPs (short: ip a)\u003c/span>\nip -br addr                              \u003cspan class=\"c\"># 2. -br = brief, one line per interface\u003c/span>\nip route                                 \u003cspan class=\"c\"># 3. routing table: 'default via X' = where unknown traffic goes\u003c/span>\nip route get 10.0.0.5                    \u003cspan class=\"c\"># 4. which route/interface would the kernel use for THIS destination?\u003c/span>\nip netns list                            \u003cspan class=\"c\"># 5. namespaces = separate mini network stacks (lab hosts)\u003c/span>\nsudo ip netns exec NAME ip route         \u003cspan class=\"c\"># 6. run any command INSIDE a namespace\u003c/span>\nC=\"sudo ip netns exec NAME\"; $C ip route \u003cspan class=\"c\"># 7. shortcut variable so you type less\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>ping / curl - test hop by hop\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">ping -c2 10.201.0.1                        \u003cspan class=\"c\"># 1. the first hop (your gateway)\u003c/span>\nping -c2 -W1 10.200.0.2                    \u003cspan class=\"c\"># 2. the far side; -W1 = wait only 1 s per reply\u003c/span>\ncurl -s --max-time 3 10.200.0.2:9000       \u003cspan class=\"c\"># 3. the actual service (TCP port!) - ping working does not prove this\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>tcpdump - watch packets\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo tcpdump -i eth0                      \u003cspan class=\"c\"># 1. every packet on an interface (very noisy)\u003c/span>\nsudo tcpdump -ni eth0                     \u003cspan class=\"c\"># 2. -n = no name lookups\u003c/span>\nsudo tcpdump -ni eth0 icmp                \u003cspan class=\"c\"># 3. filter: only ping\u003c/span>\nsudo tcpdump -ni eth0 port 80             \u003cspan class=\"c\"># 4. filter: only port 80\u003c/span>\nsudo tcpdump -ni eth0 'tcp port 80 and host 10.0.0.5'   \u003cspan class=\"c\"># 5. combine with and/or\u003c/span>\nsudo tcpdump -ni eth0 -c 5 icmp           \u003cspan class=\"c\"># 6. -c 5 = stop after 5 packets\u003c/span>\n\u003cspan class=\"c\"># Reading it: packets arrive on one side but nothing leaves the other side -&gt; something in between drops/does not forward.\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>iptables - read the firewall\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo iptables -L                              \u003cspan class=\"c\"># 1. list rules (all chains)\u003c/span>\nsudo iptables -L INPUT                        \u003cspan class=\"c\"># 2. one chain: INPUT = traffic TO this host; FORWARD = through; OUTPUT = from\u003c/span>\nsudo iptables -L INPUT -n                     \u003cspan class=\"c\"># 3. -n = numbers, no DNS (much faster)\u003c/span>\nsudo iptables -L INPUT -n -v                  \u003cspan class=\"c\"># 4. -v = packet/byte counters: does the number rise when you test? -&gt; that rule hits\u003c/span>\nsudo iptables -L INPUT -n -v --line-numbers   \u003cspan class=\"c\"># 5. rule numbers, so you can delete/insert by number\u003c/span>\nsudo iptables -S                              \u003cspan class=\"c\"># 6. the same rules as commands (easy to copy, grep)\u003c/span>\n\u003cspan class=\"c\"># change:  -D INPUT 1  (delete rule 1)   -I INPUT 1 &lt;rule&gt;  (insert at top)   -A  (append at end)\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>sysctl - read and change kernel settings\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">sysctl vm.swappiness                    \u003cspan class=\"c\"># 1. read one setting\u003c/span>\nsysctl -a | grep swappiness             \u003cspan class=\"c\"># 2. list all, filter (when you do not know the exact name)\u003c/span>\nsudo sysctl -w vm.swappiness=60         \u003cspan class=\"c\"># 3. -w = set NOW (lost at reboot)\u003c/span>\ncat /etc/sysctl.d/*.conf                \u003cspan class=\"c\"># 4. where permanent values live\u003c/span>\nsudo sysctl --system                    \u003cspan class=\"c\"># 5. re-read all files; the LAST file wins on a conflict\u003c/span>\u003c/code>\u003c/pre>", "hints": [{"title": "Hint 1 - work layer by layer, from both ends", "html": "\u003cp>Is the service listening? (\u003ccode>ip netns exec app-ns ss -ltn\u003c/code>). Does it answer locally? (\u003ccode>ip netns exec app-ns curl 10.200.0.2:9000\u003c/code>). Can the client reach its gateway? Can the client ping the server? Go hop by hop. There is \u003cstrong>more than one\u003c/strong> fault.\u003c/p>"}, {"title": "Hint 2 - where do packets die?", "html": "\u003cp>Run \u003ccode>sudo tcpdump -ni h-ap\u003c/code> in one terminal and ping/curl from the client in another. Do you see requests arriving at h-ap? Do you see replies? Then look at h-cl. \u003ccode>ip route\u003c/code> in \u003cstrong>each\u003c/strong> namespace. A packet needs a route there \u003cstrong>and\u003c/strong> back.\u003c/p>"}, {"title": "Hint 3 - the router", "html": "\u003cp>A Linux box only routes between interfaces if \u003ccode>net.ipv4.ip_forward = 1\u003c/code>. Routed traffic goes through the iptables \u003cstrong>FORWARD\u003c/strong> chain, not INPUT: \u003ccode>sudo iptables -L FORWARD -nv --line-numbers\u003c/code>. Watch the packet counters.\u003c/p>"}], "learn": "\u003cul>\u003cli>Two-way thinking: a reply needs a route back. \"Ping works one way\" = check the return path.\u003c/li>\u003cli>Bisect with \u003ccode>tcpdump\u003c/code> on each hop: see where the packet is last seen.\u003c/li>\u003cli>Routers need \u003ccode>ip_forward=1\u003c/code>; routed packets hit the FORWARD chain.\u003c/li>\u003cli>iptables counters (\u003ccode>-v\u003c/code>) show which rule is matching your traffic.\u003c/li>\u003cli>Runtime changes (\u003ccode>sysctl -w\u003c/code>, \u003ccode>iptables -I\u003c/code>) are lost on reboot - persist them.\u003c/li>\u003cli>When several faults stack, each fix only moves the failure. Keep testing after each change.\u003c/li>\u003c/ul>", "solution": "\u003cblockquote>Long commands below are built up short-first (\u003ccode># 1.\u003c/code>, \u003ccode># 2.\u003c/code> ...). Each rung adds one flag;\u003cbr>\nthe last rung is what the lab uses. The README \u003cstrong>Warm-up\u003c/strong> explains every flag from scratch.\u003c/blockquote>\n\u003cp>Shortcuts used below:\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">C=\"sudo ip netns exec client-ns\"\nA=\"sudo ip netns exec app-ns\"\u003c/code>\u003c/pre>\n\u003ch3>1. Is the service up? (start at the destination)\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">$A ss -ltnp                                  \u003cspan class=\"c\"># LISTEN 10.200.0.2:9000 python3 -&gt; yes\u003c/span>\n$A curl -s 10.200.0.2:9000                   \u003cspan class=\"c\"># inventory-api OK -&gt; app is fine\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>C=\"sudo ip netns exec client-ns\"\u003c/code> etc.\u003c/td>\u003ctd>Shell variables as shortcuts.\u003c/td>\u003ctd>\u003ccode>ip netns exec NS CMD\u003c/code> runs a command inside a network namespace (simulated host).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>$A ss -ltnp\u003c/code>\u003c/td>\u003ctd>Listeners inside app-ns.\u003c/td>\u003ctd>Start at the \u003cstrong>destination\u003c/strong>: is the service even listening? Yes, \u003ccode>10.200.0.2:9000\u003c/code>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>$A curl -s 10.200.0.2:9000\u003c/code>\u003c/td>\u003ctd>Local test on the app host.\u003c/td>\u003ctd>App works, so the fault is on the path.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>2. Client side, hop by hop\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">$C ip addr show cl0                          \u003cspan class=\"c\"># 10.201.0.2/24\u003c/span>\n$C ip route                                  \u003cspan class=\"c\"># default via 10.201.0.1\u003c/span>\n$C ping -c2 10.201.0.1                       \u003cspan class=\"c\"># gateway OK\u003c/span>\n$C ping -c2 -W1 10.200.0.2                   \u003cspan class=\"c\"># 100% packet loss\u003c/span>\n$C curl -s --max-time 3 10.200.0.2:9000      \u003cspan class=\"c\"># timeout\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>$C ip addr show cl0\u003c/code> / \u003ccode>$C ip route\u003c/code>\u003c/td>\u003ctd>Client's address and routes.\u003c/td>\u003ctd>Check the first hop config: correct IP, default via the router.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>$C ping -c2 10.201.0.1\u003c/code>\u003c/td>\u003ctd>Ping the gateway.\u003c/td>\u003ctd>Gateway OK = L2/L3 to the first hop works.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>$C ping -c2 -W1 10.200.0.2\u003c/code>\u003c/td>\u003ctd>\u003ccode>-W1\u003c/code> = 1 s timeout.\u003c/td>\u003ctd>100% loss: the problem is beyond the gateway.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>3. Fault 1 - the router does not forward\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo tcpdump -i h-cl                          \u003cspan class=\"c\"># 1. everything (noisy)\u003c/span>\nsudo tcpdump -ni h-cl                         \u003cspan class=\"c\"># 2. + no name lookups\u003c/span>\nsudo tcpdump -ni h-cl icmp &amp;                  \u003cspan class=\"c\"># 3. + only ping, + background (&amp;): requests arrive from client...\u003c/span>\nsudo tcpdump -ni h-ap icmp                   \u003cspan class=\"c\"># ...but nothing leaves to app side\u003c/span>\nsysctl net.ipv4.ip_forward                   \u003cspan class=\"c\"># = 0\u003c/span>\nsudo sysctl -w net.ipv4.ip_forward=1\necho 'net.ipv4.ip_forward = 1' | sudo tee /etc/sysctl.d/90-router.conf\nsudo sysctl --system | grep ip_forward\u003c/code>\u003c/pre>\n\u003cp>Ping again: still 100% loss. Each fix moves the failure - keep going.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>tcpdump -ni h-cl icmp\u003c/code> + \u003ccode>tcpdump -ni h-ap icmp\u003c/code>\u003c/td>\u003ctd>Capture ICMP on each side of the router.\u003c/td>\u003ctd>Packets arrive on the client side and nothing leaves on the app side = the router does not forward.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sysctl net.ipv4.ip_forward\u003c/code>\u003c/td>\u003ctd>Reads the kernel setting.\u003c/td>\u003ctd>\u003ccode>0\u003c/code> = this host will not route.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sysctl -w net.ipv4.ip_forward=1\u003c/code>\u003c/td>\u003ctd>Sets it now.\u003c/td>\u003ctd>Fault 1 fixed at runtime.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>echo '...' | tee /etc/sysctl.d/90-router.conf\u003c/code>\u003c/td>\u003ctd>Writes the setting to a file; \u003ccode>tee\u003c/code> is used because \u003ccode>sudo echo &gt; file\u003c/code> would redirect as you.\u003c/td>\u003ctd>Makes it survive a reboot.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>4. Fault 2 - no return route in app-ns\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo tcpdump -ni h-ap icmp\n\u003cspan class=\"c\"># 10.201.0.2 &gt; 10.200.0.2: ICMP echo request      &lt;-- arrives at the server side\u003c/span>\n\u003cspan class=\"c\">#                                                  &lt;-- no echo reply\u003c/span>\n$A ip route\n\u003cspan class=\"c\"># 10.200.0.0/24 dev ap0 proto kernel scope link src 10.200.0.2    &lt;-- no default route!\u003c/span>\n$A ip route get 10.201.0.2\n\u003cspan class=\"c\"># RTNETLINK answers: Network is unreachable\u003c/span>\n$A ip route add default via 10.200.0.1\n$C ping -c2 10.200.0.2                       \u003cspan class=\"c\"># works now\u003c/span>\n$C curl -s --max-time 3 10.200.0.2:9000      \u003cspan class=\"c\"># still timeout!\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>ICMP works but TCP 9000 does not -&gt; something filters by port.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>$A ip route\u003c/code> and \u003ccode>$A ip route get 10.201.0.2\u003c/code>\u003c/td>\u003ctd>Routing table, and which route would be used for an address.\u003c/td>\u003ctd>\u003ccode>Network is unreachable\u003c/code>: the server has \u003cstrong>no return route\u003c/strong> (fault 2).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>$A ip route add default via 10.200.0.1\u003c/code>\u003c/td>\u003ctd>Adds a default route.\u003c/td>\u003ctd>Replies can now find their way back.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>5. Fault 3 - the firewall on the router\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo iptables -L FORWARD                      \u003cspan class=\"c\"># 1. rules in the FORWARD chain (traffic THROUGH this router)\u003c/span>\nsudo iptables -L FORWARD -n                   \u003cspan class=\"c\"># 2. + numbers only\u003c/span>\nsudo iptables -L FORWARD -nv                  \u003cspan class=\"c\"># 3. + packet counters\u003c/span>\nsudo iptables -L FORWARD -nv --line-numbers   \u003cspan class=\"c\"># 4. + rule numbers\u003c/span>\n\u003cspan class=\"c\"># num pkts bytes target prot ... dpt:9000 /* SEC-204 block legacy admin port */\u003c/span>\n\u003cspan class=\"c\">#  1     6   360  DROP   tcp  ...\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>Counter goes up each time you curl -&gt; this rule drops our traffic. Port 9000 is inventory-api, not a \"legacy admin port\". Talk to security (change ticket), then:\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo iptables -D FORWARD 1                   \u003cspan class=\"c\"># or: -D FORWARD -p tcp --dport 9000 -m comment --comment \"...\" -j DROP\u003c/span>\n$C curl -s 10.200.0.2:9000                   \u003cspan class=\"c\"># inventory-api OK\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>Persist firewall changes in whatever the host uses (\u003ccode>iptables-save &gt; /etc/iptables/rules.v4\u003c/code> with \u003ccode>iptables-persistent\u003c/code>, nftables config, ufw, or your config management) - otherwise the old rule (or no rule) comes back after reboot.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>iptables -L FORWARD -nv --line-numbers\u003c/code>\u003c/td>\u003ctd>Router's forwarding rules with counters.\u003c/td>\u003ctd>Fault 3: \u003ccode>DROP tcp dpt:9000\u003c/code> (SEC-204) with growing counter. ICMP works but TCP 9000 does not -&gt; port filter.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>iptables -D FORWARD 1\u003c/code>\u003c/td>\u003ctd>Delete rule 1.\u003c/td>\u003ctd>Only after agreeing with security (change ticket).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>iptables-save &gt; /etc/iptables/rules.v4\u003c/code>\u003c/td>\u003ctd>Dump current rules.\u003c/td>\u003ctd>Persist so the change survives reboot.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>", "root": "\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Layer\u003c/th>\u003cth>Fault\u003c/th>\u003cth>Tool that found it\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>L3 router\u003c/td>\u003ctd>\u003ccode>ip_forward=0\u003c/code>\u003c/td>\u003ctd>tcpdump on both router legs, sysctl\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>L3 server\u003c/td>\u003ctd>no default/return route in app-ns\u003c/td>\u003ctd>tcpdump (request, no reply), \u003ccode>ip route get\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>L4 filter\u003c/td>\u003ctd>FORWARD DROP for tcp/9000 (wrong port in SEC-204)\u003c/td>\u003ctd>\u003ccode>iptables -L -nv\u003c/code> counters\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Prevent:\u003c/strong> connectivity probes from each network (synthetic checks); peer review of firewall changes with port ownership; manage routes/sysctl/firewall in config management.\u003c/p>", "explain": "\u003cp>\u003cstrong>Three stacked faults on the path client-ns -&gt; router (this VM) -&gt; app-ns.\u003c/strong> Each fix only moves the failure forward - keep testing.\u003c/p>\n\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Layer\u003c/th>\u003cth>Fault\u003c/th>\u003cth>How found\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>router\u003c/td>\u003ctd>\u003ccode>net.ipv4.ip_forward = 0\u003c/code>\u003c/td>\u003ctd>tcpdump on \u003ccode>h-cl\u003c/code> sees requests, nothing leaves \u003ccode>h-ap\u003c/code>; \u003ccode>sysctl\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>server\u003c/td>\u003ctd>no route back (no default route in app-ns)\u003c/td>\u003ctd>tcpdump on \u003ccode>h-ap\u003c/code>: request arrives, no reply; \u003ccode>ip route get\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>firewall\u003c/td>\u003ctd>\u003ccode>FORWARD DROP tcp dport 9000\u003c/code> (SEC-204 wrong port)\u003c/td>\u003ctd>ping works but curl times out; \u003ccode>iptables -L FORWARD -nv\u003c/code> counters\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Principles:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>Two-way thinking: a reply needs a route back.\u003c/li>\u003cli>Bisect with \u003ccode>tcpdump\u003c/code> on each hop: find where the packet is last seen.\u003c/li>\u003cli>Routed traffic hits \u003cstrong>FORWARD\u003c/strong>, not INPUT.\u003c/li>\u003cli>Counters (\u003ccode>-v\u003c/code>) show which rule matches your traffic.\u003c/li>\u003cli>ICMP working but TCP not -&gt; a port-specific filter.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Persistence matters:\u003c/strong> \u003ccode>sysctl -w\u003c/code> and \u003ccode>iptables -D/-I\u003c/code> vanish on reboot. Use \u003ccode>/etc/sysctl.d/90-router.conf\u003c/code> and \u003ccode>iptables-save &gt; /etc/iptables/rules.v4\u003c/code> (or nftables/ufw/config management).\u003c/p>", "mcq": [{"q": "A Linux box forwards packets between two interfaces only if:", "o": ["net.ipv4.ip_forward = 1", "net.ipv4.tcp_syncookies = 1", "rp_filter = 0", "swap is enabled"], "why": "Without ip_forward the kernel drops packets not addressed to itself."}, {"q": "Ping between the namespaces works but `curl :9000` times out. What does that suggest?", "o": ["A port-specific filter such as an iptables FORWARD DROP rule", "ip_forward is off", "The cable is unplugged", "DNS is broken"], "why": "ICMP passing proves routing; the TCP port is filtered."}, {"q": "tcpdump on h-ap shows ICMP echo requests arriving but no replies leaving. What is most likely?", "o": ["The server has no route back to the client network", "The client has no default route", "The router has no firewall", "The server is powered off"], "why": "The reply cannot be routed; check `ip route` / `ip route get \u003cclient>` in app-ns."}], "qa": [{"q": "Describe the bisect method you used to find where packets die.", "a": "Start at the destination (service listening, answers locally), then the client (address, gateway, ping gateway), then run tcpdump on both router legs while pinging/curling. See on which interface the packet is last seen and whether replies exist; fix that fault, retest, repeat."}, {"q": "For each of the three fixes, how do you make it survive a reboot of the router?", "a": "ip_forward: `/etc/sysctl.d/90-router.conf` (`net.ipv4.ip_forward = 1`). Route in app-ns: persist in that machine's network config (netplan/systemd-networkd or the namespace setup). Firewall: remove the bad rule from the persistent rule set (`iptables-save > /etc/iptables/rules.v4`, nftables config, ufw or config management)."}]}, {"id": "h04", "level": "hard", "title": "\"The server is slow\" (and the obvious suspect is innocent)", "time": "45 min", "skills": "USE method, CPU vs. IO wait, per-process IO, systemd timers", "ticket": "\u003cblockquote>\u003cstrong>INC-3004 · P2\u003c/strong>\u003cbr>\nEverything on the box feels slow: shell commands lag, \u003ccode>apt\u003c/code> and file writes crawl,\u003cbr>\nshopapp latency is up. The junior on shift says: \u003cem>\"top shows \u003ccode>batch-encoder\u003c/code> at 100% CPU.\u003cbr>\nI'll kill it.\"\u003c/em> - \u003cstrong>Stop. Don't kill anything yet.\u003c/strong>\u003cbr>\n\u003ccode>batch-encoder\u003c/code> is an approved job that is \u003cem>supposed\u003c/em> to use idle CPU.\u003cbr>\nFind the real bottleneck with evidence, fix it, and keep \u003ccode>batch-encoder\u003c/code> running.\u003c/blockquote>", "success": "\u003cul>\u003cli>\u003ccode>batch-encoder\u003c/code> still running at nice 19\u003c/li>\u003cli>The real cause stopped \u003cstrong>or\u003c/strong> limited so it cannot hurt the box, and it won't come back unconstrained\u003c/li>\u003cli>You can explain with numbers why batch-encoder was \u003cem>not\u003c/em> the cause\u003c/li>\u003c/ul>", "warmup": "\u003cp>The solution uses long command lines. They are just short commands with one flag added at a time. Practise each ladder on any Linux box first (all read-only). Every rung adds \u003cstrong>one\u003c/strong> thing to the rung above - stop at the rung you understand, and read the next one only when you are ready. The lab itself uses the last rung of each ladder.\u003c/p>\n\u003ch4>uptime / top - CPU\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">uptime                  \u003cspan class=\"c\"># 1. load average: 1, 5, 15 min. Compare to the CPU count:\u003c/span>\nnproc                   \u003cspan class=\"c\"># 2. number of CPUs. load 2.0 on 2 CPUs = fully busy\u003c/span>\ntop                     \u003cspan class=\"c\"># 3. live view. P = sort by CPU, M = by memory, 1 = per-CPU, q = quit\u003c/span>\ntop -bn1 | head -5      \u003cspan class=\"c\"># 4. -b = batch (plain text), -n1 = one snapshot -&gt; good for logs and pipes\u003c/span>\n\u003cspan class=\"c\"># CPU line: us=user sy=kernel ni=niced id=idle wa=waiting for disk\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>free / vmstat - memory and swap\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">free                    \u003cspan class=\"c\"># 1. memory in KB\u003c/span>\nfree -m                 \u003cspan class=\"c\"># 2. in MB; read the 'available' column, not 'free'\u003c/span>\nvmstat                  \u003cspan class=\"c\"># 3. one summary line since boot\u003c/span>\nvmstat 1 5              \u003cspan class=\"c\"># 4. a line per second, 5 times (ignore the first line)\u003c/span>\n\u003cspan class=\"c\"># columns: r=runnable b=blocked si/so=swap in/out wa=CPU waiting for disk. si/so &gt; 0 for long = swapping.\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>iostat / pidstat - disk activity\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">iostat                          \u003cspan class=\"c\"># 1. summary since boot\u003c/span>\niostat -x 1 3                   \u003cspan class=\"c\"># 2. -x = extended (utilisation, latency), every 1 s, 3 times\u003c/span>\niostat -xz 1 3                  \u003cspan class=\"c\"># 3. -z = hide idle devices\u003c/span>\nsudo pidstat -d 1 5             \u003cspan class=\"c\"># 4. -d = disk IO per PROCESS, every 1 s, 5 times\u003c/span>\nps -eo pid,stat,wchan:22,cmd | awk '$2 ~ /D/'   \u003cspan class=\"c\"># 5. D = uninterruptible sleep = waiting for IO\u003c/span>\n\u003cspan class=\"c\"># %util near 100 and high await = the disk is the bottleneck.\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>systemctl + journalctl - service state and logs\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">systemctl status nginx                          \u003cspan class=\"c\"># 1. state, last exit code, last log lines\u003c/span>\nsystemctl is-active nginx                       \u003cspan class=\"c\"># 2. one word: active / failed / inactive\u003c/span>\njournalctl -u nginx                             \u003cspan class=\"c\"># 3. the whole log of one unit (-u = unit)\u003c/span>\njournalctl -u nginx -n 20                       \u003cspan class=\"c\"># 4. only the last 20 lines\u003c/span>\njournalctl -u nginx -n 20 --no-pager            \u003cspan class=\"c\"># 5. print straight to the terminal (no less)\u003c/span>\njournalctl -u nginx --since \"10 min ago\"        \u003cspan class=\"c\"># 6. time window instead of line count\u003c/span>\u003c/code>\u003c/pre>", "hints": [{"title": "Hint 1 - look at all resources, not only CPU", "html": "\u003cp>USE method: for each resource (CPU, memory, disk, network) check \u003cstrong>U\u003c/strong>tilisation, \u003cstrong>S\u003c/strong>aturation, \u003cstrong>E\u003c/strong>rrors. Start with \u003ccode>vmstat 1 5\u003c/code> - read \u003ccode>r\u003c/code>, \u003ccode>b\u003c/code>, \u003ccode>us\u003c/code>, \u003ccode>sy\u003c/code>, \u003ccode>id\u003c/code>, \u003ccode>wa\u003c/code>. In \u003ccode>top\u003c/code>, the header line \u003ccode>%Cpu(s)\u003c/code> has \u003ccode>ni\u003c/code> and \u003ccode>wa\u003c/code> - what do they mean?\u003c/p>"}, {"title": "Hint 2 - which disk, which process?", "html": "\u003cp>\u003ccode>iostat -xz 1 3\u003c/code> - look at \u003ccode>w/s\u003c/code>, \u003ccode>w_await\u003c/code>, \u003ccode>%util\u003c/code>. \u003ccode>sudo pidstat -d 1 5\u003c/code> or \u003ccode>sudo iotop -o\u003c/code> shows IO per process. \u003ccode>ps -eo pid,stat,wchan:20,cmd | awk '$2 ~ /D/'\u003c/code> shows tasks blocked on IO.\u003c/p>"}, {"title": "Hint 3 - it comes back", "html": "\u003cp>\u003ccode>systemctl status &lt;PID&gt;\u003c/code> shows the unit. Look for a \u003ccode>TriggeredBy:\u003c/code> line. \u003ccode>systemctl list-timers --all\u003c/code>. Stopping the service is not enough if a timer restarts it. Options: stop + disable the timer, or keep it but give it a low IO priority (\u003ccode>sudo systemctl edit audit-sync.service\u003c/code> -&gt; \u003ccode>IOSchedulingClass=idle\u003c/code> / \u003ccode>IOWeight=\u003c/code> / \u003ccode>IOWriteBandwidthMax=\u003c/code>).\u003c/p>"}], "learn": "\u003cul>\u003cli>High CPU from a \u003cstrong>niced\u003c/strong> process is mostly harmless: the scheduler gives CPU to normal tasks first. \u003ccode>ni\u003c/code> in top.\u003c/li>\u003cli>\u003ccode>wa\u003c/code> (iowait) high + processes in \u003ccode>D\u003c/code> state + disk \u003ccode>%util\u003c/code> high = \u003cstrong>IO bottleneck\u003c/strong>.\u003c/li>\u003cli>Small synchronous writes (\u003ccode>O_DSYNC\u003c/code>, \u003ccode>fsync\u003c/code>) can saturate a disk at low MB/s.\u003c/li>\u003cli>Evidence before action. Killing the obvious suspect would have hurt the business and fixed nothing.\u003c/li>\u003cli>systemd timers restart work just like cron. \u003ccode>TriggeredBy:\u003c/code> tells you.\u003c/li>\u003c/ul>", "solution": "\u003cblockquote>Long commands below are built up short-first (\u003ccode># 1.\u003c/code>, \u003ccode># 2.\u003c/code> ...). Each rung adds one flag;\u003cbr>\nthe last rung is what the lab uses. The README \u003cstrong>Warm-up\u003c/strong> explains every flag from scratch.\u003c/blockquote>\n\u003ch3>1. First 60 seconds - whole system view\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">uptime                 \u003cspan class=\"c\"># load ~2-3 on 2 CPUs\u003c/span>\nvmstat 1 5\n\u003cspan class=\"c\"># procs -----------memory---------- ---swap-- -----io---- -system-- ------cpu-----\u003c/span>\n\u003cspan class=\"c\">#  r  b   swpd   free  ...           bi    bo   in   cs us sy id wa st\u003c/span>\n\u003cspan class=\"c\">#  1  1      0 1.2g  ...              0  3900  ... ... 0  6  0 44  0\u003c/span>\n\u003cspan class=\"c\">#           ^ b = blocked on IO                         ^ wa high\u003c/span>\ntop          \u003cspan class=\"c\"># header: %Cpu(s): 0.3 us, 6.0 sy, 49.0 ni, 0.0 id, 44.0 wa\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>Read the CPU line:\u003c/p>\n\u003cul>\u003cli>\u003ccode>ni 49%\u003c/code> = CPU used by \u003cstrong>niced\u003c/strong> processes (batch-encoder). This is \"spare\" CPU it was allowed to use.\u003c/li>\u003cli>\u003ccode>wa 44%\u003c/code> = CPUs idle \u003cstrong>waiting for disk IO\u003c/strong>. This is the pain.\u003c/li>\u003cli>\u003ccode>us\u003c/code> (normal tasks) is tiny - nothing is starved of CPU.\u003c/li>\u003c/ul>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>uptime\u003c/code>\u003c/td>\u003ctd>Load.\u003c/td>\u003ctd>Load 2-3 on 2 CPUs: looks like CPU problem...\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>vmstat 1 5\u003c/code>\u003c/td>\u003ctd>1 s samples.\u003c/td>\u003ctd>\u003ccode>b\u003c/code> (blocked) and \u003ccode>wa\u003c/code> (IO wait) high, \u003ccode>us\u003c/code> low: waiting on disk, not CPU.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>top\u003c/code> (header)\u003c/td>\u003ctd>CPU line breakdown.\u003c/td>\u003ctd>\u003ccode>ni 49%\u003c/code> = niced batch work (harmless, yields). \u003ccode>wa 44%\u003c/code> = the real pain.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>2. Prove batch-encoder is not the problem\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">ps -o pid,ni,pri,%cpu,cmd -C python3\n\u003cspan class=\"c\">#  PID  NI PRI %CPU CMD\u003c/span>\n\u003cspan class=\"c\"># 2201  19   0 99.0 /usr/bin/python3 /usr/local/bin/batch-encoder\u003c/span>\ntime (for i in $(seq 200000); do :; done)    \u003cspan class=\"c\"># a normal-priority CPU task is still fast\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>A nice 19 task yields to any nice 0 task. It cannot make the shell feel slow.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>ps -o pid,ni,pri,%cpu,cmd -C python3\u003c/code>\u003c/td>\u003ctd>Shows nice value and priority for processes named \u003ccode>python3\u003c/code>.\u003c/td>\u003ctd>\u003ccode>batch-encoder\u003c/code> is \u003ccode>NI 19\u003c/code> = lowest priority.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>time (for i in $(seq 200000); do :; done)\u003c/code>\u003c/td>\u003ctd>Times a CPU-bound loop at normal priority.\u003c/td>\u003ctd>Still fast = the nice 19 process is not slowing normal tasks. \u003cstrong>Prove or reject the red herring.\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>3. Find the disk and the process\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">iostat                  \u003cspan class=\"c\"># 1. summary since boot\u003c/span>\niostat -x               \u003cspan class=\"c\"># 2. + extended columns: %util, await\u003c/span>\niostat -xz 1 3          \u003cspan class=\"c\"># 3. + hide idle disks, every 1 s, 3 times\u003c/span>\n\u003cspan class=\"c\"># Device  r/s   w/s   wkB/s  w_await  aqu-sz  %util\u003c/span>\n\u003cspan class=\"c\"># sda     0.0  950   3800    1.0      0.95    98.0     &lt;-- saturated with tiny writes\u003c/span>\nsudo pidstat -d         \u003cspan class=\"c\"># 1. disk IO per process, one sample\u003c/span>\nsudo pidstat -d 1 5     \u003cspan class=\"c\"># 2. every 1 s, 5 times\u003c/span>\n\u003cspan class=\"c\">#  UID  PID  kB_rd/s kB_wr/s kB_ccwr/s iodelay Command\u003c/span>\n\u003cspan class=\"c\">#    0 3310     0.00 3800.00     0.00     95  dd\u003c/span>\nps -eo pid,stat,wchan:22,cmd | awk '$2 ~ /D/'\n\u003cspan class=\"c\"># 3310 D  ... dd if=/dev/zero of=/var/tmp/audit-sync.dat bs=4k ... oflag=dsync\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>~4 MB/s is tiny, but \u003cstrong>every 4 KB write waits for the disk\u003c/strong> (\u003ccode>oflag=dsync\u003c/code>), so the disk is 98% busy and every other writer queues behind it.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>iostat -xz 1 3\u003c/code>\u003c/td>\u003ctd>Extended per-device disk stats (\u003ccode>-x\u003c/code>), skip idle devices (\u003ccode>-z\u003c/code>).\u003c/td>\u003ctd>\u003ccode>%util 98%\u003c/code> with \u003ccode>w_await\u003c/code> ~1 ms and ~950 writes/s: the disk is saturated by many tiny writes.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>pidstat -d 1 5\u003c/code>\u003c/td>\u003ctd>Per-process disk IO.\u003c/td>\u003ctd>\u003ccode>dd\u003c/code> writes 3800 kB/s, \u003ccode>iodelay\u003c/code> 95.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ps -eo pid,stat,wchan:22,cmd | awk '$2 ~ /D/'\u003c/code>\u003c/td>\u003ctd>Shows processes in state \u003ccode>D\u003c/code> (uninterruptible IO wait) and what kernel function they wait in.\u003c/td>\u003ctd>Finds \u003ccode>dd ... oflag=dsync\u003c/code>: every 4 KB write is forced to disk synchronously.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>4. Who runs it, and why does it come back?\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">systemctl status 3310 --no-pager\n\u003cspan class=\"c\"># ● audit-sync.service - Compliance audit record sync\u003c/span>\n\u003cspan class=\"c\">#    TriggeredBy: ● audit-sync.timer\u003c/span>\nsystemctl list-timers --all | grep audit\nsystemctl cat audit-sync.timer          \u003cspan class=\"c\"># OnUnitInactiveSec=20s -&gt; restarts 20s after it stops\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>systemctl status 3310\u003c/code>\u003c/td>\u003ctd>Maps PID to unit.\u003c/td>\u003ctd>\u003ccode>audit-sync.service\u003c/code>, \u003ccode>TriggeredBy: audit-sync.timer\u003c/code>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl list-timers --all | grep audit\u003c/code> / \u003ccode>systemctl cat audit-sync.timer\u003c/code>\u003c/td>\u003ctd>Timer schedule.\u003c/td>\u003ctd>\u003ccode>OnUnitInactiveSec=20s\u003c/code>: restarts 20 s after it ends, which is why killing it fails.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>5. Fix - pick one, with the owner\u003c/h3>\n\u003cp>\u003cstrong>A) Stop it until the compliance team fixes the job\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo systemctl disable --now audit-sync.timer\nsudo systemctl stop audit-sync.service\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>B) Keep it running, but only on idle disk time\u003c/strong> (better if the job is required)\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo systemctl edit audit-sync.service\n\u003cspan class=\"c\"># [Service]\u003c/span>\n\u003cspan class=\"c\"># IOSchedulingClass=idle\u003c/span>\n\u003cspan class=\"c\"># IOWeight=10\u003c/span>\nsudo systemctl restart audit-sync.service\u003c/code>\u003c/pre>\n\u003cp>(\u003ccode>IOSchedulingClass\u003c/code> needs the BFQ/CFQ IO scheduler to fully work; \u003ccode>IOWriteBandwidthMax=/dev/sda 1M\u003c/code> is a hard limit that works with any scheduler.)\u003c/p>\n\u003cp>Then confirm:\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">vmstat 1 5           \u003cspan class=\"c\"># wa near 0, b = 0\u003c/span>\niostat -xz 1 3       \u003cspan class=\"c\"># %util down\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>systemctl disable --now audit-sync.timer\u003c/code>\u003c/td>\u003ctd>Stop the schedule and never start at boot.\u003c/td>\u003ctd>Option A.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl edit audit-sync.service\u003c/code> + \u003ccode>IOSchedulingClass=idle\u003c/code> \u003ccode>IOWeight=10\u003c/code>\u003c/td>\u003ctd>Drop-in override that gives the job lowest IO priority.\u003c/td>\u003ctd>Option B: keep a required job from hurting others.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>IOWriteBandwidthMax=/dev/sda 1M\u003c/code>\u003c/td>\u003ctd>Hard IO bandwidth cap.\u003c/td>\u003ctd>Works with any IO scheduler.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>", "root": "\u003cdiv class='tablewrap'>\u003ctable>\u003ctbody>\u003ctr>\u003ctd>Root cause\u003c/td>\u003ctd>audit-sync does continuous 4 KB synchronous writes (\u003ccode>dsync\u003c/code>), saturating the disk; restarted by a systemd timer every 20s\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Red herring\u003c/td>\u003ctd>batch-encoder at 100% CPU, but at nice 19 - it only used idle CPU\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prevent\u003c/td>\u003ctd>Batch the writes or use one \u003ccode>fsync\u003c/code> per batch; give batch jobs \u003ccode>IOWeight\u003c/code>/\u003ccode>Nice\u003c/code>; alert on iowait and disk \u003ccode>%util\u003c/code>, not only CPU\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "explain": "\u003cp>\u003cstrong>The red herring:\u003c/strong> \u003ccode>batch-encoder\u003c/code> burns 100% of one CPU - but it runs at \u003cstrong>nice 19\u003c/strong>, so any normal task preempts it. In \u003ccode>top\u003c/code> it shows up as \u003cstrong>\u003ccode>ni\u003c/code>\u003c/strong>, not \u003ccode>us\u003c/code>. It cannot make the shell feel slow.\u003c/p>\n\u003cp>\u003cstrong>The real bottleneck is disk I/O:\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode class=\"lang-text\">%Cpu(s): 0.3 us, 6.0 sy, 49.0 ni, 0.0 id, 44.0 wa\nvmstat: b = 1 (blocked)    iostat: w/s 950, w_await 1.0, %util 98\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>wa\u003c/code> high + \u003ccode>b &gt; 0\u003c/code> + processes in \u003ccode>D\u003c/code> state + disk \u003ccode>%util\u003c/code> ~ 100 = IO saturation. \u003ccode>pidstat -d\u003c/code> / \u003ccode>iotop\u003c/code> point to \u003ccode>dd if=/dev/zero of=/var/tmp/audit-sync.dat bs=4k oflag=dsync\u003c/code> - tiny synchronous writes. Only ~4 MB/s, but \u003cstrong>every 4 KB write waits for the disk\u003c/strong>, so the disk is full of IOPS and everything else queues behind it.\u003c/p>\n\u003cp>\u003cstrong>Why it returns:\u003c/strong> \u003ccode>systemctl status &lt;PID&gt;\u003c/code> shows \u003ccode>TriggeredBy: audit-sync.timer\u003c/code> (\u003ccode>OnUnitInactiveSec=20s\u003c/code>). Like cron, a timer restarts it.\u003c/p>\n\u003cp>\u003cstrong>Fix options:\u003c/strong> disable the timer (until the owner fixes the job) or keep it with low priority: \u003ccode>IOWeight=10\u003c/code>, \u003ccode>IOSchedulingClass=idle\u003c/code>, \u003ccode>IOWriteBandwidthMax=\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>USE method:\u003c/strong> for each resource (CPU, memory, disk, network) check Utilisation, Saturation, Errors - don't stop at the first busy thing.\u003c/p>", "mcq": [{"q": "`top` shows `49 ni` and `44 wa`. What is the bottleneck?", "o": ["Disk I/O (iowait) - ni is only low-priority niced work using spare CPU", "CPU saturation by normal tasks", "Memory", "Network"], "why": "ni = CPU used by niced processes (harmless when contended); wa = CPUs idle waiting for I/O."}, {"q": "Which tool shows I/O per process?", "o": ["pidstat -d (or iotop)", "free -m", "ip -s link", "uptime"], "why": "`pidstat -d 1` lists kB read/written per process."}, {"q": "Why is `systemctl stop audit-sync.service` alone not enough?", "o": ["A systemd timer (TriggeredBy) starts it again", "stop is not allowed on services", "Services always restart on stop", "dd restarts itself"], "why": "Disable the timer or constrain the job with IO limits."}], "qa": [{"q": "How do you prove with numbers that batch-encoder is not the cause?", "a": "It runs at nice 19 (`ps -o ni`) and top attributes its CPU to `ni`; a normal-priority CPU loop still runs fast (`time`), us is tiny, nothing is starved. Meanwhile `wa` is 44%, `b` > 0, iostat shows %util ~98 and pidstat -d shows dd writing. The disk, not the CPU, is saturated."}, {"q": "Why can only ~4 MB/s of writes saturate a disk?", "a": "The writes are 4 KB each with `oflag=dsync`: every one must reach stable storage before the next is issued, so the disk is limited by IOPS and latency, not bandwidth. ~950 sync writes/s keep it 98% busy and every other writer queues behind them."}]}, {"id": "h05", "level": "hard", "title": "App does not come back after a maintenance reboot", "time": "45 min", "skills": "systemd dependencies, mount units, fstab, drop-ins, exit codes", "ticket": "\u003cblockquote>\u003cstrong>INC-3005 · P1 · Customer facing\u003c/strong>\u003cbr>\nLast night's maintenance window had two changes: a storage \"naming cleanup\" and\u003cbr>\nsecurity ticket SEC-117 (\"service account naming standard\"). After the reboot,\u003cbr>\nshopapp did not come back. nginx shows \u003cstrong>502\u003c/strong>.\u003cbr>\nThe change owners are asleep. Restore service, and make sure it survives the \u003cstrong>next\u003c/strong> reboot.\u003c/blockquote>\n\u003cp>(The lab simulates the reboot of the app stack - you don't need to reboot the VM. The checker simulates it again.)\u003c/p>", "success": "\u003cul>\u003cli>\u003ccode>/srv/shopdata\u003c/code> mounts from fstab, shopapp starts automatically, \u003ccode>/health\u003c/code> 200\u003c/li>\u003cli>shopapp does not run as root\u003c/li>\u003cli>Survives a simulated reboot\u003c/li>\u003c/ul>", "warmup": "\u003cp>The solution uses long command lines. They are just short commands with one flag added at a time. Practise each ladder on any Linux box first (all read-only). Every rung adds \u003cstrong>one\u003c/strong> thing to the rung above - stop at the rung you understand, and read the next one only when you are ready. The lab itself uses the last rung of each ladder.\u003c/p>\n\u003ch4>systemctl + journalctl - service state and logs\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">systemctl status nginx                          \u003cspan class=\"c\"># 1. state, last exit code, last log lines\u003c/span>\nsystemctl is-active nginx                       \u003cspan class=\"c\"># 2. one word: active / failed / inactive\u003c/span>\njournalctl -u nginx                             \u003cspan class=\"c\"># 3. the whole log of one unit (-u = unit)\u003c/span>\njournalctl -u nginx -n 20                       \u003cspan class=\"c\"># 4. only the last 20 lines\u003c/span>\njournalctl -u nginx -n 20 --no-pager            \u003cspan class=\"c\"># 5. print straight to the terminal (no less)\u003c/span>\njournalctl -u nginx --since \"10 min ago\"        \u003cspan class=\"c\"># 6. time window instead of line count\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>fstab / mount - boot-time mounts\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">cat /etc/fstab                                  \u003cspan class=\"c\"># 1. what mounts at boot: source, mountpoint, type, options, dump, pass\u003c/span>\ngrep shopdata /etc/fstab                        \u003cspan class=\"c\"># 2. one line\u003c/span>\nls -l /var/lib/tshoot/*.img                     \u003cspan class=\"c\"># 3. does the source file/device really exist?\u003c/span>\nblkid                                           \u003cspan class=\"c\"># 4. UUIDs/labels of real disks (compare with fstab)\u003c/span>\nsudo mount -a                                   \u003cspan class=\"c\"># 5. try every fstab line now (errors show here, not at 3am boot)\u003c/span>\nfindmnt /srv/shopdata                           \u003cspan class=\"c\"># 6. confirm\u003c/span>\ngetent passwd shopapp                           \u003cspan class=\"c\"># 7. does this user exist? (no output = no)\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>systemctl show / cat - ask systemd for facts\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">systemctl cat nginx                              \u003cspan class=\"c\"># 1. the unit file(s) systemd really uses, incl. drop-ins\u003c/span>\nsystemctl show nginx                             \u003cspan class=\"c\"># 2. every property (long)\u003c/span>\nsystemctl show -p User nginx                     \u003cspan class=\"c\"># 3. -p = just one property\u003c/span>\nsystemctl show -p User -p MainPID nginx          \u003cspan class=\"c\"># 4. several\u003c/span>\nsystemctl show -p MainPID --value nginx          \u003cspan class=\"c\"># 5. --value = print only the value (for scripts)\u003c/span>\u003c/code>\u003c/pre>", "hints": [{"title": "Hint 1 - what failed?", "html": "\u003cp>\u003ccode>systemctl --failed\u003c/code>. \u003ccode>systemctl status shopapp\u003c/code> - read \u003ccode>Dependency failed\u003c/code> carefully. \u003ccode>systemctl list-dependencies shopapp\u003c/code> shows what it needs (look for red / failed).\u003c/p>"}, {"title": "Hint 2 - the mount", "html": "\u003cp>Mounts from \u003ccode>/etc/fstab\u003c/code> become units: \u003ccode>/srv/shopdata\u003c/code> -&gt; \u003ccode>srv-shopdata.mount\u003c/code> (\u003ccode>systemd-escape -p --suffix=mount /srv/shopdata\u003c/code>). \u003ccode>systemctl status srv-shopdata.mount\u003c/code>, \u003ccode>journalctl -b -u srv-shopdata.mount\u003c/code>. Compare fstab with what exists on disk. After editing fstab: \u003ccode>systemctl daemon-reload\u003c/code>.\u003c/p>"}, {"title": "Hint 3 - after the mount works", "html": "\u003cp>The app fails differently now. \u003ccode>systemctl status shopapp\u003c/code> shows \u003ccode>status=217/USER\u003c/code>. What does 217 mean? \u003ccode>systemctl cat shopapp\u003c/code> shows every drop-in. \u003ccode>getent passwd shop-app\u003c/code>.\u003c/p>"}], "learn": "\u003cul>\u003cli>systemd failures chain: a failed mount -&gt; \u003ccode>Dependency failed\u003c/code> on every unit that needs it. Fix the \u003cstrong>first\u003c/strong> failure in the chain.\u003c/li>\u003cli>fstab entries are converted into \u003ccode>.mount\u003c/code> units by a generator - \u003ccode>daemon-reload\u003c/code> after edits.\u003c/li>\u003cli>systemd exit codes like \u003ccode>217/USER\u003c/code>, \u003ccode>203/EXEC\u003c/code>, \u003ccode>200/CHDIR\u003c/code> describe \u003cem>setup\u003c/em> failures before the app ran. App logs will be empty.\u003c/li>\u003cli>Partially applied changes (config changed, user never created) are a classic maintenance-window failure.\u003c/li>\u003cli>\"Fixed\" is not done until it survives a reboot.\u003c/li>\u003c/ul>", "solution": "\u003cblockquote>Long commands below are built up short-first (\u003ccode># 1.\u003c/code>, \u003ccode># 2.\u003c/code> ...). Each rung adds one flag;\u003cbr>\nthe last rung is what the lab uses. The README \u003cstrong>Warm-up\u003c/strong> explains every flag from scratch.\u003c/blockquote>\n\u003ch3>1. What failed?\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">systemctl --failed\n\u003cspan class=\"c\">#   UNIT                 LOAD   ACTIVE SUB    DESCRIPTION\u003c/span>\n\u003cspan class=\"c\"># ● srv-shopdata.mount   loaded failed failed /srv/shopdata\u003c/span>\nsystemctl status shopapp --no-pager\n\u003cspan class=\"c\"># Active: inactive (dead)\u003c/span>\n\u003cspan class=\"c\"># Dependency failed for shopapp.service - ShopApp demo web service\u003c/span>\nsystemctl list-dependencies shopapp | head      \u003cspan class=\"c\"># srv-shopdata.mount shown as failed\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>The first failure in the chain is the mount. Start there.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>systemctl --failed\u003c/code>\u003c/td>\u003ctd>Lists failed units.\u003c/td>\u003ctd>\u003ccode>srv-shopdata.mount\u003c/code> is the first failure.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl status shopapp\u003c/code>\u003c/td>\u003ctd>Status of the app.\u003c/td>\u003ctd>\u003ccode>Dependency failed for shopapp.service\u003c/code>: it never started because its mount is missing.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl list-dependencies shopapp\u003c/code>\u003c/td>\u003ctd>Dependency tree with states.\u003c/td>\u003ctd>Shows which dependency is red. \u003cstrong>Fix the first failure in the chain.\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>2. Fault 1 - the mount\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">systemctl status srv-shopdata.mount --no-pager\njournalctl -b -u srv-shopdata.mount --no-pager | tail\n\u003cspan class=\"c\"># mount: /srv/shopdata: failed to setup loop device for /var/lib/tshoot/shop-data.img.\u003c/span>\ngrep shopdata /etc/fstab\n\u003cspan class=\"c\"># /var/lib/tshoot/shop-data.img /srv/shopdata ext4 loop,...\u003c/span>\nls -l /var/lib/tshoot/*.img\n\u003cspan class=\"c\"># /var/lib/tshoot/shopdata.img        &lt;-- the real file has no dash\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>The \"naming cleanup\" renamed the path in fstab but not the file. Fix fstab (not the file - other things may use the real name):\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo sed -i 's#/var/lib/tshoot/shop-data.img#/var/lib/tshoot/shopdata.img#' /etc/fstab\nsudo systemctl daemon-reload\nsudo mount -a                       \u003cspan class=\"c\"># or: sudo systemctl start srv-shopdata.mount\u003c/span>\nfindmnt /srv/shopdata\u003c/code>\u003c/pre>\n\u003cp>(Real-world version: wrong UUID / LABEL. Compare with \u003ccode>blkid\u003c/code> and \u003ccode>lsblk -f\u003c/code>. A bad fstab line \u003cem>without\u003c/em> \u003ccode>nofail\u003c/code> can drop a server into emergency mode at boot.)\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>journalctl -b -u srv-shopdata.mount\u003c/code>\u003c/td>\u003ctd>Logs of the mount unit from the current boot (\u003ccode>-b\u003c/code>).\u003c/td>\u003ctd>\u003ccode>failed to setup loop device for .../shop-data.img\u003c/code>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>grep shopdata /etc/fstab\u003c/code> and \u003ccode>ls -l /var/lib/tshoot/*.img\u003c/code>\u003c/td>\u003ctd>Compare fstab path with real files.\u003c/td>\u003ctd>fstab says \u003ccode>shop-data.img\u003c/code>, the file is \u003ccode>shopdata.img\u003c/code>. Typo from the \"naming cleanup\".\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sed -i 's#...shop-data.img#...shopdata.img#' /etc/fstab\u003c/code>\u003c/td>\u003ctd>Fix the path.\u003c/td>\u003ctd>Fix fstab (not the file): other things may use the real name.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl daemon-reload\u003c/code>\u003c/td>\u003ctd>Regenerates mount units from fstab.\u003c/td>\u003ctd>\u003cstrong>Required\u003c/strong> after editing fstab.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>mount -a\u003c/code> / \u003ccode>findmnt /srv/shopdata\u003c/code>\u003c/td>\u003ctd>Mount everything in fstab / verify.\u003c/td>\u003ctd>Fault 1 fixed.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>3. Fault 2 - the service account\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo systemctl start shopapp\nsystemctl status shopapp --no-pager\n\u003cspan class=\"c\"># Main process exited, code=exited, status=217/USER\u003c/span>\njournalctl -u shopapp -n 5 --no-pager\n\u003cspan class=\"c\"># Failed to determine user credentials: No such process\u003c/span>\n\u003cspan class=\"c\"># Failed at step USER spawning /usr/bin/python3: No such process\u003c/span>\nsystemctl cat shopapp\n\u003cspan class=\"c\"># # /etc/systemd/system/shopapp.service.d/20-service-account.conf\u003c/span>\n\u003cspan class=\"c\"># User=shop-app\u003c/span>\ngetent passwd shop-app    \u003cspan class=\"c\"># nothing - the account was never created\u003c/span>\ngetent passwd shopapp     \u003cspan class=\"c\"># exists, owns /srv/shopdata and /var/log/shopapp\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>217/USER\u003c/code> = systemd could not switch to the user. The app never ran, so app logs are empty.\u003c/p>\n\u003cp>Options: create \u003ccode>shop-app\u003c/code> (then you must also fix ownership of config, logs, data - big change at 3am), or roll back the half-done SEC-117 change. Roll back:\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo mv /etc/systemd/system/shopapp.service.d/20-service-account.conf /root/20-service-account.conf.rolled-back\nsudo systemctl daemon-reload\nsudo systemctl restart shopapp\ncurl -s localhost/health\u003c/code>\u003c/pre>\n\u003cp>Do \u003cstrong>not\u003c/strong> \"fix\" it with \u003ccode>User=root\u003c/code>.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>systemctl start shopapp\u003c/code> -&gt; \u003ccode>status=217/USER\u003c/code>\u003c/td>\u003ctd>systemd could not switch to the configured user.\u003c/td>\u003ctd>Fault 2: drop-in says \u003ccode>User=shop-app\u003c/code>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>getent passwd shop-app\u003c/code> / \u003ccode>getent passwd shopapp\u003c/code>\u003c/td>\u003ctd>Lookup in the user database.\u003c/td>\u003ctd>The new account was never created; the old one exists and owns the data.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>mv .../20-service-account.conf /root/...rolled-back\u003c/code>\u003c/td>\u003ctd>Moves the override out of the way, keeps a copy.\u003c/td>\u003ctd>Roll back the half-done SEC-117 change. Never \"fix\" with \u003ccode>User=root\u003c/code>.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>4. Prove it survives a reboot\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo systemctl stop shopapp &amp;&amp; sudo umount /srv/shopdata\nsudo systemctl daemon-reload &amp;&amp; sudo systemctl start shopapp\nsystemctl is-active srv-shopdata.mount shopapp\nsudo ./labctl.sh check h05\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>systemctl stop shopapp &amp;&amp; umount /srv/shopdata ... start shopapp\u003c/code>\u003c/td>\u003ctd>Simulate a boot sequence.\u003c/td>\u003ctd>Proves the mount is pulled in as a dependency and the whole chain survives a reboot.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>", "root": "\u003cdiv class='tablewrap'>\u003ctable>\u003ctbody>\u003ctr>\u003ctd>Root cause\u003c/td>\u003ctd>1) fstab renamed to a non-existent image path -&gt; mount failed -&gt; shopapp dependency failed. 2) Drop-in set \u003ccode>User=shop-app\u003c/code>, account never created -&gt; 217/USER\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prevent\u003c/td>\u003ctd>Validate before reboot: \u003ccode>findmnt --verify\u003c/code>, \u003ccode>mount -a\u003c/code>, \u003ccode>systemd-analyze verify\u003c/code>, test-start services; apply changes completely or not at all (config management); reboot test in staging\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "explain": "\u003cp>\u003cstrong>systemd failures chain.\u003c/strong> Fix the \u003cstrong>first\u003c/strong> failure.\u003c/p>\n\u003col>\u003cli>\u003ccode>systemctl --failed\u003c/code> -&gt; \u003ccode>srv-shopdata.mount failed\u003c/code>. \u003ccode>shopapp\u003c/code> says \u003ccode>Dependency failed\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Mount fault:\u003c/strong> the \"naming cleanup\" changed \u003ccode>/etc/fstab\u003c/code> to \u003ccode>shop-data.img\u003c/code> but the real file is \u003ccode>shopdata.img\u003c/code> -&gt; \u003ccode>failed to setup loop device\u003c/code>. Fix fstab (not the file), \u003ccode>systemctl daemon-reload\u003c/code> (fstab is turned into \u003ccode>.mount\u003c/code> units by a generator), \u003ccode>mount -a\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Service fault:\u003c/strong> \u003ccode>status=217/USER\u003c/code> - systemd could not switch to the user. A drop-in from SEC-117 sets \u003ccode>User=shop-app\u003c/code> but that account was never created (\u003ccode>getent passwd shop-app\u003c/code> is empty). App logs are empty because the app never ran.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>Exit codes 200-243 are systemd setup failures:\u003c/strong> 217/USER (user), 203/EXEC (exec), 200/CHDIR (working dir).\u003c/p>\n\u003cp>\u003cstrong>Decision:\u003c/strong> create \u003ccode>shop-app\u003c/code> (then fix ownership of config, logs and data - big change at 3 am) \u003cstrong>or roll back\u003c/strong> the half-applied change. Rolling back is the safe option; \u003cstrong>never\u003c/strong> \"fix\" with \u003ccode>User=root\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Survive the next reboot:\u003c/strong> prove it by stopping the app, unmounting and starting again; validate with \u003ccode>findmnt --verify\u003c/code>, \u003ccode>mount -a\u003c/code>, \u003ccode>systemd-analyze verify\u003c/code>. Without \u003ccode>nofail\u003c/code>, a bad fstab line can send a server to emergency mode.\u003c/p>", "mcq": [{"q": "shopapp shows `Dependency failed`. What do you do first?", "o": ["Find and fix the first failed unit in the chain (systemctl --failed)", "Restart shopapp repeatedly", "Reinstall nginx", "Reboot again"], "why": "A failed mount causes the dependent service to fail; start at the root of the chain."}, {"q": "`status=217/USER` in systemctl status means:", "o": ["systemd could not set the configured User= (account missing)", "The app ran out of memory", "The binary was not found", "A port is in use"], "why": "217 = USER step failed, before the app code ran."}, {"q": "After editing /etc/fstab you must run:", "o": ["systemctl daemon-reload", "ldconfig", "sysctl -p", "swapon -a"], "why": "systemd generates .mount units from fstab; reload to regenerate."}], "qa": [{"q": "For the missing `shop-app` account, compare 'create it' versus 'roll back the drop-in'. Which would you choose at 3 am?", "a": "Rollback: creating the account also requires changing owner/permissions on config, logs and data and testing them - a risky broad change when the owners are asleep. Roll back the half-applied SEC-117 drop-in, restore service, and let the change owners redo it completely in a planned window. Never use User=root."}, {"q": "Which commands would you run BEFORE a maintenance reboot to catch these two faults?", "a": "`findmnt --verify` and `mount -a` (fstab), `systemd-analyze verify \u003cunits>`, test-starting services (`systemctl start`), `getent passwd \u003cUser=...>` for each configured service user, and ideally a reboot test in staging."}]}, {"id": "h06", "level": "hard", "title": "\"Cannot assign requested address\"", "time": "45 min", "skills": "TCP states, TIME_WAIT, ephemeral port range, `ss -s`, sysctl persistence, myths vs. facts", "ticket": "\u003cblockquote>\u003cstrong>INC-3006 · P1\u003c/strong>\u003cbr>\nSince this morning \u003ccode>price-sync\u003c/code> logs thousands of failed syncs and the on-host monitoring\u003cbr>\ncheck (\u003ccode>curl http://localhost/health\u003c/code>) flaps between OK and CRITICAL.\u003cbr>\nCustomers outside are fine. The app logs look normal. CPU, memory and disk are fine.\u003cbr>\nYesterday two changes went live:\n\u003cul>\u003cli>\u003cstrong>CHG-701\u003c/strong> \"network tuning from a blog post\" (kernel settings)\u003c/li>\u003cli>\u003ccode>price-sync.service\u003c/code> was deployed - it pulls prices from the shop all the time and \u003cstrong>must keep running\u003c/strong>.\u003c/li>\u003c/ul>\nA colleague suggests enabling \u003ccode>tcp_tw_recycle\u003c/code>. Find the real cause and fix it properly.\u003c/blockquote>", "success": "\u003cul>\u003cli>30 local requests in a row return 200; price-sync reports no errors\u003c/li>\u003cli>The ephemeral port range is sane at runtime \u003cstrong>and\u003c/strong> after reboot\u003c/li>\u003cli>\u003ccode>price-sync\u003c/code> runs and no longer burns a new connection per request\u003c/li>\u003cli>No mass of \u003ccode>TIME_WAIT\u003c/code> sockets\u003c/li>\u003c/ul>\n\u003cp>Check with \u003ccode>sudo ./labctl.sh check h06\u003c/code>.\u003c/p>", "warmup": "\u003cp>The solution uses long command lines. They are just short commands with one flag added at a time. Practise each ladder on any Linux box first (all read-only). Every rung adds \u003cstrong>one\u003c/strong> thing to the rung above - stop at the rung you understand, and read the next one only when you are ready. The lab itself uses the last rung of each ladder.\u003c/p>\n\u003ch4>curl - talk to a web service\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">curl http://localhost/                                   \u003cspan class=\"c\"># 1. fetch a page, print the body\u003c/span>\ncurl -s http://localhost/                                \u003cspan class=\"c\"># 2. -s = silent (no progress bar)\u003c/span>\ncurl -s -o /dev/null http://localhost/                   \u003cspan class=\"c\"># 3. -o /dev/null = throw the body away\u003c/span>\ncurl -s -o /dev/null -w '%{http_code}\\n' http://localhost/   \u003cspan class=\"c\"># 4. -w = print only the HTTP status code\u003c/span>\ncurl -v http://localhost/                                \u003cspan class=\"c\"># 5. -v = verbose: shows connect, headers (debug)\u003c/span>\ncurl -s -o /dev/null -w '%{http_code} %{time_total}s\\n' --max-time 5 http://localhost/   \u003cspan class=\"c\"># 6. + timing, + give up after 5 s\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>ss -s / TIME_WAIT - socket states\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">ss -s                                          \u003cspan class=\"c\"># 1. totals per state: estab, timewait ...\u003c/span>\nss -tan state time-wait | head                 \u003cspan class=\"c\"># 2. list TIME_WAIT sockets (-a all, -t tcp, -n numeric)\u003c/span>\nss -tan state time-wait | awk 'NR&gt;1{print $4}' | cut -d: -f2 | sort -n | sed -n '1p;$p'\n                                               \u003cspan class=\"c\"># 3. smallest and largest LOCAL port in use (awk col 4, cut port, sort, sed 1p;$p = first;last)\u003c/span>\nsysctl net.ipv4.ip_local_port_range            \u003cspan class=\"c\"># 4. how many local ports exist for outgoing connections\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>sysctl - read and change kernel settings\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">sysctl vm.swappiness                    \u003cspan class=\"c\"># 1. read one setting\u003c/span>\nsysctl -a | grep swappiness             \u003cspan class=\"c\"># 2. list all, filter (when you do not know the exact name)\u003c/span>\nsudo sysctl -w vm.swappiness=60         \u003cspan class=\"c\"># 3. -w = set NOW (lost at reboot)\u003c/span>\ncat /etc/sysctl.d/*.conf                \u003cspan class=\"c\"># 4. where permanent values live\u003c/span>\nsudo sysctl --system                    \u003cspan class=\"c\"># 5. re-read all files; the LAST file wins on a conflict\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>ps / pgrep / pstree - look at processes\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">ps                                         \u003cspan class=\"c\"># 1. only your shell\u003c/span>\nps -ef                                     \u003cspan class=\"c\"># 2. every process, full format (PID, PPID, command)\u003c/span>\nps -fp 1234                                \u003cspan class=\"c\"># 3. just one PID\u003c/span>\nps -eo pid,ppid,user,%cpu,%mem,cmd         \u003cspan class=\"c\"># 4. -o = choose your own columns\u003c/span>\nps -eo pid,%cpu,cmd --sort=-%cpu | head    \u003cspan class=\"c\"># 5. sort by CPU, highest first (- = descending), top 10\u003c/span>\npgrep -af nginx                            \u003cspan class=\"c\"># 6. find PIDs by name (-a = show full command, -f = match whole command line)\u003c/span>\npstree -ps 1234                            \u003cspan class=\"c\"># 7. parent chain of one PID: who started it?\u003c/span>\u003c/code>\u003c/pre>", "hints": [{"title": "Hint 1 - which error, from which component?", "html": "\u003cp>\u003ccode>curl -v localhost/\u003c/code> a few times. \u003ccode>journalctl -u price-sync -n 20\u003c/code>. What does errno 99 \u003ccode>Cannot assign requested address\u003c/code> mean for an outgoing \u003ccode>connect()\u003c/code>? Why are outside customers not affected?\u003c/p>"}, {"title": "Hint 2 - count sockets by state", "html": "\u003cp>\u003ccode>ss -s\u003c/code>, \u003ccode>ss -tan state time-wait | wc -l\u003c/code>, \u003ccode>ss -tan state time-wait | awk '{print $4}' | sort | uniq -c | sort -rn | head\u003c/code>. Who opens all these connections? \u003ccode>sudo ss -tanp | grep -c price-sync\u003c/code> / \u003ccode>journalctl -u price-sync\u003c/code>.\u003c/p>"}, {"title": "Hint 3 - how many ports are there?", "html": "\u003cp>\u003ccode>sysctl net.ipv4.ip_local_port_range net.ipv4.tcp_tw_reuse net.ipv4.tcp_fin_timeout\u003c/code>. \u003ccode>grep -r . /etc/sysctl.d/ /etc/sysctl.conf | grep -v '^.*:#'\u003c/code>. How long does a socket stay in TIME_WAIT? How many new connections per second can you make with N ports?\u003c/p>"}], "learn": "\u003cul>\u003cli>Every outgoing TCP connection needs a free local port. The side that closes first keeps the 4-tuple in \u003cstrong>TIME_WAIT for 60 s\u003c/strong> (fixed in Linux, \u003cem>not\u003c/em> \u003ccode>tcp_fin_timeout\u003c/code>).\u003c/li>\u003cli>Max new connections/s to one destination ≈ ports in range / 60.\u003c/li>\u003cli>\u003ccode>tcp_tw_recycle\u003c/code> was removed from Linux 4.12 (it broke NAT clients). \u003ccode>tcp_tw_reuse\u003c/code> helps outgoing connections only. The real fix is connection reuse (keep-alive / pooling).\u003c/li>\u003cli>Blog-post sysctl tuning without measuring is a classic incident cause.\u003c/li>\u003c/ul>", "solution": "\u003cblockquote>Long commands below are built up short-first (\u003ccode># 1.\u003c/code>, \u003ccode># 2.\u003c/code> ...). Each rung adds one flag;\u003cbr>\nthe last rung is what the lab uses. The README \u003cstrong>Warm-up\u003c/strong> explains every flag from scratch.\u003c/blockquote>\n\u003ch3>1. Confirm and find the failing component\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">for i in $(seq 10); do curl -s -o /dev/null -w '%{http_code} ' localhost/; done; echo\n\u003cspan class=\"c\"># 000 000 200 000 000 000 200 000 000 000\u003c/span>\ncurl -v localhost/\n\u003cspan class=\"c\"># *   Trying 127.0.0.1:80...\u003c/span>\n\u003cspan class=\"c\"># * Immediate connect fail for 127.0.0.1: Cannot assign requested address\u003c/span>\njournalctl -u price-sync -n 3 --no-pager\n\u003cspan class=\"c\"># ERROR 183 failed syncs in last 10s (last: [Errno 99] Cannot assign requested address)\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>000\u003c/code> = curl never got an HTTP answer. errno 99 \u003ccode>EADDRNOTAVAIL\u003c/code> on \u003ccode>connect()\u003c/code> = the kernel found \u003cstrong>no free local port\u003c/strong> for a new outgoing connection to \u003ccode>127.0.0.1:80\u003c/code>. Outside customers use \u003cem>their own\u003c/em> ports, which is why they are fine: this is a client-side (outgoing) problem on this host.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>for i in $(seq 10); do curl -s -o /dev/null -w '%{http_code} ' localhost/; done; echo\u003c/code>\u003c/td>\u003ctd>10 requests, print only status codes on one line.\u003c/td>\u003ctd>Mixed \u003ccode>000\u003c/code> and \u003ccode>200\u003c/code> = intermittent. \u003ccode>000\u003c/code> = no HTTP answer at all.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>curl -v localhost/\u003c/code>\u003c/td>\u003ctd>Verbose single request.\u003c/td>\u003ctd>\u003ccode>Cannot assign requested address\u003c/code> = errno 99 \u003ccode>EADDRNOTAVAIL\u003c/code>: no free \u003cstrong>local\u003c/strong> port for an outgoing connection.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>journalctl -u price-sync -n 3\u003c/code>\u003c/td>\u003ctd>Client log.\u003c/td>\u003ctd>Same errno 99; it is the busy client.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>2. Socket states\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">ss -s\n\u003cspan class=\"c\"># TCP:   188 (estab 4, closed 180, orphaned 0, timewait 180)\u003c/span>\nss -tan state time-wait | awk 'NR&gt;1{print $4}' | cut -d: -f2 | sort -n | sed -n '1p;$p'\n\u003cspan class=\"c\"># 61000\u003c/span>\n\u003cspan class=\"c\"># 61100\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>All \u003ccode>TIME_WAIT\u003c/code> sockets use local ports 61000-61100 - only \u003cstrong>101 ports\u003c/strong>.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>ss -s\u003c/code>\u003c/td>\u003ctd>Socket summary by state.\u003c/td>\u003ctd>Many \u003ccode>timewait\u003c/code> sockets.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ss -
