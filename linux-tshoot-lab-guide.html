03ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>journalctl -k --since \"5 min ago\" | grep -iE 'oom|killed process'\u003c/code>\u003c/td>\u003ctd>\u003ccode>-k\u003c/code> = kernel messages only.\u003c/td>\u003ctd>The kernel's view: \u003ccode>constraint=CONSTRAINT_MEMCG\u003c/code> means a \u003cstrong>cgroup\u003c/strong> limit was hit, not host memory.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>free -m\u003c/code>\u003c/td>\u003ctd>Memory in MB.\u003c/td>\u003ctd>Host still has plenty of free RAM - confirms it is a per-service limit.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl show -p MemoryMax cache-warmer\u003c/code>\u003c/td>\u003ctd>Reads the cgroup limit.\u003c/td>\u003ctd>\u003ccode>160M\u003c/code> - the unit's own ceiling.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>3. Why does it grow?\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">watch -n1 'systemctl show -p MemoryCurrent cache-warmer'    \u003cspan class=\"c\"># grows ~20 MB/s, straight line\u003c/span>\ncat /etc/cache-warmer.conf\n\u003cspan class=\"c\"># Changed for load test LT-88: 0 = unlimited.  (was: 64)\u003c/span>\n\u003cspan class=\"c\"># max_mb = 0\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>The load test set the cache to unlimited and nobody changed it back.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>watch -n1 'systemctl show -p MemoryCurrent cache-warmer'\u003c/code>\u003c/td>\u003ctd>Re-runs a command every second.\u003c/td>\u003ctd>A straight line up ~20 MB/s = unbounded growth, not a one-time spike.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>cat /etc/cache-warmer.conf\u003c/code>\u003c/td>\u003ctd>Config file.\u003c/td>\u003ctd>\u003ccode>max_mb = 0\u003c/code> (0 = unlimited) left over from load test LT-88.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>4. Fix the config, keep the limit\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo sed -i 's/^max_mb = 0/max_mb = 64/' /etc/cache-warmer.conf\nsudo systemctl restart cache-warmer\nsleep 15\nsystemctl show -p NRestarts -p MemoryCurrent cache-warmer   \u003cspan class=\"c\"># memory flat at ~70-80 MB\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>Wrong fix: raising or removing \u003ccode>MemoryMax\u003c/code>. With an unbounded cache it only delays the kill - and without a limit the \u003cem>global\u003c/em> OOM killer may kill something important instead.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>sed -i 's/^max_mb = 0/max_mb = 64/' ...\u003c/code>\u003c/td>\u003ctd>Restores the original value.\u003c/td>\u003ctd>Fixes the \u003cstrong>cause\u003c/strong>. Raising MemoryMax only delays the kill.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl restart cache-warmer; sleep 15; systemctl show -p NRestarts -p MemoryCurrent ...\u003c/code>\u003c/td>\u003ctd>Restart, wait, re-measure.\u003c/td>\u003ctd>Memory flat at ~70-80 MB and restart counter stops = fixed.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>", "root": "\u003cdiv class='tablewrap'>\u003ctable>\u003ctbody>\u003ctr>\u003ctd>Root cause\u003c/td>\u003ctd>Load-test config \u003ccode>max_mb = 0\u003c/code> (unbounded cache) left in place; process grows to the 160M cgroup limit and is OOM-killed, systemd restarts it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prevent\u003c/td>\u003ctd>Revert test config with a checklist/ticket; validate config (reject 0); alert on \u003ccode>NRestarts\u003c/code> and on oom-kill events\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "explain": "\u003cp>\u003cstrong>What happened:\u003c/strong> \u003ccode>cache-warmer.service\u003c/code> has \u003ccode>MemoryMax=160M\u003c/code>. A load test had set \u003ccode>max_mb = 0\u003c/code> (= unlimited) in \u003ccode>/etc/cache-warmer.conf\u003c/code> and nobody reverted it. The cache grows ~20 MB/s until the unit's \u003cstrong>cgroup\u003c/strong> hits 160M and the kernel \u003cstrong>OOM-kills a process inside that cgroup\u003c/strong>. systemd reports \u003ccode>Result: oom-kill\u003c/code> and restarts it (\u003ccode>Restart=\u003c/code>) -&gt; crash loop.\u003c/p>\n\u003cp>\u003cstrong>How to tell a cgroup OOM from a host OOM:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003ccode>free -m\u003c/code> shows plenty of free RAM\u003c/li>\u003cli>kernel log: \u003ccode>Memory cgroup out of memory: Killed process ...\u003c/code> and \u003ccode>oom-kill:constraint=CONSTRAINT_MEMCG ... task_memcg=/system.slice/cache-warmer.service\u003c/code>\u003c/li>\u003cli>\u003ccode>systemctl show -p MemoryMax,MemoryCurrent,NRestarts cache-warmer\u003c/code>\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Leak or normal use?\u003c/strong> Watch \u003ccode>MemoryCurrent\u003c/code>. A straight rising line = unbounded growth; a flat line = steady state.\u003c/p>\n\u003cp>\u003cstrong>Fix the cause:\u003c/strong> restore \u003ccode>max_mb = 64\u003c/code> and restart. Keep the limit: raising or removing it only delays the kill, and without it the \u003cem>global\u003c/em> OOM killer might kill something important like the database.\u003c/p>\n\u003cp>\"Nobody changed the code\" - but a \u003cstrong>config\u003c/strong> change is a change.\u003c/p>", "mcq": [{"q": "`systemctl status` shows `Result: oom-kill` but `free -m` shows lots of free RAM. Why?", "o": ["The unit hit its own cgroup limit (MemoryMax), not the host's RAM", "free is wrong inside containers", "Swap is exhausted", "The kernel is out of file descriptors"], "why": "A memcg OOM triggers at the cgroup limit even if the host has free memory."}, {"q": "In the kernel log, which text tells you it was a cgroup OOM?", "o": ["oom-kill:constraint=CONSTRAINT_MEMCG", "Out of memory: global", "EXT4-fs error", "nf_conntrack: table full"], "why": "CONSTRAINT_MEMCG = the limit of that memory cgroup."}, {"q": "What is the right fix?", "o": ["Set the cache bound back (max_mb = 64) and keep MemoryMax", "Remove MemoryMax", "Double MemoryMax to 320M", "Add swap"], "why": "The cause is the unbounded cache config. A bigger limit just delays the same kill."}], "qa": [{"q": "Why is raising MemoryMax the wrong fix here?", "a": "The cache has no upper bound (max_mb = 0) and grows ~20 MB/s, so any limit is eventually reached - you only delay the crash. Removing the limit lets the process threaten the whole host (global OOM may kill something critical). Fix the unbounded growth at its source."}, {"q": "How do you decide between a memory leak and legitimate memory use?", "a": "Sample MemoryCurrent/RSS over time (`watch systemctl show -p MemoryCurrent`, `ps -o rss`). Legitimate use plateaus; a leak or unbounded cache rises steadily. Also read the service's start-up log/config for its configured bounds."}]}, {"id": "m05", "level": "medium", "title": "Backups silently stopped", "time": "30 min", "skills": "cron rules, syslog/journal, file modes, testing jobs by hand", "ticket": "\u003cblockquote>\u003cstrong>INC-2005 · P2 · Audit finding\u003c/strong>\u003cbr>\nAudit found \u003ccode>/srv/backups\u003c/code> is \u003cstrong>empty\u003c/strong>. A new backup job was \"deployed\" last week by copying\u003cbr>\ntwo files to the server: \u003ccode>/etc/cron.d/shopapp-backup.cron\u003c/code> and \u003ccode>/usr/local/bin/shopapp-backup\u003c/code>.\u003cbr>\nNo errors were ever reported. Make the backups run.\u003cbr>\n(In the lab the job runs every minute so you can test quickly.)\u003c/blockquote>", "success": "\u003cul>\u003cli>cron runs the job and a fresh \u003ccode>.tar.gz\u003c/code> appears in \u003ccode>/srv/backups\u003c/code>\u003c/li>\u003cli>The archive is valid\u003c/li>\u003c/ul>", "warmup": "\u003cp>The solution uses long command lines. They are just short commands with one flag added at a time. Practise each ladder on any Linux box first (all read-only). Every rung adds \u003cstrong>one\u003c/strong> thing to the rung above - stop at the rung you understand, and read the next one only when you are ready. The lab itself uses the last rung of each ladder.\u003c/p>\n\u003ch4>cron - is my job running?\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">ls -l /etc/cron.d/                              \u003cspan class=\"c\"># 1. system cron files: names, owner, mode\u003c/span>\ncat /etc/cron.d/NAME                            \u003cspan class=\"c\"># 2. format: min hour day month weekday USER command\u003c/span>\njournalctl -u cron --since \"10 min ago\"         \u003cspan class=\"c\"># 3. every run, and every complaint\u003c/span>\nsystemctl list-timers                           \u003cspan class=\"c\"># 4. the systemd equivalent\u003c/span>\nsudo /path/to/script                            \u003cspan class=\"c\"># 5. run the job by hand to see its real error\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>mv / chmod / tar - the small fixes\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">mv old.name new.name                  \u003cspan class=\"c\"># 1. rename\u003c/span>\nchmod 0644 file                       \u003cspan class=\"c\"># 2. rw-r--r--\u003c/span>\nchmod 0755 script                     \u003cspan class=\"c\"># 3. rwxr-xr-x  (a script needs x to run)\u003c/span>\ntar -tzf backup.tar.gz | head         \u003cspan class=\"c\"># 4. -t = list (not extract), -z = gzip, -f = this file\u003c/span>\ntar -tzvf backup.tar.gz | head        \u003cspan class=\"c\"># 5. -v = with sizes/dates: look inside a backup before you trust it\u003c/span>\u003c/code>\u003c/pre>", "hints": [{"title": "Hint 1 - does cron even see it?", "html": "\u003cp>\u003ccode>journalctl -u cron --since \"10 min ago\"\u003c/code> - do you see the job running each minute? Read \u003ccode>man cron\u003c/code> about \u003ccode>/etc/cron.d\u003c/code> - there are rules about file \u003cstrong>names\u003c/strong>.\u003c/p>"}, {"title": "Hint 2 - cron is picky", "html": "\u003cp>After fixing the name, read the cron log again. cron also refuses files that are writable by group/other or not owned by root (security reasons).\u003c/p>"}, {"title": "Hint 3 - run it like cron does", "html": "\u003cp>Run the exact command from the cron line by hand: \u003ccode>sudo /usr/local/bin/shopapp-backup\u003c/code>. Cron does not run \u003ccode>bash script\u003c/code>, it executes the path directly.\u003c/p>"}], "learn": "\u003cul>\u003cli>\"No errors\" from cron often means \"never ran\". Check the cron log first.\u003c/li>\u003cli>\u003ccode>/etc/cron.d\u003c/code> file rules: name only \u003ccode>[A-Za-z0-9_-]\u003c/code> (no \u003ccode>.\u003c/code>), owned by root, not group/world writable, has a \u003cstrong>user\u003c/strong> column.\u003c/li>\u003cli>Run the exact command as the exact user cron uses before you trust a job.\u003c/li>\u003cli>A job that fails silently needs monitoring: alert when the newest backup is older than X.\u003c/li>\u003c/ul>", "solution": "\u003cblockquote>Long commands below are built up short-first (\u003ccode># 1.\u003c/code>, \u003ccode># 2.\u003c/code> ...). Each rung adds one flag;\u003cbr>\nthe last rung is what the lab uses. The README \u003cstrong>Warm-up\u003c/strong> explains every flag from scratch.\u003c/blockquote>\n\u003ch3>1. Does cron run it?\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">ls -l /srv/backups                        \u003cspan class=\"c\"># empty\u003c/span>\njournalctl -u cron --since \"10 min ago\"   \u003cspan class=\"c\"># no shopapp-backup lines at all\u003c/span>\nls -l /etc/cron.d/\n\u003cspan class=\"c\"># -rw-rw-rw- 1 root root ... shopapp-backup.cron\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>Debian/Ubuntu cron uses \u003ccode>run-parts\u003c/code> naming rules for \u003ccode>/etc/cron.d\u003c/code>: names with a \u003ccode>.\u003c/code> are \u003cstrong>ignored\u003c/strong> (so editor backups like \u003ccode>foo.bak\u003c/code> / \u003ccode>foo.dpkg-old\u003c/code> don't run). No error is logged.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>ls -l /srv/backups\u003c/code>\u003c/td>\u003ctd>Output folder of the job.\u003c/td>\u003ctd>Empty - the backup is not being produced.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>journalctl -u cron --since \"10 min ago\"\u003c/code>\u003c/td>\u003ctd>cron daemon log.\u003c/td>\u003ctd>No lines for this job at all = cron is not even \u003cem>seeing\u003c/em> it.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ls -l /etc/cron.d/\u003c/code>\u003c/td>\u003ctd>Names and modes of cron files.\u003c/td>\u003ctd>Name \u003ccode>shopapp-backup.cron\u003c/code> contains a dot; mode is \u003ccode>rw-rw-rw-\u003c/code>. Two clues for two faults.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>2. Fault 1 - the name\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo mv /etc/cron.d/shopapp-backup.cron /etc/cron.d/shopapp-backup\u003c/code>\u003c/pre>\n\u003cp>Wait one minute and read the log again:\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">journalctl -u cron --since \"2 min ago\"\n\u003cspan class=\"c\"># cron[650]: (*system*shopapp-backup) INSECURE MODE (group/other writable) (/etc/cron.d/shopapp-backup)\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>mv /etc/cron.d/shopapp-backup.cron /etc/cron.d/shopapp-backup\u003c/code>\u003c/td>\u003ctd>Renames the file.\u003c/td>\u003ctd>Debian/Ubuntu cron ignores names with a \u003ccode>.\u003c/code> in \u003ccode>/etc/cron.d\u003c/code> (silently).\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>3. Fault 2 - the file mode\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo chown root:root /etc/cron.d/shopapp-backup\nsudo chmod 0644 /etc/cron.d/shopapp-backup\u003c/code>\u003c/pre>\n\u003cp>Next minute:\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">journalctl -u cron --since \"2 min ago\"\n\u003cspan class=\"c\"># CRON[7001]: (root) CMD (/usr/local/bin/shopapp-backup)\u003c/span>\n\u003cspan class=\"c\"># CRON[7000]: (CRON) info (No MTA installed, discarding output)\u003c/span>\nls /srv/backups      \u003cspan class=\"c\"># still empty!\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>Cron runs it now, but the job fails and the output is thrown away (no mail server).\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>chown root:root\u003c/code> + \u003ccode>chmod 0644\u003c/code>\u003c/td>\u003ctd>Fix owner and mode.\u003c/td>\u003ctd>cron logs \u003ccode>INSECURE MODE (group/other writable)\u003c/code> and refuses files that anyone can edit - otherwise any user could run code as root.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>journalctl -u cron --since \"2 min ago\"\u003c/code> (after each fix)\u003c/td>\u003ctd>Re-read the log a minute later.\u003c/td>\u003ctd>Each fix reveals the \u003cstrong>next\u003c/strong> fault. \u003ccode>CMD (...)\u003c/code> = cron now runs it.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>4. Fault 3 - run it like cron does\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo /usr/local/bin/shopapp-backup\n\u003cspan class=\"c\"># sudo: /usr/local/bin/shopapp-backup: command not found      (or: Permission denied)\u003c/span>\nls -l /usr/local/bin/shopapp-backup\n\u003cspan class=\"c\"># -rw-r--r-- ...           &lt;-- no x bit\u003c/span>\nsudo chmod 0755 /usr/local/bin/shopapp-backup\nsudo /usr/local/bin/shopapp-backup &amp;&amp; ls -l /srv/backups\njournalctl -t shopapp-backup -n 3\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>/usr/local/bin/shopapp-backup\u003c/code> (run by hand as root)\u003c/td>\u003ctd>Executes the job like cron would.\u003c/td>\u003ctd>The output is discarded by cron (\u003ccode>No MTA installed\u003c/code>), so run it yourself to see the error.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ls -l /usr/local/bin/shopapp-backup\u003c/code>\u003c/td>\u003ctd>Mode of the script.\u003c/td>\u003ctd>\u003ccode>-rw-r--r--\u003c/code>: no execute bit.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>chmod 0755 /usr/local/bin/shopapp-backup\u003c/code>\u003c/td>\u003ctd>Adds execute.\u003c/td>\u003ctd>Fault 3 fixed.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>journalctl -t shopapp-backup -n 3\u003c/code>\u003c/td>\u003ctd>Filter by syslog \u003cstrong>identifier\u003c/strong> (\u003ccode>-t\u003c/code>).\u003c/td>\u003ctd>See what the script itself logged.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>5. Verify the backup is usable\u003c/h3>\n\u003cp>A backup you never restored is not a backup:\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">tar -tzvf /srv/backups/shopapp-*.tar.gz | head\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>tar -tzvf /srv/backups/shopapp-*.tar.gz | head\u003c/code>\u003c/td>\u003ctd>\u003ccode>-t\u003c/code> list, \u003ccode>-z\u003c/code> gzip, \u003ccode>-v\u003c/code> verbose, \u003ccode>-f\u003c/code> file.\u003c/td>\u003ctd>A backup you never read back is not a backup - verify the archive is valid and has content.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>", "root": "\u003cdiv class='tablewrap'>\u003ctable>\u003ctbody>\u003ctr>\u003ctd>Root cause\u003c/td>\u003ctd>Three deploy mistakes: \u003ccode>.cron\u003c/code> suffix (ignored), mode 0666 (rejected as insecure), script without \u003ccode>x\u003c/code> bit. Output was discarded, so nobody saw it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prevent\u003c/td>\u003ctd>Deploy cron jobs with config management/packages; capture output (\u003ccode>&gt;&gt; /var/log/... 2&gt;&amp;1\u003c/code> or \u003ccode>logger\u003c/code>); alert on \"newest backup older than 26h\"; consider systemd timers (logs in journal, \u003ccode>systemctl list-timers\u003c/code>)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "explain": "\u003cp>\u003cstrong>cron fails quietly.\u003c/strong> Three independent mistakes meant the job never produced a backup, and nobody saw an error:\u003c/p>\n\u003col>\u003cli>\u003cstrong>File name\u003c/strong> \u003ccode>shopapp-backup.cron\u003c/code> - on Debian/Ubuntu \u003ccode>/etc/cron.d\u003c/code> files follow \u003ccode>run-parts\u003c/code> naming: only \u003ccode>[A-Za-z0-9_-]\u003c/code>. A name with a \u003ccode>.\u003c/code> is \u003cstrong>silently ignored\u003c/strong> (so editor leftovers like \u003ccode>foo.bak\u003c/code> don't run).\u003c/li>\u003cli>\u003cstrong>Mode 0666\u003c/strong> - cron refuses files that are group/other-writable or not owned by root: \u003ccode>INSECURE MODE\u003c/code>. Fix: \u003ccode>root:root 0644\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Script without \u003ccode>x\u003c/code> bit\u003c/strong> - cron executes the path directly (not \u003ccode>bash script\u003c/code>), so it needs the execute permission.\u003c/li>\u003c/ol>\n\u003cp>Even when cron runs the job, with no MTA the output is discarded - \u003ccode>No MTA installed, discarding output\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Method:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>read the cron log: \u003ccode>journalctl -u cron\u003c/code> - do you see the job at all?\u003c/li>\u003cli>run the \u003cstrong>exact command as the exact user cron uses\u003c/strong>: \u003ccode>sudo /usr/local/bin/shopapp-backup\u003c/code>\u003c/li>\u003cli>check the result: \u003ccode>tar -tzvf /srv/backups/*.tar.gz\u003c/code> - a backup you never restored is not a backup\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Prevention:\u003c/strong> deploy via config management/packages, log output (\u003ccode>&gt;&gt; file 2&gt;&amp;1\u003c/code> or \u003ccode>logger\u003c/code>), alert when the newest backup is older than ~26 h, consider systemd timers (logs in the journal).\u003c/p>", "mcq": [{"q": "Why was `/etc/cron.d/shopapp-backup.cron` never executed?", "o": ["File names containing a '.' are ignored by cron's run-parts naming rules", "cron.d only accepts .cron suffix", "It needs a shebang", "cron only runs at midnight"], "why": "No error is logged: such files are skipped silently."}, {"q": "The cron log shows `INSECURE MODE (group/other writable)`. What do you change?", "o": ["chown root:root and chmod 0644 on the cron file", "chmod 777 the file", "Restart the kernel", "Add a MAILTO line"], "why": "cron requires root ownership and no group/other write permission."}, {"q": "Cron now runs the job, but no archive appears. What is a likely remaining cause?", "o": ["The script lacks the execute bit (cron runs it directly)", "Backups are only made on weekends", "cron can't write to /tmp", "The tar binary is missing from the kernel"], "why": "Run it by hand exactly as cron does: it fails with Permission denied until chmod +x."}], "qa": [{"q": "'cron reported no errors' - why does that not prove the job works, and how do you make failures visible?", "a": "Because several failures are silent: ignored file names, rejected insecure files, and discarded output when no MTA exists. Check `journalctl -u cron` for actual runs, run the command by hand as the cron user, redirect output to a log (`>> /var/log/x.log 2>&1` or logger), and alert when the newest backup is older than expected."}, {"q": "What does 'a backup you never restored is not a backup' mean in practice?", "a": "You must verify the archive is usable: list/extract it (`tar -tzvf`), occasionally do a full test restore, and monitor backup age and size. An empty or corrupt archive gives false confidence."}]}, {"id": "m06", "level": "medium", "title": "Everything is slow, CPU is idle", "time": "30 min", "skills": "memory pressure, swap, `vmstat si/so`, RSS vs. swap per process, sysctl persistence", "ticket": "\u003cblockquote>\u003cstrong>INC-2006 · P2\u003c/strong>\u003cbr>\nSince the change window for \u003cstrong>CHG-552 \"batch performance tuning\"\u003c/strong> the host is very\u003cbr>\nsluggish: SSH takes seconds to echo keys, the shop is slow, load average is high.\u003cbr>\n\u003ccode>top\u003c/code> shows the CPUs mostly idle. Nobody sees a CPU hog.\u003cbr>\n\u003ccode>report-builder.service\u003c/code> (the nightly batch) must keep running - just not like this.\u003c/blockquote>", "success": "\u003cul>\u003cli>The host stops swapping (no steady swap-in/swap-out)\u003c/li>\u003cli>\u003ccode>report-builder\u003c/code> keeps running with a sane memory footprint (≤ 50% of RAM)\u003c/li>\u003cli>The swappiness \"tuning\" from CHG-552 is undone at runtime \u003cstrong>and\u003c/strong> on disk\u003c/li>\u003c/ul>\n\u003cp>Check with \u003ccode>sudo ./labctl.sh check m06\u003c/code>.\u003c/p>", "warmup": "\u003cp>The solution uses long command lines. They are just short commands with one flag added at a time. Practise each ladder on any Linux box first (all read-only). Every rung adds \u003cstrong>one\u003c/strong> thing to the rung above - stop at the rung you understand, and read the next one only when you are ready. The lab itself uses the last rung of each ladder.\u003c/p>\n\u003ch4>uptime / top - CPU\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">uptime                  \u003cspan class=\"c\"># 1. load average: 1, 5, 15 min. Compare to the CPU count:\u003c/span>\nnproc                   \u003cspan class=\"c\"># 2. number of CPUs. load 2.0 on 2 CPUs = fully busy\u003c/span>\ntop                     \u003cspan class=\"c\"># 3. live view. P = sort by CPU, M = by memory, 1 = per-CPU, q = quit\u003c/span>\ntop -bn1 | head -5      \u003cspan class=\"c\"># 4. -b = batch (plain text), -n1 = one snapshot -&gt; good for logs and pipes\u003c/span>\n\u003cspan class=\"c\"># CPU line: us=user sy=kernel ni=niced id=idle wa=waiting for disk\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>free / vmstat - memory and swap\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">free                    \u003cspan class=\"c\"># 1. memory in KB\u003c/span>\nfree -m                 \u003cspan class=\"c\"># 2. in MB; read the 'available' column, not 'free'\u003c/span>\nvmstat                  \u003cspan class=\"c\"># 3. one summary line since boot\u003c/span>\nvmstat 1 5              \u003cspan class=\"c\"># 4. a line per second, 5 times (ignore the first line)\u003c/span>\n\u003cspan class=\"c\"># columns: r=runnable b=blocked si/so=swap in/out wa=CPU waiting for disk. si/so &gt; 0 for long = swapping.\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>ps / pgrep / pstree - look at processes\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">ps                                         \u003cspan class=\"c\"># 1. only your shell\u003c/span>\nps -ef                                     \u003cspan class=\"c\"># 2. every process, full format (PID, PPID, command)\u003c/span>\nps -fp 1234                                \u003cspan class=\"c\"># 3. just one PID\u003c/span>\nps -eo pid,ppid,user,%cpu,%mem,cmd         \u003cspan class=\"c\"># 4. -o = choose your own columns\u003c/span>\nps -eo pid,%cpu,cmd --sort=-%cpu | head    \u003cspan class=\"c\"># 5. sort by CPU, highest first (- = descending), top 10\u003c/span>\npgrep -af nginx                            \u003cspan class=\"c\"># 6. find PIDs by name (-a = show full command, -f = match whole command line)\u003c/span>\npstree -ps 1234                            \u003cspan class=\"c\"># 7. parent chain of one PID: who started it?\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>sysctl - read and change kernel settings\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">sysctl vm.swappiness                    \u003cspan class=\"c\"># 1. read one setting\u003c/span>\nsysctl -a | grep swappiness             \u003cspan class=\"c\"># 2. list all, filter (when you do not know the exact name)\u003c/span>\nsudo sysctl -w vm.swappiness=60         \u003cspan class=\"c\"># 3. -w = set NOW (lost at reboot)\u003c/span>\ncat /etc/sysctl.d/*.conf                \u003cspan class=\"c\"># 4. where permanent values live\u003c/span>\nsudo sysctl --system                    \u003cspan class=\"c\"># 5. re-read all files; the LAST file wins on a conflict\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>grep VmSwap - who is swapped out?\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">grep VmSwap /proc/self/status                         \u003cspan class=\"c\"># 1. swap used by one process\u003c/span>\ngrep VmSwap /proc/[0-9]*/status 2&gt;/dev/null           \u003cspan class=\"c\"># 2. all processes (glob); hide errors of processes that vanished\u003c/span>\ngrep VmSwap /proc/[0-9]*/status 2&gt;/dev/null | sort -k2 -n | tail -3   \u003cspan class=\"c\"># 3. sort by column 2, biggest last\u003c/span>\u003c/code>\u003c/pre>", "hints": [{"title": "Hint 1 - CPU idle, load high", "html": "\u003cp>Load counts tasks waiting for CPU \u003cstrong>and\u003c/strong> tasks waiting in the kernel (I/O, page faults). \u003ccode>vmstat 1 10\u003c/code> - look at the \u003ccode>si\u003c/code>/\u003ccode>so\u003c/code> (swap in/out) columns and \u003ccode>wa\u003c/code>. \u003ccode>free -m\u003c/code>.\u003c/p>"}, {"title": "Hint 2 - who uses the memory?", "html": "\u003cp>\u003ccode>ps -eo pid,user,rss,vsz,cmd --sort=-rss | head\u003c/code>. Swap per process: \u003ccode>grep VmSwap /proc/*/status | sort -k2 -n | tail\u003c/code>. Add up all workers of the same program.\u003c/p>"}, {"title": "Hint 3 - what did CHG-552 change?", "html": "\u003cp>Look at recently changed files: \u003ccode>ls -lt /etc /etc/sysctl.d | head\u003c/code>. \u003ccode>sysctl vm.swappiness\u003c/code>, and read the report-builder config. Two settings were changed.\u003c/p>"}], "learn": "\u003cul>\u003cli>Swap thrashing looks like \"slow everything, CPU idle\". \u003ccode>si\u003c/code>/\u003ccode>so\u003c/code> &gt; 0 every second is the signal.\u003c/li>\u003cli>\u003ccode>free\u003c/code> \"used\" is not the story: check \u003cstrong>available\u003c/strong> and swap activity.\u003c/li>\u003cli>Size worker pools to RAM: workers × memory per worker must fit with headroom.\u003c/li>\u003cli>\u003ccode>vm.swappiness\u003c/code> changes \u003cem>when\u003c/em> the kernel swaps; it does not create memory.\u003c/li>\u003cli>A runtime \u003ccode>sysctl -w\u003c/code> is lost at reboot; a file in \u003ccode>/etc/sysctl.d/\u003c/code> comes back at boot.\u003c/li>\u003c/ul>", "solution": "\u003cblockquote>Long commands below are built up short-first (\u003ccode># 1.\u003c/code>, \u003ccode># 2.\u003c/code> ...). Each rung adds one flag;\u003cbr>\nthe last rung is what the lab uses. The README \u003cstrong>Warm-up\u003c/strong> explains every flag from scratch.\u003c/blockquote>\n\u003ch3>1. Confirm: CPU idle, but the box is slow\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">uptime                     \u003cspan class=\"c\"># load average: 6.8, 5.9, 3.1  on 2 CPUs\u003c/span>\nvmstat 1 5\n\u003cspan class=\"c\"># procs -----------memory---------- ---swap-- -----io---- -system-- ------cpu-----\u003c/span>\n\u003cspan class=\"c\">#  r  b   swpd   free   buff  cache   si   so    bi    bo   in   cs us sy id wa st\u003c/span>\n\u003cspan class=\"c\">#  1  4 812344  61200   1020  40312 9120 8840 10200  8900 3100 5200  6 14 32 48  0\u003c/span>\u003c/code>\u003c/pre>\n\u003cul>\u003cli>\u003ccode>si\u003c/code>/\u003ccode>so\u003c/code> in the thousands every second = \u003cstrong>swap storm\u003c/strong>.\u003c/li>\u003cli>\u003ccode>b\u003c/code> (blocked) &gt; 0 and high \u003ccode>wa\u003c/code> = tasks waiting on the disk (here: on swap).\u003c/li>\u003cli>\u003ccode>cache\u003c/code> is tiny - the page cache was squeezed out, so even normal file reads hit disk.\u003c/li>\u003c/ul>\n\u003cpre>\u003ccode class=\"lang-bash\">free -m\n\u003cspan class=\"c\">#        total  used  free  shared  buff/cache  available\u003c/span>\n\u003cspan class=\"c\"># Mem:    1967  1880    60       2          27         18\u003c/span>\n\u003cspan class=\"c\"># Swap:   1023   790   233\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>available\u003c/code> is almost zero.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>uptime\u003c/code>\u003c/td>\u003ctd>Load average.\u003c/td>\u003ctd>6.8 on 2 CPUs - but is the CPU really busy?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>vmstat 1 5\u003c/code>\u003c/td>\u003ctd>Virtual memory stats, 1 s interval, 5 samples.\u003c/td>\u003ctd>Key columns: \u003ccode>si/so\u003c/code> (swap in/out, KB/s) in the thousands = swap storm; \u003ccode>b\u003c/code> blocked tasks; \u003ccode>wa\u003c/code> CPU waiting on IO; tiny \u003ccode>cache\u003c/code>. CPU is not busy, it is \u003cstrong>waiting for disk\u003c/strong>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>free -m\u003c/code>\u003c/td>\u003ctd>RAM and swap usage in MB.\u003c/td>\u003ctd>\u003ccode>available\u003c/code> ~18 MB: nothing left without swapping.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>2. Who uses the memory?\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">ps -eo pid,user,rss,cmd                  \u003cspan class=\"c\"># 1. rss = RAM actually used (KB)\u003c/span>\nps -eo pid,user,rss,cmd --sort=-rss      \u003cspan class=\"c\"># 2. biggest first\u003c/span>\nps -eo pid,user,rss,cmd --sort=-rss | head   \u003cspan class=\"c\"># 3. top 10\u003c/span>\n\u003cspan class=\"c\"># 5121 root 182340 /usr/bin/python3 /usr/local/bin/report-builder\u003c/span>\n\u003cspan class=\"c\"># 5122 root 179112 /usr/bin/python3 /usr/local/bin/report-builder\u003c/span>\n\u003cspan class=\"c\"># ... 10 workers\u003c/span>\ngrep VmSwap /proc/[0-9]*/status 2&gt;/dev/null | sort -k2 -n | tail -3\nsystemctl status report-builder        \u003cspan class=\"c\"># Memory: 1.9G (swap: 790M)\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>Ten workers, each with ~200 MB. Total is more than the RAM of the host.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>ps -eo pid,user,rss,cmd --sort=-rss | head\u003c/code>\u003c/td>\u003ctd>\u003ccode>rss\u003c/code> = resident memory. Sorted by biggest.\u003c/td>\u003ctd>Ten \u003ccode>report-builder\u003c/code> workers, ~200 MB each.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>grep VmSwap /proc/[0-9]*/status | sort -k2 -n | tail -3\u003c/code>\u003c/td>\u003ctd>Reads swap use of every process; sorts by the number in column 2.\u003c/td>\u003ctd>Who has been pushed to swap.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl status report-builder\u003c/code>\u003c/td>\u003ctd>Shows a cgroup memory summary.\u003c/td>\u003ctd>\u003ccode>Memory: 1.9G (swap: 790M)\u003c/code> for one service.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>3. What did CHG-552 change?\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">ls -lt /etc/sysctl.d/ /etc/*.conf | head\ncat /etc/sysctl.d/60-batch-tuning.conf\n\u003cspan class=\"c\"># # swap more eagerly so the batch gets more page cache\u003c/span>\n\u003cspan class=\"c\"># vm.swappiness = 100\u003c/span>\ncat /etc/report-builder.conf\n\u003cspan class=\"c\"># workers = 10            # CHG-552: was 2   (the number depends on your VM's RAM)\u003c/span>\n\u003cspan class=\"c\"># worker_mb = 200\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>Two changes: workers 2 → 10 (more memory than the host has), and swappiness 100 (swap application memory even earlier).\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>ls -lt /etc/sysctl.d/ /etc/*.conf | head\u003c/code>\u003c/td>\u003ctd>Newest changed config files first.\u003c/td>\u003ctd>Finds what CHG-552 touched.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>cat /etc/sysctl.d/60-batch-tuning.conf\u003c/code>\u003c/td>\u003ctd>Kernel tunables applied at boot.\u003c/td>\u003ctd>\u003ccode>vm.swappiness = 100\u003c/code> - swap application memory eagerly.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>cat /etc/report-builder.conf\u003c/code>\u003c/td>\u003ctd>App config.\u003c/td>\u003ctd>\u003ccode>workers = 10\u003c/code> (was 2): 10 x 200 MB &gt; RAM.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>4. Fix\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo sed -i 's/^workers *=.*/workers = 2/' /etc/report-builder.conf\nsudo systemctl restart report-builder\n\nsudo rm /etc/sysctl.d/60-batch-tuning.conf     \u003cspan class=\"c\"># or set 60 / remove the line\u003c/span>\nsudo sysctl -w vm.swappiness=60                 \u003cspan class=\"c\"># runtime value (default)\u003c/span>\nsudo sysctl --system | grep swappiness          \u003cspan class=\"c\"># confirm nothing else sets it\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>Optional: pull pages back from swap (only when there is enough free RAM!): \u003ccode>sudo swapoff -a &amp;&amp; sudo swapon -a\u003c/code>.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>sed -i 's/^workers *=.*/workers = 2/' FILE\u003c/code>\u003c/td>\u003ctd>Restore the old value.\u003c/td>\u003ctd>Fixes the memory demand.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>rm /etc/sysctl.d/60-batch-tuning.conf\u003c/code>\u003c/td>\u003ctd>Removes persistent tuning.\u003c/td>\u003ctd>So it does not come back at reboot.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sysctl -w vm.swappiness=60\u003c/code>\u003c/td>\u003ctd>Changes the kernel parameter \u003cstrong>now\u003c/strong> (runtime only).\u003c/td>\u003ctd>Immediate effect; \u003ccode>rm\u003c/code> above makes it permanent.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sysctl --system\u003c/code>\u003c/td>\u003ctd>Re-applies all sysctl files in order.\u003c/td>\u003ctd>Confirms nothing else sets swappiness.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>swapoff -a &amp;&amp; swapon -a\u003c/code>\u003c/td>\u003ctd>Disable and re-enable all swap (forces pages back into RAM).\u003c/td>\u003ctd>Optional cleanup - \u003cstrong>only\u003c/strong> if there is enough free RAM, or it can OOM.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>5. Verify\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">vmstat 1 5              \u003cspan class=\"c\"># si/so 0\u003c/span>\nfree -m\nsudo ./labctl.sh check m06\u003c/code>\u003c/pre>", "root": "\u003cdiv class='tablewrap'>\u003ctable>\u003ctbody>\u003ctr>\u003ctd>Root cause\u003c/td>\u003ctd>CHG-552 raised batch workers 2 → 10 (2 GB on a 2 GB host) and set swappiness 100 -&gt; thrashing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fix\u003c/td>\u003ctd>Workers back to 2, swappiness default, sysctl file removed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prevent\u003c/td>\u003ctd>Capacity check for changes (workers × MB vs RAM); \u003ccode>MemoryMax=\u003c/code>/\u003ccode>MemoryHigh=\u003c/code> on batch units; alert on swap-in rate, not only swap used\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "explain": "\u003cp>\u003cstrong>Swap storm = slow system with idle CPU.\u003c/strong> The sum of the batch workers' memory (10 workers x ~200 MB = ~2 GB) exceeds the RAM of a 2 GB VM. The kernel keeps moving pages between RAM and swap. Tasks wait for page-ins in uninterruptible sleep (D), which counts toward load average but not CPU use. Result: high load, high \u003ccode>wa\u003c/code>, low CPU, SSH echo lag.\u003c/p>\n\u003cp>\u003cstrong>Signals in \u003ccode>vmstat 1\u003c/code>:\u003c/strong> \u003ccode>si\u003c/code>/\u003ccode>so\u003c/code> in the thousands \u003cstrong>every second\u003c/strong>, \u003ccode>b &gt; 0\u003c/code>, \u003ccode>wa\u003c/code> high, \u003ccode>cache\u003c/code> tiny, \u003ccode>free -m\u003c/code> -&gt; \u003ccode>available\u003c/code> near zero. Swap \u003cem>used\u003c/em> alone is not the signal; swap \u003cem>activity\u003c/em> is.\u003c/p>\n\u003cp>\u003cstrong>Two changes in CHG-552:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>workers 2 -&gt; 10 (capacity: workers x MB per worker must fit RAM with headroom)\u003c/li>\u003cli>\u003ccode>vm.swappiness = 100\u003c/code> (swap application memory more eagerly)\u003c/li>\u003c/ul>\n\u003cp>\u003ccode>vm.swappiness\u003c/code> changes \u003cem>when\u003c/em> the kernel swaps vs dropping page cache; it does not create memory.\u003c/p>\n\u003cp>\u003cstrong>Persistence:\u003c/strong> \u003ccode>sysctl -w\u003c/code> is runtime only. \u003ccode>/etc/sysctl.d/60-batch-tuning.conf\u003c/code> re-applies at boot, so remove or fix the file \u003cstrong>and\u003c/strong> set the runtime value. Verify with \u003ccode>sysctl --system | grep swappiness\u003c/code>.\u003c/p>\n\u003cp>Prevention: capacity check on changes, \u003ccode>MemoryMax=/MemoryHigh=\u003c/code> on batch units, alert on swap-in rate.\u003c/p>", "mcq": [{"q": "The host is very slow, `top` shows idle CPUs. Which `vmstat` pattern proves a swap storm?", "o": ["si and so are high every second, with high wa", "r is high and us is 100", "cs is zero", "free is above 90%"], "why": "Constant swap-in/swap-out plus I/O wait means tasks are waiting on swap."}, {"q": "What does `vm.swappiness` do?", "o": ["Tunes how aggressively the kernel swaps application memory versus reclaiming page cache", "Sets the total swap size", "Enables the OOM killer", "Limits per-process memory"], "why": "It is a preference, not a limit - it cannot create RAM."}, {"q": "How do you undo the swappiness tuning both now and after reboot?", "o": ["sysctl -w vm.swappiness=60 AND remove the /etc/sysctl.d file", "Only run sysctl -w", "Only reboot", "Edit /proc/meminfo"], "why": "Runtime change is lost on reboot; the file in sysctl.d would reapply the bad value."}], "qa": [{"q": "Why can load average be high while the CPUs are idle?", "a": "Load counts runnable tasks plus tasks in uninterruptible sleep (D). During a swap storm many tasks wait for pages to be read from disk; they use no CPU but still add to load and iowait."}, {"q": "Give a quick capacity check that would have prevented CHG-552.", "a": "workers x memory per worker (+ OS and other services) must be comfortably below RAM: 10 x ~200 MB = ~2 GB on a 2 GB host fails; 2 workers = ~400 MB fits. Also cap the batch unit with MemoryMax/MemoryHigh."}]}, {"id": "m07", "level": "medium", "title": "Hundreds of `\u003cdefunct>` processes", "time": "25 min", "skills": "process states, zombies, parent/child, `TasksMax`, why `kill -9` does nothing", "ticket": "\u003cblockquote>\u003cstrong>INC-2007 · P2\u003c/strong>\u003cbr>\n\u003ccode>queue-dispatcher.service\u003c/code> stopped processing jobs. Its log says\u003cbr>\n\u003ccode>fork failed: [Errno 11] Resource temporarily unavailable\u003c/code>.\u003cbr>\n\u003ccode>ps\u003c/code> shows ~150 \u003ccode>[python3] &lt;defunct&gt;\u003c/code> processes. The night shift ran\u003cbr>\n\u003ccode>kill -9\u003c/code> on them - nothing happened.\u003cbr>\nGet the dispatcher processing jobs again. Do \u003cstrong>not\u003c/strong> raise the unit's \u003ccode>TasksMax\u003c/code> - it\u003cbr>\nprotects the host from runaway forks.\u003c/blockquote>", "success": "\u003cul>\u003cli>queue-dispatcher is running and dispatching jobs\u003c/li>\u003cli>No zombie children pile up under it\u003c/li>\u003cli>\u003ccode>TasksMax\u003c/code> is still 150\u003c/li>\u003c/ul>\n\u003cp>Check with \u003ccode>sudo ./labctl.sh check m07\u003c/code>.\u003c/p>", "warmup": "\u003cp>The solution uses long command lines. They are just short commands with one flag added at a time. Practise each ladder on any Linux box first (all read-only). Every rung adds \u003cstrong>one\u003c/strong> thing to the rung above - stop at the rung you understand, and read the next one only when you are ready. The lab itself uses the last rung of each ladder.\u003c/p>\n\u003ch4>ps / pgrep / pstree - look at processes\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">ps                                         \u003cspan class=\"c\"># 1. only your shell\u003c/span>\nps -ef                                     \u003cspan class=\"c\"># 2. every process, full format (PID, PPID, command)\u003c/span>\nps -fp 1234                                \u003cspan class=\"c\"># 3. just one PID\u003c/span>\nps -eo pid,ppid,user,%cpu,%mem,cmd         \u003cspan class=\"c\"># 4. -o = choose your own columns\u003c/span>\nps -eo pid,%cpu,cmd --sort=-%cpu | head    \u003cspan class=\"c\"># 5. sort by CPU, highest first (- = descending), top 10\u003c/span>\npgrep -af nginx                            \u003cspan class=\"c\"># 6. find PIDs by name (-a = show full command, -f = match whole command line)\u003c/span>\npstree -ps 1234                            \u003cspan class=\"c\"># 7. parent chain of one PID: who started it?\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>pipes - building a one-liner step by step\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">ps -eo stat                                   \u003cspan class=\"c\"># 1. one column of states\u003c/span>\nps -eo stat | grep Z                          \u003cspan class=\"c\"># 2. keep lines containing Z\u003c/span>\nps -eo stat | grep -c '^Z'                    \u003cspan class=\"c\"># 3. -c = count them; ^ = at line start\u003c/span>\nps -eo pid,ppid,stat,cmd | awk '$3 ~ /Z/'     \u003cspan class=\"c\"># 4. awk: print lines where column 3 matches Z\u003c/span>\nwatch -n1 'ps -eo stat | grep -c \"^Z\"'        \u003cspan class=\"c\"># 5. watch -n1 = re-run every second, live view\u003c/span>\n\u003cspan class=\"c\"># Rule: build a pipeline one stage at a time, run it after each |, and look at the output.\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>systemctl show / cat - ask systemd for facts\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">systemctl cat nginx                              \u003cspan class=\"c\"># 1. the unit file(s) systemd really uses, incl. drop-ins\u003c/span>\nsystemctl show nginx                             \u003cspan class=\"c\"># 2. every property (long)\u003c/span>\nsystemctl show -p User nginx                     \u003cspan class=\"c\"># 3. -p = just one property\u003c/span>\nsystemctl show -p User -p MainPID nginx          \u003cspan class=\"c\"># 4. several\u003c/span>\nsystemctl show -p MainPID --value nginx          \u003cspan class=\"c\"># 5. --value = print only the value (for scripts)\u003c/span>\u003c/code>\u003c/pre>", "hints": [{"title": "Hint 1 - what is a zombie?", "html": "\u003cp>\u003ccode>ps -eo pid,ppid,stat,cmd | awk '$3 ~ /Z/'\u003c/code>. State \u003ccode>Z\u003c/code> = the process has already exited. It is only an entry in the process table, waiting for its \u003cstrong>parent\u003c/strong> to read its exit status.\u003c/p>"}, {"title": "Hint 2 - who must clean up?", "html": "\u003cp>Look at the PPID of the zombies. Which process is it? Only the parent (with \u003ccode>wait()\u003c/code>) or the parent's death removes zombies. Why can a dead process not be killed?\u003c/p>"}, {"title": "Hint 3 - why does the parent not reap?", "html": "\u003cp>\u003ccode>systemctl status queue-dispatcher\u003c/code> shows \u003ccode>Tasks: 150 (limit: 150)\u003c/code>. Zombies count against it. Read the dispatcher's config file (\u003ccode>systemctl cat\u003c/code> shows how it is started).\u003c/p>"}], "learn": "\u003cul>\u003cli>Zombies use no CPU or memory, but they use a PID and count against \u003ccode>TasksMax\u003c/code> / \u003ccode>pid_max\u003c/code>.\u003c/li>\u003cli>You cannot kill a zombie - it is already dead. Fix or restart the \u003cstrong>parent\u003c/strong>.\u003c/li>\u003cli>When a parent dies, its children are re-parented to PID 1 (or a subreaper), which reaps them.\u003c/li>\u003cli>\u003ccode>EAGAIN\u003c/code> from fork/clone = a task/PID limit, not a memory problem.\u003c/li>\u003c/ul>", "solution": "\u003cblockquote>Long commands below are built up short-first (\u003ccode># 1.\u003c/code>, \u003ccode># 2.\u003c/code> ...). Each rung adds one flag;\u003cbr>\nthe last rung is what the lab uses. The README \u003cstrong>Warm-up\u003c/strong> explains every flag from scratch.\u003c/blockquote>\n\u003ch3>1. Confirm\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">journalctl -u queue-dispatcher -n 5 --no-pager\n\u003cspan class=\"c\"># queue-dispatcher[6100]: ERROR fork failed: [Errno 11] Resource temporarily unavailable\u003c/span>\nps -eo stat | grep -c '^Z'          \u003cspan class=\"c\"># ~149\u003c/span>\nps -eo pid,ppid,stat,cmd                              \u003cspan class=\"c\"># 1. all processes with state\u003c/span>\nps -eo pid,ppid,stat,cmd | awk '$3 ~ /Z/'             \u003cspan class=\"c\"># 2. awk: keep rows whose 3rd column contains Z\u003c/span>\nps -eo pid,ppid,stat,cmd | awk '$3 ~ /Z/' | head -3   \u003cspan class=\"c\"># 3. first three\u003c/span>\n\u003cspan class=\"c\">#  6230  6100 Z    [python3] &lt;defunct&gt;\u003c/span>\n\u003cspan class=\"c\">#  6231  6100 Z    [python3] &lt;defunct&gt;\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>All zombies have the same parent: PID 6100.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>journalctl -u queue-dispatcher -n 5\u003c/code>\u003c/td>\u003ctd>Unit log.\u003c/td>\u003ctd>\u003ccode>fork failed: Errno 11 (EAGAIN)\u003c/code>: cannot create processes.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ps -eo stat | grep -c '^Z'\u003c/code>\u003c/td>\u003ctd>Prints process state; \u003ccode>grep -c\u003c/code> counts lines starting with \u003ccode>Z\u003c/code> (zombie).\u003c/td>\u003ctd>~149 zombies.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ps -eo pid,ppid,stat,cmd | awk '$3 ~ /Z/' | head -3\u003c/code>\u003c/td>\u003ctd>\u003ccode>awk\u003c/code> keeps lines where column 3 (STAT) contains Z.\u003c/td>\u003ctd>All zombies share the same PPID 6100 - one parent is the culprit.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>2. Why \u003ccode>kill -9\u003c/code> does nothing\u003c/h3>\n\u003cp>A zombie has already exited. Its memory is gone; only the process-table entry (PID, exit status) remains until the parent calls \u003ccode>wait()\u003c/code>. You cannot kill something that is dead.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>kill -9 ZOMBIE\u003c/code> (useless)\u003c/td>\u003ctd>Sends SIGKILL.\u003c/td>\u003ctd>A zombie is already dead; only its process-table entry remains until the parent calls \u003ccode>wait()\u003c/code>.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>3. Why fork fails\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">systemctl status queue-dispatcher | grep Tasks\n\u003cspan class=\"c\">#      Tasks: 150 (limit: 150)\u003c/span>\nsystemctl show -p TasksMax queue-dispatcher     \u003cspan class=\"c\"># TasksMax=150\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>Every zombie still holds a PID inside the service's cgroup. 150 of them = the limit is reached, and the next \u003ccode>fork()\u003c/code> fails with \u003ccode>EAGAIN\u003c/code> (errno 11).\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>systemctl status queue-dispatcher | grep Tasks\u003c/code>\u003c/td>\u003ctd>Shows cgroup task count and limit.\u003c/td>\u003ctd>\u003ccode>Tasks: 150 (limit: 150)\u003c/code> - zombies still occupy PIDs in the cgroup.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl show -p TasksMax queue-dispatcher\u003c/code>\u003c/td>\u003ctd>Reads the limit.\u003c/td>\u003ctd>Explains why \u003ccode>fork()\u003c/code> returns EAGAIN.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>4. Why the parent doesn't reap\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">pstree -p 6100 | head -3\nsystemctl cat queue-dispatcher | grep ExecStart\ncat /etc/queue-dispatcher.conf\n\u003cspan class=\"c\"># [dispatcher]\u003c/span>\n\u003cspan class=\"c\"># ; set to false while debugging INC-2190 (child exit codes) - revert after!\u003c/span>\n\u003cspan class=\"c\"># reap_children = false\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>The parent was told not to collect its children's exit status.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>pstree -p 6100\u003c/code>\u003c/td>\u003ctd>Process tree of the parent.\u003c/td>\u003ctd>See its children.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl cat queue-dispatcher | grep ExecStart\u003c/code>\u003c/td>\u003ctd>What the service runs.\u003c/td>\u003ctd>Find the program and its config.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>cat /etc/queue-dispatcher.conf\u003c/code>\u003c/td>\u003ctd>App config.\u003c/td>\u003ctd>\u003ccode>reap_children = false\u003c/code>, set while debugging INC-2190 and never reverted.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>5. Fix\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo sed -i 's/^reap_children *=.*/reap_children = true/' /etc/queue-dispatcher.conf\nsudo systemctl restart queue-dispatcher\u003c/code>\u003c/pre>\n\u003cp>Restarting the parent alone already clears the zombies (systemd stops the cgroup; orphans are re-parented and reaped). But without the config fix they come back in ~30 seconds.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>sed -i 's/^reap_children *=.*/reap_children = true/' FILE\u003c/code>\u003c/td>\u003ctd>Flip it back.\u003c/td>\u003ctd>Real fix.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl restart queue-dispatcher\u003c/code>\u003c/td>\u003ctd>Restart parent.\u003c/td>\u003ctd>Clears existing zombies (orphans are re-parented to init and reaped).\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>6. Verify\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">ps -eo stat | grep -c '^Z'                  \u003cspan class=\"c\"># 0 (or a few for a moment)\u003c/span>\njournalctl -u queue-dispatcher -n 3 --no-pager   \u003cspan class=\"c\"># dispatched job N\u003c/span>\nsudo ./labctl.sh check m07\u003c/code>\u003c/pre>", "root": "\u003cdiv class='tablewrap'>\u003ctable>\u003ctbody>\u003ctr>\u003ctd>Root cause\u003c/td>\u003ctd>Debug setting \u003ccode>reap_children = false\u003c/code> left on; zombies filled the unit's \u003ccode>TasksMax\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fix\u003c/td>\u003ctd>Reaping enabled, service restarted\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prevent\u003c/td>\u003ctd>Expiring debug flags / review; alert on zombie count and on \u003ccode>Tasks\u003c/code> near \u003ccode>TasksMax\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "explain": "\u003cp>\u003cstrong>What a zombie is:\u003c/strong> a process that has already exited but whose parent has not yet called \u003ccode>wait()\u003c/code> to read its exit status. Its memory is gone; only a \u003cstrong>process-table entry\u003c/strong> (PID + status) remains. State \u003ccode>Z\u003c/code>, shown as \u003ccode>&lt;defunct&gt;\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Why \u003ccode>kill -9\u003c/code> does nothing:\u003c/strong> you cannot kill something that is already dead.\u003c/p>\n\u003cp>\u003cstrong>Why it breaks the service:\u003c/strong> every zombie still holds a \u003cstrong>PID/task slot inside the unit's cgroup\u003c/strong>. \u003ccode>TasksMax=150\u003c/code> + 150 zombies = the next \u003ccode>fork()\u003c/code> fails with \u003ccode>EAGAIN\u003c/code> (errno 11 \u003ccode>Resource temporarily unavailable\u003c/code>). EAGAIN on fork = task/PID limit, not memory.\u003c/p>\n\u003cp>\u003cstrong>Who cleans up:\u003c/strong> only the \u003cstrong>parent\u003c/strong> (calling \u003ccode>wait\u003c/code>) - or the parent's death (children are re-parented to PID 1, which reaps them). The dispatcher had \u003ccode>reap_children = false\u003c/code> in \u003ccode>/etc/queue-dispatcher.conf\u003c/code> (a debug flag from INC-2190 never reverted).\u003c/p>\n\u003cp>\u003cstrong>Fix:\u003c/strong> set \u003ccode>reap_children = true\u003c/code> and restart. Restarting alone clears the zombies but they return within ~30 s without the config fix. Don't raise \u003ccode>TasksMax\u003c/code> - it protects the host from runaway forks.\u003c/p>\n\u003cp>Prevent: expiring debug flags, alert on zombie count and on \u003ccode>Tasks\u003c/code> near \u003ccode>TasksMax\u003c/code>.\u003c/p>", "mcq": [{"q": "Why does `kill -9` have no effect on a `\u003cdefunct>` process?", "o": ["It is already dead; only its process-table entry remains until the parent reaps it", "Zombies ignore SIGKILL by design of the kernel's scheduler", "kill -9 needs root", "The process is stuck in D state"], "why": "Zombies are dead; the parent must call wait()."}, {"q": "`fork failed: [Errno 11] Resource temporarily unavailable` while memory is free. What limit was likely hit?", "o": ["A task/PID limit such as TasksMax or pid_max", "The file descriptor limit", "The disk quota", "The swap size"], "why": "EAGAIN from fork/clone = no more tasks allowed."}, {"q": "Which action removes zombies for good?", "o": ["Fix the parent so it reaps children (or restart the parent)", "Reboot only", "Raise TasksMax", "Run kill -9 on each zombie"], "why": "When the parent exits, orphans go to PID 1 and are reaped; fix the cause so they don't pile up."}], "qa": [{"q": "Why shouldn't you solve this by raising TasksMax?", "a": "TasksMax is a safety net against fork bombs and leaks. Zombies would still accumulate until the new limit, merely delaying the failure and weakening host protection. The root cause is the parent not reaping (reap_children=false)."}, {"q": "What does a zombie cost, and what does it not cost?", "a": "It costs almost nothing in CPU or memory, but it occupies a PID/task slot (counting against TasksMax and pid_max) until the parent reaps it."}]}, {"id": "m08", "level": "medium", "title": "logrotate \"is configured\" but logs keep growing", "time": "30 min", "skills": "logrotate debugging, directory permissions, `create` vs `copytruncate`, deleted-but-open files", "ticket": "\u003cblockquote>\u003cstrong>INC-2008 · P3 · Monitoring alert\u003c/strong>\u003cbr>\n\u003ccode>DiskSpaceWarning: /var/log/shopapp 80% used\u003c/code>.\u003cbr>\nA logrotate rule for shopapp was added two weeks ago (\u003ccode>/etc/logrotate.d/shopapp\u003c/code>)\u003cbr>\nbut \u003ccode>app.log\u003c/code> has never been rotated. Also, last week someone changed permissions on\u003cbr>\n\u003ccode>/var/log/shopapp\u003c/code> so the deploy group can read logs.\u003cbr>\nMake log rotation work - and make sure that after a rotation the app still writes\u003cbr>\nto a file you can see. The volume must not fill up again.\u003c/blockquote>", "success": "\u003cul>\u003cli>\u003ccode>logrotate -d /etc/logrotate.d/shopapp\u003c/code> shows no errors\u003c/li>\u003cli>After a forced rotation, shopapp keeps writing to \u003ccode>/var/log/shopapp/app.log\u003c/code>\u003c/li>\u003cli>No deleted log file is held open by shopapp\u003c/li>\u003cli>The rule rotates on size (\u003ccode>size\u003c/code> or \u003ccode>maxsize\u003c/code>), and the volume is below 50%\u003c/li>\u003c/ul>\n\u003cp>Check with \u003ccode>sudo ./labctl.sh check m08\u003c/code>.\u003c/p>", "warmup": "\u003cp>The solution uses long command lines. They are just short commands with one flag added at a time. Practise each ladder on any Linux box first (all read-only). Every rung adds \u003cstrong>one\u003c/strong> thing to the rung above - stop at the rung you understand, and read the next one only when you are ready. The lab itself uses the last rung of each ladder.\u003c/p>\n\u003ch4>logrotate - test a rule safely\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">cat /etc/logrotate.d/nginx                      \u003cspan class=\"c\"># 1. read an existing rule first\u003c/span>\nsudo logrotate -d /etc/logrotate.d/nginx        \u003cspan class=\"c\"># 2. -d = debug / dry run: prints what it WOULD do, changes nothing\u003c/span>\nsudo logrotate -v /etc/logrotate.d/nginx        \u003cspan class=\"c\"># 3. -v = really run (only if due), verbose\u003c/span>\nsudo logrotate -vf /etc/logrotate.d/nginx       \u003cspan class=\"c\"># 4. -f = force now, even if not due\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>lsof - who has this file open?\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">lsof                                  \u003cspan class=\"c\"># 1. every open file of every process (huge)\u003c/span>\nlsof /var/log/syslog                  \u003cspan class=\"c\"># 2. only processes that have THIS file open\u003c/span>\nlsof -p 1234                          \u003cspan class=\"c\"># 3. everything process 1234 has open\u003c/span>\nlsof +L1                              \u003cspan class=\"c\"># 4. open files with link count &lt; 1 = deleted but still open\u003c/span>\nlsof -nP +L1 /var/log                 \u003cspan class=\"c\"># 5. -n/-P = no DNS / port-name lookups (faster); limit to one filesystem\u003c/span>\u003c/code>\u003c/pre>\n\u003ch4>ls -lh / ls -ld - sizes and directory modes\u003c/h4>\n\u003cpre>\u003ccode class=\"lang-bash\">ls -lh /var/log/shopapp/             \u003cspan class=\"c\"># 1. file sizes in human units\u003c/span>\nls -ld /var/log/shopapp              \u003cspan class=\"c\"># 2. the DIRECTORY's own mode and owner\u003c/span>\u003c/code>\u003c/pre>", "hints": [{"title": "Hint 1 - dry run", "html": "\u003cp>\u003ccode>sudo logrotate -d /etc/logrotate.d/shopapp\u003c/code> (debug = dry run, changes nothing). Read every \u003ccode>error:\u003c/code> line. What does it say about the directory?\u003c/p>"}, {"title": "Hint 2 - force a real rotation, then look", "html": "\u003cp>\u003ccode>sudo logrotate -v -f /etc/logrotate.d/shopapp\u003c/code>, then \u003ccode>curl -s localhost/\u003c/code> a few times. \u003ccode>ls -l /var/log/shopapp/\u003c/code> - is \u003ccode>app.log\u003c/code> growing? \u003ccode>sudo lsof +L1 /var/log/shopapp\u003c/code>.\u003c/p>"}, {"title": "Hint 3 - how does the app find its log?", "html": "\u003cp>The app opens \u003ccode>app.log\u003c/code> once at start and keeps the file descriptor. After \u003ccode>create\u003c/code> renames the file, where do new lines go? After \u003ccode>compress\u003c/code> deletes the renamed file? Look up \u003ccode>copytruncate\u003c/code> and \u003ccode>postrotate\u003c/code> in \u003ccode>man logrotate\u003c/code>. How much free space does \u003ccode>copytruncate\u003c/code> need for a 190 MB file?\u003c/p>"}], "learn": "\u003cul>\u003cli>\u003ccode>logrotate -d\u003c/code> is the first tool; logrotate refuses insecure (group/world-writable) dirs unless you set \u003ccode>su\u003c/code>.\u003c/li>\u003cli>A renamed file keeps its inode - processes keep writing to it.\u003c/li>\u003cli>Rotation strategies: app reopens log on signal (\u003ccode>postrotate\u003c/code> + reload), or \u003ccode>copytruncate\u003c/code>, or restart.\u003c/li>\u003cli>\u003ccode>compress\u003c/code> without \u003ccode>delaycompress\u003c/code> + an app that keeps the fd = deleted-but-open file (lab M01 again).\u003c/li>\u003c/ul>", "solution": "\u003cblockquote>Long commands below are built up short-first (\u003ccode># 1.\u003c/code>, \u003ccode># 2.\u003c/code> ...). Each rung adds one flag;\u003cbr>\nthe last rung is what the lab uses. The README \u003cstrong>Warm-up\u003c/strong> explains every flag from scratch.\u003c/blockquote>\n\u003ch3>1. Confirm\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">df -h /var/log/shopapp                    \u003cspan class=\"c\"># ~80%\u003c/span>\nls -lh /var/log/shopapp/                  \u003cspan class=\"c\"># app.log ~190M, never rotated\u003c/span>\ncat /etc/logrotate.d/shopapp\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>df -h /var/log/shopapp\u003c/code> and \u003ccode>ls -lh /var/log/shopapp/\u003c/code>\u003c/td>\u003ctd>Usage and file sizes.\u003c/td>\u003ctd>~80% used, \u003ccode>app.log\u003c/code> ~190 MB and never rotated.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>cat /etc/logrotate.d/shopapp\u003c/code>\u003c/td>\u003ctd>The rotation rule.\u003c/td>\u003ctd>Read what it is supposed to do.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>2. Dry run\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo logrotate -d /etc/logrotate.d/shopapp\n\u003cspan class=\"c\"># error: skipping \"/var/log/shopapp/app.log\" because parent directory has insecure\u003c/span>\n\u003cspan class=\"c\"># permissions (It's world writable or writable by group which is not \"root\") Set \"su\"\u003c/span>\n\u003cspan class=\"c\"># directive in config file to tell logrotate which user/group should be used for rotation.\u003c/span>\nls -ld /var/log/shopapp\n\u003cspan class=\"c\"># drwxrwxr-x 3 shopapp shopapp ... /var/log/shopapp      &lt;- group-writable (last week's change)\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>Logrotate runs as root. In a directory that non-root users can write, a user could swap files for symlinks and make root overwrite anything. So logrotate refuses.\u003c/p>\n\u003cp>Fix (either):\u003c/p>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo chmod 0755 /var/log/shopapp      \u003cspan class=\"c\"># read access for a group needs r-x, not w\u003c/span>\n\u003cspan class=\"c\"># and/or add to the rule:   su shopapp shopapp\u003c/span>\u003c/code>\u003c/pre>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>logrotate -d /etc/logrotate.d/shopapp\u003c/code>\u003c/td>\u003ctd>\u003ccode>-d\u003c/code> = debug / \u003cstrong>dry run\u003c/strong>: shows what it would do and errors, changes nothing.\u003c/td>\u003ctd>Reveals why it silently skips: \u003ccode>parent directory has insecure permissions\u003c/code>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ls -ld /var/log/shopapp\u003c/code>\u003c/td>\u003ctd>\u003ccode>-d\u003c/code> shows the directory itself, not its contents.\u003c/td>\u003ctd>Group-writable (\u003ccode>drwxrwxr-x\u003c/code>). logrotate runs as root and will not work in a directory others can write (symlink attacks).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>chmod 0755 /var/log/shopapp\u003c/code> and/or \u003ccode>su shopapp shopapp\u003c/code> in the rule\u003c/td>\u003ctd>Remove group write, or tell logrotate which user/group to use.\u003c/td>\u003ctd>Fix 1.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>3. First real rotation - and the second problem\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo logrotate -v -f /etc/logrotate.d/shopapp\nfor i in 1 2 3; do curl -s localhost/ &gt;/dev/null; done\nls -l /var/log/shopapp/\n\u003cspan class=\"c\"># -rw-r----- 1 shopapp shopapp     0 ... app.log          &lt;- stays empty!\u003c/span>\n\u003cspan class=\"c\"># -rw-r----- 1 shopapp shopapp  210K ... app.log.1.gz\u003c/span>\nsudo lsof +L1 /var/log/shopapp\n\u003cspan class=\"c\"># python3 7001 shopapp 3w REG 7,0 199M 0 12 /var/log/shopapp/app.log.1 (deleted)\u003c/span>\ndf -h /var/log/shopapp                \u003cspan class=\"c\"># still full\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>create\u003c/code> renamed \u003ccode>app.log\u003c/code> -&gt; \u003ccode>app.log.1\u003c/code> (same inode, the app keeps writing there), \u003ccode>compress\u003c/code> then gzipped it and \u003cstrong>deleted\u003c/strong> \u003ccode>app.log.1\u003c/code>. The app writes to a deleted file: space is not freed and new log lines are invisible.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>logrotate -v -f /etc/logrotate.d/shopapp\u003c/code>\u003c/td>\u003ctd>\u003ccode>-f\u003c/code> force rotation now, \u003ccode>-v\u003c/code> verbose.\u003c/td>\u003ctd>Tests it for real instead of waiting for the timer.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>lsof +L1 /var/log/shopapp\u003c/code>\u003c/td>\u003ctd>Open deleted files.\u003c/td>\u003ctd>Fault 2: \u003ccode>app.log.1 (deleted)\u003c/code> still held by python - \u003ccode>compress\u003c/code> deleted the renamed file while the app kept writing to it.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>4. Fix the rule\u003c/h3>\n\u003cp>shopapp has no \"reopen log\" signal, so use \u003ccode>copytruncate\u003c/code> (copy the content, then truncate the original in place - same inode, the app's fd stays valid):\u003c/p>\n\u003cpre>\u003ccode class=\"lang-text\">/var/log/shopapp/*.log {\n    su shopapp shopapp\n    daily\n    maxsize 20M\n    rotate 7\n    compress\n    delaycompress\n    missingok\n    notifempty\n    copytruncate\n}\u003c/code>\u003c/pre>\n\u003cp>(Alternative: keep \u003ccode>create\u003c/code> and add \u003ccode>postrotate systemctl restart shopapp endscript\u003c/code>. \u003ccode>copytruncate\u003c/code> can lose a few lines written between copy and truncate - acceptable here.)\u003c/p>\n\u003cp>Free the space held by the deleted file: \u003ccode>sudo systemctl restart shopapp\u003c/code>.\u003c/p>\n\u003cp>Trap: \u003ccode>copytruncate\u003c/code> needs free space for a \u003cstrong>full copy\u003c/strong> of the file. If you switch to \u003ccode>copytruncate\u003c/code> while the 190 MB \u003ccode>app.log\u003c/code> is still there, rotation fails with \u003ccode>No space left on device\u003c/code>. Get rid of the big file first (rotate once with \u003ccode>create\u003c/code> and restart, or archive it elsewhere and truncate), then rely on \u003ccode>maxsize\u003c/code> to keep files small.\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>copytruncate\u003c/code> (in the rule)\u003c/td>\u003ctd>Copies the file, then truncates the original in place.\u003c/td>\u003ctd>App keeps the same inode and fd, so no signal or restart is needed. Cost: a few lines can be lost; needs free space for a full copy.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systemctl restart shopapp\u003c/code>\u003c/td>\u003ctd>Closes the old fd.\u003c/td>\u003ctd>Frees the deleted file's space.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch3>5. Verify\u003c/h3>\n\u003cpre>\u003ccode class=\"lang-bash\">sudo logrotate -d /etc/logrotate.d/shopapp 2&gt;&amp;1 | grep -i error   \u003cspan class=\"c\"># nothing\u003c/span>\nsudo logrotate -v -f /etc/logrotate.d/shopapp\ncurl -s localhost/ &gt;/dev/null; ls -l /var/log/shopapp/app.log   \u003cspan class=\"c\"># grows\u003c/span>\nsudo lsof +L1 /var/log/shopapp                                  \u003cspan class=\"c\"># nothing\u003c/span>\nsudo ./labctl.sh check m08\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>maxsize\u003c/code> + the daily \u003ccode>logrotate.timer\u003c/code> keeps the file small. For big log bursts run logrotate more often (hourly timer).\u003c/p>\n\u003cdiv class=\"cmdbox\">\u003cdiv class=\"cmdhead\">Commands in this step - what and why\u003c/div>\u003cdiv class='tablewrap'>\u003ctable>\u003cthead>\u003ctr>\u003cth>Command\u003c/th>\u003cth>What it does\u003c/th>\u003cth>Why we ran it here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>logrotate -d ... 2&gt;&amp;1 | grep -i error\u003c/code>\u003c/td>\u003ctd>Dry run, filter errors.\u003c/td>\u003ctd>Verify nothing is reported.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>curl -s localhost/ &gt;/dev/null; ls -l app.log\u003c/code>\u003c/td>\u003ctd>Generate traffic, check size.\u003c/td>\u003ctd>The file grows again = app writes to the right file.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>", "root": "\u003cdiv class='tablewrap'>\u003ctable>\u003ctbody>\u003ctr>\u003ctd>Root cause\u003c/td>\u003ctd>(1) group-writable log dir -&gt; logrotate skipped the file; (2) \u003ccode>create\u003c/code>+\u003ccode>compress\u003c/code> with an app that never reopens its log -&gt; writes to a deleted file\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fix\u003c/td>\u003ctd>Dir 0755 / \u003ccode>su\u003c/code>, \u003ccode>copytruncate\u003c/code> + \u003ccode>delaycompress\u003c/code> + \u003ccode>maxsize\u003c/code>, restart app\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prevent\u003c/td>\u003ctd>Test new rules with \u003ccode>logrotate -d\u003c/code> and one forced run; check \u003ccode>lsof +L1\u003c/code> after rotation; alert on log volume at 80%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "explain": "\u003cp>\u003cstrong>Problem 1 - logrotate skips the file.\u003c/strong> logrotate runs as root. If the log directory is \u003cstrong>writable by a non-root user/group\u003c/strong> (last week's change: \u003ccode>drwxrwxr-x shopapp:shopapp\u003c/code>), a user could swap files for symlinks and make root overwrite arbitrary files. So it prints \u003ccode>error: skipping ... because parent directory has insecure permissions\u003c/code>. Fix: \u003ccode>chmod 0755\u003c/code> (read access needs \u003ccode>r-x\u003c/code>, not \u003ccode>w\u003c/code>) and/or \u003ccode>su shopapp shopapp\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Problem 2 - the app keeps writing to the wrong file.\u003c/strong> The app opens \u003ccode>app.log\u003c/code> once and keeps the fd. With \u003ccode>create\u003c/code>:\u003c/p>\n\u003col>\u003cli>logrotate \u003cstrong>renames\u003c/strong> \u003ccode>app.log\u003c/code> -&gt; \u003ccode>app.log.1\u003c/code> (same inode)\u003c/li>\u003cli>the app's fd still points at the renamed inode -&gt; new lines go to \u003ccode>app.log.1\u003c/code>\u003c/li>\u003cli>\u003ccode>compress\u003c/code> gzips it and \u003cstrong>deletes\u003c/strong> it -&gt; app writes to a deleted file (M01 again)\u003c/li>\u003cli>new \u003ccode>app.log\u003c/code> stays empty, space is not freed\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>Options:\u003c/strong> app reopens the log on a signal (\u003ccode>postrotate\u003c/code>), \u003ccode>copytruncate\u003c/code>, or restart in \u003ccode>postrotate\u003c/code>. \u003ccode>copytruncate\u003c/code> copies the content then truncates \u003cstrong>in place\u003c/strong> (same inode, fd stays valid) - but a few lines written between copy and truncate can be lost, and it needs free space for a \u003cstrong>full copy\u003c/strong> (a 190 MB file on an almost full volume fails with ENOSPC).\u003c/p>\n\u003cp>Also use \u003ccode>delaycompress\u003c/code> and \u003ccode>maxsize\u003c/code>, then \u003cstrong>test\u003c/strong>: \u003ccode>logrotate -d\u003c/code>, one forced \u003ccode>-f\u003c/code> run, \u003ccode>curl\u003c/code>, \u003ccode>lsof +L1\u003c/code>.\u003c/p>", "mcq": [{"q": "Which command does a safe dry-run of a logrotate rule?", "o": ["logrotate -d /etc/logrotate.d/shopapp", "logrotate -f /etc/logrotate.d/shopapp", "logrotate --purge", "cron -t"], "why": "-d = debug/dry run: shows what it would do and prints errors, changes nothing."}, {"q": "Why does the app keep writing to the old file after a `create`-style rotation?", "o": ["It holds an open fd to the renamed file (same inode)", "logrotate deletes the app's PID", "The new app.log is read-only", "The app reads its config again"], "why": "A rename keeps the inode; processes keep writing through their open file descriptors."}, {"q": "What is a trade-off of `copytruncate`?", "o": ["Lines written between copy and truncate can be lost, and it needs free space for a full copy", "It requires restarting the app", "It deletes the old log", "It only works for compressed logs"], "why": "It avoids reopening the log but is not atomic and uses disk space."}], "qa": [{"q": "Why does logrotate refuse a log directory that is group-writable?", "a": "logrotate runs as root. A user able to write the directory could replace the log with a symlink to a sensitive file and trick root's rotation into overwriting or chowning it (privilege escalation). It skips such directories unless you fix modes or specify `su user group`."}, {"q": "Describe step by step how the log became invisible after the first forced rotation.", "a": "`create` renamed app.log to app.log.1 (same inode); the app kept writing to that inode; `compress` gzipped and deleted app.log.1, so the app wrote into a deleted-but-open file. The new app.log stayed empty (size 0) and the 190 MB was not freed - confirmed by `lsof +L1`. Fix with copytruncate (or reopen signal) and restart the app to release the deleted file."}]}, {"id": "m09", "level": "medium", "title": "\"Your connection is not private\"", "time": "30 min", "skills": "`openssl s_client`, `openssl x509`, cert/key matching, nginx TLS config, key file permissions", "ticket": "\u003cblockquote>\u003cstrong>INC-2009 · P1\u003c/strong>\u003cbr>\nCustomers get a certificate warning on \u003cstrong>https://shop.lab.internal\u003c/strong>.\u003cbr>\nThe certificate was renewed last week by the platform team (files are in\u003cbr>\n\u003ccode>/etc/ssl/shopapp/\u003c/code>) and the change ticket was closed as done.\u003cbr>\nReproduce like a customer (the lab CA plays the role of a public CA):\u003cbr>\n\u00
